            if (!wrapper) return;

            const id = ++textIdCounter;
            const div = document.createElement('div');
            div.className = 'pdf-text-annotation';
            div.contentEditable = 'true';
            div.dataset.id = id;
            div.dataset.pageNum = pageNum;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.width = '120px';
            div.style.height = '40px';
            div.textContent = 'Type here...';

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-text-annotation';
            delBtn.textContent = '×';
            delBtn.title = 'Delete this text';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteTextAnnotation(id);
            });
            div.appendChild(delBtn);

            // Make draggable
            let dragTextState = null;
            div.addEventListener('pointerdown', (e) => {
                if (e.target === delBtn) return;
                e.preventDefault();
                e.stopPropagation(); // Prevent global canvas click from creating another annotation
                const rect = div.getBoundingClientRect();
                dragTextState = {
                    element: div,
                    offsetX: e.clientX - rect.left,
                    offsetY: e.clientY - rect.top,
                    id: id
                };
                div.style.cursor = 'grabbing';
                document.body.style.userSelect = 'none';
                if (e.pointerId !== undefined && div.setPointerCapture) {
                    try { div.setPointerCapture(e.pointerId); } catch (_) {}
                }
            });

            div.addEventListener('pointermove', (e) => {
                if (!dragTextState || dragTextState.id !== id) return;
                e.preventDefault();
                const wrapperRect = wrapper.getBoundingClientRect();
                const wsRect = getWorkspaceRect();
                let left = e.clientX - wsRect.left - dragTextState.offsetX;
                let top = e.clientY - wsRect.top - dragTextState.offsetY;
                left = Math.max(0, Math.min(left, wrapperRect.width - div.offsetWidth));
                top = Math.max(0, Math.min(top, wrapperRect.height - div.offsetHeight));
                div.style.left = left + 'px';
                div.style.top = top + 'px';
                const ann = textAnnotations.find(a => a.id === id);
                if (ann) { ann.x = left;
                    ann.y = top; }
            });

            div.addEventListener('pointerup', (e) => {
                if (dragTextState && dragTextState.id === id) {
                    dragTextState = null;
                    div.style.cursor = 'move';
                    document.body.style.userSelect = '';
                    if (e.pointerId !== undefined && div.releasePointerCapture) {
                        try { div.releasePointerCapture(e.pointerId); } catch (_) {}
                    }
                }
            });
            div.addEventListener('pointercancel', (e) => {
                if (dragTextState && dragTextState.id === id) {
                    dragTextState = null;
                    div.style.cursor = 'move';
                    document.body.style.userSelect = '';
                }
            });

            wrapper.appendChild(div);

            textAnnotations.push({
                id: id,
                pageNum: pageNum,
                x: x,
                y: y,
                text: 'Type here...',
                width: 120,
                height: 40,
                element: div
            });

            setTimeout(() => {
                div.focus();
                document.execCommand('selectAll', false, null);
            }, 50);

            return div;
        }

        function deleteTextAnnotation(id) {
            const idx = textAnnotations.findIndex(a => a.id === id);
            if (idx === -1) return;
            const ann = textAnnotations[idx];
            if (ann.element && ann.element.parentNode) {
                ann.element.parentNode.removeChild(ann.element);
            }
            textAnnotations.splice(idx, 1);
        }

        function renderTextAnnotationsForPage(pageNum) {
            const wrapper = getPdfCanvasWrapper(pageNum);
            if (!wrapper) return;
            const existing = wrapper.querySelectorAll('.pdf-text-annotation');
            existing.forEach(el => {
                const id = parseInt(el.dataset.id, 10);
                const found = textAnnotations.some(a => a.id === id);
                if (!found) el.remove();
            });
            textAnnotations.filter(a => a.pageNum === pageNum).forEach(ann => {
                if (ann.element && ann.element.parentNode === wrapper) return;
                const div = document.createElement('div');
                div.className = 'pdf-text-annotation';
                div.contentEditable = 'true';
                div.dataset.id = ann.id;
                div.dataset.pageNum = ann.pageNum;
                div.style.left = ann.x + 'px';
                div.style.top = ann.y + 'px';
                div.style.width = (ann.width || 120) + 'px';
                div.style.height = (ann.height || 40) + 'px';
                div.textContent = ann.text || 'Type here...';

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-text-annotation';
                delBtn.textContent = '×';
                delBtn.title = 'Delete this text';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteTextAnnotation(ann.id);
                });
                div.appendChild(delBtn);

                let dragState = null;
                div.addEventListener('pointerdown', (e) => {
                    if (e.target === delBtn) return;
                    e.preventDefault();
                    e.stopPropagation();
                    const rect = div.getBoundingClientRect();
                    dragState = {
                        element: div,
                        offsetX: e.clientX - rect.left,
                        offsetY: e.clientY - rect.top,
                        id: ann.id
                    };
                    div.style.cursor = 'grabbing';
                    document.body.style.userSelect = 'none';
                    if (e.pointerId !== undefined && div.setPointerCapture) {
                        try { div.setPointerCapture(e.pointerId); } catch (_) {}
                    }
                });
                div.addEventListener('pointermove', (e) => {
                    if (!dragState || dragState.id !== ann.id) return;
                    e.preventDefault();
                    const wrapperRect = wrapper.getBoundingClientRect();
                    const wsRect = getWorkspaceRect();
                    let left = e.clientX - wsRect.left - dragState.offsetX;
                    let top = e.clientY - wsRect.top - dragState.offsetY;
                    left = Math.max(0, Math.min(left, wrapperRect.width - div.offsetWidth));
                    top = Math.max(0, Math.min(top, wrapperRect.height - div.offsetHeight));
                    div.style.left = left + 'px';
                    div.style.top = top + 'px';
                    const annData = textAnnotations.find(a => a.id === ann.id);
                    if (annData) { annData.x = left;
                        annData.y = top; }
                });
                div.addEventListener('pointerup', (e) => {
                    if (dragState && dragState.id === ann.id) {
                        dragState = null;
                        div.style.cursor = 'move';
                        document.body.style.userSelect = '';
                        if (e.pointerId !== undefined && div.releasePointerCapture) {
                            try { div.releasePointerCapture(e.pointerId); } catch (_) {}
                        }
                    }
                });
                div.addEventListener('pointercancel', (e) => {
                    if (dragState && dragState.id === ann.id) {
                        dragState = null;
                        div.style.cursor = 'move';
                        document.body.style.userSelect = '';
                    }
                });
                div.addEventListener('blur', function() {
                    const annData = textAnnotations.find(a => a.id === ann.id);
                    if (annData) {
                        annData.text = this.textContent;
                        annData.width = this.offsetWidth;
                        annData.height = this.offsetHeight;
                    }
                });

                wrapper.appendChild(div);
                ann.element = div;
            });
        }

        function handleSelectTypeClick(e) {
            if (!isSelectTypeActive) return;
            if (isPinching) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = getContainerFromPoint(globalX, globalY);
            if (!containerInfo || containerInfo.type !== 'pdf') return;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            createTextAnnotation(containerInfo.pageNum, localPoint.x, localPoint.y);
        }

        // ================================================================
        // DRAWING SYSTEM
        // ================================================================
        function redrawGlobalStrokes() {
            const wsRect = getWorkspaceRect();
            globalCanvas.width = wsRect.width;
            globalCanvas.height = wsRect.height;
            globalCtx.clearRect(0, 0, globalCanvas.width, globalCanvas.height);

            globalStrokes.forEach(stroke => {
                if (!stroke.points || stroke.points.length < 2) return;
                let containerInfo = null;
                if (stroke.container === 'pdf') {
                    const wrapper = getPdfCanvasWrapper(stroke.pageNum);
                    if (!wrapper) return;
                    const rect = wrapper.getBoundingClientRect();
                    containerInfo = { type: 'pdf', pageNum: stroke.pageNum, element: wrapper,
                        offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
                } else if (stroke.container === 'notepad') {
                    if (notepadPane.style.display === 'none') return;
                    const wrapper = getNotepadPageWrapper(stroke.pageIndex || currentNotepadIndex);
                    if (!wrapper) return;
                    const wrapperRect = wrapper.getBoundingClientRect();
                    containerInfo = { type: 'notepad', element: wrapper,
                        offsetX: wrapperRect.left - wsRect.left, offsetY: wrapperRect.top - wsRect.top };
                } else return;
                const globalPoints = stroke.points.map(p => containerToGlobal(p.x, p.y, containerInfo));
                globalCtx.save();
                globalCtx.beginPath();
                globalCtx.moveTo(globalPoints[0].x, globalPoints[0].y);
                for (let i = 1; i < globalPoints.length; i++) globalCtx.lineTo(globalPoints[i].x, globalPoints[i].y);
                globalCtx.setLineDash([]);
                if (stroke.tool === 'pen' || stroke.tool === 'whitener') {
                    globalCtx.globalCompositeOperation = 'source-over';
                    globalCtx.strokeStyle = (stroke.tool === 'whitener') ? '#ffffff' : stroke.color;
                    globalCtx.lineWidth = stroke.width;
                    globalCtx.lineCap = 'round';
                    globalCtx.lineJoin = 'round';
                } else if (stroke.tool === 'highlighter') {
                    globalCtx.globalCompositeOperation = 'source-over';
                    globalCtx.strokeStyle = stroke.color;
                    globalCtx.lineWidth = stroke.width * 4;
                    globalCtx.lineCap = 'square';
                    globalCtx.lineJoin = 'miter';
                } else if (stroke.tool === 'eraser') {
                    globalCtx.globalCompositeOperation = 'destination-out';
                    globalCtx.lineWidth = stroke.width * 6;
                    globalCtx.lineCap = 'round';
                    globalCtx.lineJoin = 'round';
                }
                globalCtx.stroke();
                globalCtx.restore();
            });

            linkData.forEach(link => {
                let sourceGlobal = null,
                    targetGlobal = null;
                if (link.sourceType === 'pdf') {
                    const wrapper = getPdfCanvasWrapper(link.sourcePageNum);
                    if (wrapper) {
                        const rect = wrapper.getBoundingClientRect();
                        const ci = { type: 'pdf', pageNum: link.sourcePageNum, element: wrapper,
                            offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
                        let cx = link.sourceX,
                            cy = link.sourceY;
                        if (link.sourceBounds) { cx = (link.sourceBounds.x1 + link.sourceBounds.x2) / 2;
                            cy = (link.sourceBounds.y1 + link.sourceBounds.y2) / 2; }
                        sourceGlobal = containerToGlobal(cx, cy, ci);
                    }
                } else if (link.sourceType === 'notepad' && notepadPane.style.display !== 'none') {
                    const wrapper = getNotepadPageWrapper(link.sourceNotepadIndex);
                    if (wrapper) {
                        const rect = wrapper.getBoundingClientRect();
                        const ci = { type: 'notepad', element: wrapper,
                            offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
                        let cx = link.sourceX,
                            cy = link.sourceY;
                        if (link.sourceBounds) { cx = (link.sourceBounds.x1 + link.sourceBounds.x2) / 2;
                            cy = (link.sourceBounds.y1 + link.sourceBounds.y2) / 2; }
                        sourceGlobal = containerToGlobal(cx, cy, ci);
                    }
                }
                if (link.targetType === 'pdf') {
                    const wrapper = getPdfCanvasWrapper(link.targetPageNum);
                    if (wrapper) {
                        const rect = wrapper.getBoundingClientRect();
                        const ci = { type: 'pdf', pageNum: link.targetPageNum, element: wrapper,
                            offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
                        let cx = link.targetX,
                            cy = link.targetY;
                        if (link.targetBounds) { cx = (link.targetBounds.x1 + link.targetBounds.x2) / 2;
                            cy = (link.targetBounds.y1 + link.targetBounds.y2) / 2; }
                        targetGlobal = containerToGlobal(cx, cy, ci);
                    }
                } else if (link.targetType === 'notepad' && notepadPane.style.display !== 'none') {
                    const wrapper = getNotepadPageWrapper(link.targetNotepadIndex);
                    if (wrapper) {
                        const rect = wrapper.getBoundingClientRect();
                        const ci = { type: 'notepad', element: wrapper,
                            offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
                        let cx = link.targetX,
                            cy = link.targetY;
                        if (link.targetBounds) { cx = (link.targetBounds.x1 + link.targetBounds.x2) / 2;
                            cy = (link.targetBounds.y1 + link.targetBounds.y2) / 2; }
                        targetGlobal = containerToGlobal(cx, cy, ci);
                    }
                }
                if (sourceGlobal && targetGlobal) {
                    globalCtx.save();
                    globalCtx.setLineDash([6, 6]);
                    globalCtx.lineDashOffset = 0;
                    globalCtx.strokeStyle = '#94a3b8';
                    globalCtx.lineWidth = 1.5;
                    globalCtx.globalCompositeOperation = 'source-over';
                    globalCtx.globalAlpha = 0.4;
                    globalCtx.beginPath();
                    globalCtx.moveTo(sourceGlobal.x, sourceGlobal.y);
                    globalCtx.lineTo(targetGlobal.x, targetGlobal.y);
                    globalCtx.stroke();
                    globalCtx.restore();
                }
            });
        }

        // ---- POINTER MODE DRAWING ----
        function startGlobalStroke(e) {
            if (activeToolMode !== 'pointer' && !['pen', 'highlighter', 'eraser', 'whitener'].includes(activeToolMode))
                return;
            if (isPinching) return;
            if (e.touches && e.touches.length > 1) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = getContainerFromPoint(globalX, globalY);
            if (!containerInfo) return;
            isDrawing = true;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            let tool = currentTool;
            if (activeToolMode === 'whitener') tool = 'whitener';
            else if (activeToolMode === 'pen') tool = 'pen';
            else if (activeToolMode === 'highlighter') tool = 'highlighter';
            else if (activeToolMode === 'eraser') tool = 'eraser';
            else return;
            const color = (tool === 'highlighter') ? highlighterColor : (tool === 'whitener' ? '#ffffff' : penColor);
            activeStroke = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                tool: tool,
                color: color,
                width: (tool === 'highlighter') ? strokeWidth : strokeWidth,
                container: containerInfo.type,
                pageNum: containerInfo.type === 'pdf' ? containerInfo.pageNum : undefined,
                pageIndex: containerInfo.type === 'notepad' ? containerInfo.pageIndex : undefined,
                points: [localPoint],
                containerInfo: containerInfo
            };
            globalStrokes.push(activeStroke);
        }

        function drawGlobalStroke(e) {
            if (activeToolMode !== 'pointer' && !['pen', 'highlighter', 'eraser', 'whitener'].includes(activeToolMode))
                return;
            if (!isDrawing || !activeStroke) return;
            if (e.touches && e.touches.length > 1) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = getContainerFromPoint(globalX, globalY);
            if (!containerInfo || containerInfo.type !== activeStroke.container ||
                (containerInfo.type === 'pdf' && containerInfo.pageNum !== activeStroke.pageNum) ||
                (containerInfo.type === 'notepad' && containerInfo.pageIndex !== activeStroke.pageIndex)) return;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            activeStroke.points.push(localPoint);
            const lastPoint = activeStroke.points[activeStroke.points.length - 2];
            const lastGlobal = containerToGlobal(lastPoint.x, lastPoint.y, containerInfo);
            const currGlobal = containerToGlobal(localPoint.x, localPoint.y, containerInfo);
            globalCtx.save();
            globalCtx.beginPath();
            globalCtx.moveTo(lastGlobal.x, lastGlobal.y);
            globalCtx.lineTo(currGlobal.x, currGlobal.y);
            globalCtx.setLineDash([]);
            if (activeStroke.tool === 'pen' || activeStroke.tool === 'whitener') {
                globalCtx.globalCompositeOperation = 'source-over';
                globalCtx.strokeStyle = (activeStroke.tool === 'whitener') ? '#ffffff' : penColor;
                globalCtx.lineWidth = strokeWidth;
                globalCtx.lineCap = 'round';
                globalCtx.lineJoin = 'round';
            } else if (activeStroke.tool === 'highlighter') {
                globalCtx.globalCompositeOperation = 'source-over';
                globalCtx.strokeStyle = highlighterColor;
                globalCtx.lineWidth = strokeWidth * 4;
                globalCtx.lineCap = 'square';
                globalCtx.lineJoin = 'miter';
            } else if (activeStroke.tool === 'eraser') {
                globalCtx.globalCompositeOperation = 'destination-out';
                globalCtx.lineWidth = strokeWidth * 6;
                globalCtx.lineCap = 'round';
                globalCtx.lineJoin = 'round';
            }
            globalCtx.stroke();
            globalCtx.restore();
        }

        function stopGlobalStroke(e) {
            if (activeToolMode !== 'pointer' && !['pen', 'highlighter', 'eraser', 'whitener'].includes(activeToolMode))
                return;
            if (isDrawing) { isDrawing = false;
                activeStroke = null; }
        }

        // ---- LINK MODES ----
        function startLinkStroke(e) {
            if (activeToolMode === 'pointer' || activeToolMode === 'scan' || activeToolMode === 'linkpoint' || waitingForDrop)
                return;
            if (!['line', 'underline', 'highlighter'].includes(activeToolMode)) return;
            if (isPinching) return;
            if (e.touches && e.touches.length > 1) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = getContainerFromPoint(globalX, globalY);
            if (!containerInfo || containerInfo.type !== 'pdf') return;
            isDrawing = true;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            if (activeToolMode === 'underline') {
                underlineStartX = localPoint.x;
                underlineStartY = localPoint.y;
                underlineEndX = localPoint.x;
                const tool = 'pen';
                const color = penColor;
                const width = strokeWidth;
                activeStroke = {
                    id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    tool,
                    color,
                    width,
                    container: containerInfo.type,
                    pageNum: containerInfo.pageNum,
                    points: [{ x: underlineStartX, y: underlineStartY }, { x: underlineStartX, y: underlineStartY }],
                    containerInfo,
                    mode: 'underline'
                };
                globalCtx.save();
                globalCtx.beginPath();
                globalCtx.moveTo(underlineStartX, underlineStartY);
                globalCtx.lineTo(underlineStartX, underlineStartY);
                globalCtx.strokeStyle = penColor;
                globalCtx.lineWidth = strokeWidth;
                globalCtx.lineCap = 'round';
                globalCtx.stroke();
                globalCtx.restore();
                return;
            }
            const tool = (activeToolMode === 'highlighter') ? 'highlighter' : 'pen';
            const color = (tool === 'highlighter') ? highlighterColor : penColor;
            const width = (tool === 'highlighter') ? strokeWidth : strokeWidth;
            activeStroke = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                tool,
                color,
                width,
                container: containerInfo.type,
                pageNum: containerInfo.pageNum,
                points: [localPoint],
                containerInfo,
                mode: activeToolMode
            };
        }

        function drawLinkStroke(e) {
            if (!isDrawing || !activeStroke) return;
            if (activeToolMode === 'underline' && activeStroke.mode === 'underline') {
                if (e.touches && e.touches.length > 1) return;
                e.preventDefault();
                const wsRect = getWorkspaceRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const globalX = clientX - wsRect.left;
                const globalY = clientY - wsRect.top;
                const containerInfo = getContainerFromPoint(globalX, globalY);
                if (!containerInfo || containerInfo.type !== 'pdf' || containerInfo.pageNum !== activeStroke.pageNum) return;
                const localPoint = globalToContainer(globalX, globalY, containerInfo);
                underlineEndX = localPoint.x;
                redrawGlobalStrokes();
                globalCtx.save();
                globalCtx.beginPath();
                globalCtx.moveTo(underlineStartX, underlineStartY);
                globalCtx.lineTo(underlineEndX, underlineStartY);
                globalCtx.strokeStyle = penColor;
                globalCtx.lineWidth = strokeWidth;
                globalCtx.lineCap = 'round';
                globalCtx.stroke();
                globalCtx.restore();
                return;
            }
            if (activeToolMode === 'pointer' || activeToolMode === 'scan' || activeToolMode === 'linkpoint' || waitingForDrop)
                return;
            if (e.touches && e.touches.length > 1) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = getContainerFromPoint(globalX, globalY);
            if (!containerInfo || containerInfo.type !== activeStroke.container || containerInfo.pageNum !== activeStroke
                .pageNum) return;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            activeStroke.points.push(localPoint);
            const lastPoint = activeStroke.points[activeStroke.points.length - 2];
            const lastGlobal = containerToGlobal(lastPoint.x, lastPoint.y, containerInfo);
            const currGlobal = containerToGlobal(localPoint.x, localPoint.y, containerInfo);
            globalCtx.save();
            globalCtx.beginPath();
            globalCtx.moveTo(lastGlobal.x, lastGlobal.y);
            globalCtx.lineTo(currGlobal.x, currGlobal.y);
            globalCtx.setLineDash([]);
            if (activeStroke.tool === 'pen') {
                globalCtx.globalCompositeOperation = 'source-over';
                globalCtx.strokeStyle = penColor;
                globalCtx.lineWidth = strokeWidth;
                globalCtx.lineCap = 'round';
                globalCtx.lineJoin = 'round';
            } else if (activeStroke.tool === 'highlighter') {
                globalCtx.globalCompositeOperation = 'source-over';
                globalCtx.strokeStyle = highlighterColor;
                globalCtx.lineWidth = strokeWidth * 4;
                globalCtx.lineCap = 'square';
                globalCtx.lineJoin = 'miter';
            }
            globalCtx.stroke();
            globalCtx.restore();
        }

        function stopLinkStroke(e) {
            if (!isDrawing || !activeStroke) return;
            isDrawing = false;
            if (activeToolMode === 'underline' && activeStroke.mode === 'underline') {
                if (underlineStartX !== underlineEndX) {
                    const stroke = {
                        id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                        tool: 'pen',
                        color: penColor,
                        width: strokeWidth,
                        container: activeStroke.container,
                        pageNum: activeStroke.pageNum,
                        points: [{ x: underlineStartX, y: underlineStartY }, { x: underlineEndX, y: underlineStartY }],
                        containerInfo: activeStroke.containerInfo,
                        mode: 'underline'
                    };
                    globalStrokes.push(stroke);
                    pendingLinkSource = {
                        type: 'underline',
                        container: stroke.container,
                        pageNum: stroke.pageNum,
                        points: stroke.points.slice(),
                        color: penColor,
                        containerInfo: stroke.containerInfo,
                        bounds: { x1: Math.min(underlineStartX, underlineEndX), y1: underlineStartY - 5,
                            x2: Math.max(underlineStartX, underlineEndX), y2: underlineStartY + 5 }
                    };
                    waitingForDrop = true;
                    globalCanvas.style.pointerEvents = 'none';
                    updateModeStatus('✋ Now tap on Notepad to drop the underline link');
                    redrawGlobalStrokes();
                } else { redrawGlobalStrokes(); }
                activeStroke = null;
                underlineStartX = underlineStartY = underlineEndX = 0;
                return;
            }
            if (activeStroke.points.length > 1) {
                pendingLinkSource = {
                    type: activeToolMode,
                    container: activeStroke.container,
                    pageNum: activeStroke.pageNum,
                    points: activeStroke.points.slice(),
                    color: (activeStroke.tool === 'highlighter') ? highlighterColor : penColor,
                    containerInfo: activeStroke.containerInfo,
                    bounds: null
                };
                waitingForDrop = true;
                globalStrokes.push(activeStroke);
                globalCanvas.style.pointerEvents = 'none';
                updateModeStatus('✋ Now tap on Notepad to drop the link');
            }
            activeStroke = null;
        }

        // ---- LINK POINT ----
        function handleLinkPointClick(e) {
            if (activeToolMode !== 'linkpoint' || waitingForDrop) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = getContainerFromPoint(globalX, globalY);
            if (!containerInfo) return;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            if (!linkPointStart) {
                linkPointStart = {
                    container: containerInfo.type,
                    pageNum: containerInfo.type === 'pdf' ? containerInfo.pageNum : undefined,
                    pageIndex: containerInfo.type === 'notepad' ? containerInfo.pageIndex : undefined,
                    x: localPoint.x,
                    y: localPoint.y,
                    containerInfo: containerInfo,
                    scrollY: 0
                };
                updateModeStatus('📍 Now tap on the other side (PDF or Notepad) to link');
                if (containerInfo.type === 'pdf') { showPdfHighlight(containerInfo.pageNum, { x1: localPoint.x - 15,
                        y1: localPoint.y - 10, x2: localPoint.x + 15, y2: localPoint.y + 10 }); }
                return;
            }
            const source = linkPointStart;
            const target = {
                container: containerInfo.type,
                pageNum: containerInfo.type === 'pdf' ? containerInfo.pageNum : undefined,
                pageIndex: containerInfo.type === 'notepad' ? containerInfo.pageIndex : undefined,
                x: localPoint.x,
                y: localPoint.y,
                containerInfo: containerInfo,
                scrollY: 0
            };
            if (source.container === target.container && source.pageNum === target.pageNum) {
                linkPointStart = null;
                updateModeStatus('❌ Same container, try again');
                return;
            }
            const linkId = ++linkIdCounter;
            const linkEntry = {
                id: linkId,
                type: 'linkpoint',
                sourceType: source.container,
                sourcePageNum: source.pageNum,
                sourceNotepadIndex: source.pageIndex,
                sourceX: source.x,
                sourceY: source.y,
                sourceScrollY: 0,
                targetType: target.container,
                targetPageNum: target.pageNum,
                targetNotepadIndex: target.pageIndex,
                targetX: target.x,
                targetY: target.y,
                targetScrollY: 0,
                sourceBounds: null,
                targetBounds: null,
                color: penColor,
                created: Date.now()
            };
            linkData.push(linkEntry);
            if (source.container === 'pdf') insertPdfMarker(linkId, source.x, source.y, source.pageNum, 'linkpoint');
            else insertNotepadMarker(linkId, source.x, source.y, 'linkpoint', source.pageIndex);
            if (target.container === 'pdf') insertPdfMarker(linkId, target.x, target.y, target.pageNum, 'linkpoint');
            else insertNotepadMarker(linkId, target.x, target.y, 'linkpoint', target.pageIndex);
            linkPointStart = null;
            redrawGlobalStrokes();
            updateModeStatus('✅ Link created!');
        }

        // ---- SCAN ----
        function handleScanPointerDown(e) {
            if (activeToolMode !== 'scan' || waitingForDrop) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = getContainerFromPoint(globalX, globalY);
            if (!containerInfo || containerInfo.type !== 'pdf') return;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            scanSelectionStart = { globalX, globalY, containerInfo, localX: localPoint.x, localY: localPoint.y };
            isScanSelecting = true;
        }

        function handleScanPointerMove(e) {
            if (!isScanSelecting || !scanSelectionStart) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = scanSelectionStart.containerInfo;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            scanSelectionEnd = { globalX, globalY, containerInfo, localX: localPoint.x, localY: localPoint.y };
            redrawGlobalStrokes();
            const start = scanSelectionStart,
                end = scanSelectionEnd;
            const g1 = containerToGlobal(start.localX, start.localY, start.containerInfo);
            const g2 = containerToGlobal(end.localX, end.localY, end.containerInfo);
            const left = Math.min(g1.x, g2.x),
                top = Math.min(g1.y, g2.y);
            const width = Math.abs(g2.x - g1.x),
                height = Math.abs(g2.y - g1.y);
            globalCtx.save();
            globalCtx.fillStyle = 'rgba(37,99,235,0.08)';
            globalCtx.strokeStyle = '#2563eb';
            globalCtx.lineWidth = 1.5;
            globalCtx.setLineDash([4, 4]);
            globalCtx.fillRect(left, top, width, height);
            globalCtx.strokeRect(left, top, width, height);
            globalCtx.restore();
        }

        function handleScanPointerUp(e) {
            if (!isScanSelecting || !scanSelectionStart || !scanSelectionEnd) {
                isScanSelecting = false;
                scanSelectionStart = null;
                scanSelectionEnd = null;
                redrawGlobalStrokes();
                return;
            }
            e.preventDefault();
            const start = scanSelectionStart,
                end = scanSelectionEnd;
            const dx = Math.abs(end.localX - start.localX);
            const dy = Math.abs(end.localY - start.localY);
            if (dx > 5 && dy > 5) {
                const wrapper = start.containerInfo.wrapper;
                if (wrapper) {
                    const pdfCanvas = wrapper.querySelector('.pdf-canvas');
                    if (pdfCanvas) {
                        const minX = Math.min(start.localX, end.localX);
                        const minY = Math.min(start.localY, end.localY);
                        const width = Math.abs(end.localX - start.localX);
                        const height = Math.abs(end.localY - start.localY);
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = width;
                        tempCanvas.height = height;
                        const ctx = tempCanvas.getContext('2d');
                        ctx.drawImage(pdfCanvas, minX, minY, width, height, 0, 0, width, height);
                        const imageData = tempCanvas.toDataURL('image/png');
                        pendingLinkSource = {
                            type: 'scan',
                            container: 'pdf',
                            pageNum: start.containerInfo.pageNum,
                            bounds: { x1: minX, y1: minY, x2: minX + width, y2: minY + height },
                            imageData,
                            containerInfo: start.containerInfo,
                            color: '#8b5cf6'
                        };
                        waitingForDrop = true;
                        globalCanvas.style.pointerEvents = 'none';
                        updateModeStatus('📷 Scan captured! Tap on Notepad to drop image');
                    }
                }
            }
            isScanSelecting = false;
            scanSelectionStart = null;
            scanSelectionEnd = null;
            redrawGlobalStrokes();
        }

        // ---- DROP ----
        function handleNotepadDrop(e) {
            if (!waitingForDrop || !pendingLinkSource) return;
            e.preventDefault();
            const wsRect = getWorkspaceRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const globalX = clientX - wsRect.left;
            const globalY = clientY - wsRect.top;
            const containerInfo = getContainerFromPoint(globalX, globalY);
            if (!containerInfo || containerInfo.type !== 'notepad') return;
            const localPoint = globalToContainer(globalX, globalY, containerInfo);
            const source = pendingLinkSource;
            const linkType = source.type;
            const notepadIdx = containerInfo.pageIndex !== undefined ? containerInfo.pageIndex : currentNotepadIndex;
            const linkId = ++linkIdCounter;
            const linkEntry = {
                id: linkId,
                type: linkType,
                sourceType: 'pdf',
                sourcePageNum: source.pageNum,
                sourceX: (source.bounds) ? (source.bounds.x1 + source.bounds.x2) / 2 : source.points[0].x,
                sourceY: (source.bounds) ? (source.bounds.y1 + source.bounds.y2) / 2 : source.points[0].y,
                sourceBounds: source.bounds || null,
                sourceScrollY: 0,
                targetType: 'notepad',
                targetPageNum: undefined,
                targetNotepadIndex: notepadIdx,
                targetX: localPoint.x,
                targetY: localPoint.y,
                targetBounds: null,
                targetScrollY: 0,
                color: source.color || penColor,
                imageData: source.imageData || null,
                created: Date.now()
            };
            linkData.push(linkEntry);
            insertPdfMarker(linkId, linkEntry.sourceX, linkEntry.sourceY, source.pageNum, linkType);
            if (linkType === 'scan' && source.imageData) {
                insertNotepadScanImage(linkId, localPoint.x, localPoint.y, source.imageData, notepadIdx);
            } else {
                insertNotepadMarker(linkId, localPoint.x, localPoint.y, linkType, notepadIdx);
            }
            waitingForDrop = false;
            pendingLinkSource = null;
            updateGlobalCanvasPointerEvents();
            updateModeStatus('✅ Link placed at exact position!');
            redrawGlobalStrokes();
        }

        // ---- GLOBAL EVENTS ----
        function onPointerDown(e) {
            if (isPinching) return;
            if (e.touches && e.touches.length > 1) return;

            if (isSelectTypeActive) {
                handleSelectTypeClick(e);
                return;
            }

            if (activeToolMode === 'pointer' || ['pen', 'highlighter', 'eraser', 'whitener'].includes(activeToolMode)) {
                startGlobalStroke(e);
            } else if (['line', 'underline', 'highlighter'].includes(activeToolMode)) {
                startLinkStroke(e);
            } else if (activeToolMode === 'scan') {
                handleScanPointerDown(e);
            } else if (activeToolMode === 'linkpoint') {
                handleLinkPointClick(e);
            }
        }

        function onPointerMove(e) {
            if (isPinching) return;
            if (e.touches && e.touches.length > 1) return;

            if (isSelectTypeActive) return;

            if (activeToolMode === 'pointer' || ['pen', 'highlighter', 'eraser', 'whitener'].includes(activeToolMode)) {
                drawGlobalStroke(e);
            } else if (['line', 'underline', 'highlighter'].includes(activeToolMode)) {
                drawLinkStroke(e);
            } else if (activeToolMode === 'scan') {
                handleScanPointerMove(e);
            }
        }

        function onPointerUp(e) {
            if (isSelectTypeActive) return;
            if (activeToolMode === 'pointer' || ['pen', 'highlighter', 'eraser', 'whitener'].includes(activeToolMode)) {
                stopGlobalStroke(e);
            } else if (['line', 'underline', 'highlighter'].includes(activeToolMode)) {
                stopLinkStroke(e);
            } else if (activeToolMode === 'scan') {
                handleScanPointerUp(e);
            }
        }

        globalCanvas.addEventListener('pointerdown', onPointerDown);
        globalCanvas.addEventListener('pointermove', onPointerMove);
        globalCanvas.addEventListener('pointerup', onPointerUp);
        globalCanvas.addEventListener('pointercancel', onPointerUp);
        globalCanvas.addEventListener('pointerleave', function(e) {
            if (isSelectTypeActive) return;
            if (activeToolMode === 'pointer' || ['pen', 'highlighter', 'eraser', 'whitener'].includes(activeToolMode)) {
                stopGlobalStroke(e);
            } else if (['line', 'underline', 'highlighter'].includes(activeToolMode)) {
                stopLinkStroke(e);
            }
        });

        globalCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
        globalCanvas.addEventListener('touchmove', onPointerMove, { passive: false });
        globalCanvas.addEventListener('touchend', onPointerUp);
        globalCanvas.addEventListener('touchcancel', onPointerUp);

        notepadScrollContainer.addEventListener('pointerdown', function(e) {
            if (waitingForDrop) handleNotepadDrop(e);
        });
        notepadScrollContainer.addEventListener('touchstart', function(e) {
            if (waitingForDrop) handleNotepadDrop(e);
        }, { passive: false });

        document.addEventListener('pointerdown', function(e) {
            if (waitingForDrop) {
                const rect = notepadScrollContainer.getBoundingClientRect();
                const x = e.clientX,
                    y = e.clientY;
                if (!(x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom)) {
                    cancelPendingLink();
                }
            }
        });

        // ================================================================
        // TOOL SELECTION (सिर्फ currentTool सेट करने के लिए)
        // ================================================================
        function setTool(tool) {
            currentTool = tool;
        }

        pickerColor.addEventListener('input', (e) => {
            penColor = e.target.value;
            const hex = e.target.value;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            highlighterColor = `rgba(${r},${g},${b},0.35)`;
        });

        sliderSize.addEventListener('input', (e) => { strokeWidth = parseInt(e.target.value, 10); });

        // ================================================================
        // LEFT RESIZER DRAG
        // ================================================================
        function startLeftResizing(e) {
            isLeftResizing = true;
            leftResizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            leftResizeStartX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            leftResizeStartMargin = leftMarginPx;
            if (e.pointerId && leftResizer.setPointerCapture) {
                try { leftResizer.setPointerCapture(e.pointerId); } catch (_) {}
            }
        }

        function handleLeftResizeMove(e) {
            if (!isLeftResizing) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            if (clientX === undefined) return;
            const deltaX = clientX - leftResizeStartX;
            let newMargin = leftResizeStartMargin + deltaX;
            const wsWidth = mainWorkspace.getBoundingClientRect().width || window.innerWidth;
            const maxMargin = wsWidth * 0.4;
            newMargin = Math.max(0, Math.min(newMargin, maxMargin));
            leftMarginPx = newMargin;
            applyLeftMargin(newMargin);
        }

        function stopLeftResizing(e) {
            if (isLeftResizing) {
                isLeftResizing = false;
                leftResizer.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                if (e && e.pointerId && leftResizer.releasePointerCapture) {
                    try { leftResizer.releasePointerCapture(e.pointerId); } catch (_) {}
                }
                resizeGlobalCanvas();
            }
        }

        function applyLeftMargin(marginPx) {
            pdfViewWrapper.style.marginLeft = marginPx + 'px';
            resizeGlobalCanvas();
        }

        leftResizer.addEventListener('pointerdown', startLeftResizing);
        leftResizer.addEventListener('touchstart', startLeftResizing, { passive: false });
        window.addEventListener('pointermove', handleLeftResizeMove);
        window.addEventListener('touchmove', handleLeftResizeMove, { passive: false });
        window.addEventListener('pointerup', stopLeftResizing);
        window.addEventListener('pointercancel', stopLeftResizing);
        window.addEventListener('touchend', stopLeftResizing);
        window.addEventListener('touchcancel', stopLeftResizing);

        // ================================================================
        // RIGHT RESIZER DRAG
        // ================================================================
        function startResizing(e) {
            isResizing = true;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            if (e.pointerId && resizer.setPointerCapture) { try { resizer.setPointerCapture(e.pointerId); } catch (_) {} }
        }

        function handleResizeMove(e) {
            if (!isResizing) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            if (clientX === undefined) return;
            const windowWidth = window.innerWidth;
            let pdfWidthPct = (clientX / windowWidth) * 100;
            updateWorkspaceWidths(pdfWidthPct);
        }

        function stopResizing(e) {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                if (e && e.pointerId && resizer.releasePointerCapture) { try { resizer.releasePointerCapture(e
                        .pointerId); } catch (_) {} }
                resizeGlobalCanvas();
            }
        }

        function updateWorkspaceWidths(pdfRatioPct) {
            const isOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
            if (!isOpen) return;
            if (resizeRafId) cancelAnimationFrame(resizeRafId);
            resizeRafId = requestAnimationFrame(() => {
                const clamped = Math.max(15, Math.min(85, pdfRatioPct));
                const notepadPct = 100 - clamped;
                pdfViewWrapper.style.width = clamped + '%';
                pdfViewWrapper.style.flex = '0 0 ' + clamped + '%';
                notepadPane.style.width = notepadPct + '%';
                notepadPane.style.flex = '0 0 ' + notepadPct + '%';
                resizeGlobalCanvas();
                setTimeout(updateAllOverlayMarkers, 50);
            });
        }

        resizer.addEventListener('pointerdown', startResizing);
        window.addEventListener('pointermove', handleResizeMove);
        window.addEventListener('pointerup', stopResizing);
        window.addEventListener('pointercancel', stopResizing);
        resizer.addEventListener('touchstart', startResizing, { passive: false });
        window.addEventListener('touchmove', handleResizeMove, { passive: false });
        window.addEventListener('touchend', stopResizing);
        window.addEventListener('touchcancel', stopResizing);

        // ================================================================
        // SMOOTH PINCH-TO-ZOOM
        // ================================================================
        function handleWorkspaceTouchStart(e) {
            if (e.touches && e.touches.length === 2) {
                isPinching = true;
                isZoomFinalizing = false;
                if (isDrawing) { isDrawing = false; if (activeStroke) { activeStroke = null; } }
                const t1 = e.touches[0],
                    t2 = e.touches[1];
                initialPinchDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                initialPinchScale = currentScale;
                if (zoomDebounceTimer) { clearTimeout(zoomDebounceTimer);
                    zoomDebounceTimer = null; }
                pdfContainer.style.willChange = 'transform';
                pdfViewWrapper.style.willChange = 'width, flex-basis, margin-left';
                notepadPane.style.willChange = 'width, flex-basis';
            }
        }

        function handleWorkspaceTouchMove(e) {
            if (isPinching && e.touches && e.touches.length === 2) {
                e.preventDefault();
                const t1 = e.touches[0],
                    t2 = e.touches[1];
                const currentDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                if (initialPinchDistance > 0) {
                    const factor = currentDistance / initialPinchDistance;
                    const newScale = Math.min(Math.max(initialPinchScale * factor, 0.5), 3.0);
                    applyZoomTransformSmooth(newScale);
                    if (zoomDebounceTimer) { clearTimeout(zoomDebounceTimer); }
                    zoomDebounceTimer = setTimeout(() => {}, 150);
                }
            }
        }

        function handleWorkspaceTouchEnd(e) {
            if (isPinching && (!e.touches || e.touches.length < 2)) {
                isPinching = false;
                if (zoomDebounceTimer) { clearTimeout(zoomDebounceTimer);
                    zoomDebounceTimer = null; }
                finalizeZoomSmooth();
            }
        }

        function applyZoomTransformSmooth(newScale) {
            const clampedScale = Math.min(Math.max(newScale, 0.5), 3.0);
            if (Math.abs(clampedScale - currentScale) < 0.003) return;

            const baseScale = 1.35;
            const scaleFactor = clampedScale / baseScale;

            pdfContainer.style.transition = 'transform 0.05s ease-out';
            pdfContainer.style.transform = `scale(${scaleFactor})`;
            pdfContainer.style.transformOrigin = 'top center';

            zoomLabel.textContent = Math.round(clampedScale * 100) + '%';

            const isNotepadOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
            if (isNotepadOpen) {
                const pdfRatio = 30 + (clampedScale - 0.5) * (50 / 2.5);
                const clampedPdfRatio = Math.max(30, Math.min(80, pdfRatio));
                const notepadPct = 100 - clampedPdfRatio;

                pdfViewWrapper.style.transition = 'width 0.08s ease-out, flex-basis 0.08s ease-out';
                pdfViewWrapper.style.width = clampedPdfRatio + '%';
                pdfViewWrapper.style.flex = '0 0 ' + clampedPdfRatio + '%';

                notepadPane.style.transition = 'width 0.08s ease-out, flex-basis 0.08s ease-out';
                notepadPane.style.width = notepadPct + '%';
                notepadPane.style.flex = '0 0 ' + notepadPct + '%';
            } else {
                pdfViewWrapper.style.width = '100%';
                pdfViewWrapper.style.flex = '1 1 100%';
            }

            currentScale = clampedScale;
            redrawGlobalStrokes();
            setTimeout(updateAllOverlayMarkers, 50);
        }

        function finalizeZoomSmooth() {
            if (isZoomFinalizing) return;
            isZoomFinalizing = true;

            pdfContainer.style.transition = 'none';
            pdfViewWrapper.style.transition = 'none';
            notepadPane.style.transition = 'none';

            pdfContainer.style.transform = '';
            pdfContainer.style.transformOrigin = '';
            pdfContainer.style.willChange = '';

            pdfViewWrapper.style.willChange = '';
            notepadPane.style.willChange = '';

            const isNotepadOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
            if (!isNotepadOpen) {
                pdfViewWrapper.style.width = '100%';
                pdfViewWrapper.style.flex = '1 1 100%';
            }

            const cards = document.querySelectorAll('.pdf-page-card');
            cards.forEach(card => {
                if (card.dataset.isPdfPage === 'true') {
                    card.dataset.rendered = 'false';
                    const rect = card.getBoundingClientRect();
                    if (rect.top < window.innerHeight * 2 && rect.bottom > -window.innerHeight) {
                        renderSinglePage(card);
                    }
                } else {
                    const dims = getStandardPageDimensions();
                    card.style.width = dims.width + 'px';
                    card.style.height = dims.height + 'px';
                    card.style.minHeight = dims.height + 'px';
                }
            });

            setTimeout(() => {
                updateAllMarkerPositions();
                updateAllOverlayMarkers();
                redrawGlobalStrokes();
                resizeGlobalCanvas();
                document.querySelectorAll('.pdf-page-card').forEach(card => {
                    const pageNum = parseInt(card.dataset.pageNum, 10);
                    if (!isNaN(pageNum)) renderTextAnnotationsForPage(pageNum);
                });
                isZoomFinalizing = false;
            }, 80);
        }

        btnZoomIn.addEventListener('click', () => {
            const newScale = Math.min(currentScale + 0.15, 3.0);
            applyZoomTransformSmooth(newScale);
            setTimeout(() => finalizeZoomSmooth(), 120);
        });
        btnZoomOut.addEventListener('click', () => {
            const newScale = Math.max(currentScale - 0.15, 0.5);
            applyZoomTransformSmooth(newScale);
            setTimeout(() => finalizeZoomSmooth(), 120);
        });

        mainWorkspace.addEventListener('touchstart', handleWorkspaceTouchStart, { passive: false });
        mainWorkspace.addEventListener('touchmove', handleWorkspaceTouchMove, { passive: false });
        mainWorkspace.addEventListener('touchend', handleWorkspaceTouchEnd);
        mainWorkspace.addEventListener('touchcancel', handleWorkspaceTouchEnd);

        mainWorkspace.addEventListener('pointerdown', (e) => {
            activePointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activePointerMap.size === 2) {
                isPinching = true;
                isZoomFinalizing = false;
                if (isDrawing) { isDrawing = false; if (activeStroke) { activeStroke = null; } }
                const pts = Array.from(activePointerMap.values());
                initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                initialPinchScale = currentScale;
                if (zoomDebounceTimer) { clearTimeout(zoomDebounceTimer);
                    zoomDebounceTimer = null; }
                pdfContainer.style.willChange = 'transform';
                pdfViewWrapper.style.willChange = 'width, flex-basis, margin-left';
                notepadPane.style.willChange = 'width, flex-basis';
            }
        });

        mainWorkspace.addEventListener('pointermove', (e) => {
            if (activePointerMap.has(e.pointerId)) {
                activePointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
            }
            if (isPinching && activePointerMap.size === 2) {
                const pts = Array.from(activePointerMap.values());
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                if (initialPinchDistance > 0) {
                    const factor = dist / initialPinchDistance;
                    const newScale = Math.min(Math.max(initialPinchScale * factor, 0.5), 3.0);
                    applyZoomTransformSmooth(newScale);
                    if (zoomDebounceTimer) { clearTimeout(zoomDebounceTimer); }
                    zoomDebounceTimer = setTimeout(() => {}, 150);
                }
            }
        });

        const releasePointer = (e) => {
            activePointerMap.delete(e.pointerId);
            if (activePointerMap.size < 2 && isPinching) {
                isPinching = false;
                if (zoomDebounceTimer) { clearTimeout(zoomDebounceTimer);
                    zoomDebounceTimer = null; }
                finalizeZoomSmooth();
            }
        };
        mainWorkspace.addEventListener('pointerup', releasePointer);
        mainWorkspace.addEventListener('pointercancel', releasePointer);

        // ================================================================
        // NOTEPAD TOGGLE (50/50 डिफॉल्ट)
        // ================================================================
        function hideNotepad() {
            notepadPane.style.display = 'none';
            notepadPane.style.width = '0%';
            notepadPane.style.flex = '0 0 0%';
            resizer.style.display = 'none';
            pdfViewWrapper.style.width = '100%';
            pdfViewWrapper.style.flex = '1 1 100%';
            btnToggleNotepad.classList.remove('active');
            pdfContainer.style.transform = '';
            pdfContainer.style.transformOrigin = '';
            pdfContainer.style.transition = 'none';
            pdfContainer.style.willChange = '';
            resizeGlobalCanvas();
        }

        function showNotepad() {
            notepadPane.style.display = 'flex';
            const pdfRatio = 50;
            const notepadPct = 50;
            pdfViewWrapper.style.width = pdfRatio + '%';
            pdfViewWrapper.style.flex = '0 0 ' + pdfRatio + '%';
            notepadPane.style.width = notepadPct + '%';
            notepadPane.style.flex = '0 0 ' + notepadPct + '%';
            resizer.style.display = 'block';
            btnToggleNotepad.classList.add('active');
            resizeGlobalCanvas();
            setTimeout(updateAllOverlayMarkers, 80);
        }

        btnToggleNotepad.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = notepadPane.style.display === 'none' || getComputedStyle(notepadPane).display === 'none';
            if (isHidden) showNotepad();
            else hideNotepad();
        });

        btnCloseNotepad.addEventListener('click', (e) => { e.stopPropagation();
            hideNotepad(); });

        // ---- Notepad bg select change ----
        notepadBgSelect.addEventListener('change', function() {
            const newBg = this.value;
            if (currentNotepadIndex >= 0 && currentNotepadIndex < notepadPagesData.length) {
                notepadPagesData[currentNotepadIndex].background = newBg;
                const content = getNotepadPageContent(currentNotepadIndex);
                if (content) {
                    content.className = content.className.split(' ').filter(c => !c.startsWith('bg-')).join(' ');
                    content.classList.add(newBg);
                }
            }
        });

        // ---- Auto-save ----
        notepadPagesContainer.addEventListener('blur', function(e) {
            const target = e.target;
            if (target.classList.contains('notepad-page-content')) {
                const wrapper = target.closest('.notepad-page-wrapper');
                if (wrapper) {
                    const idx = parseInt(wrapper.dataset.pageIndex, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < notepadPagesData.length) {
                        notepadPagesData[idx].content = target.innerHTML;
                    }
                }
            }
        }, true);

        // ---- Scroll detection ----
        let scrollTimeoutId = null;
        notepadScrollContainer.addEventListener('scroll', function() {
            if (scrollTimeoutId) clearTimeout(scrollTimeoutId);
            scrollTimeoutId = setTimeout(() => {
                const wrappers = notepadPagesContainer.querySelectorAll('.notepad-page-wrapper');
                const containerRect = notepadScrollContainer.getBoundingClientRect();
                let closestIdx = currentNotepadIndex;
                let closestDist = Infinity;
                wrappers.forEach((wrapper, idx) => {
                    const rect = wrapper.getBoundingClientRect();
                    const center = rect.top + rect.height / 2;
                    const containerCenter = containerRect.top + containerRect.height / 2;
                    const dist = Math.abs(center - containerCenter);
                    if (dist < closestDist) { closestDist = dist;
                        closestIdx = idx; }
                });
                if (closestIdx !== currentNotepadIndex && closestIdx < notepadPagesData.length) {
                    saveCurrentPageContent();
                    currentNotepadIndex = closestIdx;
                    updateNotepadMarkersVisibility();
                    updateNotepadHeader();
                    updateNotepadNav();
                    redrawGlobalStrokes();
                }
                updateAllOverlayMarkers();
            }, 50);
        });

        // ================================================================
        // MOUSE WHEEL ZOOM (Ctrl+Wheel)
        // ================================================================
        mainWorkspace.addEventListener('wheel', function(e) {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const delta = -e.deltaY * 0.01;
                let newScale = currentScale + delta;
                newScale = Math.min(Math.max(newScale, 0.5), 3.0);
                applyZoomTransformSmooth(newScale);
                if (zoomDebounceTimer) clearTimeout(zoomDebounceTimer);
                zoomDebounceTimer = setTimeout(() => {
                    finalizeZoomSmooth();
                }, 150);
            }
        }, { passive: false });

        // ================================================================
        // MULTI-DOCUMENT ENGINE
        // ================================================================
        function updateDocSummaryLabel() {
            if (loadedDocs.length === 0) {
                docInfo.textContent = totalPages > 0 ? `Custom Workspace (${totalPages} ${totalPages===1?'page':'pages'})` :
                    'No file selected';
            } else if (loadedDocs.length === 1) {
                docInfo.textContent = `${loadedDocs[0].fileName} (${totalPages} ${totalPages===1?'page':'pages'})`;
            } else {
                docInfo.textContent = `${loadedDocs.length} Cases (${totalPages} pages total)`;
            }
        }

        function updateAllPageIndicators() {
            const cards = pdfContainer.querySelectorAll('.pdf-page-card');
            totalPages = cards.length;
            cards.forEach((card, index) => {
                const pageNum = index + 1;
                card.dataset.pageNum = pageNum;
                const indicator = card.querySelector('.page-number-indicator');
                if (indicator) indicator.textContent = `PAGE ${pageNum} OF ${totalPages}`;
            });
        }

        function getCurrentlyActivePageNode() {
            const cards = Array.from(pdfContainer.querySelectorAll('.pdf-page-card'));
            if (!cards.length) return null;
            const wrapperRect = pdfViewWrapper.getBoundingClientRect();
            const wrapperCenter = wrapperRect.top + wrapperRect.height / 2;
            let closest = cards[0],
                minDist = Infinity;
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const center = rect.top + rect.height / 2;
                const dist = Math.abs(center - wrapperCenter);
                if (dist < minDist) { minDist = dist;
                    closest = card; }
            });
            return closest;
        }

        function initIntersectionObserver() {
            if (intersectionObserver) intersectionObserver.disconnect();
            intersectionObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageCard = entry.target;
                        if (pageCard.dataset.isPdfPage === 'true' && pageCard.dataset.rendered !== 'true') {
                            renderSinglePage(pageCard);
                        }
                    }
                });
            }, { root: pdfViewWrapper, rootMargin: '600px 0px', threshold: 0.01 });
        }

        function appendPageCardsForRange(docIndex, start, end) {
            if (!intersectionObserver) initIntersectionObserver();
            for (let i = start; i <= end; i++) {
                const pageCard = document.createElement('div');
                pageCard.className = 'pdf-page-card';
                pageCard.dataset.docIndex = docIndex;
                pageCard.dataset.internalPageNum = i;
                pageCard.dataset.isPdfPage = 'true';
                pageCard.style.minHeight = '850px';
                const indicator = document.createElement('div');
                indicator.className = 'page-number-indicator';
                const wrapper = document.createElement('div');
                wrapper.className = 'canvas-wrapper';
                const pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-canvas';
                wrapper.appendChild(pdfCanvas);
                pageCard.appendChild(indicator);
                pageCard.appendChild(wrapper);
                pdfContainer.appendChild(pageCard);
                intersectionObserver.observe(pageCard);
            }
            updateAllPageIndicators();
            redrawGlobalStrokes();
        }

        function renderSinglePage(pageCard) {
            if (pageCard.dataset.isPdfPage !== 'true' || pageCard.dataset.rendering === 'true') return;
            const docIndex = parseInt(pageCard.dataset.docIndex, 10);
            const pageNum = parseInt(pageCard.dataset.internalPageNum, 10);
            const docEntry = loadedDocs[docIndex];
            if (!docEntry || !docEntry.pdfDoc) return;
            pageCard.dataset.rendering = 'true';
            docEntry.pdfDoc.getPage(pageNum).then(page => {
                const viewport = page.getViewport({ scale: currentScale });
                const pdfCanvas = pageCard.querySelector('.pdf-canvas');
                const wrapper = pageCard.querySelector('.canvas-wrapper');
                const ctx = pdfCanvas.getContext('2d');
                pdfCanvas.width = viewport.width;
                pdfCanvas.height = viewport.height;
                wrapper.style.width = viewport.width + 'px';
                wrapper.style.height = viewport.height + 'px';
                pageCard.style.width = viewport.width + 'px';
                pageCard.style.height = viewport.height + 'px';
                pageCard.style.minHeight = viewport.height + 'px';
                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                    pageCard.dataset.rendered = 'true';
                    pageCard.dataset.rendering = 'false';
                    redrawGlobalStrokes();
                    linkData.forEach(link => {
                        if (link.sourceType === 'pdf' && link.sourcePageNum === parseInt(pageCard.dataset
                            .pageNum, 10)) {
                            let cx = link.sourceX,
                                cy = link.sourceY;
                            if (link.sourceBounds) { cx = (link.sourceBounds.x1 + link.sourceBounds
                                .x2) / 2;
                                cy = (link.sourceBounds.y1 + link.sourceBounds.y2) / 2; }
                            insertPdfMarker(link.id, cx, cy, link.sourcePageNum, link.type);
                        }
                        if (link.targetType === 'pdf' && link.targetPageNum === parseInt(pageCard.dataset
                            .pageNum, 10)) {
                            let cx = link.targetX,
                                cy = link.targetY;
                            if (link.targetBounds) { cx = (link.targetBounds.x1 + link.targetBounds
                                .x2) / 2;
                                cy = (link.targetBounds.y1 + link.targetBounds.y2) / 2; }
                            insertPdfMarker(link.id, cx, cy, link.targetPageNum, link.type);
                        }
                    });
                    renderTextAnnotationsForPage(parseInt(pageCard.dataset.pageNum, 10));
                }).catch(() => { pageCard.dataset.rendering = 'false'; });
            }).catch(() => { pageCard.dataset.rendering = 'false'; });
        }

        function getStandardPageDimensions() {
            const existing = pdfContainer.querySelector('.pdf-page-card');
            if (existing && existing.offsetWidth > 0) {
                return { width: existing.offsetWidth, height: existing.offsetHeight || Math.round(existing.offsetWidth *
                        1.3) };
            }
            return { width: Math.round(612 * currentScale), height: Math.round(792 * currentScale) };
        }

        function createPageTextLayer() {
            const textLayer = document.createElement('div');
            textLayer.className = 'page-text-layer';
            textLayer.contentEditable = 'true';
            textLayer.setAttribute('spellcheck', 'false');
            textLayer.setAttribute('placeholder', 'Tap here to type notes...');
            return textLayer;
        }

        function insertPageCardInPlace(pageCard) {
            const activeCard = getCurrentlyActivePageNode();
            if (activeCard && activeCard.parentNode === pdfContainer) {
                activeCard.insertAdjacentElement('afterend', pageCard);
            } else {
                pdfContainer.appendChild(pageCard);
            }
            updateAllPageIndicators();
            updateDocSummaryLabel();
            closeModal();
            redrawGlobalStrokes();
            const wrapperRect = pdfViewWrapper.getBoundingClientRect();
            const cardRect = pageCard.getBoundingClientRect();
            pdfViewWrapper.scrollTo({ top: pdfViewWrapper.scrollTop + (cardRect.top - wrapperRect.top),
                behavior: 'smooth' });
        }

        // ================================================================
        // MODAL HANDLERS
