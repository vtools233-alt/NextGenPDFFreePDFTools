<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF Viewer & Workspace</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary-accent: #2563eb;
      --primary-accent-hover: #1d4ed8;
      --active-bg: #eff6ff;
      --active-border: #3b82f6;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --toolbar-height: 55px;
      --link-color: #2563eb;
      --link-highlight: rgba(37, 99, 235, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      background-color: var(--bg-primary);
      color: var(--text-main);
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* TOP TOOLBAR */
    #top-toolbar {
      position: relative;
      width: 100%;
      height: var(--toolbar-height);
      z-index: 1000;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 10px;
      white-space: nowrap;
      padding: 0 15px;
      -webkit-overflow-scrolling: touch;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #top-toolbar::-webkit-scrollbar { display: none; }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .toolbar-divider {
      height: 24px;
      width: 1px;
      background-color: var(--border-color);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }
    .btn-primary {
      background-color: var(--primary-accent);
      color: #ffffff;
      border-color: var(--primary-accent);
    }
    .btn-primary:hover {
      background-color: var(--primary-accent-hover);
      border-color: var(--primary-accent-hover);
    }

    .btn-tool {
      padding: 8px;
      min-width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .btn-tool.active {
      background-color: var(--active-bg);
      border-color: var(--active-border);
      color: var(--primary-accent);
    }

    .tool-group {
      display: flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .tool-group .btn-tool {
      border: none;
      border-radius: 5px;
      background: transparent;
    }
    .tool-group .btn-tool.active {
      background-color: #ffffff;
      box-shadow: var(--shadow-sm);
      color: var(--primary-accent);
    }

    #doc-info {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .control-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      flex-shrink: 0;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
      flex-shrink: 0;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      flex-shrink: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--border-color);
      border-radius: 50%;
    }

    input[type="range"] {
      width: 70px;
      accent-color: var(--primary-accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* MAIN WORKSPACE */
    #main-workspace {
      display: flex;
      flex-direction: row;
      width: 100%;
      flex: 1;
      height: calc(100vh - var(--toolbar-height));
      overflow: hidden;
      position: relative;
      touch-action: none;
      background-color: #f1f5f9;
    }

    /* GLOBAL DRAWING OVERLAY */
    #global-drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
      touch-action: none;
    }

    /* PDF VIEWPORT CONTAINER */
    #pdf-view-wrapper {
      flex: 1 1 100%;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #f1f5f9;
      position: relative;
      display: block;
      padding: 24px 0 80px 0;
      box-sizing: border-box;
      min-width: 0;
      touch-action: pan-x pan-y;
    }

    #pdf-container {
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin: 0 auto;
      transform-origin: top center;
    }

    /* RESIZER — ULTRA-THIN, TRANSPARENT */
    #resizer {
      width: 2px;
      height: 100%;
      background-color: transparent;
      cursor: col-resize;
      flex-shrink: 0;
      user-select: none;
      touch-action: none;
      z-index: 30;
      display: none;
      position: relative;
      transition: background-color 0.2s ease, width 0.2s ease;
    }
    #resizer:hover, #resizer.active {
      background-color: var(--primary-accent);
      width: 4px;
    }
    #resizer::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1px;
      height: 24px;
      background-color: #94a3b8;
      border-radius: 1px;
      transition: all 0.2s ease;
    }
    #resizer:hover::after, #resizer.active::after {
      background-color: #ffffff;
      height: 32px;
    }

    /* PAGE CARD STYLES */
    .pdf-page-card {
      position: relative;
      background-color: #ffffff;
      box-shadow: var(--shadow-md);
      border-radius: 4px;
      min-height: 850px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
      flex-shrink: 0;
      transition: box-shadow 0.2s ease;
    }
    .pdf-page-card:hover { box-shadow: var(--shadow-lg); }

    .page-number-indicator {
      position: absolute;
      top: -22px;
      left: 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .canvas-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      width: 100%;
      height: 100%;
    }

    .pdf-canvas {
      display: block;
      position: relative;
      z-index: 1;
    }

    /* NATIVE TOUCH TYPING LAYER (for templates / image pages) */
    .page-text-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      outline: none;
      padding: 32px 28px;
      box-sizing: border-box;
      font-size: 16px;
      line-height: 32px;
      color: #0f172a;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: text;
      pointer-events: auto;
    }
    .page-text-layer.block-events {
      pointer-events: none !important;
    }

    /* PDF LINK HIGHLIGHT OVERLAY */
    .pdf-link-highlight {
      position: absolute;
      border-radius: 4px;
      pointer-events: none;
      z-index: 3;
      background-color: var(--link-highlight);
      border: 2px solid var(--primary-accent);
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .pdf-link-highlight.active {
      opacity: 1;
    }

    /* INITIAL EMPTY STATE */
    #empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      background: #ffffff;
      padding: 40px 60px;
      border-radius: 12px;
      border: 2px dashed #cbd5e1;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }
    #empty-state svg {
      width: 48px;
      height: 48px;
      stroke: var(--text-muted);
    }
    #empty-state h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }
    #empty-state p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 300px;
    }

    /* NOTEPAD SPLIT VIEW SIDEBAR — NO BORDER, FLUSH WITH PDF */
    #notepad-pane {
      display: none;
      width: 0%;
      flex: 0 0 0%;
      height: 100%;
      background-color: #ffffff;
      border-left: none;
      flex-direction: column;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.04);
      z-index: 20;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      min-width: 0;
      background-color: #f1f5f9;
    }

    #notepad-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      flex-shrink: 0;
    }
    #notepad-header h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .notepad-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* NOTEPAD EDITOR — contentEditable div (replaces textarea) */
    #notepad-editor-container {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      position: relative;
      background-color: #ffffff;
    }

    #notepad-editor {
      width: 100%;
      min-height: 100%;
      height: auto;
      outline: none;
      font-size: 15px;
      background: transparent;
      color: #1e293b;
      font-family: inherit;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* NOTEPAD BACKGROUND TEMPLATES */
    .bg-red-lined {
      background-color: #ffffff;
      background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
      background-size: 100% 32px;
      line-height: 32px !important;
      border-left: 3px solid #f87171 !important;
      padding-left: 16px !important;
    }
    .bg-purple-lined {
      background-color: #ffffff;
      background-image: linear-gradient(#f3e8ff 1px, transparent 1px);
      background-size: 100% 32px;
      line-height: 32px !important;
      border-left: 3px solid #c084fc !important;
      padding-left: 16px !important;
    }
    .bg-dot-grid {
      background-color: #ffffff;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      line-height: 24px !important;
      padding-left: 12px !important;
    }

    /* NOTEPAD LINK MARKER STYLES */
    .notepad-link-marker {
      display: inline-block;
      width: 18px;
      height: 18px;
      background: var(--primary-accent);
      border-radius: 50%;
      margin: 0 4px;
      cursor: pointer;
      position: relative;
      vertical-align: middle;
      transition: all 0.2s ease;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }
    .notepad-link-marker:hover {
      transform: scale(1.25);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .notepad-link-marker::after {
      content: '🔗';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 9px;
      line-height: 1;
    }
    .notepad-link-marker .link-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      font-weight: 400;
    }
    .notepad-link-marker:hover .link-tooltip {
      display: block;
    }
    .notepad-link-marker .link-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: #1e293b;
    }

    /* LINK LINE DASH STYLE ON OVERLAY (applied via drawing) */
    /* We'll draw dashed lines for links */

    /* PAGE TEMPLATE BACKGROUNDS */
    .page-template-white { background-color: #ffffff; }
    .page-template-lined-white {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 100% 32px;
      border-left: 3px solid #f87171 !important;
    }
    .page-template-dot-grid {
      background-color: #ffffff;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .page-template-yellow-blank { background-color: #fef9c3; }
    .page-template-yellow-lined {
      background-color: #fef9c3;
      background-image: linear-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 100% 32px;
      border-left: 3px solid #f87171 !important;
    }

    /* MODAL POP-UP */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-content {
      background-color: #ffffff;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
      max-height: 80vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: #f8fafc;
    }
    .modal-header h3 { font-size: 16px; font-weight: 600; color: var(--text-main); }
    .modal-close-btn {
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }
    .modal-close-btn:hover {
      color: var(--text-main);
      background-color: #e2e8f0;
    }
    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-section h4 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .modal-action-btn {
      padding: 12px;
      font-size: 14px;
      justify-content: center;
    }
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .template-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .template-option:hover {
      border-color: var(--primary-accent);
      background-color: var(--active-bg);
    }
    .template-preview {
      width: 100%;
      height: 60px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    .template-option span {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      text-align: center;
    }

    .bg-template-white { background-color: #ffffff; }
    .bg-template-lined-white {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 100% 16px;
      border-left: 2px solid #f87171 !important;
    }
    .bg-template-dot-grid {
      background-color: #ffffff;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 12px 12px;
    }
    .bg-template-yellow-blank { background-color: #fef9c3; }
    .bg-template-yellow-lined {
      background-color: #fef9c3;
      background-image: linear-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 100% 16px;
      border-left: 2px solid #f87171 !important;
    }
  </style>
</head>
<body>

  <header id="top-toolbar">
    <div class="toolbar-section">
      <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;" />
      <button class="btn btn-primary" id="btn-open-pdf">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        Open PDF
      </button>

      <input type="file" id="case-plus-input" accept="application/pdf" multiple style="display: none;" />
      <button class="btn" id="btn-case-plus" title="Append single or multiple supplementary PDFs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Case +
      </button>

      <span id="doc-info">No file selected</span>

      <button class="btn" id="btn-add-page" title="Insert Page Below Active Page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        + Page
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-section">
      <div class="tool-group">
        <button class="btn btn-tool active" id="tool-select" title="Selection / Scroll Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"></path></svg>
        </button>
        <button class="btn btn-tool" id="tool-pen" title="Pen Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
        </button>
        <button class="btn btn-tool" id="tool-highlighter" title="Highlighter Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11-6 6v3h3l6-6"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></svg>
        </button>
        <button class="btn btn-tool" id="tool-eraser" title="Eraser Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
        </button>
      </div>

      <div class="color-picker-wrapper">
        <span class="control-label">Color:</span>
        <input type="color" id="picker-color" value="#1e293b" title="Stroke Color" />
      </div>

      <div class="color-picker-wrapper">
        <span class="control-label">Size:</span>
        <input type="range" id="slider-size" min="1" max="25" value="3" title="Stroke Thickness" />
      </div>

      <button class="btn" id="btn-clear-page" title="Clear Screen Annotations">
        Clear Page
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-section">
      <button class="btn btn-tool" id="btn-zoom-out" title="Zoom Out">

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ================================================================
    // STATE
    // ================================================================
    let loadedDocs = [];
    let totalPages = 0;
    let currentScale = 1.35;
    let currentTool = 'select';
    let penColor = '#1e293b';
    let highlighterColor = 'rgba(250, 204, 21, 0.4)';
    let strokeWidth = 3;
    let intersectionObserver = null;

    // Drawing state
    let globalStrokes = [];
    let activeStroke = null;
    let isDrawing = false;

    // ---- LINK SYSTEM ----
    let linkData = [];
    let linkIdCounter = 0;
    let activeHighlightId = null;

    // DOM refs
    const fileInput = document.getElementById('pdf-file-input');
    const btnOpenPdf = document.getElementById('btn-open-pdf');
    const casePlusInput = document.getElementById('case-plus-input');
    const btnCasePlus = document.getElementById('btn-case-plus');
    const btnAddPage = document.getElementById('btn-add-page');
    const btnTriggerCamera = document.getElementById('btn-trigger-camera');
    const btnTriggerGallery = document.getElementById('btn-trigger-gallery');
    const cameraOnlyInput = document.getElementById('camera-only-input');
    const galleryOnlyInput = document.getElementById('gallery-only-input');
    const addPageModal = document.getElementById('add-page-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const docInfo = document.getElementById('doc-info');
    const mainWorkspace = document.getElementById('main-workspace');
    const globalCanvas = document.getElementById('global-drawing-canvas');
    const globalCtx = globalCanvas.getContext('2d');
    const pdfContainer = document.getElementById('pdf-container');
    const emptyState = document.getElementById('empty-state');
    const pdfViewWrapper = document.getElementById('pdf-view-wrapper');
    const notepadPane = document.getElementById('notepad-pane');
    const notepadEditorContainer = document.getElementById('notepad-editor-container');
    const notepadEditor = document.getElementById('notepad-editor');
    const resizer = document.getElementById('resizer');
    const btnToggleNotepad = document.getElementById('btn-toggle-notepad');
    const btnCloseNotepad = document.getElementById('btn-close-notepad');
    const notepadBgSelect = document.getElementById('notepad-bg-select');
    const toolSelect = document.getElementById('tool-select');
    const toolPen = document.getElementById('tool-pen');
    const toolHighlighter = document.getElementById('tool-highlighter');
    const toolEraser = document.getElementById('tool-eraser');
    const pickerColor = document.getElementById('picker-color');
    const sliderSize = document.getElementById('slider-size');
    const btnClearPage = document.getElementById('btn-clear-page');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const zoomLabel = document.getElementById('zoom-label');
    const btnExportPdf = document.getElementById('btn-export-pdf');

    // ----- RESIZER STATE -----
    let isResizing = false;

    // ----- PINCH STATE -----
    let isPinching = false;
    let initialPinchDistance = 0;
    let initialPdfRatio = 50;
    let pinchCenterPane = 'pdf';
    let pinchRafId = null;
    const activePointerMap = new Map();

    // ================================================================
    // COORDINATE HELPERS (workspace-relative)
    // ================================================================
    function getWorkspaceRect() {
      return mainWorkspace.getBoundingClientRect();
    }

    function getContainerFromPoint(globalX, globalY) {
      const wsRect = getWorkspaceRect();
      const viewportX = globalX + wsRect.left;
      const viewportY = globalY + wsRect.top;
      const elements = document.elementsFromPoint(viewportX, viewportY);
      for (let el of elements) {
        const card = el.closest('.pdf-page-card');
        if (card) {
          const rect = card.getBoundingClientRect();
          const offsetX = rect.left - wsRect.left;
          const offsetY = rect.top - wsRect.top;
          return { type: 'pdf', pageNum: parseInt(card.dataset.pageNum, 10), element: card, offsetX, offsetY, rect };
        }
      }
      const notepadRect = notepadEditorContainer.getBoundingClientRect();
      if (notepadPane.style.display !== 'none') {
        const nOffsetX = notepadRect.left - wsRect.left;
        const nOffsetY = notepadRect.top - wsRect.top;
        if (globalX >= nOffsetX && globalX <= nOffsetX + notepadRect.width &&
            globalY >= nOffsetY && globalY <= nOffsetY + notepadRect.height) {
          return { type: 'notepad', element: notepadEditorContainer, offsetX: nOffsetX, offsetY: nOffsetY, rect: notepadRect };
        }
      }
      return null;
    }

    function globalToContainer(globalX, globalY, containerInfo) {
      if (containerInfo.type === 'pdf') {
        return { x: globalX - containerInfo.offsetX, y: globalY - containerInfo.offsetY };
      } else if (containerInfo.type === 'notepad') {
        const scrollX = notepadEditorContainer.scrollLeft || 0;
        const scrollY = notepadEditorContainer.scrollTop || 0;
        return { x: globalX - containerInfo.offsetX + scrollX, y: globalY - containerInfo.offsetY + scrollY };
      }
      return { x: globalX, y: globalY };
    }

    function containerToGlobal(containerX, containerY, containerInfo) {
      if (containerInfo.type === 'pdf') {
        return { x: containerX + containerInfo.offsetX, y: containerY + containerInfo.offsetY };
      } else if (containerInfo.type === 'notepad') {
        const scrollX = notepadEditorContainer.scrollLeft || 0;
        const scrollY = notepadEditorContainer.scrollTop || 0;
        return { x: containerX + containerInfo.offsetX - scrollX, y: containerY + containerInfo.offsetY - scrollY };
      }
      return { x: containerX, y: containerY };
    }

    // ================================================================
    // LINK SYSTEM
    // ================================================================

    // Insert a link marker in the notepad editor
    function insertLinkMarker(linkId, x, y) {
      // Find or create a marker span at the specified position
      // Since we're using contentEditable, we need to insert at the cursor position
      // or at a specific location. We'll use a combination of range and selection.
      
      const editor = notepadEditor;
      if (!editor) return;

      // Focus the editor
      editor.focus();

      // Create a range at the end of the editor
      const range = document.createRange();
      const sel = window.getSelection();
      
      // Place cursor at the end
      range.selectNodeContents(editor);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);

      // Create the marker element
      const marker = document.createElement('span');
      marker.className = 'notepad-link-marker';
      marker.dataset.linkId = linkId;
      marker.contentEditable = 'false';
      
      // Tooltip
      const tooltip = document.createElement('span');
      tooltip.className = 'link-tooltip';
      tooltip.textContent = '🔗 Click to jump to PDF';
      marker.appendChild(tooltip);

      // Click handler
      marker.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = parseInt(this.dataset.linkId, 10);
        jumpToLink(id);
      });

      // Insert at cursor position
      range.insertNode(marker);

      // Add a space after the marker for typing
      const spaceNode = document.createTextNode(' ');
      range.setStartAfter(marker);
      range.insertNode(spaceNode);

      // Move cursor after the space
      range.setStartAfter(spaceNode);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);

      // Store marker position info in the link data
      const link = linkData.find(l => l.id === linkId);
      if (link) {
        link.markerElement = marker;
      }

      // Save content to localStorage or keep in memory
      saveNotepadContent();
    }

    // Jump to a link (scroll to PDF page)
    function jumpToLink(linkId) {
      const link = linkData.find(l => l.id === linkId);
      if (!link) return;

      if (link.sourceType === 'pdf') {
        // Scroll to PDF
        const pageNum = link.sourcePageNum;
        const card = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${pageNum}"]`);
        if (card) {
          // Scroll the page into view
          const wrapperRect = pdfViewWrapper.getBoundingClientRect();
          const cardRect = card.getBoundingClientRect();
          pdfViewWrapper.scrollTo({
            top: pdfViewWrapper.scrollTop + (cardRect.top - wrapperRect.top) - 60,
            behavior: 'smooth'
          });

          // Show highlight on PDF
          showPdfHighlight(link.sourceX, link.sourceY, pageNum);
        }
      } else if (link.sourceType === 'notepad') {
        // Scroll to notepad position
        notepadEditorContainer.scrollTo({
          top: link.sourceScrollY || 0,
          behavior: 'smooth'
        });
        // Focus the editor
        notepadEditor.focus();
      }
    }

    // Show a highlight on the PDF at a specific position
    function showPdfHighlight(x, y, pageNum) {
      // Remove old highlight
      document.querySelectorAll('.pdf-link-highlight').forEach(el => el.remove());

      const card = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${pageNum}"]`);
      if (!card) return;

      // Create highlight element
      const highlight = document.createElement('div');
      highlight.className = 'pdf-link-highlight active';
      highlight.style.left = (x - 20) + 'px';
      highlight.style.top = (y - 10) + 'px';
      highlight.style.width = '40px';
      highlight.style.height = '20px';
      highlight.style.borderRadius = '4px';
      highlight.style.pointerEvents = 'none';
      highlight.style.position = 'absolute';
      highlight.style.zIndex = '3';

      // Append to canvas wrapper
      const wrapper = card.querySelector('.canvas-wrapper');
      if (wrapper) {
        wrapper.appendChild(highlight);
        // Auto fade after 2 seconds
        setTimeout(() => {
          highlight.classList.remove('active');
          setTimeout(() => highlight.remove(), 400);
        }, 2000);
      }
    }

    // Save notepad content (for persistence)
    function saveNotepadContent() {
      // We'll keep it in memory - no localStorage for now
    }

    // Restore notepad content with markers
    function restoreNotepadContent(content) {
      if (content) {
        notepadEditor.innerHTML = content;
      }
    }

    // ================================================================
    // DRAWING SYSTEM (unchanged tool logic, with link detection added)
    // ================================================================

    function redrawGlobalStrokes() {
      const wsRect = getWorkspaceRect();
      globalCanvas.width = wsRect.width;
      globalCanvas.height = wsRect.height;
      globalCtx.clearRect(0, 0, globalCanvas.width, globalCanvas.height);

      // Draw regular strokes
      globalStrokes.forEach(stroke => {
        if (!stroke.points || stroke.points.length < 2) return;

        let containerInfo = null;
        if (stroke.container === 'pdf') {
          const card = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${stroke.pageNum}"]`);
          if (!card) return;
          const rect = card.getBoundingClientRect();
          const offsetX = rect.left - wsRect.left;
          const offsetY = rect.top - wsRect.top;
          containerInfo = { type: 'pdf', pageNum: stroke.pageNum, element: card, offsetX, offsetY, rect };
        } else if (stroke.container === 'notepad') {
          if (notepadPane.style.display === 'none') return;
          const rect = notepadEditorContainer.getBoundingClientRect();
          const offsetX = rect.left - wsRect.left;
          const offsetY = rect.top - wsRect.top;
          containerInfo = { type: 'notepad', element: notepadEditorContainer, offsetX, offsetY, rect };
        } else {
          return;
        }

        const globalPoints = stroke.points.map(p => containerToGlobal(p.x, p.y, containerInfo));

        globalCtx.save();
        globalCtx.beginPath();
        globalCtx.moveTo(globalPoints[0].x, globalPoints[0].y);
        for (let i = 1; i < globalPoints.length; i++) {
          globalCtx.lineTo(globalPoints[i].x, globalPoints[i].y);
        }

        // Check if this stroke is a link (has linkData associated)
        const isLink = linkData.some(l => l.strokeId === stroke.id);

        if (isLink) {
          // Draw as dashed line for links
          globalCtx.setLineDash([6, 4]);
          globalCtx.lineDashOffset = 0;
        } else {
          globalCtx.setLineDash([]);
        }

        if (stroke.tool === 'pen') {
          globalCtx.globalCompositeOperation = 'source-over';
          globalCtx.strokeStyle = stroke.color;
          globalCtx.lineWidth = stroke.width;
          globalCtx.lineCap = 'round';
          globalCtx.lineJoin = 'round';
        } else if (stroke.tool === 'highlighter') {
          globalCtx.globalCompositeOperation = 'source-over';
          globalCtx.strokeStyle = stroke.color;
          globalCtx.lineWidth = stroke.width * 4;
          globalCtx.lineCap = 'square';
          globalCtx.lineJoin = 'miter';
        } else if (stroke.tool === 'eraser') {
          globalCtx.globalCompositeOperation = 'destination-out';
          globalCtx.lineWidth = stroke.width * 6;
          globalCtx.lineCap = 'round';
          globalCtx.lineJoin = 'round';
        }

        globalCtx.stroke();
        globalCtx.restore();
      });
    }

    // ----- DRAWING HANDLERS -----
    function startGlobalStroke(e) {
      if (currentTool === 'select' || isPinching) return;
      if (e.touches && e.touches.length > 1) return;
      e.preventDefault();

      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;

      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo) return;

      isDrawing = true;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);

      activeStroke = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        tool: currentTool,
        color: currentTool === 'highlighter' ? highlighterColor : penColor,
        width: strokeWidth,
        container: containerInfo.type,
        pageNum: containerInfo.type === 'pdf' ? containerInfo.pageNum : undefined,
        points: [localPoint],
        containerInfo: containerInfo
      };

      globalStrokes.push(activeStroke);
    }

    function drawGlobalStroke(e) {
      if (!isDrawing || !activeStroke || currentTool === 'select' || isPinching) return;
      if (e.touches && e.touches.length > 1) return;
      e.preventDefault();

      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;

      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo) return;

      // If container changed, transform points
      if (containerInfo.type !== activeStroke.container ||
          (containerInfo.type === 'pdf' && containerInfo.pageNum !== activeStroke.pageNum)) {
        let oldContainerInfo = null;
        if (activeStroke.container === 'pdf') {
          const oldCard = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${activeStroke.pageNum}"]`);
          if (!oldCard) return;
          const oldRect = oldCard.getBoundingClientRect();
          oldContainerInfo = { type: 'pdf', pageNum: activeStroke.pageNum, element: oldCard,
                               offsetX: oldRect.left - wsRect.left, offsetY: oldRect.top - wsRect.top };
        } else if (activeStroke.container === 'notepad') {
          if (notepadPane.style.display === 'none') return;
          const oldRect = notepadEditorContainer.getBoundingClientRect();
          oldContainerInfo = { type: 'notepad', element: notepadEditorContainer,
                               offsetX: oldRect.left - wsRect.left, offsetY: oldRect.top - wsRect.top };
        }
        if (!oldContainerInfo) return;

        const newPoints = activeStroke.points.map(p => {
          const g = containerToGlobal(p.x, p.y, oldContainerInfo);
          return globalToContainer(g.x, g.y, containerInfo);
        });
        activeStroke.points = newPoints;
        activeStroke.container = containerInfo.type;
        if (containerInfo.type === 'pdf') activeStroke.pageNum = containerInfo.pageNum;
        else delete activeStroke.pageNum;
        activeStroke.containerInfo = containerInfo;
      }

      const localPoint = globalToContainer(globalX, globalY, containerInfo);
      activeStroke.points.push(localPoint);

      // Incremental draw
      const lastPoint = activeStroke.points[activeStroke.points.length-2];
      const lastGlobal = containerToGlobal(lastPoint.x, lastPoint.y, containerInfo);
      const currGlobal = containerToGlobal(localPoint.x, localPoint.y, containerInfo);

      globalCtx.save();
      globalCtx.beginPath();
      globalCtx.moveTo(lastGlobal.x, lastGlobal.y);
      globalCtx.lineTo(currGlobal.x, currGlobal.y);

      if (currentTool === 'pen') {
        globalCtx.globalCompositeOperation = 'source-over';
        globalCtx.strokeStyle = penColor;
        globalCtx.lineWidth = strokeWidth;
        globalCtx.lineCap = 'round';
        globalCtx.lineJoin = 'round';
      } else if (currentTool === 'highlighter') {
        globalCtx.globalCompositeOperation = 'source-over';
        globalCtx.strokeStyle = highlighterColor;
        globalCtx.lineWidth = strokeWidth * 4;
        globalCtx.lineCap = 'square';
        globalCtx.lineJoin = 'miter';
      } else if (currentTool === 'eraser') {
        globalCtx.globalCompositeOperation = 'destination-out';
        globalCtx.lineWidth = strokeWidth * 6;
        globalCtx.lineCap = 'round';
        globalCtx.lineJoin = 'round';
      }
      globalCtx.stroke();
      globalCtx.restore();
    }

    function stopGlobalStroke(e) {
      if (isDrawing && activeStroke) {
        // ---- LINK DETECTION ----
        // Check if stroke connects PDF and Notepad
        const startContainer = activeStroke.points.length > 0 ? activeStroke.container : null;
        const endContainer = activeStroke.points.length > 1 ? activeStroke.container : null;

        // We need to check if the stroke spans across containers
        // The container might have changed during drawing, so we check the points
        let hasPdf = false;
        let hasNotepad = false;
        let pdfPoint = null;
        let notepadPoint = null;
        let pdfPageNum = null;
        let notepadScrollY = 0;

        // We'll check if any point is in PDF and any point is in Notepad
        // We'll use the containerInfo from the stroke
        if (activeStroke.container === 'pdf') {
          hasPdf = true;
          pdfPageNum = activeStroke.pageNum;
          // Get the last point (end of stroke)
          const lastPt = activeStroke.points[activeStroke.points.length - 1];
          pdfPoint = { x: lastPt.x, y: lastPt.y };
        } else if (activeStroke.container === 'notepad') {
          hasNotepad = true;
          notepadScrollY = notepadEditorContainer.scrollTop || 0;
          const lastPt = activeStroke.points[activeStroke.points.length - 1];
          notepadPoint = { x: lastPt.x, y: lastPt.y };
        }

        // Check if we have both PDF and Notepad (the stroke connects them)
        // We need to detect if the stroke started in one and ended in the other
        // Since the container might have changed, we check the stroke's container history
        // We'll use a simple approach: if the stroke has points in both containers

        // For simplicity, we'll check if the stroke's containerInfo changed during drawing
        // The activeStroke.containerInfo is the last container
        // We need to know if it started in a different container

        // We'll check by looking at the first and last points using the container info
        // But containerInfo only stores the last one. We'll store startContainerInfo as well.

        // Let's store start container info when the stroke starts
        // We'll store it in the stroke object
        if (!activeStroke.startContainerInfo) {
          // This is the first time we're stopping, so we missed it
          // We'll use the container of the first point
          const firstPt = activeStroke.points[0];
          // We need to find which container the first point is in
          // We'll use the container from the stroke's container property
          // But we need the start container
          if (activeStroke.points.length > 0) {
            // We'll use the container from the first point by checking the stroke's container
            // Actually, we stored the container in the stroke object
            activeStroke.startContainer = activeStroke.container;
          }
        }

        // Now we can detect if the stroke spans across containers
        // If the start container and end container are different, it's a link
        // For our current tracking, we check if the stroke has points in both containers
        // We'll use a simpler approach: check the container of the first point vs the last point

        // We'll recompute by checking the actual positions
        // Get the first point's container by checking where it falls
        const firstPt = activeStroke.points[0];
        const lastPt = activeStroke.points[activeStroke.points.length - 1];

        // Get container for first point
        let firstContainer = null;
        let lastContainer = null;

        // Use the stored container info
        if (activeStroke.container === 'pdf') {
          // The stroke ended in PDF, check if it started in Notepad
          // We need to check if any point is in Notepad
          // We'll check the container of the stroke
          // Actually, we stored the container in the stroke object
          // We need to know if the container changed during drawing
          // We'll use the container property of the stroke
          // If the stroke has both PDF and Notepad points, we need to detect it
          // We'll check if the stroke has points in both containers by looking at the points
          // For each point, we need to know its container
          // This is complex, so we'll use a simpler approach:
          // Check if the stroke started in one container and ended in another
          // We'll store the start container when the stroke starts

          // Actually, let's just check if the stroke spans across containers by looking at the points
          // We'll convert each point to global and check which container it falls in
          let hasPdfPoint = false;
          let hasNotepadPoint = false;
          let pdfPointLocal = null;
          let notepadPointLocal = null;
          let pdfPageNumLocal = null;

          // We'll check the first few points and last few points
          // For simplicity, we'll check the first point and last point
          // Convert first point to global
          const wsRect = getWorkspaceRect();
          let firstContainerInfo = null;
          let lastContainerInfo = null;

          // First point container
          const firstGlobal = containerToGlobal(firstPt.x, firstPt.y, activeStroke.containerInfo || { type: activeStroke.container, offsetX: 0, offsetY: 0, element: null, rect: null, pageNum: activeStroke.pageNum });
          const firstContainerCheck = getContainerFromPoint(firstGlobal.x, firstGlobal.y);
          if (firstContainerCheck) firstContainerInfo = firstContainerCheck;

          // Last point container
          const lastGlobal = containerToGlobal(lastPt.x, lastPt.y, activeStroke.containerInfo || { type: activeStroke.container, offsetX: 0, offsetY: 0, element: null, rect: null, pageNum: activeStroke.pageNum });
          const lastContainerCheck = getContainerFromPoint(lastGlobal.x, lastGlobal.y);
          if (lastContainerCheck) lastContainerInfo = lastContainerCheck;

          // If the first and last containers are different, it's a link
          if (firstContainerInfo && lastContainerInfo &&
              (firstContainerInfo.type !== lastContainerInfo.type ||
               (firstContainerInfo.type === 'pdf' && lastContainerInfo.type === 'pdf' &&
                firstContainerInfo.pageNum !== lastContainerInfo.pageNum))) {

            // It's a link!
            const linkId = ++linkIdCounter;
            const linkEntry = {
              id: linkId,
              strokeId: activeStroke.id,
              sourceType: firstContainerInfo.type,
              sourcePageNum: firstContainerInfo.type === 'pdf' ? firstContainerInfo.pageNum : undefined,
              sourceX: firstPt.x,
              sourceY: firstPt.y,
              sourceScrollY: firstContainerInfo.type === 'notepad' ? (notepadEditorContainer.scrollTop || 0) : 0,
              targetType: lastContainerInfo.type,
              targetPageNum: lastContainerInfo.type === 'pdf' ? lastContainerInfo.pageNum : undefined,
              targetX: lastPt.x,
              targetY: lastPt.y,
              targetScrollY: lastContainerInfo.type === 'notepad' ? (notepadEditorContainer.scrollTop || 0) : 0,
              created: Date.now()
            };

            linkData.push(linkEntry);

            // If the target is notepad, insert a marker
            if (lastContainerInfo.type === 'notepad') {
              // Insert marker at the target position in notepad
              setTimeout(() => {
                insertLinkMarker(linkId, lastPt.x, lastPt.y);
              }, 50);
            } else if (firstContainerInfo.type === 'notepad') {
              // The source is notepad, insert marker at source position
              setTimeout(() => {
                insertLinkMarker(linkId, firstPt.x, firstPt.y);
              }, 50);
            }

            // Redraw to show dashed lines for links
            redrawGlobalStrokes();
          }
        } else if (activeStroke.container === 'notepad') {
          // The stroke ended in Notepad, check if it started in PDF
          // Similar logic as above
          const wsRect = getWorkspaceRect();
          let firstContainerInfo = null;
          let lastContainerInfo = null;

          const firstGlobal = containerToGlobal(firstPt.x, firstPt.y, activeStroke.containerInfo || { type: activeStroke.container, offsetX: 0, offsetY: 0, element: null, rect: null, pageNum: activeStroke.pageNum });
          const firstContainerCheck = getContainerFromPoint(firstGlobal.x, firstGlobal.y);
          if (firstContainerCheck) firstContainerInfo = firstContainerCheck;

          const lastGlobal = containerToGlobal(lastPt.x, lastPt.y, activeStroke.containerInfo || { type: activeStroke.container, offsetX: 0, offsetY: 0, element: null, rect: null, pageNum: activeStroke.pageNum });
          const lastContainerCheck = getContainerFromPoint(lastGlobal.x, lastGlobal.y);
          if (lastContainerCheck) lastContainerInfo = lastContainerCheck;

          if (firstContainerInfo && lastContainerInfo &&
              (firstContainerInfo.type !== lastContainerInfo.type ||
               (firstContainerInfo.type === 'pdf' && lastContainerInfo.type === 'pdf' &&
                firstContainerInfo.pageNum !== lastContainerInfo.pageNum))) {

            const linkId = ++linkIdCounter;
            const linkEntry = {
              id: linkId,
              strokeId: activeStroke.id,
              sourceType: firstContainerInfo.type,
              sourcePageNum: firstContainerInfo.type === 'pdf' ? firstContainerInfo.pageNum : undefined,
              sourceX: firstPt.x,
              sourceY: firstPt.y,
              sourceScrollY: firstContainerInfo.type === 'notepad' ? (notepadEditorContainer.scrollTop || 0) : 0,
              targetType: lastContainerInfo.type,
              targetPageNum: lastContainerInfo.type === 'pdf' ? lastContainerInfo.pageNum : undefined,
              targetX: lastPt.x,
              targetY: lastPt.y,
              targetScrollY: lastContainerInfo.type === 'notepad' ? (notepadEditorContainer.scrollTop || 0) : 0,
              created: Date.now()
            };

            linkData.push(linkEntry);

            if (lastContainerInfo.type === 'notepad') {
              setTimeout(() => {
                insertLinkMarker(linkId, lastPt.x, lastPt.y);
              }, 50);
            } else if (firstContainerInfo.type === 'notepad') {
              setTimeout(() => {
                insertLinkMarker(linkId, firstPt.x, firstPt.y);
              }, 50);
            }

            redrawGlobalStrokes();
          }
        }

        isDrawing = false;
        activeStroke = null;
      }
    }

    // ----- ATTACH EVENTS TO GLOBAL CANVAS -----
    globalCanvas.addEventListener('pointerdown', startGlobalStroke);
    globalCanvas.addEventListener('pointermove', drawGlobalStroke);
    globalCanvas.addEventListener('pointerup', stopGlobalStroke);
    globalCanvas.addEventListener('pointercancel', stopGlobalStroke);
    globalCanvas.addEventListener('pointerleave', stopGlobalStroke);

    globalCanvas.addEventListener('touchstart', startGlobalStroke, { passive: false });
    globalCanvas.addEventListener('touchmove', drawGlobalStroke, { passive: false });
    globalCanvas.addEventListener('touchend', stopGlobalStroke);
    globalCanvas.addEventListener('touchcancel', stopGlobalStroke);

    // ----- UPDATE POINTER EVENTS -----
    function updateDrawingMode() {
      if (currentTool === 'select') {
        globalCanvas.style.pointerEvents = 'none';
        document.querySelectorAll('.page-text-layer').forEach(el => {
          el.classList.remove('block-events');
          el.style.pointerEvents = 'auto';
        });
      } else {
        globalCanvas.style.pointerEvents = 'auto';
        globalCanvas.style.cursor = 'crosshair';
        document.querySelectorAll('.page-text-layer').forEach(el => {
          el.classList.add('block-events');
          el.style.pointerEvents = 'none';
        });
      }
    }

    // ----- RESIZE -----
    function resizeGlobalCanvas() {
      redrawGlobalStrokes();
    }

    // ----- SCROLL HANDLERS -----
    function onScroll() {
      redrawGlobalStrokes();
    }

    // ================================================================
    // MULTI-DOCUMENT ENGINE
    // ================================================================
    function updateDocSummaryLabel() {
      if (loadedDocs.length === 0) {
        docInfo.textContent = totalPages > 0 ? `Custom Workspace (${totalPages} ${totalPages === 1 ? 'page' : 'pages'})` : 'No file selected';
      } else if (loadedDocs.length === 1) {
        docInfo.textContent = `${loadedDocs[0].fileName} (${totalPages} ${totalPages === 1 ? 'page' : 'pages'})`;
      } else {
        docInfo.textContent = `${loadedDocs.length} Cases (${totalPages} pages total)`;
      }
    }

    function updateAllPageIndicators() {
      const cards = pdfContainer.querySelectorAll('.pdf-page-card');
      totalPages = cards.length;
      cards.forEach((card, index) => {
        const pageNum = index + 1;
        card.dataset.pageNum = pageNum;
        const indicator = card.querySelector('.page-number-indicator');
        if (indicator) {
          indicator.textContent = `PAGE ${pageNum} OF ${totalPages}`;
        }
      });
    }

    function getCurrentlyActivePageNode() {
      const cards = Array.from(pdfContainer.querySelectorAll('.pdf-page-card'));
      if (cards.length === 0) return null;
      const wrapperRect = pdfViewWrapper.getBoundingClientRect();
      const wrapperCenter = wrapperRect.top + wrapperRect.height / 2;
      let closestCard = cards[0];
      let minDistance = Infinity;
      cards.forEach(card => {
        const cardRect = card.getBoundingClientRect();
        const cardCenter = cardRect.top + cardRect.height / 2;
        const distance = Math.abs(cardCenter - wrapperCenter);
        if (distance < minDistance) {
          minDistance = distance;
          closestCard = card;
        }
      });
      return closestCard;
    }

    function initIntersectionObserver() {
      if (intersectionObserver) {
        intersectionObserver.disconnect();
      }
      intersectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageCard = entry.target;
            if (pageCard.dataset.isPdfPage === 'true' && pageCard.dataset.rendered !== 'true') {
              renderSinglePage(pageCard);
            }
          }
        });
      }, {
        root: pdfViewWrapper,
        rootMargin: '600px 0px',
        threshold: 0.01
      });
    }

    function appendPageCardsForRange(docIndex, startInternalPage, endInternalPage) {
      if (!intersectionObserver) {
        initIntersectionObserver();
      }
      for (let i = startInternalPage; i <= endInternalPage; i++) {
        const pageCard = document.createElement('div');
        pageCard.className = 'pdf-page-card';
        pageCard.dataset.docIndex = docIndex;
        pageCard.dataset.internalPageNum = i;
        pageCard.dataset.isPdfPage = 'true';
        pageCard.style.minHeight = '850px';

        const pageIndicator = document.createElement('div');
        pageIndicator.className = 'page-number-indicator';

        const canvasWrapper = document.createElement('div');
        canvasWrapper.className = 'canvas-wrapper';

        const pdfCanvas = document.createElement('canvas');
        pdfCanvas.className = 'pdf-canvas';

        canvasWrapper.appendChild(pdfCanvas);
        pageCard.appendChild(pageIndicator);
        pageCard.appendChild(canvasWrapper);

        pdfContainer.appendChild(pageCard);
        intersectionObserver.observe(pageCard);
      }
      updateAllPageIndicators();
      redrawGlobalStrokes();
    }

    function renderSinglePage(pageCard) {
      if (pageCard.dataset.isPdfPage !== 'true' || pageCard.dataset.rendering === 'true') return;
      const docIndex = parseInt(pageCard.dataset.docIndex, 10);
      const internalPageNum = parseInt(pageCard.dataset.internalPageNum, 10);
      const docEntry = loadedDocs[docIndex];
      if (!docEntry || !docEntry.pdfDoc) return;

      pageCard.dataset.rendering = 'true';

      docEntry.pdfDoc.getPage(internalPageNum).then(page => {
        const viewport = page.getViewport({ scale: currentScale });
        const pdfCanvas = pageCard.querySelector('.pdf-canvas');
        const canvasWrapper = pageCard.querySelector('.canvas-wrapper');

        const pdfCtx = pdfCanvas.getContext('2d');
        pdfCanvas.height = viewport.height;
        pdfCanvas.width = viewport.width;

        canvasWrapper.style.width = `${viewport.width}px`;
        canvasWrapper.style.height = `${viewport.height}px`;
        pageCard.style.width = `${viewport.width}px`;
        pageCard.style.height = `${viewport.height}px`;
        pageCard.style.minHeight = `${viewport.height}px`;

        page.render({ canvasContext: pdfCtx, viewport: viewport }).promise.then(() => {
          pageCard.dataset.rendered = 'true';
          pageCard.dataset.rendering = 'false';
          redrawGlobalStrokes();
        }).catch(() => {
          pageCard.dataset.rendering = 'false';
        });
      }).catch(() => {
        pageCard.dataset.rendering = 'false';
      });
    }

    function getStandardPageDimensions() {
      const existingCard = pdfContainer.querySelector('.pdf-page-card');
      if (existingCard && existingCard.offsetWidth > 0) {
        return {
          width: existingCard.offsetWidth,
          height: existingCard.offsetHeight || Math.round(existingCard.offsetWidth * 1.3)
        };
      }
      return { width: Math.round(612 * currentScale), height: Math.round(792 * currentScale) };
    }

    function createPageTextLayer() {
      const textLayer = document.createElement('div');
      textLayer.className = 'page-text-layer';
      textLayer.contentEditable = 'true';
      textLayer.setAttribute('spellcheck', 'false');
      textLayer.setAttribute('placeholder', 'Tap here to type notes...');
      return textLayer;
    }

    function insertPageCardInPlace(pageCard) {
      const activeCard = getCurrentlyActivePageNode();
      if (activeCard && activeCard.parentNode === pdfContainer) {
        activeCard.insertAdjacentElement('afterend', pageCard);
      } else {
        pdfContainer.appendChild(pageCard);
      }
      updateAllPageIndicators();
      updateDocSummaryLabel();
      closeModal();
      redrawGlobalStrokes();
      const wrapperRect = pdfViewWrapper.getBoundingClientRect();
      const cardRect = pageCard.getBoundingClientRect();
      pdfViewWrapper.scrollTo({
        top: pdfViewWrapper.scrollTop + (cardRect.top - wrapperRect.top),
        behavior: 'smooth'
      });
    }

    // ----- MODAL -----
    btnAddPage.addEventListener('click', () => {
      addPageModal.style.display = 'flex';
    });

    function closeModal() {
      addPageModal.style.display = 'none';
    }

    btnCloseModal.addEventListener('click', closeModal);
    addPageModal.addEventListener('click', (e) => {
      if (e.target === addPageModal) closeModal();
    });

    btnTriggerCamera.addEventListener('click', () => {
      cameraOnlyInput.value = '';
      cameraOnlyInput.click();
    });

    btnTriggerGallery.addEventListener('click', () => {
      galleryOnlyInput.value = '';
      galleryOnlyInput.click();
    });

    function handleImageFileImport(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          if (emptyState) emptyState.style.display = 'none';
          const dims = getStandardPageDimensions();

          const pageCard = document.createElement('div');
          pageCard.className = 'pdf-page-card';
          pageCard.dataset.rendered = 'true';
          pageCard.style.width = `${dims.width}px`;
          pageCard.style.height = `${dims.height}px`;
          pageCard.style.minHeight = `${dims.height}px`;

          const pageIndicator = document.createElement('div');
          pageIndicator.className = 'page-number-indicator';

          const canvasWrapper = document.createElement('div');
          canvasWrapper.className = 'canvas-wrapper';
          canvasWrapper.style.width = '100%';
          canvasWrapper.style.height = '100%';
          canvasWrapper.style.display = 'flex';
          canvasWrapper.style.alignItems = 'center';
          canvasWrapper.style.justifyContent = 'center';
          canvasWrapper.style.overflow = 'hidden';

          const imgElem = document.createElement('img');
          imgElem.src = event.target.result;
          imgElem.style.maxWidth = '100%';
          imgElem.style.maxHeight = '100%';
          imgElem.style.objectFit = 'contain';

          const textLayer = createPageTextLayer();
          canvasWrapper.appendChild(imgElem);
          canvasWrapper.appendChild(textLayer);
          pageCard.appendChild(pageIndicator);
          pageCard.appendChild(canvasWrapper);

          insertPageCardInPlace(pageCard);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    cameraOnlyInput.addEventListener('change', (e) => handleImageFileImport(e.target.files[0]));
    galleryOnlyInput.addEventListener('change', (e) => handleImageFileImport(e.target.files[0]));

    document.querySelectorAll('.template-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const templateType = btn.dataset.template;
        if (!templateType) return;
        if (emptyState) emptyState.style.display = 'none';

        const dims = getStandardPageDimensions();

        const pageCard = document.createElement('div');
        pageCard.className = 'pdf-page-card';
        pageCard.dataset.rendered = 'true';
        pageCard.style.width = `${dims.width}px`;
        pageCard.style.height = `${dims.height}px`;
        pageCard.style.minHeight = `${dims.height}px`;

        const pageIndicator = document.createElement('div');
        pageIndicator.className = 'page-number-indicator';

        const canvasWrapper = document.createElement('div');
        canvasWrapper.className = `canvas-wrapper page-template-${templateType}`;
        canvasWrapper.style.width = '100%';
        canvasWrapper.style.height = '100%';

        const textLayer = createPageTextLayer();
        canvasWrapper.appendChild(textLayer);

        pageCard.appendChild(pageIndicator);
        pageCard.appendChild(canvasWrapper);

        insertPageCardInPlace(pageCard);
      });
    });

    // ----- OPEN PDF -----
    btnOpenPdf.addEventListener('click', () => {
      fileInput.value = '';
      fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const safeBuffer = event.target.result.slice(0);
          pdfjsLib.getDocument({ data: safeBuffer }).promise.then(function(pdf) {
            loadedDocs = [];
            totalPages = 0;
            globalStrokes = [];
            linkData = [];
            linkIdCounter = 0;
            notepadEditor.innerHTML = '';

            loadedDocs.push({
              pdfDoc: pdf,
              fileName: file.name,
              numPages: pdf.numPages
            });

            hideNotepad();
            setTool('select');

            if (emptyState) emptyState.style.display = 'none';

            pdfContainer.innerHTML = '';
            initIntersectionObserver();
            appendPageCardsForRange(0, 1, pdf.numPages);

            const firstPageCard = pdfContainer.querySelector('.pdf-page-card');
            if (firstPageCard) {
              renderSinglePage(firstPageCard);
            }
            updateDocSummaryLabel();
            resizeGlobalCanvas();
          }).catch(function() {
            alert('Failed to parse PDF.');
          });
        } catch (err) {}
      };
      reader.readAsArrayBuffer(file);
    });

    // ----- CASE + -----
    btnCasePlus.addEventListener('click', () => {
      casePlusInput.value = '';
      casePlusInput.click();
    });

    casePlusInput.addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files || files.length === 0) return;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
          const buffer = await file.arrayBuffer();
          const safeBuffer = buffer.slice(0);
          const pdf = await pdfjsLib.getDocument({ data: safeBuffer }).promise;

          const docIndex = loadedDocs.length;
          const numPages = pdf.numPages;

          loadedDocs.push({
            pdfDoc: pdf,
            fileName: file.name,
            numPages: numPages
          });

          if (emptyState) emptyState.style.display = 'none';
          appendPageCardsForRange(docIndex, 1, numPages);

          const newlyAppendedCard = pdfContainer.querySelector(`[data-doc-index="${docIndex}"][data-internal-page-num="1"]`);
          if (newlyAppendedCard) {
            renderSinglePage(newlyAppendedCard);
          }
        } catch (err) {}
      }
      updateDocSummaryLabel();
      resizeGlobalCanvas();
    });

    // ----- ZOOM -----
    function applyZoom(newScale) {
      currentScale = Math.min(Math.max(newScale, 0.5), 3.0);
      zoomLabel.textContent = `${Math.round(currentScale * 100)}%`;

      const pageCards = document.querySelectorAll('.pdf-page-card');
      pageCards.forEach(card => {
        if (card.dataset.isPdfPage === 'true') {
          card.dataset.rendered = 'false';
        } else {
          const dims = getStandardPageDimensions();
          card.style.width = `${dims.width}px`;
          card.style.height = `${dims.height}px`;
          card.style.minHeight = `${dims.height}px`;
        }
      });

      pageCards.forEach(card => {
        if (card.dataset.isPdfPage === 'true') {
          const rect = card.getBoundingClientRect();
          if (rect.top < window.innerHeight * 2 && rect.bottom > -window.innerHeight) {
            renderSinglePage(card);
          }
        }
      });
      resizeGlobalCanvas();
    }

    btnZoomIn.addEventListener('click', () => applyZoom(currentScale + 0.15));
    btnZoomOut.addEventListener('click', () => applyZoom(currentScale - 0.15));

    // ----- TOOL SELECTION -----
    function setTool(tool) {
      currentTool = tool;
      toolSelect.classList.toggle('active', tool === 'select');
      toolPen.classList.toggle('active', tool === 'pen');
      toolHighlighter.classList.toggle('active', tool === 'highlighter');
      toolEraser.classList.toggle('active', tool === 'eraser');
      updateDrawingMode();
    }

    toolSelect.addEventListener('click', () => setTool('select'));
    toolPen.addEventListener('click', () => setTool('pen'));
    toolHighlighter.addEventListener('click', () => setTool('highlighter'));
    toolEraser.addEventListener('click', () => setTool('eraser'));

    pickerColor.addEventListener('input', (e) => {
      penColor = e.target.value;
      const hex = e.target.value;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      highlighterColor = `rgba(${r}, ${g}, ${b}, 0.35)`;
    });

    sliderSize.addEventListener('input', (e) => {
      strokeWidth = parseInt(e.target.value, 10);
    });

    btnClearPage.addEventListener('click', () => {
      const activeCard = getCurrentlyActivePageNode();
      if (!activeCard) return;
      const pNum = parseInt(activeCard.dataset.pageNum, 10);
      // Remove strokes for that page
      const strokesToRemove = globalStrokes.filter(s => s.container === 'pdf' && s.pageNum === pNum);
      strokesToRemove.forEach(s => {
        // Also remove associated links
        linkData = linkData.filter(l => l.strokeId !== s.id);
      });
      globalStrokes = globalStrokes.filter(s => !(s.container === 'pdf' && s.pageNum === pNum));
      // Clear markers from notepad
      document.querySelectorAll('.notepad-link-marker').forEach(marker => {
        const linkId = parseInt(marker.dataset.linkId, 10);
        const linkExists = linkData.some(l => l.id === linkId);
        if (!linkExists) {
          marker.remove();
        }
      });
      redrawGlobalStrokes();
    });

    // ================================================================
    // RESIZER
    // ================================================================
    function startResizing(e) {
      isResizing = true;
      resizer.classList.add('active');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      if (e.pointerId && resizer.setPointerCapture) {
        try { resizer.setPointerCapture(e.pointerId); } catch(err) {}
      }
    }

    function updateWorkspaceWidths(pdfRatioPct) {
      const isNotepadOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
      if (!isNotepadOpen) return;
      if (pinchRafId) {
        cancelAnimationFrame(pinchRafId);
      }
      pinchRafId = requestAnimationFrame(() => {
        const clampedPdfRatio = Math.max(15, Math.min(85, pdfRatioPct));
        const notepadRatioPct = 100 - clampedPdfRatio;

        pdfViewWrapper.style.width = `${clampedPdfRatio}%`;
        pdfViewWrapper.style.flex = `0 0 ${clampedPdfRatio}%`;

        notepadPane.style.width = `${notepadRatioPct}%`;
        notepadPane.style.flex = `0 0 ${notepadRatioPct}%`;

        resizeGlobalCanvas();
      });
    }

    function handleResizeMove(e) {
      if (!isResizing) return;
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      if (clientX === undefined) return;
      const windowWidth = window.innerWidth;
      let pdfWidthPct = (clientX / windowWidth) * 100;
      updateWorkspaceWidths(pdfWidthPct);
    }

    function stopResizing(e) {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        if (e && e.pointerId && resizer.releasePointerCapture) {
          try { resizer.releasePointerCapture(e.pointerId); } catch(err) {}
        }
        resizeGlobalCanvas();
      }
    }

    resizer.addEventListener('pointerdown', startResizing);
    window.addEventListener('pointermove', handleResizeMove);
    window.addEventListener('pointerup', stopResizing);
    window.addEventListener('pointercancel', stopResizing);

    resizer.addEventListener('touchstart', startResizing, { passive: false });
    window.addEventListener('touchmove', handleResizeMove, { passive: false });
    window.addEventListener('touchend', stopResizing);
    window.addEventListener('touchcancel', stopResizing);

    // ================================================================
    // PINCH GESTURE
    // ================================================================
    function handleWorkspaceTouchStart(e) {
      if (e.touches && e.touches.length === 2) {
        const isNotepadOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
        if (!isNotepadOpen) return;
        isPinching = true;
        if (isDrawing) {
          isDrawing = false;
          activeStroke = null;
        }
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        initialPinchDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        const workspaceRect = mainWorkspace.getBoundingClientRect();
        const pdfRect = pdfViewWrapper.getBoundingClientRect();
        initialPdfRatio = (pdfRect.width / workspaceRect.width) * 100;
        const centerX = (t1.clientX + t2.clientX) / 2;
        const resizerRect = resizer.getBoundingClientRect();
        if (resizerRect.width > 0 && centerX > resizerRect.left) {
          pinchCenterPane = 'notepad';
        } else {
          pinchCenterPane = 'pdf';
        }
      }
    }

    function handleWorkspaceTouchMove(e) {
      if (isPinching && e.touches && e.touches.length === 2) {
        e.preventDefault();
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const currentDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        if (initialPinchDistance > 0) {
          const factor = currentDistance / initialPinchDistance;
          let targetPdfRatio = initialPdfRatio;
          if (pinchCenterPane === 'pdf') {
            targetPdfRatio = initialPdfRatio * factor;
          } else {
            const initialNotepadRatio = 100 - initialPdfRatio;
            const targetNotepadRatio = initialNotepadRatio * factor;
            targetPdfRatio = 100 - targetNotepadRatio;
          }
          updateWorkspaceWidths(targetPdfRatio);
        }
      }
    }

    function handleWorkspaceTouchEnd(e) {
      if (isPinching && (!e.touches || e.touches.length < 2)) {
        isPinching = false;
        if (pinchRafId) {
          cancelAnimationFrame(pinchRafId);
          pinchRafId = null;
        }
        resizeGlobalCanvas();
      }
    }

    mainWorkspace.addEventListener('pointerdown', (e) => {
      activePointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointerMap.size === 2) {
        const isNotepadOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
        if (!isNotepadOpen) return;
        isPinching = true;
        if (isDrawing) {
          isDrawing = false;
          activeStroke = null;
        }
        const pts = Array.from(activePointerMap.values());
        initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const workspaceRect = mainWorkspace.getBoundingClientRect();
        const pdfRect = pdfViewWrapper.getBoundingClientRect();
        initialPdfRatio = (pdfRect.width / workspaceRect.width) * 100;
        const centerX = (pts[0].x + pts[1].x) / 2;
        const resizerRect = resizer.getBoundingClientRect();
        if (resizerRect.width > 0 && centerX > resizerRect.left) {
          pinchCenterPane = 'notepad';
        } else {
          pinchCenterPane = 'pdf';
        }
      }
    });

    mainWorkspace.addEventListener('pointermove', (e) => {
      if (activePointerMap.has(e.pointerId)) {
        activePointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }
      if (isPinching && activePointerMap.size === 2) {
        const pts = Array.from(activePointerMap.values());
        const currentDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (initialPinchDistance > 0) {
          const factor = currentDistance / initialPinchDistance;
          let targetPdfRatio = initialPdfRatio;
          if (pinchCenterPane === 'pdf') {
            targetPdfRatio = initialPdfRatio * factor;
          } else {
            const initialNotepadRatio = 100 - initialPdfRatio;
            const targetNotepadRatio = initialNotepadRatio * factor;
            targetPdfRatio = 100 - targetNotepadRatio;
          }
          updateWorkspaceWidths(targetPdfRatio);
        }
      }
    });

    const releasePointerFromMap = (e) => {
      activePointerMap.delete(e.pointerId);
      if (activePointerMap.size < 2) {
        isPinching = false;
        resizeGlobalCanvas();
      }
    };

    mainWorkspace.addEventListener('pointerup', releasePointerFromMap);
    mainWorkspace.addEventListener('pointercancel', releasePointerFromMap);

    mainWorkspace.addEventListener('touchstart', handleWorkspaceTouchStart, { passive: false });
    mainWorkspace.addEventListener('touchmove', handleWorkspaceTouchMove, { passive: false });
    mainWorkspace.addEventListener('touchend', handleWorkspaceTouchEnd, { passive: false });
    mainWorkspace.addEventListener('touchcancel', handleWorkspaceTouchEnd, { passive: false });

    // ================================================================
    // NOTEPAD TOGGLE
    // ================================================================
    function hideNotepad() {
      notepadPane.style.display = 'none';
      notepadPane.style.width = '0%';
      notepadPane.style.flex = '0 0 0%';
      resizer.style.display = 'none';
      pdfViewWrapper.style.width = '100%';
      pdfViewWrapper.style.flex = '1 1 100%';
      btnToggleNotepad.classList.remove('active');
      resizeGlobalCanvas();
    }

    function showNotepad() {
      notepadPane.style.display = 'flex';
      notepadPane.style.width = '50%';
      notepadPane.style.flex = '0 0 50%';
      resizer.style.display = 'block';
      pdfViewWrapper.style.width = '50%';
      pdfViewWrapper.style.flex = '0 0 50%';
      btnToggleNotepad.classList.add('active');
      resizeGlobalCanvas();
    }

    btnToggleNotepad.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = notepadPane.style.display === 'none' || getComputedStyle(notepadPane).display === 'none';
      if (isHidden) showNotepad();
      else hideNotepad();
    });

    btnCloseNotepad.addEventListener('click', (e) => {
      e.stopPropagation();
      hideNotepad();
    });

    notepadBgSelect.addEventListener('change', (e) => {
      notepadEditorContainer.className = e.target.value;
    });

    // ================================================================
    // EXPORT
    // ================================================================
    btnExportPdf.addEventListener('click', () => {
      if (totalPages === 0) {
        alert('Please open a PDF document or insert a page first.');
        return;
      }
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = mainWorkspace.clientWidth;
      tempCanvas.height = mainWorkspace.clientHeight;
      const ctx = tempCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      redrawGlobalStrokes();
      ctx.drawImage(globalCanvas, 0, 0);
      const link = document.createElement('a');
      link.download = 'annotated-workspace.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    });

    // ================================================================
    // SCROLL LISTENERS
    // ================================================================
    pdfViewWrapper.addEventListener('scroll', onScroll);
    notepadEditorContainer.addEventListener('scroll', onScroll);

    // ================================================================
    // INIT
    // ================================================================
    hideNotepad();
    setTool('select');
    resizeGlobalCanvas();
    if (loadedDocs.length === 0) {
      emptyState.style.display = 'flex';
    }
    window.addEventListener('resize', resizeGlobalCanvas);

    // Notepad placeholder
    notepadEditor.addEventListener('focus', function() {
      if (this.textContent.trim() === 'Type your notes here...') {
        this.textContent = '';
      }
    });
    notepadEditor.addEventListener('blur', function() {
      if (this.textContent.trim() === '') {
        this.textContent = 'Type your notes here...';
      }
    });
    if (notepadEditor.textContent.trim() === '') {
      notepadEditor.textContent = 'Type your notes here...';
    }
  </script>
</body>
</html>
