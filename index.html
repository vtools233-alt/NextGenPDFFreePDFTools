<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF Viewer & Workspace</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    /* ===== CSS (unchanged – full) ===== */
    :root { --bg-primary: #f8fafc; --bg-secondary: #ffffff; --border-color: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; --primary-accent: #2563eb; --primary-accent-hover: #1d4ed8; --active-bg: #eff6ff; --active-border: #3b82f6; --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1); --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1); --toolbar-height: 55px; --link-color: #2563eb; --link-highlight: rgba(37,99,235,0.25); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; top: 0; left: 0; margin: 0; padding: 0; background-color: var(--bg-primary); color: var(--text-main); touch-action: none; }
    body { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    #top-toolbar { position: relative; width: 100%; height: var(--toolbar-height); z-index: 1000; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; gap: 10px; white-space: nowrap; padding: 0 15px; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow-sm); flex-shrink: 0; -ms-overflow-style: none; scrollbar-width: none; }
    #top-toolbar::-webkit-scrollbar { display: none; }
    .toolbar-section { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .toolbar-divider { height: 24px; width: 1px; background-color: var(--border-color); margin: 0 2px; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; border: 1px solid var(--border-color); background-color: #ffffff; color: var(--text-main); cursor: pointer; transition: all 0.15s ease; user-select: none; white-space: nowrap; flex-shrink: 0; }
    .btn:hover { background-color: #f1f5f9; border-color: #cbd5e1; }
    .btn-primary { background-color: var(--primary-accent); color: #ffffff; border-color: var(--primary-accent); }
    .btn-primary:hover { background-color: var(--primary-accent-hover); border-color: var(--primary-accent-hover); }
    .btn-success { background-color: #16a34a; color: #ffffff; border-color: #16a34a; }
    .btn-success:hover { background-color: #15803d; border-color: #15803d; }
    .btn-success.active { background-color: #1d4ed8; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(37,99,235,0.3); }
    .btn-info { background-color: #0ea5e9; color: #ffffff; border-color: #0ea5e9; }
    .btn-info:hover { background-color: #0284c7; border-color: #0284c7; }
    .btn-info.active { background-color: #0284c7; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(14,165,233,0.3); }
    .btn-tool { padding: 8px; min-width: 36px; height: 36px; flex-shrink: 0; }
    .btn-tool.active { background-color: var(--active-bg); border-color: var(--active-border); color: var(--primary-accent); }
    .tool-group { display: flex; background: #f1f5f9; padding: 3px; border-radius: 8px; gap: 2px; border: 1px solid var(--border-color); flex-shrink: 0; }
    .tool-group .btn-tool { border: none; border-radius: 5px; background: transparent; }
    .tool-group .btn-tool.active { background-color: #ffffff; box-shadow: var(--shadow-sm); color: var(--primary-accent); }
    #doc-info { font-size: 13px; color: var(--text-muted); font-weight: 500; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
    .control-label { font-size: 12px; color: var(--text-muted); font-weight: 500; flex-shrink: 0; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 6px; padding: 0 4px; flex-shrink: 0; }
    input[type="color"] { -webkit-appearance: none; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; background: none; flex-shrink: 0; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-color); border-radius: 50%; }
    input[type="range"] { width: 70px; accent-color: var(--primary-accent); cursor: pointer; flex-shrink: 0; }

    #main-workspace { display: flex; flex-direction: row; width: 100%; flex: 1; height: calc(100vh - var(--toolbar-height)); overflow: hidden; position: relative; touch-action: none; background-color: #f1f5f9; }
    #global-drawing-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; touch-action: none; }
    #pdf-view-wrapper { flex: 1 1 100%; width: 100%; height: 100%; overflow-y: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; background-color: #f1f5f9; position: relative; display: block; padding: 24px 0 80px 0; box-sizing: border-box; min-width: 0; touch-action: pan-x pan-y; }
    #pdf-container { width: 100%; min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px; margin: 0 auto; transform-origin: top center; }
    #resizer { width: 2px; height: 100%; background-color: transparent; cursor: col-resize; flex-shrink: 0; user-select: none; touch-action: none; z-index: 30; display: none; position: relative; transition: background-color 0.2s ease, width 0.2s ease; }
    #resizer:hover, #resizer.active { background-color: var(--primary-accent); width: 4px; }
    #resizer::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1px; height: 24px; background-color: #94a3b8; border-radius: 1px; transition: all 0.2s ease; }
    #resizer:hover::after, #resizer.active::after { background-color: #ffffff; height: 32px; }
    .pdf-page-card { position: relative; background-color: #ffffff; box-shadow: var(--shadow-md); border-radius: 4px; min-height: 850px; display: flex; flex-direction: column; align-items: center; margin: 0 auto; flex-shrink: 0; transition: box-shadow 0.2s ease; }
    .pdf-page-card:hover { box-shadow: var(--shadow-lg); }
    .page-number-indicator { position: absolute; top: -22px; left: 0; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .canvas-wrapper { position: relative; overflow: hidden; border-radius: 4px; width: 100%; height: 100%; }
    .pdf-canvas { display: block; position: relative; z-index: 1; width: 100%; height: 100%; }
    .pdf-link-highlight { position: absolute; border-radius: 3px; pointer-events: none; z-index: 5; background-color: var(--link-highlight); border: 2px solid var(--primary-accent); transition: opacity 0.4s ease; opacity: 0; box-shadow: 0 0 16px rgba(37,99,235,0.25); }
    .pdf-link-highlight.active { opacity: 1; }
    .pdf-link-marker { position: absolute; width: 24px; height: 24px; border-radius: 50%; z-index: 6; cursor: pointer; border: 2px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #ffffff; pointer-events: auto; transform: translate(-50%, -50%); background: #2563eb; }
    .pdf-link-marker:hover { transform: translate(-50%, -50%) scale(1.25); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .pdf-link-marker .link-tooltip { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 11px; white-space: nowrap; pointer-events: none; }
    .pdf-link-marker:hover .link-tooltip { display: block; }
    .pdf-link-marker .link-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: #1e293b; }
    .pdf-link-marker.type-line { background: #2563eb; }
    .pdf-link-marker.type-highlight { background: #eab308; }
    .pdf-link-marker.type-underline { background: #22c55e; }
    .pdf-link-marker.type-scan { background: #8b5cf6; }
    .pdf-link-marker.type-linkpoint { background: #ec4899; }
    .page-text-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; outline: none; padding: 32px 28px; box-sizing: border-box; font-size: 16px; line-height: 32px; color: #0f172a; white-space: pre-wrap; word-break: break-word; cursor: text; pointer-events: auto; }
    .page-text-layer.block-events { pointer-events: none !important; }
    #empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; background: #ffffff; padding: 40px 60px; border-radius: 12px; border: 2px dashed #cbd5e1; box-shadow: var(--shadow-sm); z-index: 10; }
    #empty-state svg { width: 48px; height: 48px; stroke: var(--text-muted); }
    #empty-state h3 { font-size: 18px; font-weight: 600; color: var(--text-main); }
    #empty-state p { font-size: 14px; color: var(--text-muted); max-width: 300px; }
    #notepad-pane { display: none; width: 0%; flex: 0 0 0%; height: 100%; background-color: #ffffff; border-left: none; flex-direction: column; box-shadow: -2px 0 8px rgba(0,0,0,0.04); z-index: 20; overflow: hidden; flex-shrink: 0; position: relative; min-width: 0; background-color: #f1f5f9; }
    #notepad-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background-color: #ffffff; flex-shrink: 0; }
    #notepad-header h4 { font-size: 14px; font-weight: 600; color: var(--text-main); }
    .notepad-controls { display: flex; align-items: center; gap: 8px; }
    #notepad-editor-container { flex: 1; padding: 24px; overflow-y: auto; position: relative; background-color: #ffffff; }
    #notepad-editor { width: 100%; min-height: 100%; height: auto; outline: none; font-size: 15px; background: transparent; color: #1e293b; font-family: inherit; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .bg-red-lined { background-color: #ffffff; background-image: linear-gradient(#f1f5f9 1px, transparent 1px); background-size: 100% 32px; line-height: 32px !important; border-left: 3px solid #f87171 !important; padding-left: 16px !important; }
    .bg-purple-lined { background-color: #ffffff; background-image: linear-gradient(#f3e8ff 1px, transparent 1px); background-size: 100% 32px; line-height: 32px !important; border-left: 3px solid #c084fc !important; padding-left: 16px !important; }
    .bg-dot-grid { background-color: #ffffff; background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 24px 24px; line-height: 24px !important; padding-left: 12px !important; }
    .notepad-link-marker { display: inline-block; width: 20px; height: 20px; border-radius: 50%; margin: 0 4px; cursor: pointer; position: relative; vertical-align: middle; transition: all 0.2s ease; border: 2px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); flex-shrink: 0; text-align: center; line-height: 16px; font-size: 10px; color: #fff; background: #2563eb; }
    .notepad-link-marker:hover { transform: scale(1.2); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .notepad-link-marker .link-tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #1e293b; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-size: 11px; white-space: nowrap; pointer-events: none; }
    .notepad-link-marker:hover .link-tooltip { display: block; }
    .notepad-link-marker .link-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: #1e293b; }
    .notepad-link-marker.type-line { background: #2563eb; }
    .notepad-link-marker.type-highlight { background: #eab308; }
    .notepad-link-marker.type-underline { background: #22c55e; }
    .notepad-link-marker.type-scan { background: #8b5cf6; }
    .notepad-link-marker.type-linkpoint { background: #ec4899; }
    .notepad-link-marker.type-line::after { content: '✏️'; font-size: 10px; line-height: 16px; }
    .notepad-link-marker.type-highlight::after { content: '🟡'; font-size: 10px; line-height: 16px; }
    .notepad-link-marker.type-underline::after { content: '⏺️'; font-size: 10px; line-height: 16px; }
    .notepad-link-marker.type-scan::after { content: '📷'; font-size: 10px; line-height: 16px; }
    .notepad-link-marker.type-linkpoint::after { content: '🔗'; font-size: 10px; line-height: 16px; }
    .page-template-white { background-color: #ffffff; }
    .page-template-lined-white { background-color: #ffffff; background-image: linear-gradient(#e2e8f0 1px, transparent 1px); background-size: 100% 32px; border-left: 3px solid #f87171 !important; }
    .page-template-dot-grid { background-color: #ffffff; background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 24px 24px; }
    .page-template-yellow-blank { background-color: #fef9c3; }
    .page-template-yellow-lined { background-color: #fef9c3; background-image: linear-gradient(#cbd5e1 1px, transparent 1px); background-size: 100% 32px; border-left: 3px solid #f87171 !important; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15,23,42,0.4); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 2000; }
    .modal-content { background-color: #ffffff; border-radius: 12px; width: 90%; max-width: 480px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); overflow: hidden; animation: modalFadeIn 0.2s ease-out; max-height: 80vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; background-color: #f8fafc; }
    .modal-header h3 { font-size: 16px; font-weight: 600; color: var(--text-main); }
    .modal-close-btn { background: none; border: none; font-size: 22px; line-height: 1; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 4px; }
    .modal-close-btn:hover { color: var(--text-main); background-color: #e2e8f0; }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .modal-section h4 { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .modal-action-btn { padding: 12px; font-size: 14px; justify-content: center; }
    .template-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .template-option { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: #ffffff; cursor: pointer; transition: all 0.15s ease; }
    .template-option:hover { border-color: var(--primary-accent); background-color: var(--active-bg); }
    .template-preview { width: 100%; height: 60px; border: 1px solid var(--border-color); border-radius: 4px; }
    .template-option span { font-size: 12px; font-weight: 500; color: var(--text-main); text-align: center; }
    .bg-template-white { background-color: #ffffff; }
    .bg-template-lined-white { background-color: #ffffff; background-image: linear-gradient(#e2e8f0 1px, transparent 1px); background-size: 100% 16px; border-left: 2px solid #f87171 !important; }
    .bg-template-dot-grid { background-color: #ffffff; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 12px 12px; }
    .bg-template-yellow-blank { background-color: #fef9c3; }
    .bg-template-yellow-lined { background-color: #fef9c3; background-image: linear-gradient(#cbd5e1 1px, transparent 1px); background-size: 100% 16px; border-left: 2px solid #f87171 !important; }
    #tool-selector-dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 6px 0; min-width: 150px; z-index: 9999; flex-direction: column; gap: 2px; }
    #tool-selector-dropdown .tool-option { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; transition: background 0.1s ease; font-size: 13px; color: var(--text-main); border: none; background: transparent; width: 100%; text-align: left; }
    #tool-selector-dropdown .tool-option:hover { background-color: var(--active-bg); }
    #tool-selector-dropdown .tool-option .icon { font-size: 16px; width: 24px; text-align: center; }
    #tool-selector-dropdown .tool-option .label { flex: 1; }
    #tool-selector-dropdown .tool-option .shortcut { color: var(--text-muted); font-size: 11px; }
    #tool-selector-dropdown .divider { height: 1px; background: var(--border-color); margin: 4px 8px; }
    #mode-status { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary-accent); color: #fff; padding: 8px 20px; border-radius: 30px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-lg); z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; white-space: nowrap; }
    #mode-status.visible { opacity: 1; }
  </style>
</head>
<body>

  <!-- TOP TOOLBAR -->
  <header id="top-toolbar">
    <div class="toolbar-section">
      <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;" />
      <button class="btn btn-primary" id="btn-open-pdf">Open PDF</button>
      <input type="file" id="case-plus-input" accept="application/pdf" multiple style="display: none;" />
      <button class="btn" id="btn-case-plus">Case +</button>
      <span id="doc-info">No file selected</span>
      <button class="btn" id="btn-add-page">+ Page</button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-section">
      <div class="tool-group">
        <button class="btn btn-tool active" id="tool-select" title="Pointer">🖱️</button>
        <button class="btn btn-tool" id="tool-pen" title="Pen">✏️</button>
        <button class="btn btn-tool" id="tool-highlighter" title="Highlighter">🟡</button>
        <button class="btn btn-tool" id="tool-eraser" title="Eraser">🧹</button>
      </div>
      <div class="color-picker-wrapper">
        <span class="control-label">Color:</span>
        <input type="color" id="picker-color" value="#2563eb" />
      </div>
      <div class="color-picker-wrapper">
        <span class="control-label">Size:</span>
        <input type="range" id="slider-size" min="1" max="25" value="3" />
      </div>
      <button class="btn" id="btn-clear-page">Clear Page</button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-section">
      <button class="btn btn-tool" id="btn-zoom-out">−</button>
      <span id="zoom-label" class="control-label" style="min-width:42px;text-align:center;">135%</span>
      <button class="btn btn-tool" id="btn-zoom-in">+</button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-section" style="position:relative;">
      <!-- SELECT BUTTON (FIXED - ULTIMATE) -->
      <button class="btn btn-success" id="btn-select-tools">Select</button>
      <div id="tool-selector-dropdown">
        <button class="tool-option" data-mode="pointer"><span class="icon">🖱️</span><span class="label">Pointer</span><span class="shortcut">Esc</span></button>
        <div class="divider"></div>
        <button class="tool-option" data-mode="line"><span class="icon">✏️</span><span class="label">Line</span><span class="shortcut">L</span></button>
        <button class="tool-option" data-mode="highlight"><span class="icon">🟡</span><span class="label">Highlight</span><span class="shortcut">H</span></button>
        <button class="tool-option" data-mode="underline"><span class="icon">⏺️</span><span class="label">Underline</span><span class="shortcut">U</span></button>
        <button class="tool-option" data-mode="scan"><span class="icon">📷</span><span class="label">Scan</span><span class="shortcut">S</span></button>
        <div class="divider"></div>
        <button class="tool-option" data-mode="linkpoint"><span class="icon">🔗</span><span class="label">Link Point</span><span class="shortcut">P</span></button>
      </div>
      <button class="btn" id="btn-toggle-notepad">Notepad</button>
      <button class="btn" id="btn-export-pdf">Save</button>
    </div>
  </header>

  <div id="mode-status"></div>

  <div id="main-workspace">
    <canvas id="global-drawing-canvas"></canvas>
    <main id="pdf-view-wrapper">
      <div id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        <h3>No Document Loaded</h3>
        <p>Click "Open PDF" to load a file, "Case +" to append documents, or "+ Page" to insert custom page templates.</p>
      </div>
      <div id="pdf-container"></div>
    </main>
    <div id="resizer" title="Drag to resize workspace"></div>
    <aside id="notepad-pane">
      <div id="notepad-header">
        <h4>Workspace Notepad</h4>
        <div class="notepad-controls">
          <select id="notepad-bg-select" class="btn" style="padding:4px 8px;font-size:12px;">
            <option value="bg-red-lined">Red Lined</option>
            <option value="bg-purple-lined">Purple Lined</option>
            <option value="bg-dot-grid">Dot Grid</option>
          </select>
          <button class="btn btn-tool" id="btn-close-notepad">✕</button>
        </div>
      </div>
      <div id="notepad-editor-container" class="bg-red-lined">
        <div id="notepad-editor" contenteditable="true" placeholder="Type your notes here..."></div>
      </div>
    </aside>
  </div>

  <!-- ADD PAGE MODAL -->
  <div id="add-page-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Insert New Page</h3>
        <button id="btn-close-modal" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-section">
          <h4>FROM CAMERA / PHOTO</h4>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary modal-action-btn" id="btn-trigger-camera" style="flex:1;">📷 Camera</button>
            <button class="btn modal-action-btn" id="btn-trigger-gallery" style="flex:1;">🖼️ Gallery</button>
          </div>
          <input type="file" id="camera-only-input" accept="image/*" capture="environment" style="display:none;">
          <input type="file" id="gallery-only-input" accept="image/*" style="display:none;">
        </div>
        <div class="modal-section">
          <h4>Custom Page Templates</h4>
          <div class="template-grid">
            <button class="template-option" data-template="white"><div class="template-preview bg-template-white"></div><span>Plain White</span></button>
            <button class="template-option" data-template="lined-white"><div class="template-preview bg-template-lined-white"></div><span>Lined White</span></button>
            <button class="template-option" data-template="dot-grid"><div class="template-preview bg-template-dot-grid"></div><span>Dot Grid</span></button>
            <button class="template-option" data-template="yellow-blank"><div class="template-preview bg-template-yellow-blank"></div><span>Yellow Blank</span></button>
            <button class="template-option" data-template="yellow-lined"><div class="template-preview bg-template-yellow-lined"></div><span>Yellow Lined</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ================================================================
    // STATE (unchanged)
    // ================================================================
    let loadedDocs = [];
    let totalPages = 0;
    let currentScale = 1.35;
    let currentTool = 'select';
    let penColor = '#1e293b';
    let highlighterColor = 'rgba(250, 204, 21, 0.4)';
    let strokeWidth = 3;
    let intersectionObserver = null;

    let globalStrokes = [];
    let activeStroke = null;
    let isDrawing = false;

    let linkData = [];
    let linkIdCounter = 0;

    let activeToolMode = 'pointer';
    let pendingLinkSource = null;
    let waitingForDrop = false;
    let linkPointStart = null;

    let scanSelectionStart = null;
    let scanSelectionEnd = null;
    let isScanSelecting = false;

    // ---- DOM REFS ----
    const fileInput = document.getElementById('pdf-file-input');
    const btnOpenPdf = document.getElementById('btn-open-pdf');
    const casePlusInput = document.getElementById('case-plus-input');
    const btnCasePlus = document.getElementById('btn-case-plus');
    const btnAddPage = document.getElementById('btn-add-page');
    const btnTriggerCamera = document.getElementById('btn-trigger-camera');
    const btnTriggerGallery = document.getElementById('btn-trigger-gallery');
    const cameraOnlyInput = document.getElementById('camera-only-input');
    const galleryOnlyInput = document.getElementById('gallery-only-input');
    const addPageModal = document.getElementById('add-page-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const docInfo = document.getElementById('doc-info');
    const mainWorkspace = document.getElementById('main-workspace');
    const globalCanvas = document.getElementById('global-drawing-canvas');
    const globalCtx = globalCanvas.getContext('2d');
    const pdfContainer = document.getElementById('pdf-container');
    const emptyState = document.getElementById('empty-state');
    const pdfViewWrapper = document.getElementById('pdf-view-wrapper');
    const notepadPane = document.getElementById('notepad-pane');
    const notepadEditorContainer = document.getElementById('notepad-editor-container');
    const notepadEditor = document.getElementById('notepad-editor');
    const resizer = document.getElementById('resizer');
    const btnToggleNotepad = document.getElementById('btn-toggle-notepad');
    const btnCloseNotepad = document.getElementById('btn-close-notepad');
    const notepadBgSelect = document.getElementById('notepad-bg-select');
    const toolSelect = document.getElementById('tool-select');
    const toolPen = document.getElementById('tool-pen');
    const toolHighlighter = document.getElementById('tool-highlighter');
    const toolEraser = document.getElementById('tool-eraser');
    const pickerColor = document.getElementById('picker-color');
    const sliderSize = document.getElementById('slider-size');
    const btnClearPage = document.getElementById('btn-clear-page');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const zoomLabel = document.getElementById('zoom-label');
    const btnExportPdf = document.getElementById('btn-export-pdf');
    const btnSelectTools = document.getElementById('btn-select-tools');
    const toolDropdown = document.getElementById('tool-selector-dropdown');
    const modeStatus = document.getElementById('mode-status');

    // ----- RESIZER / PINCH -----
    let isResizing = false;
    let isPinching = false;
    let initialPinchDistance = 0;
    let initialPdfRatio = 50;
    let pinchCenterPane = 'pdf';
    let pinchRafId = null;
    const activePointerMap = new Map();

    // ================================================================
    // COORDINATE HELPERS (unchanged)
    // ================================================================
    function getWorkspaceRect() { return mainWorkspace.getBoundingClientRect(); }
    function getPdfCanvasWrapper(pageNum) {
      const card = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${pageNum}"]`);
      if (!card) return null;
      return card.querySelector('.canvas-wrapper');
    }
    function getContainerFromPoint(globalX, globalY) {
      const wsRect = getWorkspaceRect();
      const viewportX = globalX + wsRect.left;
      const viewportY = globalY + wsRect.top;
      const elements = document.elementsFromPoint(viewportX, viewportY);
      for (let el of elements) {
        const card = el.closest('.pdf-page-card');
        if (card) {
          const wrapper = card.querySelector('.canvas-wrapper');
          if (wrapper) {
            const wrapperRect = wrapper.getBoundingClientRect();
            return { type: 'pdf', pageNum: parseInt(card.dataset.pageNum,10), element: card, wrapper, wrapperRect,
                     offsetX: wrapperRect.left - wsRect.left, offsetY: wrapperRect.top - wsRect.top,
                     width: wrapperRect.width, height: wrapperRect.height };
          }
          const rect = card.getBoundingClientRect();
          return { type: 'pdf', pageNum: parseInt(card.dataset.pageNum,10), element: card, wrapper: null,
                   offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top,
                   width: rect.width, height: rect.height };
        }
      }
      const notepadRect = notepadEditorContainer.getBoundingClientRect();
      if (notepadPane.style.display !== 'none') {
        const nOffsetX = notepadRect.left - wsRect.left;
        const nOffsetY = notepadRect.top - wsRect.top;
        if (globalX >= nOffsetX && globalX <= nOffsetX + notepadRect.width &&
            globalY >= nOffsetY && globalY <= nOffsetY + notepadRect.height) {
          return { type: 'notepad', element: notepadEditorContainer, offsetX: nOffsetX, offsetY: nOffsetY,
                   width: notepadRect.width, height: notepadRect.height };
        }
      }
      return null;
    }
    function globalToContainer(globalX, globalY, containerInfo) {
      if (containerInfo.type === 'pdf') {
        return { x: globalX - containerInfo.offsetX, y: globalY - containerInfo.offsetY };
      } else if (containerInfo.type === 'notepad') {
        const scrollX = notepadEditorContainer.scrollLeft || 0;
        const scrollY = notepadEditorContainer.scrollTop || 0;
        return { x: globalX - containerInfo.offsetX + scrollX, y: globalY - containerInfo.offsetY + scrollY };
      }
      return { x: globalX, y: globalY };
    }
    function containerToGlobal(containerX, containerY, containerInfo) {
      if (containerInfo.type === 'pdf') {
        return { x: containerX + containerInfo.offsetX, y: containerY + containerInfo.offsetY };
      } else if (containerInfo.type === 'notepad') {
        const scrollX = notepadEditorContainer.scrollLeft || 0;
        const scrollY = notepadEditorContainer.scrollTop || 0;
        return { x: containerX + containerInfo.offsetX - scrollX, y: containerY + containerInfo.offsetY - scrollY };
      }
      return { x: containerX, y: containerY };
    }

    // ================================================================
    // LINK & MARKER FUNCTIONS (unchanged)
    // ================================================================
    function insertPdfMarker(linkId, x, y, pageNum, type) {
      const wrapper = getPdfCanvasWrapper(pageNum);
      if (!wrapper) return;
      const existing = wrapper.querySelector(`.pdf-link-marker[data-link-id="${linkId}"]`);
      if (existing) existing.remove();
      const marker = document.createElement('div');
      marker.className = `pdf-link-marker type-${type}`;
      marker.dataset.linkId = linkId;
      marker.style.left = x + 'px';
      marker.style.top = y + 'px';
      const tooltip = document.createElement('span');
      tooltip.className = 'link-tooltip';
      const labels = { line:'✏️ Line', highlight:'🟡 Highlight', underline:'⏺️ Underline', scan:'📷 Scan', linkpoint:'🔗 Link Point' };
      tooltip.textContent = 'Jump to Notepad (' + (labels[type]||type) + ')';
      marker.appendChild(tooltip);
      marker.addEventListener('click', function(e) {
        e.stopPropagation();
        jumpToLink(parseInt(this.dataset.linkId,10));
      });
      wrapper.appendChild(marker);
    }

    function insertNotepadMarker(linkId, x, y, type) {
      const editor = notepadEditor;
      if (!editor) return;
      editor.focus();
      const range = document.createRange();
      const sel = window.getSelection();
      range.selectNodeContents(editor);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
      const marker = document.createElement('span');
      marker.className = `notepad-link-marker type-${type}`;
      marker.dataset.linkId = linkId;
      marker.contentEditable = 'false';
      const tooltip = document.createElement('span');
      tooltip.className = 'link-tooltip';
      const labels = { line:'✏️ Line', highlight:'🟡 Highlight', underline:'⏺️ Underline', scan:'📷 Scan', linkpoint:'🔗 Link Point' };
      tooltip.textContent = 'Jump to PDF (' + (labels[type]||type) + ')';
      marker.appendChild(tooltip);
      marker.addEventListener('click', function(e) {
        e.stopPropagation();
        jumpToLink(parseInt(this.dataset.linkId,10));
      });
      range.insertNode(marker);
      const spaceNode = document.createTextNode(' ');
      range.setStartAfter(marker);
      range.insertNode(spaceNode);
      range.setStartAfter(spaceNode);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function insertNotepadScanImage(linkId, x, y, imageData) {
      const editor = notepadEditor;
      if (!editor) return;
      editor.focus();
      const range = document.createRange();
      const sel = window.getSelection();
      range.selectNodeContents(editor);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
      const container = document.createElement('span');
      container.contentEditable = 'false';
      container.style.display = 'inline-block';
      container.style.verticalAlign = 'middle';
      container.style.margin = '0 4px';
      container.dataset.linkId = linkId;
      const img = document.createElement('img');
      img.src = imageData;
      img.style.maxHeight = '80px';
      img.style.maxWidth = '150px';
      img.style.borderRadius = '4px';
      img.style.border = '1px solid #e2e8f0';
      img.style.display = 'block';
      const marker = document.createElement('span');
      marker.className = 'notepad-link-marker type-scan';
      marker.dataset.linkId = linkId;
      marker.style.display = 'inline-block';
      marker.style.marginTop = '4px';
      marker.contentEditable = 'false';
      const tooltip = document.createElement('span');
      tooltip.className = 'link-tooltip';
      tooltip.textContent = 'Jump to PDF (Scan)';
      marker.appendChild(tooltip);
      marker.addEventListener('click', function(e) {
        e.stopPropagation();
        jumpToLink(parseInt(this.dataset.linkId,10));
      });
      container.appendChild(img);
      container.appendChild(marker);
      range.insertNode(container);
      const spaceNode = document.createTextNode(' ');
      range.setStartAfter(container);
      range.insertNode(spaceNode);
      range.setStartAfter(spaceNode);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function jumpToLink(linkId) {
      const link = linkData.find(l => l.id === linkId);
      if (!link) return;
      if (link.sourceType === 'pdf') jumpToPdf(link.sourcePageNum, link.sourceX, link.sourceY, link.sourceBounds);
      else if (link.targetType === 'pdf') jumpToPdf(link.targetPageNum, link.targetX, link.targetY, link.targetBounds);
      else if (link.sourceType === 'notepad') jumpToNotepad(link.sourceScrollY);
      else if (link.targetType === 'notepad') jumpToNotepad(link.targetScrollY);
    }

    function jumpToPdf(pageNum, x, y, bounds) {
      const wrapper = getPdfCanvasWrapper(pageNum);
      if (!wrapper) {
        const card = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${pageNum}"]`);
        if (card) {
          const wrapperRect = pdfViewWrapper.getBoundingClientRect();
          const cardRect = card.getBoundingClientRect();
          pdfViewWrapper.scrollTo({ top: pdfViewWrapper.scrollTop + (cardRect.top - wrapperRect.top) - 60, behavior: 'smooth' });
          setTimeout(() => jumpToPdf(pageNum, x, y, bounds), 400);
        }
        return;
      }
      let targetY = y;
      if (bounds) targetY = (bounds.y1 + bounds.y2) / 2;
      const wrapperRect = wrapper.getBoundingClientRect();
      const viewWrapperRect = pdfViewWrapper.getBoundingClientRect();
      pdfViewWrapper.scrollTo({ top: pdfViewWrapper.scrollTop + (wrapperRect.top + targetY - viewWrapperRect.top) - 80, behavior: 'smooth' });
      setTimeout(() => {
        showPdfHighlight(pageNum, bounds ? bounds : { x1: x-30, y1: y-15, x2: x+30, y2: y+15 });
      }, 400);
    }

    function showPdfHighlight(pageNum, bounds) {
      document.querySelectorAll('.pdf-link-highlight').forEach(el => el.remove());
      const wrapper = getPdfCanvasWrapper(pageNum);
      if (!wrapper) return;
      let x1 = bounds.x1, y1 = bounds.y1, x2 = bounds.x2, y2 = bounds.y2;
      if (!bounds.x2) { x1 = bounds.x1 - 20; y1 = bounds.y1 - 10; x2 = bounds.x1 + 20; y2 = bounds.y1 + 10; }
      const left = Math.min(x1, x2), top = Math.min(y1, y2);
      const width = Math.abs(x2 - x1), height = Math.abs(y2 - y1);
      const highlight = document.createElement('div');
      highlight.className = 'pdf-link-highlight active';
      highlight.style.left = left + 'px';
      highlight.style.top = top + 'px';
      highlight.style.width = width + 'px';
      highlight.style.height = height + 'px';
      wrapper.appendChild(highlight);
      setTimeout(() => { highlight.classList.remove('active'); setTimeout(() => highlight.remove(), 500); }, 3000);
    }

    function jumpToNotepad(scrollY) {
      notepadEditorContainer.scrollTo({ top: scrollY || 0, behavior: 'smooth' });
      notepadEditor.focus();
    }

    // ================================================================
    // MODE MANAGEMENT (ULTIMATE FIX)
    // ================================================================

    let isDropdownOpen = false;
    let ignoreOutsideClick = false;

    function toggleDropdown(e) {
      e.stopPropagation();
      e.preventDefault();

      // Toggle state
      isDropdownOpen = !isDropdownOpen;
      toolDropdown.style.display = isDropdownOpen ? 'flex' : 'none';

      if (isDropdownOpen) {
        // Prevent outside click from closing it immediately
        ignoreOutsideClick = true;
        setTimeout(() => { ignoreOutsideClick = false; }, 200);
      }
    }

    // Use 'click' event - more reliable on mobile/desktop
    btnSelectTools.addEventListener('click', function(e) {
      console.log('Select button clicked!'); // debug
      toggleDropdown(e);
    });

    // Also support touch devices
    btnSelectTools.addEventListener('touchstart', function(e) {
      // Prevent double-firing
      if (!e.target._touched) {
        e.target._touched = true;
        toggleDropdown(e);
        setTimeout(() => { e.target._touched = false; }, 300);
      }
    }, { passive: false });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (ignoreOutsideClick) return;
      if (isDropdownOpen) {
        const target = e.target;
        if (!toolDropdown.contains(target) && target !== btnSelectTools) {
          toolDropdown.style.display = 'none';
          isDropdownOpen = false;
        }
      }
    });

    // Handle option selection
    document.querySelectorAll('.tool-option').forEach(opt => {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        const mode = this.dataset.mode;
        setToolMode(mode);
        toolDropdown.style.display = 'none';
        isDropdownOpen = false;
      });
    });

    function cancelPendingLink() {
      if (waitingForDrop) {
        waitingForDrop = false;
        pendingLinkSource = null;
        scanSelectionStart = null; scanSelectionEnd = null; isScanSelecting = false;
        linkPointStart = null;
        updateModeStatus('Cancelled');
        redrawGlobalStrokes();
      }
    }

    function setToolMode(mode) {
      cancelPendingLink();
      if (mode === 'pointer') {
        setTool('select');
        activeToolMode = 'pointer';
        updateModeStatus('🖱️ Pointer mode');
        globalCanvas.style.pointerEvents = 'none';
        return;
      }
      if (mode === 'line' || mode === 'underline') setTool('pen');
      else if (mode === 'highlight') setTool('highlighter');
      activeToolMode = mode;
      updateModeStatus(getModeLabel(mode));
      globalCanvas.style.pointerEvents = 'auto';
      globalCanvas.style.cursor = 'crosshair';
    }

    function getModeLabel(mode) {
      const map = {
        'line': '✏️ Line: Draw on PDF, then tap on Notepad',
        'highlight': '🟡 Highlight: Highlight on PDF, then tap on Notepad',
        'underline': '⏺️ Underline: Underline on PDF, then tap on Notepad',
        'scan': '📷 Scan: Select area on PDF, then tap on Notepad',
        'linkpoint': '🔗 Link Point: Tap on PDF, then tap on Notepad',
        'pointer': '🖱️ Pointer mode'
      };
      return map[mode] || '';
    }
    function updateModeStatus(text) {
      modeStatus.textContent = text;
      modeStatus.classList.add('visible');
      clearTimeout(modeStatus._timeout);
      modeStatus._timeout = setTimeout(() => modeStatus.classList.remove('visible'), 3000);
    }

    // ================================================================
    // DRAWING SYSTEM (unchanged)
    // ================================================================
    function redrawGlobalStrokes() {
      const wsRect = getWorkspaceRect();
      globalCanvas.width = wsRect.width;
      globalCanvas.height = wsRect.height;
      globalCtx.clearRect(0, 0, globalCanvas.width, globalCanvas.height);

      globalStrokes.forEach(stroke => {
        if (!stroke.points || stroke.points.length < 2) return;
        let containerInfo = null;
        if (stroke.container === 'pdf') {
          const wrapper = getPdfCanvasWrapper(stroke.pageNum);
          if (!wrapper) return;
          const rect = wrapper.getBoundingClientRect();
          containerInfo = { type: 'pdf', pageNum: stroke.pageNum, element: wrapper,
                            offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
        } else if (stroke.container === 'notepad') {
          if (notepadPane.style.display === 'none') return;
          const rect = notepadEditorContainer.getBoundingClientRect();
          containerInfo = { type: 'notepad', element: notepadEditorContainer,
                            offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
        } else return;
        const globalPoints = stroke.points.map(p => containerToGlobal(p.x, p.y, containerInfo));
        globalCtx.save();
        globalCtx.beginPath();
        globalCtx.moveTo(globalPoints[0].x, globalPoints[0].y);
        for (let i = 1; i < globalPoints.length; i++) {
          globalCtx.lineTo(globalPoints[i].x, globalPoints[i].y);
        }
        globalCtx.setLineDash([]);
        if (stroke.tool === 'pen') {
          globalCtx.globalCompositeOperation = 'source-over';
          globalCtx.strokeStyle = stroke.color;
          globalCtx.lineWidth = stroke.width;
          globalCtx.lineCap = 'round';
          globalCtx.lineJoin = 'round';
        } else if (stroke.tool === 'highlighter') {
          globalCtx.globalCompositeOperation = 'source-over';
          globalCtx.strokeStyle = stroke.color;
          globalCtx.lineWidth = stroke.width * 4;
          globalCtx.lineCap = 'square';
          globalCtx.lineJoin = 'miter';
        } else if (stroke.tool === 'eraser') {
          globalCtx.globalCompositeOperation = 'destination-out';
          globalCtx.lineWidth = stroke.width * 6;
          globalCtx.lineCap = 'round';
          globalCtx.lineJoin = 'round';
        }
        globalCtx.stroke();
        globalCtx.restore();
      });

      linkData.forEach(link => {
        let sourceGlobal = null, targetGlobal = null;
        if (link.sourceType === 'pdf') {
          const wrapper = getPdfCanvasWrapper(link.sourcePageNum);
          if (wrapper) {
            const rect = wrapper.getBoundingClientRect();
            const ci = { type: 'pdf', pageNum: link.sourcePageNum, element: wrapper,
                         offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
            let cx = link.sourceX, cy = link.sourceY;
            if (link.sourceBounds) { cx = (link.sourceBounds.x1+link.sourceBounds.x2)/2; cy = (link.sourceBounds.y1+link.sourceBounds.y2)/2; }
            sourceGlobal = containerToGlobal(cx, cy, ci);
          }
        } else if (link.sourceType === 'notepad' && notepadPane.style.display !== 'none') {
          const rect = notepadEditorContainer.getBoundingClientRect();
          const ci = { type: 'notepad', element: notepadEditorContainer,
                       offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
          let cx = link.sourceX, cy = link.sourceY;
          if (link.sourceBounds) { cx = (link.sourceBounds.x1+link.sourceBounds.x2)/2; cy = (link.sourceBounds.y1+link.sourceBounds.y2)/2; }
          sourceGlobal = containerToGlobal(cx, cy, ci);
        }
        if (link.targetType === 'pdf') {
          const wrapper = getPdfCanvasWrapper(link.targetPageNum);
          if (wrapper) {
            const rect = wrapper.getBoundingClientRect();
            const ci = { type: 'pdf', pageNum: link.targetPageNum, element: wrapper,
                         offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
            let cx = link.targetX, cy = link.targetY;
            if (link.targetBounds) { cx = (link.targetBounds.x1+link.targetBounds.x2)/2; cy = (link.targetBounds.y1+link.targetBounds.y2)/2; }
            targetGlobal = containerToGlobal(cx, cy, ci);
          }
        } else if (link.targetType === 'notepad' && notepadPane.style.display !== 'none') {
          const rect = notepadEditorContainer.getBoundingClientRect();
          const ci = { type: 'notepad', element: notepadEditorContainer,
                       offsetX: rect.left - wsRect.left, offsetY: rect.top - wsRect.top };
          let cx = link.targetX, cy = link.targetY;
          if (link.targetBounds) { cx = (link.targetBounds.x1+link.targetBounds.x2)/2; cy = (link.targetBounds.y1+link.targetBounds.y2)/2; }
          targetGlobal = containerToGlobal(cx, cy, ci);
        }
        if (sourceGlobal && targetGlobal) {
          globalCtx.save();
          globalCtx.setLineDash([6,6]);
          globalCtx.lineDashOffset = 0;
          globalCtx.strokeStyle = '#94a3b8';
          globalCtx.lineWidth = 1.5;
          globalCtx.globalCompositeOperation = 'source-over';
          globalCtx.globalAlpha = 0.4;
          globalCtx.beginPath();
          globalCtx.moveTo(sourceGlobal.x, sourceGlobal.y);
          globalCtx.lineTo(targetGlobal.x, targetGlobal.y);
          globalCtx.stroke();
          globalCtx.restore();
        }
      });
    }

    // ---- POINTER MODE DRAWING ----
    function startGlobalStroke(e) {
      if (activeToolMode !== 'pointer') return;
      if (isPinching) return;
      if (e.touches && e.touches.length > 1) return;
      e.preventDefault();
      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;
      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo) return;
      isDrawing = true;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);
      activeStroke = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2,6),
        tool: currentTool,
        color: currentTool === 'highlighter' ? highlighterColor : penColor,
        width: currentTool === 'highlighter' ? strokeWidth : strokeWidth,
        container: containerInfo.type,
        pageNum: containerInfo.type === 'pdf' ? containerInfo.pageNum : undefined,
        points: [localPoint],
        containerInfo: containerInfo
      };
      globalStrokes.push(activeStroke);
    }

    function drawGlobalStroke(e) {
      if (activeToolMode !== 'pointer') return;
      if (!isDrawing || !activeStroke) return;
      if (e.touches && e.touches.length > 1) return;
      e.preventDefault();
      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;
      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo || containerInfo.type !== activeStroke.container ||
          (containerInfo.type === 'pdf' && containerInfo.pageNum !== activeStroke.pageNum)) return;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);
      activeStroke.points.push(localPoint);
      const lastPoint = activeStroke.points[activeStroke.points.length-2];
      const lastGlobal = containerToGlobal(lastPoint.x, lastPoint.y, containerInfo);
      const currGlobal = containerToGlobal(localPoint.x, localPoint.y, containerInfo);
      globalCtx.save();
      globalCtx.beginPath();
      globalCtx.moveTo(lastGlobal.x, lastGlobal.y);
      globalCtx.lineTo(currGlobal.x, currGlobal.y);
      globalCtx.setLineDash([]);
      if (activeStroke.tool === 'pen') {
        globalCtx.globalCompositeOperation = 'source-over';
        globalCtx.strokeStyle = penColor;
        globalCtx.lineWidth = strokeWidth;
        globalCtx.lineCap = 'round';
        globalCtx.lineJoin = 'round';
      } else if (activeStroke.tool === 'highlighter') {
        globalCtx.globalCompositeOperation = 'source-over';
        globalCtx.strokeStyle = highlighterColor;
        globalCtx.lineWidth = strokeWidth * 4;
        globalCtx.lineCap = 'square';
        globalCtx.lineJoin = 'miter';
      } else if (activeStroke.tool === 'eraser') {
        globalCtx.globalCompositeOperation = 'destination-out';
        globalCtx.lineWidth = strokeWidth * 6;
        globalCtx.lineCap = 'round';
        globalCtx.lineJoin = 'round';
      }
      globalCtx.stroke();
      globalCtx.restore();
    }

    function stopGlobalStroke(e) {
      if (activeToolMode !== 'pointer') return;
      if (isDrawing) { isDrawing = false; activeStroke = null; }
    }

    // ---- LINK MODES ----
    function startLinkStroke(e) {
      if (activeToolMode === 'pointer' || activeToolMode === 'scan' || activeToolMode === 'linkpoint' || waitingForDrop) return;
      if (isPinching) return;
      if (e.touches && e.touches.length > 1) return;
      e.preventDefault();
      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;
      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo || containerInfo.type !== 'pdf') return;
      isDrawing = true;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);
      const tool = (activeToolMode === 'highlight') ? 'highlighter' : 'pen';
      const color = (tool === 'highlighter') ? highlighterColor : penColor;
      const width = (tool === 'highlighter') ? strokeWidth : strokeWidth;
      activeStroke = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2,6),
        tool: tool,
        color: color,
        width: width,
        container: containerInfo.type,
        pageNum: containerInfo.pageNum,
        points: [localPoint],
        containerInfo: containerInfo,
        mode: activeToolMode
      };
    }

    function drawLinkStroke(e) {
      if (!isDrawing || !activeStroke || activeToolMode === 'pointer' || activeToolMode === 'scan' || activeToolMode === 'linkpoint' || waitingForDrop) return;
      if (e.touches && e.touches.length > 1) return;
      e.preventDefault();
      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;
      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo || containerInfo.type !== activeStroke.container || containerInfo.pageNum !== activeStroke.pageNum) return;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);
      activeStroke.points.push(localPoint);
      const lastPoint = activeStroke.points[activeStroke.points.length-2];
      const lastGlobal = containerToGlobal(lastPoint.x, lastPoint.y, containerInfo);
      const currGlobal = containerToGlobal(localPoint.x, localPoint.y, containerInfo);
      globalCtx.save();
      globalCtx.beginPath();
      globalCtx.moveTo(lastGlobal.x, lastGlobal.y);
      globalCtx.lineTo(currGlobal.x, currGlobal.y);
      globalCtx.setLineDash([]);
      if (activeStroke.tool === 'pen') {
        globalCtx.globalCompositeOperation = 'source-over';
        globalCtx.strokeStyle = penColor;
        globalCtx.lineWidth = strokeWidth;
        globalCtx.lineCap = 'round';
        globalCtx.lineJoin = 'round';
      } else if (activeStroke.tool === 'highlighter') {
        globalCtx.globalCompositeOperation = 'source-over';
        globalCtx.strokeStyle = highlighterColor;
        globalCtx.lineWidth = strokeWidth * 4;
        globalCtx.lineCap = 'square';
        globalCtx.lineJoin = 'miter';
      }
      globalCtx.stroke();
      globalCtx.restore();
    }

    function stopLinkStroke(e) {
      if (!isDrawing || !activeStroke) return;
      isDrawing = false;
      if (activeStroke.points.length > 1) {
        pendingLinkSource = {
          type: activeToolMode,
          container: activeStroke.container,
          pageNum: activeStroke.pageNum,
          points: activeStroke.points.slice(),
          color: (activeStroke.tool === 'highlighter') ? highlighterColor : penColor,
          containerInfo: activeStroke.containerInfo,
          bounds: null
        };
        waitingForDrop = true;
        globalStrokes.push(activeStroke);
        updateModeStatus('✋ Now tap on Notepad to drop the link');
      }
      activeStroke = null;
    }

    // ---- LINK POINT ----
    function handleLinkPointClick(e) {
      if (activeToolMode !== 'linkpoint' || waitingForDrop) return;
      e.preventDefault();
      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;
      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo) return;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);

      if (!linkPointStart) {
        linkPointStart = {
          container: containerInfo.type,
          pageNum: containerInfo.type === 'pdf' ? containerInfo.pageNum : undefined,
          x: localPoint.x, y: localPoint.y,
          containerInfo: containerInfo,
          scrollY: containerInfo.type === 'notepad' ? (notepadEditorContainer.scrollTop || 0) : 0
        };
        updateModeStatus('📍 Now tap on the other side (PDF or Notepad) to link');
        if (containerInfo.type === 'pdf') {
          showPdfHighlight(containerInfo.pageNum, { x1: localPoint.x-15, y1: localPoint.y-10, x2: localPoint.x+15, y2: localPoint.y+10 });
        }
        return;
      }

      const source = linkPointStart;
      const target = {
        container: containerInfo.type,
        pageNum: containerInfo.type === 'pdf' ? containerInfo.pageNum : undefined,
        x: localPoint.x, y: localPoint.y,
        containerInfo: containerInfo,
        scrollY: containerInfo.type === 'notepad' ? (notepadEditorContainer.scrollTop || 0) : 0
      };

      if (source.container === target.container && source.pageNum === target.pageNum) {
        linkPointStart = null;
        updateModeStatus('❌ Same container, try again');
        return;
      }

      const linkId = ++linkIdCounter;
      const linkEntry = {
        id: linkId,
        type: 'linkpoint',
        sourceType: source.container,
        sourcePageNum: source.pageNum,
        sourceX: source.x, sourceY: source.y,
        sourceScrollY: source.scrollY,
        targetType: target.container,
        targetPageNum: target.pageNum,
        targetX: target.x, targetY: target.y,
        targetScrollY: target.scrollY,
        sourceBounds: null, targetBounds: null,
        color: penColor,
        created: Date.now()
      };
      linkData.push(linkEntry);

      if (source.container === 'pdf') insertPdfMarker(linkId, source.x, source.y, source.pageNum, 'linkpoint');
      else insertNotepadMarker(linkId, source.x, source.y, 'linkpoint');
      if (target.container === 'pdf') insertPdfMarker(linkId, target.x, target.y, target.pageNum, 'linkpoint');
      else insertNotepadMarker(linkId, target.x, target.y, 'linkpoint');

      linkPointStart = null;
      redrawGlobalStrokes();
      updateModeStatus('✅ Link created!');
    }

    // ---- SCAN ----
    function handleScanPointerDown(e) {
      if (activeToolMode !== 'scan' || waitingForDrop) return;
      e.preventDefault();
      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;
      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo || containerInfo.type !== 'pdf') return;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);
      scanSelectionStart = { globalX, globalY, containerInfo, localX: localPoint.x, localY: localPoint.y };
      isScanSelecting = true;
    }

    function handleScanPointerMove(e) {
      if (!isScanSelecting || !scanSelectionStart) return;
      e.preventDefault();
      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;
      const containerInfo = scanSelectionStart.containerInfo;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);
      scanSelectionEnd = { globalX, globalY, containerInfo, localX: localPoint.x, localY: localPoint.y };
      redrawGlobalStrokes();
      const start = scanSelectionStart, end = scanSelectionEnd;
      const g1 = containerToGlobal(start.localX, start.localY, start.containerInfo);
      const g2 = containerToGlobal(end.localX, end.localY, end.containerInfo);
      const left = Math.min(g1.x, g2.x), top = Math.min(g1.y, g2.y);
      const width = Math.abs(g2.x - g1.x), height = Math.abs(g2.y - g1.y);
      globalCtx.save();
      globalCtx.fillStyle = 'rgba(37,99,235,0.08)';
      globalCtx.strokeStyle = '#2563eb';
      globalCtx.lineWidth = 1.5;
      globalCtx.setLineDash([4,4]);
      globalCtx.fillRect(left, top, width, height);
      globalCtx.strokeRect(left, top, width, height);
      globalCtx.restore();
    }

    function handleScanPointerUp(e) {
      if (!isScanSelecting || !scanSelectionStart || !scanSelectionEnd) {
        isScanSelecting = false;
        scanSelectionStart = null; scanSelectionEnd = null;
        redrawGlobalStrokes();
        return;
      }
      e.preventDefault();
      const start = scanSelectionStart, end = scanSelectionEnd;
      const dx = Math.abs(end.localX - start.localX);
      const dy = Math.abs(end.localY - start.localY);
      if (dx > 5 && dy > 5) {
        const wrapper = start.containerInfo.wrapper;
        if (wrapper) {
          const pdfCanvas = wrapper.querySelector('.pdf-canvas');
          if (pdfCanvas) {
            const minX = Math.min(start.localX, end.localX);
            const minY = Math.min(start.localY, end.localY);
            const width = Math.abs(end.localX - start.localX);
            const height = Math.abs(end.localY - start.localY);
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width; tempCanvas.height = height;
            const ctx = tempCanvas.getContext('2d');
            ctx.drawImage(pdfCanvas, minX, minY, width, height, 0, 0, width, height);
            const imageData = tempCanvas.toDataURL('image/png');
            pendingLinkSource = {
              type: 'scan',
              container: 'pdf',
              pageNum: start.containerInfo.pageNum,
              bounds: { x1: minX, y1: minY, x2: minX + width, y2: minY + height },
              imageData: imageData,
              containerInfo: start.containerInfo,
              color: '#8b5cf6'
            };
            waitingForDrop = true;
            updateModeStatus('📷 Scan captured! Tap on Notepad to drop image');
          }
        }
      }
      isScanSelecting = false;
      scanSelectionStart = null; scanSelectionEnd = null;
      redrawGlobalStrokes();
    }

    // ---- DROP ON NOTEPAD ----
    function handleNotepadDrop(e) {
      if (!waitingForDrop || !pendingLinkSource) return;
      e.preventDefault();

      const wsRect = getWorkspaceRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const globalX = clientX - wsRect.left;
      const globalY = clientY - wsRect.top;
      const containerInfo = getContainerFromPoint(globalX, globalY);
      if (!containerInfo || containerInfo.type !== 'notepad') return;
      const localPoint = globalToContainer(globalX, globalY, containerInfo);

      const source = pendingLinkSource;
      const target = {
        container: 'notepad',
        x: localPoint.x, y: localPoint.y,
        containerInfo: containerInfo,
        scrollY: notepadEditorContainer.scrollTop || 0
      };

      const linkId = ++linkIdCounter;
      const linkType = source.type;

      const linkEntry = {
        id: linkId,
        type: linkType,
        sourceType: 'pdf',
        sourcePageNum: source.pageNum,
        sourceX: (source.bounds) ? (source.bounds.x1 + source.bounds.x2)/2 : source.points[0].x,
        sourceY: (source.bounds) ? (source.bounds.y1 + source.bounds.y2)/2 : source.points[0].y,
        sourceBounds: source.bounds || null,
        sourceScrollY: 0,
        targetType: 'notepad',
        targetPageNum: undefined,
        targetX: target.x,
        targetY: target.y,
        targetBounds: null,
        targetScrollY: target.scrollY,
        color: source.color || penColor,
        imageData: source.imageData || null,
        created: Date.now()
      };
      linkData.push(linkEntry);

      insertPdfMarker(linkId, linkEntry.sourceX, linkEntry.sourceY, source.pageNum, linkType);
      if (linkType === 'scan' && source.imageData) {
        insertNotepadScanImage(linkId, target.x, target.y, source.imageData);
      } else {
        insertNotepadMarker(linkId, target.x, target.y, linkType);
      }

      waitingForDrop = false;
      pendingLinkSource = null;
      updateModeStatus('✅ Link created!');
      redrawGlobalStrokes();
    }

    // ================================================================
    // UNIFIED EVENT LISTENERS
    // ================================================================
    function onPointerDown(e) {
      if (isPinching) return;
      if (e.touches && e.touches.length > 1) return;
      if (activeToolMode === 'pointer') startGlobalStroke(e);
      else if (activeToolMode === 'line' || activeToolMode === 'highlight' || activeToolMode === 'underline') startLinkStroke(e);
      else if (activeToolMode === 'scan') handleScanPointerDown(e);
      else if (activeToolMode === 'linkpoint') handleLinkPointClick(e);
    }
    function onPointerMove(e) {
      if (isPinching) return;
      if (e.touches && e.touches.length > 1) return;
      if (activeToolMode === 'pointer') drawGlobalStroke(e);
      else if (activeToolMode === 'line' || activeToolMode === 'highlight' || activeToolMode === 'underline') drawLinkStroke(e);
      else if (activeToolMode === 'scan') handleScanPointerMove(e);
    }
    function onPointerUp(e) {
      if (activeToolMode === 'pointer') stopGlobalStroke(e);
      else if (activeToolMode === 'line' || activeToolMode === 'highlight' || activeToolMode === 'underline') stopLinkStroke(e);
      else if (activeToolMode === 'scan') handleScanPointerUp(e);
    }

    globalCanvas.addEventListener('pointerdown', onPointerDown);
    globalCanvas.addEventListener('pointermove', onPointerMove);
    globalCanvas.addEventListener('pointerup', onPointerUp);
    globalCanvas.addEventListener('pointercancel', onPointerUp);
    globalCanvas.addEventListener('pointerleave', function(e) {
      if (activeToolMode === 'pointer') stopGlobalStroke(e);
      else if (activeToolMode === 'line' || activeToolMode === 'highlight' || activeToolMode === 'underline') stopLinkStroke(e);
    });

    globalCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
    globalCanvas.addEventListener('touchmove', onPointerMove, { passive: false });
    globalCanvas.addEventListener('touchend', onPointerUp);
    globalCanvas.addEventListener('touchcancel', onPointerUp);

    notepadEditorContainer.addEventListener('pointerdown', function(e) {
      if (waitingForDrop) handleNotepadDrop(e);
    });
    notepadEditorContainer.addEventListener('touchstart', function(e) {
      if (waitingForDrop) handleNotepadDrop(e);
    }, { passive: false });

    document.addEventListener('pointerdown', function(e) {
      if (waitingForDrop) {
        const rect = notepadEditorContainer.getBoundingClientRect();
        const x = e.clientX, y = e.clientY;
        if (!(x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom)) {
          cancelPendingLink();
        }
      }
    });

    // ================================================================
    // TOOL SELECTION (unchanged)
    // ================================================================
    function setTool(tool) {
      currentTool = tool;
      toolSelect.classList.toggle('active', tool === 'select');
      toolPen.classList.toggle('active', tool === 'pen');
      toolHighlighter.classList.toggle('active', tool === 'highlighter');
      toolEraser.classList.toggle('active', tool === 'eraser');

      if (tool === 'select') {
        globalCanvas.style.pointerEvents = 'none';
        globalCanvas.style.cursor = 'default';
        activeToolMode = 'pointer';
        updateModeStatus('🖱️ Pointer mode');
        document.querySelectorAll('.page-text-layer').forEach(el => {
          el.classList.remove('block-events');
          el.style.pointerEvents = 'auto';
        });
      } else {
        globalCanvas.style.pointerEvents = 'auto';
        globalCanvas.style.cursor = 'crosshair';
        activeToolMode = 'pointer';
        const labels = { pen: '✏️ Pen', highlighter: '🟡 Highlighter', eraser: '🧹 Eraser' };
        updateModeStatus(labels[tool] + ' mode');
        document.querySelectorAll('.page-text-layer').forEach(el => {
          el.classList.add('block-events');
          el.style.pointerEvents = 'none';
        });
        globalCanvas.style.zIndex = '100';
      }
    }

    toolSelect.addEventListener('click', () => setTool('select'));
    toolPen.addEventListener('click', () => setTool('pen'));
    toolHighlighter.addEventListener('click', () => setTool('highlighter'));
    toolEraser.addEventListener('click', () => setTool('eraser'));

    pickerColor.addEventListener('input', (e) => {
      penColor = e.target.value;
      const hex = e.target.value;
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      highlighterColor = `rgba(${r},${g},${b},0.35)`;
    });

    sliderSize.addEventListener('input', (e) => {
      strokeWidth = parseInt(e.target.value, 10);
    });

    // ================================================================
    // MULTI-DOCUMENT ENGINE (unchanged)
    // ================================================================
    function updateDocSummaryLabel() {
      if (loadedDocs.length === 0) {
        docInfo.textContent = totalPages > 0 ? `Custom Workspace (${totalPages} ${totalPages===1?'page':'pages'})` : 'No file selected';
      } else if (loadedDocs.length === 1) {
        docInfo.textContent = `${loadedDocs[0].fileName} (${totalPages} ${totalPages===1?'page':'pages'})`;
      } else {
        docInfo.textContent = `${loadedDocs.length} Cases (${totalPages} pages total)`;
      }
    }

    function updateAllPageIndicators() {
      const cards = pdfContainer.querySelectorAll('.pdf-page-card');
      totalPages = cards.length;
      cards.forEach((card, index) => {
        const pageNum = index + 1;
        card.dataset.pageNum = pageNum;
        const indicator = card.querySelector('.page-number-indicator');
        if (indicator) indicator.textContent = `PAGE ${pageNum} OF ${totalPages}`;
      });
    }

    function getCurrentlyActivePageNode() {
      const cards = Array.from(pdfContainer.querySelectorAll('.pdf-page-card'));
      if (!cards.length) return null;
      const wrapperRect = pdfViewWrapper.getBoundingClientRect();
      const wrapperCenter = wrapperRect.top + wrapperRect.height / 2;
      let closest = cards[0], minDist = Infinity;
      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        const center = rect.top + rect.height/2;
        const dist = Math.abs(center - wrapperCenter);
        if (dist < minDist) { minDist = dist; closest = card; }
      });
      return closest;
    }

    function initIntersectionObserver() {
      if (intersectionObserver) intersectionObserver.disconnect();
      intersectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageCard = entry.target;
            if (pageCard.dataset.isPdfPage === 'true' && pageCard.dataset.rendered !== 'true') {
              renderSinglePage(pageCard);
            }
          }
        });
      }, { root: pdfViewWrapper, rootMargin: '600px 0px', threshold: 0.01 });
    }

    function appendPageCardsForRange(docIndex, start, end) {
      if (!intersectionObserver) initIntersectionObserver();
      for (let i = start; i <= end; i++) {
        const pageCard = document.createElement('div');
        pageCard.className = 'pdf-page-card';
        pageCard.dataset.docIndex = docIndex;
        pageCard.dataset.internalPageNum = i;
        pageCard.dataset.isPdfPage = 'true';
        pageCard.style.minHeight = '850px';
        const indicator = document.createElement('div');
        indicator.className = 'page-number-indicator';
        const wrapper = document.createElement('div');
        wrapper.className = 'canvas-wrapper';
        const pdfCanvas = document.createElement('canvas');
        pdfCanvas.className = 'pdf-canvas';
        wrapper.appendChild(pdfCanvas);
        pageCard.appendChild(indicator);
        pageCard.appendChild(wrapper);
        pdfContainer.appendChild(pageCard);
        intersectionObserver.observe(pageCard);
      }
      updateAllPageIndicators();
      redrawGlobalStrokes();
    }

    function renderSinglePage(pageCard) {
      if (pageCard.dataset.isPdfPage !== 'true' || pageCard.dataset.rendering === 'true') return;
      const docIndex = parseInt(pageCard.dataset.docIndex, 10);
      const pageNum = parseInt(pageCard.dataset.internalPageNum, 10);
      const docEntry = loadedDocs[docIndex];
      if (!docEntry || !docEntry.pdfDoc) return;
      pageCard.dataset.rendering = 'true';
      docEntry.pdfDoc.getPage(pageNum).then(page => {
        const viewport = page.getViewport({ scale: currentScale });
        const pdfCanvas = pageCard.querySelector('.pdf-canvas');
        const wrapper = pageCard.querySelector('.canvas-wrapper');
        const ctx = pdfCanvas.getContext('2d');
        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        wrapper.style.width = viewport.width + 'px';
        wrapper.style.height = viewport.height + 'px';
        pageCard.style.width = viewport.width + 'px';
        pageCard.style.height = viewport.height + 'px';
        pageCard.style.minHeight = viewport.height + 'px';
        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
          pageCard.dataset.rendered = 'true';
          pageCard.dataset.rendering = 'false';
          redrawGlobalStrokes();
          linkData.forEach(link => {
            if (link.sourceType === 'pdf' && link.sourcePageNum === parseInt(pageCard.dataset.pageNum,10)) {
              let cx = link.sourceX, cy = link.sourceY;
              if (link.sourceBounds) { cx = (link.sourceBounds.x1+link.sourceBounds.x2)/2; cy = (link.sourceBounds.y1+link.sourceBounds.y2)/2; }
              insertPdfMarker(link.id, cx, cy, link.sourcePageNum, link.type);
            }
            if (link.targetType === 'pdf' && link.targetPageNum === parseInt(pageCard.dataset.pageNum,10)) {
              let cx = link.targetX, cy = link.targetY;
              if (link.targetBounds) { cx = (link.targetBounds.x1+link.targetBounds.x2)/2; cy = (link.targetBounds.y1+link.targetBounds.y2)/2; }
              insertPdfMarker(link.id, cx, cy, link.targetPageNum, link.type);
            }
          });
        }).catch(() => { pageCard.dataset.rendering = 'false'; });
      }).catch(() => { pageCard.dataset.rendering = 'false'; });
    }

    function getStandardPageDimensions() {
      const existing = pdfContainer.querySelector('.pdf-page-card');
      if (existing && existing.offsetWidth > 0) {
        return { width: existing.offsetWidth, height: existing.offsetHeight || Math.round(existing.offsetWidth * 1.3) };
      }
      return { width: Math.round(612 * currentScale), height: Math.round(792 * currentScale) };
    }

    function createPageTextLayer() {
      const textLayer = document.createElement('div');
      textLayer.className = 'page-text-layer';
      textLayer.contentEditable = 'true';
      textLayer.setAttribute('spellcheck', 'false');
      textLayer.setAttribute('placeholder', 'Tap here to type notes...');
      return textLayer;
    }

    function insertPageCardInPlace(pageCard) {
      const activeCard = getCurrentlyActivePageNode();
      if (activeCard && activeCard.parentNode === pdfContainer) {
        activeCard.insertAdjacentElement('afterend', pageCard);
      } else {
        pdfContainer.appendChild(pageCard);
      }
      updateAllPageIndicators();
      updateDocSummaryLabel();
      closeModal();
      redrawGlobalStrokes();
      const wrapperRect = pdfViewWrapper.getBoundingClientRect();
      const cardRect = pageCard.getBoundingClientRect();
      pdfViewWrapper.scrollTo({ top: pdfViewWrapper.scrollTop + (cardRect.top - wrapperRect.top), behavior: 'smooth' });
    }

    // ================================================================
    // MODAL HANDLERS
    // ================================================================
    btnAddPage.addEventListener('click', () => { addPageModal.style.display = 'flex'; });
    function closeModal() { addPageModal.style.display = 'none'; }
    btnCloseModal.addEventListener('click', closeModal);
    addPageModal.addEventListener('click', (e) => { if (e.target === addPageModal) closeModal(); });

    btnTriggerCamera.addEventListener('click', () => { cameraOnlyInput.value = ''; cameraOnlyInput.click(); });
    btnTriggerGallery.addEventListener('click', () => { galleryOnlyInput.value = ''; galleryOnlyInput.click(); });

    function handleImageFileImport(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          if (emptyState) emptyState.style.display = 'none';
          const dims = getStandardPageDimensions();
          const pageCard = document.createElement('div');
          pageCard.className = 'pdf-page-card';
          pageCard.dataset.rendered = 'true';
          pageCard.style.width = dims.width + 'px';
          pageCard.style.height = dims.height + 'px';
          pageCard.style.minHeight = dims.height + 'px';
          const indicator = document.createElement('div');
          indicator.className = 'page-number-indicator';
          const wrapper = document.createElement('div');
          wrapper.className = 'canvas-wrapper';
          wrapper.style.width = '100%'; wrapper.style.height = '100%';
          wrapper.style.display = 'flex';
          wrapper.style.alignItems = 'center';
          wrapper.style.justifyContent = 'center';
          wrapper.style.overflow = 'hidden';
          const imgElem = document.createElement('img');
          imgElem.src = event.target.result;
          imgElem.style.maxWidth = '100%';
          imgElem.style.maxHeight = '100%';
          imgElem.style.objectFit = 'contain';
          const textLayer = createPageTextLayer();
          wrapper.appendChild(imgElem);
          wrapper.appendChild(textLayer);
          pageCard.appendChild(indicator);
          pageCard.appendChild(wrapper);
          insertPageCardInPlace(pageCard);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    cameraOnlyInput.addEventListener('change', (e) => handleImageFileImport(e.target.files[0]));
    galleryOnlyInput.addEventListener('change', (e) => handleImageFileImport(e.target.files[0]));

    document.querySelectorAll('.template-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const templateType = btn.dataset.template;
        if (!templateType) return;
        if (emptyState) emptyState.style.display = 'none';
        const dims = getStandardPageDimensions();
        const pageCard = document.createElement('div');
        pageCard.className = 'pdf-page-card';
        pageCard.dataset.rendered = 'true';
        pageCard.style.width = dims.width + 'px';
        pageCard.style.height = dims.height + 'px';
        pageCard.style.minHeight = dims.height + 'px';
        const indicator = document.createElement('div');
        indicator.className = 'page-number-indicator';
        const wrapper = document.createElement('div');
        wrapper.className = `canvas-wrapper page-template-${templateType}`;
