<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Notepad & PDF Annotator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- jsPDF CDN for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        
        /* Main Layout */
        #app-header { height: 56px; background-color: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; z-index: 50; }
        #main-workspace { position: relative; width: 100%; height: calc(100vh - 56px); display: flex; overflow: hidden; background-color: #090d16; }
        
        /* Global Canvas Overlay */
        #global-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 25; pointer-events: none; }
        
        /* PDF View Wrapper */
        #pdf-view-wrapper { flex: 1 1 100%; height: 100%; overflow-y: auto; overflow-x: auto; position: relative; display: flex; flex-direction: column; align-items: center; padding: 1rem; scroll-behavior: smooth; }
        #pdf-container { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; position: relative; width: 100%; }
        
        /* PDF Page Card */
        .pdf-page-card { position: relative; background: #ffffff; border-radius: 4px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; color: #000; }
        .pdf-page-header { width: 100%; background: #334155; color: #cbd5e1; font-size: 11px; padding: 4px 10px; border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .pdf-canvas-wrapper { position: relative; overflow: hidden; }
        .pdf-overlay-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        
        /* Resizer Handles */
        .resizer { width: 8px; background: #1e293b; cursor: col-resize; z-index: 30; border-left: 1px solid #334155; border-right: 1px solid #334155; display: none; transition: background 0.2s; }
        .resizer:hover, .resizer.active { background: #3b82f6; }

        /* Notepad Pane */
        #notepad-pane { width: 50%; flex: 0 0 50%; height: 100%; background-color: #1e293b; display: none; flex-direction: column; z-index: 20; border-left: 1px solid #334155; }
        #notepad-toolbar { height: 44px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 0.75rem; }
        #notepad-scroll-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        
        /* Notepad Page Themes */
        .notepad-page-card { width: 100%; max-width: 650px; min-height: 800px; background: #ffffff; color: #1e293b; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); padding: 2rem; position: relative; }
        .bg-red-lined { background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #f87171 2px, transparent 2px); background-size: 100% 28px, 100% 100%; background-position: 0 0, 50px 0; line-height: 28px; }
        .bg-grid { background-image: linear-gradient(#cbd5e1 1px, transparent 1px), linear-gradient(90deg, #cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        .bg-blank { background: #ffffff; }
        .notepad-editor { width: 100%; min-height: 700px; outline: none; font-size: 16px; font-family: 'Courier New', Courier, monospace; color: #0f172a; }
        
        /* UI Elements & Buttons */
        .tool-btn { padding: 0.4rem 0.6rem; border-radius: 0.375rem; background: #334155; color: #f8fafc; font-size: 13px; display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .tool-btn:hover { background: #475569; }
        .tool-btn.active { background: #2563eb; color: #ffffff; border-color: #60a5fa; }
        .sticky-note-element { position: absolute; width: 180px; background: #fef08a; color: #713f12; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); padding: 8px; z-index: 40; pointer-events: auto; }
        .sticky-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 11px; margin-bottom: 4px; cursor: move; }
        .sticky-body { width: 100%; height: 80px; background: transparent; border: none; outline: none; resize: none; font-size: 12px; color: #713f12; }
        .link-marker-node { position: absolute; width: 16px; height: 16px; background: #ef4444; border: 2px solid #ffffff; border-radius: 50%; cursor: pointer; z-index: 40; pointer-events: auto; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); } 50% { transform: scale(1.15); } 100% { transform: scale(0.9); } }
        .cropped-scan-img { margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

    <!-- Header / Toolbar -->
    <header id="app-header">
        <div class="flex items-center gap-2">
            <button id="btn-open-pdf" class="tool-btn"><i class="fa-solid fa-folder-open"></i> Open PDF</button>
            <button id="btn-case-plus" class="tool-btn"><i class="fa-solid fa-file-circle-plus"></i> Case+</button>
            <span id="doc-summary-label" class="text-xs text-slate-400 ml-2">No PDF Loaded</span>
        </div>

        <!-- Main Drawing Tools -->
        <div class="flex items-center gap-1 bg-slate-900/50 p-1 rounded-lg border border-slate-700">
            <button class="tool-btn active" data-tool="pointer" onclick="setToolMode('pointer')"><i class="fa-solid fa-mouse-pointer"></i></button>
            <button class="tool-btn" data-tool="pen" onclick="setToolMode('pen')"><i class="fa-solid fa-pen"></i></button>
            <button class="tool-btn" data-tool="highlighter" onclick="setToolMode('highlighter')"><i class="fa-solid fa-highlighter"></i></button>
            <button class="tool-btn" data-tool="eraser" onclick="setToolMode('eraser')"><i class="fa-solid fa-eraser"></i></button>
            <button class="tool-btn" data-tool="whitener" onclick="setToolMode('whitener')"><i class="fa-solid fa-square"></i></button>
            <button class="tool-btn" data-tool="scan" onclick="setToolMode('scan')"><i class="fa-solid fa-crop-simple"></i> Scan</button>
            <button class="tool-btn" data-tool="sticky" onclick="setToolMode('sticky')"><i class="fa-solid fa-note-sticky"></i> Note</button>

            <div class="h-4 w-px bg-slate-700 mx-1"></div>

            <input type="color" id="picker-color" value="#1e293b" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0">
            <input type="range" id="slider-size" min="1" max="50" value="3" class="w-16 accent-blue-500">
        </div>

        <!-- Zoom & View Controls -->
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1 bg-slate-800 rounded px-2 py-1">
                <button id="btn-zoom-out" class="text-xs text-slate-300 hover:text-white"><i class="fa-solid fa-minus"></i></button>
                <span id="zoom-level-text" class="text-xs font-mono w-10 text-center">100%</span>
                <button id="btn-zoom-in" class="text-xs text-slate-300 hover:text-white"><i class="fa-solid fa-plus"></i></button>
            </div>

            <button id="btn-clear-page" class="tool-btn hover:bg-red-600"><i class="fa-solid fa-trash-can"></i> Clear</button>
            <button id="btn-toggle-notepad" class="tool-btn" onclick="toggleNotepad()"><i class="fa-solid fa-book-open"></i> Notepad</button>
            <button id="btn-export-pdf" class="tool-btn bg-emerald-600 hover:bg-emerald-500"><i class="fa-solid fa-download"></i> Export</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main id="main-workspace">
        <canvas id="global-canvas"></canvas>

        <!-- Left Resizer Handle -->
        <div id="left-resizer" class="resizer"></div>

        <!-- PDF Viewing Area -->
        <div id="pdf-view-wrapper">
            <div id="empty-state" class="flex flex-col items-center justify-center my-auto text-slate-500">
                <i class="fa-solid fa-file-pdf text-6xl mb-4 text-slate-700"></i>
                <p class="text-lg font-medium">कोई PDF फ़ाइल लोड नहीं है</p>
                <p class="text-xs text-slate-600 mb-4">स्टार्ट करने के लिए नीचे बटन पर क्लिक करें</p>
                <button class="empty-state-btn tool-btn bg-blue-600 hover:bg-blue-500 px-4 py-2"><i class="fa-solid fa-folder-open"></i> Open PDF File</button>
            </div>
            <div id="pdf-container"></div>
        </div>

        <!-- Middle Split Resizer -->
        <div id="resizer" class="resizer"></div>

        <!-- Notepad Side Pane -->
        <aside id="notepad-pane">
            <div id="notepad-toolbar">
                <div class="flex items-center gap-2">
                    <button id="notepad-prev-btn" class="tool-btn" onclick="prevNotepadPage()"><i class="fa-solid fa-chevron-left"></i></button>
                    <select id="notepad-page-select" class="bg-slate-800 text-xs rounded px-2 py-1 border border-slate-700 text-slate-200 outline-none"></select>
                    <button id="notepad-next-btn" class="tool-btn" onclick="nextNotepadPage()"><i class="fa-solid fa-chevron-right"></i></button>
                    <button class="tool-btn" onclick="addNewNotepadPage()"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="flex items-center gap-2">
                    <select id="notepad-bg-select" class="bg-slate-800 text-xs rounded px-2 py-1 border border-slate-700 text-slate-200 outline-none">
                        <option value="bg-red-lined">Lined</option>
                        <option value="bg-grid">Grid</option>
                        <option value="bg-blank">Blank</option>
                    </select>
                    <button id="btn-notepad-list" class="tool-btn" onclick="showNotepadPageList()"><i class="fa-solid fa-list"></i></button>
                </div>
            </div>
            <div id="notepad-scroll-container"></div>
        </aside>
    </main>

    <!-- Hidden File Inputs -->
    <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden">
    <input type="file" id="case-plus-input" accept="application/pdf" multiple class="hidden">

    <!-- Notepad Page List Modal -->
    <div id="notepad-list-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-800 rounded-lg max-w-2xl w-full p-4 border border-slate-700 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold">Notepad Pages Overview</h3>
                <button id="notepad-list-close" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            <div id="notepad-list-grid" class="grid grid-cols-3 gap-4 overflow-y-auto p-2"></div>
        </div>
    </div>

    <!-- JavaScript Engine (Parts 1 - 5 Complete & Fixed) -->
    <script>
        // Set PDF.js Worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // Global DOM & State Declarations
        const mainWorkspace = document.getElementById('main-workspace');
        const globalCanvas = document.getElementById('global-canvas');
        const ctx = globalCanvas ? globalCanvas.getContext('2d') : null;

        const pdfContainer = document.getElementById('pdf-container');
        const pdfViewWrapper = document.getElementById('pdf-view-wrapper');
        const emptyState = document.getElementById('empty-state');
        const docSummaryLabel = document.getElementById('doc-summary-label');

        const notepadPane = document.getElementById('notepad-pane');
        const notepadScrollContainer = document.getElementById('notepad-scroll-container');
        const resizer = document.getElementById('resizer');
        const leftResizer = document.getElementById('left-resizer');

        const pickerColor = document.getElementById('picker-color');
        const sliderSize = document.getElementById('slider-size');
        const zoomLevelText = document.getElementById('zoom-level-text');
        const toolButtons = document.querySelectorAll('.tool-btn');

        // Application State
        let activeToolMode = 'pointer';
        let penColor = '#1e293b';
        let highlighterColor = 'rgba(253, 224, 71, 0.35)';
        let strokeWidth = 3;
        let isDrawing = false;
        let currentStroke = null;
        let globalStrokes = [];

        let currentScale = 1.0;
        let loadedDocs = [];
        let totalPages = 0;
        let intersectionObserver = null;
        let renderingQueue = new Set();

        let notepadPagesData = [{ content: '', background: 'bg-red-lined', scrollTop: 0 }];
        let currentNotepadIndex = 0;

        let scanSelection = null;
        let linkMarkers = [];
        let pendingLinkSource = null;

        let isResizing = false;
        let isLeftResizing = false;
        let leftMarginPx = 0;

        // ================================================================
        // 1. TOOL MODE & CANVAS POINTER CONTROLS
        // ================================================================
        function setToolMode(mode) {
            cancelPendingLink();
            activeToolMode = mode;

            if (mode === 'eraser' || mode === 'whitener') {
                if (sliderSize && parseInt(sliderSize.value, 10) < 20) {
                    sliderSize.value = 20;
                    strokeWidth = 20;
                }
            }

            toolButtons.forEach(btn => {
                if (btn.dataset.tool) {
                    btn.classList.toggle('active', btn.dataset.tool === mode);
                }
            });

            updateGlobalCanvasPointerEvents();
        }

        function updateGlobalCanvasPointerEvents() {
            if (!globalCanvas) return;
            if (['pen', 'highlighter', 'eraser', 'whitener', 'scan'].includes(activeToolMode)) {
                globalCanvas.style.pointerEvents = 'auto';
                globalCanvas.style.cursor = (activeToolMode === 'eraser' || activeToolMode === 'whitener') ? 'cell' : 'crosshair';
            } else {
                globalCanvas.style.pointerEvents = 'none';
                globalCanvas.style.cursor = 'default';
            }
        }

        // ================================================================
        // 2. DRAWING STROKES & CANVAS ENGINE
        // ================================================================
        function startGlobalStroke(e) {
            if (!['pen', 'highlighter', 'eraser', 'whitener'].includes(activeToolMode)) return;
            const wsRect = mainWorkspace.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - wsRect.left;
            const y = clientY - wsRect.top;

            const activeCard = getCurrentlyActivePageNodeFromPoint(clientX, clientY);
            const pageNum = activeCard ? parseInt(activeCard.dataset.pageNum, 10) : 1;

            isDrawing = true;
            currentStroke = {
                id: Date.now(),
                type: activeToolMode,
                pageNum: pageNum,
                color: activeToolMode === 'highlighter' ? highlighterColor : (activeToolMode === 'whitener' ? '#ffffff' : penColor),
                width: strokeWidth,
                points: [{ x, y }]
            };
        }

        function drawGlobalStroke(e) {
            if (!isDrawing || !currentStroke) return;
            const wsRect = mainWorkspace.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - wsRect.left;
            const y = clientY - wsRect.top;

            currentStroke.points.push({ x, y });

            if (activeToolMode === 'eraser') {
                eraseStrokesAtPoint(x, y, strokeWidth);
            }
            redrawGlobalStrokes();
        }

        function stopGlobalStroke() {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentStroke && currentStroke.points.length > 1 && activeToolMode !== 'eraser') {
                globalStrokes.push(currentStroke);
            }
            currentStroke = null;
            redrawGlobalStrokes();
        }

        function eraseStrokesAtPoint(x, y, radius) {
            globalStrokes = globalStrokes.filter(stroke => {
                return !stroke.points.some(pt => Math.hypot(pt.x - x, pt.y - y) < radius);
            });
        }

        function redrawGlobalStrokes() {
            if (!ctx || !globalCanvas) return;
            ctx.clearRect(0, 0, globalCanvas.width, globalCanvas.height);

            for (const stroke of globalStrokes) {
                drawSingleStroke(ctx, stroke);
            }
            if (isDrawing && currentStroke && activeToolMode !== 'eraser') {
                drawSingleStroke(ctx, currentStroke);
            }
            if (scanSelection && scanSelection.active) {
                drawScanBox(ctx);
            }
        }

        function drawSingleStroke(context, stroke) {
            if (!stroke.points || stroke.points.length < 2) return;
            context.save();
            context.beginPath();
            context.moveTo(stroke.points[0].x, stroke.points[0].y);
            for (let i = 1; i < stroke.points.length; i++) {
                context.lineTo(stroke.points[i].x, stroke.points[i].y);
            }
            context.strokeStyle = stroke.color;
            context.lineWidth = stroke.width;
            context.lineCap = 'round';
            context.lineJoin = 'round';

            if (stroke.type === 'highlighter') {
                context.globalAlpha = 0.5;
                context.globalCompositeOperation = 'multiply';
            } else {
                context.globalCompositeOperation = 'source-over';
            }
            context.stroke();
            context.restore();
        }

        // ================================================================
        // 3. PDF RENDERING & ZOOM SYSTEM
        // ================================================================
        function initIntersectionObserver() {
            if (intersectionObserver) intersectionObserver.disconnect();
            intersectionObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageCard = entry.target;
                        if (!pageCard.dataset.rendered || pageCard.dataset.rendered === 'false') {
                            renderSinglePage(pageCard);
                        }
                    }
                });
            }, { root: pdfViewWrapper, rootMargin: '300px 0px 300px 0px', threshold: 0.01 });
        }

        function appendPageCardsForRange(docIndex, startPage, endPage) {
            const docObj = loadedDocs[docIndex];
            if (!docObj) return;

            const fragment = document.createDocumentFragment();
            for (let p = startPage; p <= endPage; p++) {
                totalPages++;
                const card = document.createElement('div');
                card.className = 'pdf-page-card';
                card.dataset.docIndex = docIndex;
                card.dataset.pageNumInDoc = p;
                card.dataset.pageNum = totalPages;
                card.dataset.rendered = 'false';
                card.id = `pdf-page-${totalPages}`;

                const header = document.createElement('div');
                header.className = 'pdf-page-header';
                header.innerText = `Page ${totalPages} (${docObj.fileName})`;

                const wrapper = document.createElement('div');
                wrapper.className = 'pdf-canvas-wrapper';

                const overlay = document.createElement('div');
                overlay.className = 'pdf-overlay-layer';

                card.appendChild(header);
                card.appendChild(wrapper);
                card.appendChild(overlay);
                fragment.appendChild(card);
            }
            pdfContainer.appendChild(fragment);

            const newCards = pdfContainer.querySelectorAll('.pdf-page-card[data-rendered="false"]');
            newCards.forEach(card => { if (intersectionObserver) intersectionObserver.observe(card); });
        }

        async function renderSinglePage(pageCard) {
            if (!pageCard || renderingQueue.has(pageCard.id)) return;
            const docIndex = parseInt(pageCard.dataset.docIndex, 10);
            const pageNumInDoc = parseInt(pageCard.dataset.pageNumInDoc, 10);
            const docObj = loadedDocs[docIndex];
            if (!docObj || !docObj.pdfDoc) return;

            renderingQueue.add(pageCard.id);
            pageCard.dataset.rendered = 'rendering';

            try {
                const page = await docObj.pdfDoc.getPage(pageNumInDoc);
                const viewport = page.getViewport({ scale: currentScale });
                const wrapper = pageCard.querySelector('.pdf-canvas-wrapper');
                wrapper.innerHTML = '';

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                wrapper.style.width = `${viewport.width}px`;
                wrapper.style.height = `${viewport.height}px`;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                wrapper.appendChild(canvas);
                pageCard.dataset.rendered = 'true';
            } catch (err) {
                console.error(`Page render error:`, err);
                pageCard.dataset.rendered = 'false';
            } finally {
                renderingQueue.delete(pageCard.id);
            }
        }

        function zoomIn() { if (currentScale < 3.0) { currentScale += 0.15; updateZoom(); } }
        function zoomOut() { if (currentScale > 0.4) { currentScale -= 0.15; updateZoom(); } }

        function updateZoom() {
            if (zoomLevelText) zoomLevelText.innerText = `${Math.round(currentScale * 100)}%`;
            const cards = pdfContainer.querySelectorAll('.pdf-page-card');
            cards.forEach(card => {
                card.dataset.rendered = 'false';
                const wrapper = card.querySelector('.pdf-canvas-wrapper');
                if (wrapper) wrapper.innerHTML = '';
            });
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                if (rect.top < window.innerHeight * 1.5 && rect.bottom > -window.innerHeight * 0.5) {
                    renderSinglePage(card);
                }
            });
            resizeGlobalCanvas();
        }

        // ================================================================
        // 4. NOTEPAD ENGINE & PAGE MANAGEMENT
        // ================================================================
        function showNotepad() {
            if (!notepadPane) return;
            notepadPane.style.display = 'flex';
            if (resizer) resizer.style.display = 'block';
            if (pdfViewWrapper) { pdfViewWrapper.style.width = '50%'; pdfViewWrapper.style.flex = '0 0 50%'; }
            notepadPane.style.width = '50%';
            notepadPane.style.flex = '0 0 50%';
            resizeGlobalCanvas();
            renderNotepadPages();
        }

        function hideNotepad() {
            if (!notepadPane) return;
            notepadPane.style.display = 'none';
            if (resizer) resizer.style.display = 'none';
            if (pdfViewWrapper) { pdfViewWrapper.style.width = '100%'; pdfViewWrapper.style.flex = '1 1 100%'; }
            resizeGlobalCanvas();
        }

        function toggleNotepad() {
            const isVisible = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
            isVisible ? hideNotepad() : showNotepad();
        }

        function renderNotepadPages() {
            if (!notepadScrollContainer) return;
            saveCurrentNotepadState();

            const curData = notepadPagesData[currentNotepadIndex] || { content: '', background: 'bg-red-lined', scrollTop: 0 };
            notepadScrollContainer.innerHTML = '';

            const pageCard = document.createElement('div');
            pageCard.className = `notepad-page-card ${curData.background}`;

            const editor = document.createElement('div');
            editor.className = 'notepad-editor';
            editor.contentEditable = 'true';
            editor.innerHTML = curData.content || '';
            editor.addEventListener('input', () => {
                notepadPagesData[currentNotepadIndex].content = editor.innerHTML;
            });

            pageCard.appendChild(editor);
            notepadScrollContainer.appendChild(pageCard);
            notepadScrollContainer.scrollTop = curData.scrollTop || 0;

            updateNotepadControlsUI();
        }

        function saveCurrentNotepadState() {
            if (!notepadScrollContainer) return;
            const editor = notepadScrollContainer.querySelector('.notepad-editor');
            if (editor && notepadPagesData[currentNotepadIndex]) {
                notepadPagesData[currentNotepadIndex].content = editor.innerHTML;
                notepadPagesData[currentNotepadIndex].scrollTop = notepadScrollContainer.scrollTop;
            }
        }

        function updateNotepadControlsUI() {
            const sel = document.getElementById('notepad-page-select');
            if (sel) {
                sel.innerHTML = '';
                notepadPagesData.forEach((_, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.innerText = `Page ${idx + 1}`;
                    if (idx === currentNotepadIndex) opt.selected = true;
                    sel.appendChild(opt);
                });
            }
            const bgSel = document.getElementById('notepad-bg-select');
            if (bgSel && notepadPagesData[currentNotepadIndex]) {
                bgSel.value = notepadPagesData[currentNotepadIndex].background;
            }
        }

        function prevNotepadPage() { if (currentNotepadIndex > 0) { currentNotepadIndex--; renderNotepadPages(); } }
        function nextNotepadPage() { if (currentNotepadIndex < notepadPagesData.length - 1) { currentNotepadIndex++; renderNotepadPages(); } }

        function addNewNotepadPage() {
            saveCurrentNotepadState();
            const lastBg = notepadPagesData[notepadPagesData.length - 1]?.background || 'bg-red-lined';
            notepadPagesData.push({ content: '', background: lastBg, scrollTop: 0 });
            currentNotepadIndex = notepadPagesData.length - 1;
            renderNotepadPages();
        }

        document.getElementById('notepad-bg-select')?.addEventListener('change', function() {
            if (notepadPagesData[currentNotepadIndex]) {
                notepadPagesData[currentNotepadIndex].background = this.value;
                const card = notepadScrollContainer.querySelector('.notepad-page-card');
                if (card) card.className = `notepad-page-card ${this.value}`;
            }
        });

        // ================================================================
        // 5. SCAN, STICKY NOTES, CLEAR & EXPORT LOGIC
        // ================================================================
        function handleScanStart(e) {
            const wsRect = mainWorkspace.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            scanSelection = { startX: clientX - wsRect.left, startY: clientY - wsRect.top, endX: clientX - wsRect.left, endY: clientY - wsRect.top, active: true };
        }

        function handleScanMove(e) {
            if (!scanSelection || !scanSelection.active) return;
            const wsRect = mainWorkspace.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            scanSelection.endX = clientX - wsRect.left;
            scanSelection.endY = clientY - wsRect.top;
            redrawGlobalStrokes();
        }

        function handleScanEnd() {
            if (!scanSelection || !scanSelection.active) return;
            scanSelection.active = false;
            const x = Math.min(scanSelection.startX, scanSelection.endX);
            const y = Math.min(scanSelection.startY, scanSelection.endY);
            const w = Math.abs(scanSelection.endX - scanSelection.startX);
            const h = Math.abs(scanSelection.endY - scanSelection.startY);

            if (w > 15 && h > 15) {
                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = w;
                cropCanvas.height = h;
                const cropCtx = cropCanvas.getContext('2d');
                cropCtx.drawImage(globalCanvas, x, y, w, h, 0, 0, w, h);

                showNotepad();
                const editor = notepadScrollContainer.querySelector('.notepad-editor');
                if (editor) {
                    const img = document.createElement('img');
                    img.src = cropCanvas.toDataURL('image/png');
                    img.className = 'cropped-scan-img';
                    editor.appendChild(img);
                    saveCurrentNotepadState();
                }
            }
            scanSelection = null;
            setToolMode('pointer');
            redrawGlobalStrokes();
        }

        function drawScanBox(context) {
            if (!scanSelection) return;
            const x = Math.min(scanSelection.startX, scanSelection.endX);
            const y = Math.min(scanSelection.startY, scanSelection.endY);
            const w = Math.abs(scanSelection.endX - scanSelection.startX);
            const h = Math.abs(scanSelection.endY - scanSelection.startY);

            context.save();
            context.strokeStyle = '#3b82f6';
            context.lineWidth = 2;
            context.setLineDash([6, 4]);
            context.strokeRect(x, y, w, h);
            context.fillStyle = 'rgba(59, 130, 246, 0.15)';
            context.fillRect(x, y, w, h);
            context.restore();
        }

        function createStickyNoteAtPoint(clientX, clientY) {
            const activePage = getCurrentlyActivePageNodeFromPoint(clientX, clientY);
            if (!activePage) return;

            const overlay = activePage.querySelector('.pdf-overlay-layer');
            const rect = activePage.getBoundingClientRect();
            const note = document.createElement('div');
            note.className = 'sticky-note-element';
            note.style.left = `${clientX - rect.left}px`;
            note.style.top = `${clientY - rect.top}px`;

            note.innerHTML = `
                <div class="sticky-header"><span>Note</span><button onclick="this.parentElement.parentElement.remove()">&times;</button></div>
                <textarea class="sticky-body" placeholder="Type here..."></textarea>
            `;
            overlay.appendChild(note);
            setToolMode('pointer');
        }

        function cancelPendingLink() { pendingLinkSource = null; }

        // Clear Page Fix
        document.getElementById('btn-clear-page')?.addEventListener('click', () => {
            const activeCard = getCurrentlyActivePageNode();
            if (!activeCard) return;
            const pNum = parseInt(activeCard.dataset.pageNum, 10);

            globalStrokes = globalStrokes.filter(s => s.pageNum !== pNum);
            const overlay = activeCard.querySelector('.pdf-overlay-layer');
            if (overlay) overlay.innerHTML = '';

            redrawGlobalStrokes();
        });

        // Export PDF
        document.getElementById('btn-export-pdf')?.addEventListener('click', async () => {
            if (loadedDocs.length === 0 && notepadPagesData.length === 0) {
                alert('कुछ भी एक्सपोर्ट करने के लिए लोड नहीं है।');
                return;
            }
            try {
                const { jsPDF } = window.jspdf;
                const pdfExport = new jsPDF('p', 'pt', 'a4');
                let isFirst = true;

                const cards = pdfContainer.querySelectorAll('.pdf-page-card');
                for (let card of cards) {
                    const canvas = card.querySelector('canvas');
                    if (canvas) {
                        if (!isFirst) pdfExport.addPage();
                        pdfExport.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 20, 20, 555, 780);
                        isFirst = false;
                    }
                }
                pdfExport.save('Annotated-Workspace.pdf');
            } catch (err) {
                alert('Export failed: ' + err.message);
            }
        });

        // ================================================================
        // 6. EVENT DISPATCHERS & RESIZERS (PART 5 FIXES)
        // ================================================================
        function handlePointerDown(e) {
            if (activeToolMode === 'scan') { handleScanStart(e); return; }
            if (activeToolMode === 'sticky') { createStickyNoteAtPoint(e.clientX, e.clientY); return; }
            startGlobalStroke(e);
        }

        function handlePointerMove(e) {
            if (activeToolMode === 'scan') { handleScanMove(e); return; }
            drawGlobalStroke(e);
        }

        function handlePointerUp(e) {
            if (activeToolMode === 'scan') { handleScanEnd(); return; }
            stopGlobalStroke();
        }

        globalCanvas.addEventListener('pointerdown', handlePointerDown);
        globalCanvas.addEventListener('pointermove', handlePointerMove);
        globalCanvas.addEventListener('pointerup', handlePointerUp);

        // Open PDF Click Trigger (FIXED)
        const pdfFileInput = document.getElementById('pdf-file-input');
        const btnOpenPdf = document.getElementById('btn-open-pdf');
        
        if (btnOpenPdf && pdfFileInput) {
            btnOpenPdf.addEventListener('click', () => {
                pdfFileInput.value = '';
                pdfFileInput.click();
            });
        }

        document.querySelector('.empty-state-btn')?.addEventListener('click', () => {
            pdfFileInput.value = '';
            pdfFileInput.click();
        });

        pdfFileInput?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                pdfjsLib.getDocument({ data }).promise.then(function(pdf) {
                    loadedDocs = [{ pdfDoc: pdf, fileName: file.name, numPages: pdf.numPages }];
                    totalPages = 0;
                    globalStrokes = [];

                    if (emptyState) emptyState.style.display = 'none';
                    pdfContainer.innerHTML = '';

                    initIntersectionObserver();
                    appendPageCardsForRange(0, 1, pdf.numPages);

                    updateDocSummaryLabel();
                    resizeGlobalCanvas();
                }).catch(err => alert('Error loading PDF: ' + err.message));
            };
            reader.readAsArrayBuffer(file);
        });

        // Case+ Multi PDF Appender
        const casePlusInput = document.getElementById('case-plus-input');
        document.getElementById('btn-case-plus')?.addEventListener('click', () => {
            casePlusInput.value = '';
            casePlusInput.click();
        });

        casePlusInput?.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            for (let file of files) {
                const buffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
                const idx = loadedDocs.length;
                loadedDocs.push({ pdfDoc: pdf, fileName: file.name, numPages: pdf.numPages });
                appendPageCardsForRange(idx, 1, pdf.numPages);
            }
            updateDocSummaryLabel();
            resizeGlobalCanvas();
        });

        // Split Resizer Drag
        resizer?.addEventListener('pointerdown', () => { isResizing = true; });
        window.addEventListener('pointermove', (e) => {
            if (!isResizing) return;
            let pct = (e.clientX / window.innerWidth) * 100;
            pct = Math.max(20, Math.min(80, pct));
            pdfViewWrapper.style.width = pct + '%';
            pdfViewWrapper.style.flex = '0 0 ' + pct + '%';
            notepadPane.style.width = (100 - pct) + '%';
            notepadPane.style.flex = '0 0 ' + (100 - pct) + '%';
            resizeGlobalCanvas();
        });
        window.addEventListener('pointerup', () => { isResizing = false; });

        // Utility Helpers
        function resizeGlobalCanvas() {
            if (!mainWorkspace || !globalCanvas) return;
            const rect = mainWorkspace.getBoundingClientRect();
            globalCanvas.width = rect.width;
            globalCanvas.height = rect.height;
            redrawGlobalStrokes();
        }

        function getCurrentlyActivePageNodeFromPoint(x, y) {
            const el = document.elementFromPoint(x, y);
            return el ? el.closest('.pdf-page-card') : null;
        }

        function getCurrentlyActivePageNode() {
            const cards = pdfContainer.querySelectorAll('.pdf-page-card');
            return cards[0] || null;
        }

        function updateDocSummaryLabel() {
            if (!docSummaryLabel) return;
            docSummaryLabel.innerText = `${loadedDocs.length} Document(s) | ${totalPages} Pages`;
        }

        if (pickerColor) pickerColor.addEventListener('input', (e) => penColor = e.target.value);
        if (sliderSize) sliderSize.addEventListener('input', (e) => strokeWidth = parseInt(e.target.value, 10));
        if (document.getElementById('btn-zoom-in')) document.getElementById('btn-zoom-in').addEventListener('click', zoomIn);
        if (document.getElementById('btn-zoom-out')) document.getElementById('btn-zoom-out').addEventListener('click', zoomOut);

        window.addEventListener('resize', resizeGlobalCanvas);

        // Initializing
        hideNotepad();
        resizeGlobalCanvas();
    </script>
</body>
</html>
