<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF & Notepad Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #121212;
            color: #e0e0e0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* ===== TOOLBAR ===== */
        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            min-height: 56px;
            touch-action: auto;
        }
        #toolbar button {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            touch-action: auto;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }
        #toolbar button:hover {
            background: #333;
            border-color: #666;
        }
        #toolbar button:active {
            transform: scale(0.95);
        }
        #toolbar button.active {
            background: #3a6ea5;
            border-color: #5a8ec5;
            color: #fff;
            box-shadow: 0 0 12px rgba(58, 110, 165, 0.3);
        }
        #toolbar .tool-group {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        #toolbar .separator {
            width: 1px;
            height: 30px;
            background: #444;
            margin: 0 4px;
        }
        #toolbar label {
            font-size: 12px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 6px;
            touch-action: auto;
        }
        #toolbar select {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            touch-action: auto;
            min-height: 32px;
        }
        #toolbar select:focus {
            outline: none;
            border-color: #5a8ec5;
        }
        #file-upload {
            display: none;
        }
        #toolbar .file-label {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            touch-action: auto;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #toolbar .file-label:hover {
            background: #333;
        }
        #page-indicator {
            font-size: 13px;
            color: #aaa;
            padding: 0 8px;
            min-width: 80px;
            text-align: center;
            touch-action: auto;
        }
        #btn-notes {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            touch-action: auto;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }
        #btn-notes:hover {
            background: #333;
            border-color: #666;
        }
        #btn-notes.active-notes {
            background: #3a6ea5;
            border-color: #5a8ec5;
            color: #fff;
            box-shadow: 0 0 12px rgba(58, 110, 165, 0.3);
        }

        /* ===== MAIN SPLIT LAYOUT ===== */
        #app-container {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            background: #121212;
            touch-action: none;
        }

        /* ===== PDF CONTAINER ===== */
        #pdf-container {
            flex: 1 1 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background: #1a1a1a;
            padding: 20px 16px;
            position: relative;
            touch-action: pan-y;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            transition: flex-basis 0.2s ease;
        }
        #pdf-container .page-placeholder {
            min-height: 850px;
            width: 100%;
            display: block;
            background: #222;
            border-radius: 4px;
            margin-bottom: 16px;
            position: relative;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
            transition: opacity 0.2s;
            touch-action: none;
        }
        #pdf-container .page-placeholder canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 4px;
            touch-action: none;
        }
        #pdf-container .page-placeholder.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            min-height: 850px;
            background: #1e1e1e;
            border: 1px dashed #444;
        }
        #pdf-container .page-placeholder.loading::after {
            content: '⏳ Loading page…';
            font-size: 14px;
            color: #666;
        }

        /* ===== RESIZER BAR ===== */
        #resizer {
            flex: 0 0 6px;
            height: 100%;
            background: #2a2a2a;
            cursor: col-resize;
            position: relative;
            z-index: 10;
            touch-action: none !important;
            pointer-events: auto !important;
            transition: background 0.15s;
            display: none;
            /* hidden by default */
            align-items: center;
            justify-content: center;
        }
        #resizer.visible {
            display: flex;
        }
        #resizer::after {
            content: '';
            width: 2px;
            height: 40px;
            background: #555;
            border-radius: 2px;
            transition: background 0.15s;
        }
        #resizer:hover,
        #resizer:active {
            background: #3a6ea5;
        }
        #resizer:hover::after,
        #resizer:active::after {
            background: #7ab0e0;
        }

        /* ===== NOTEPAD CONTAINER ===== */
        #notepad-container {
            flex: 0 0 40%;
            height: 100%;
            background: #1a1a1a;
            display: none;
            /* hidden by default */
            flex-direction: column;
            padding: 12px 14px 14px 14px;
            touch-action: none;
            overflow: hidden;
            transition: flex-basis 0.2s ease;
        }
        #notepad-container.visible {
            display: flex;
        }
        #notepad-container .notepad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
            touch-action: auto;
        }
        #notepad-container .notepad-header h3 {
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
            letter-spacing: 0.3px;
            touch-action: auto;
        }
        #notepad-container .notepad-header .note-stats {
            font-size: 11px;
            color: #666;
            touch-action: auto;
        }
        #notepad-textarea {
            flex: 1;
            width: 100%;
            min-height: 200px;
            background: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px 18px;
            font-size: 15px;
            line-height: 28px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            resize: none;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            touch-action: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        #notepad-textarea:focus {
            border-color: #3a6ea5;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3), 0 0 0 2px rgba(58, 110, 165, 0.15);
        }
        #notepad-textarea::placeholder {
            color: #555;
            font-style: italic;
        }

        /* ===== NOTEPAD THEMES ===== */
        #notepad-textarea.theme-red-lined {
            background: repeating-linear-gradient(#1e1e1e, #1e1e1e 31px, rgba(255, 69, 58, 0.25) 31px, rgba(255, 69, 58, 0.25) 32px);
            line-height: 32px;
            padding-top: 32px;
        }
        #notepad-textarea.theme-purple-lined {
            background: repeating-linear-gradient(#1e1e1e, #1e1e1e 31px, rgba(191, 90, 242, 0.25) 31px, rgba(191, 90, 242, 0.25) 32px);
            line-height: 32px;
            padding-top: 32px;
        }
        #notepad-textarea.theme-dot-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 0);
            background-size: 24px 24px;
            background-color: #1e1e1e;
        }
        #notepad-textarea.theme-dark {
            background: #121212;
            color: #e0e0e0;
        }
        #notepad-textarea.theme-light {
            background: #f0f0f0;
            color: #1a1a1a;
            border-color: #ccc;
        }
        #notepad-textarea.theme-light::placeholder {
            color: #888;
        }

        /* ===== SCROLLBAR STYLING ===== */
        #pdf-container::-webkit-scrollbar,
        #notepad-textarea::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        #pdf-container::-webkit-scrollbar-track,
        #notepad-textarea::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        #pdf-container::-webkit-scrollbar-thumb,
        #notepad-textarea::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        #pdf-container::-webkit-scrollbar-thumb:hover,
        #notepad-textarea::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            #toolbar {
                padding: 6px 10px;
                gap: 4px;
                min-height: 48px;
            }
            #toolbar button {
                padding: 4px 10px;
                font-size: 11px;
                min-height: 30px;
            }
            #toolbar .file-label {
                padding: 4px 10px;
                font-size: 11px;
                min-height: 30px;
            }
            #toolbar select {
                font-size: 11px;
                padding: 3px 8px;
                min-height: 28px;
            }
            #page-indicator {
                font-size: 11px;
                min-width: 60px;
            }
            #app-container {
                top: 48px;
            }
            #pdf-container {
                padding: 12px 10px;
            }
            #pdf-container .page-placeholder {
                min-height: 600px;
            }
            #notepad-container {
                padding: 8px 10px 10px 10px;
            }
            #notepad-textarea {
                font-size: 14px;
                padding: 12px 14px;
                min-height: 150px;
                line-height: 28px;
            }
            #resizer {
                flex: 0 0 8px;
            }
            #notepad-container .notepad-header h3 {
                font-size: 12px;
            }
        }
        @media (max-width: 500px) {
            #toolbar .separator {
                display: none;
            }
            #toolbar .tool-group {
                gap: 2px;
            }
            #pdf-container .page-placeholder {
                min-height: 450px;
            }
            #pdf-container {
                padding: 8px 6px;
            }
            #notepad-textarea {
                font-size: 13px;
                padding: 10px 12px;
                line-height: 26px;
            }
        }

        /* ===== LOADING OVERLAY ===== */
        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(4px);
            touch-action: none;
        }
        #loading-overlay.visible {
            display: flex;
        }
        #loading-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #3a6ea5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loading-overlay .load-text {
            color: #aaa;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="load-text">Loading PDF…</div>
    </div>

    <!-- ===== TOOLBAR ===== -->
    <div id="toolbar">
        <div class="tool-group">
            <button id="tool-select" class="active" data-tool="select" title="Select / Pan">🖱 Select</button>
            <button id="tool-pen" data-tool="pen" title="Pen">✏️ Pen</button>
            <button id="tool-highlighter" data-tool="highlighter" title="Highlighter">🟡 Highlighter</button>
            <button id="tool-eraser" data-tool="eraser" title="Eraser">🧹 Eraser</button>
        </div>

        <div class="separator"></div>

        <div class="tool-group">
            <label for="theme-select" style="font-size:12px;color:#999;">Theme</label>
            <select id="theme-select">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="red-lined">Red Lined</option>
                <option value="purple-lined">Purple Lined</option>
                <option value="dot-grid">Dot Grid</option>
            </select>
        </div>

        <div class="separator"></div>

        <div class="tool-group">
            <label for="file-upload" class="file-label">📄 Load PDF</label>
            <input type="file" id="file-upload" accept=".pdf">
            <button id="btn-clear-notes" title="Clear notes">🗑 Clear</button>
        </div>

        <div class="separator"></div>

        <div class="tool-group">
            <button id="btn-notes" title="Toggle Notepad">📝 Notes</button>
        </div>

        <div class="separator"></div>

        <div id="page-indicator">Page 1 / 1</div>
    </div>

    <!-- ===== APP CONTAINER ===== -->
    <div id="app-container">

        <!-- PDF -->
        <div id="pdf-container"></div>

        <!-- RESIZER -->
        <div id="resizer"></div>

        <!-- NOTEPAD -->
        <div id="notepad-container">
            <div class="notepad-header">
                <h3>📝 Notepad</h3>
                <span class="note-stats" id="note-stats">0 words</span>
            </div>
            <textarea id="notepad-textarea" placeholder="Write your notes here…"></textarea>
        </div>

    </div>

    <script>
        /* ==========================================================
               CRITICAL ARCHITECTURAL REFACTOR — COMPLETE IMPLEMENTATION
               ========================================================== */

        (function() {
            'use strict';

            // ---- PDF.js config ----
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            // ============================================================
            //  1.  STATE
            // ============================================================

            // --- FIX 2: DEFAULT TOOL STATE = 'select' ---
            let currentTool = 'select';
            let isDrawing = false;
            let lastX = 0,
                lastY = 0;

            let pdfDoc = null;
            let pageRenders = {};
            let renderedPages = new Set();
            let scale = 1.0;
            let totalPages = 0;
            let currentPageNum = 1;

            let notes = [];
            let annotations = [];

            // ---- Notepad visibility state ----
            let isNotepadVisible = false;

            const STORAGE_KEY = 'pdf_notepad_data';

            // ---- DOM refs ----
            const pdfContainer = document.getElementById('pdf-container');
            const notepadTextarea = document.getElementById('notepad-textarea');
            const resizer = document.getElementById('resizer');
            const notepadContainer = document.getElementById('notepad-container');
            const fileUpload = document.getElementById('file-upload');
            const pageIndicator = document.getElementById('page-indicator');
            const noteStats = document.getElementById('note-stats');
            const themeSelect = document.getElementById('theme-select');
            const loadingOverlay = document.getElementById('loading-overlay');
            const btnClearNotes = document.getElementById('btn-clear-notes');
            const btnNotes = document.getElementById('btn-notes');

            // ---- Tool buttons ----
            const toolSelect = document.getElementById('tool-select');
            const toolPen = document.getElementById('tool-pen');
            const toolHighlighter = document.getElementById('tool-highlighter');
            const toolEraser = document.getElementById('tool-eraser');
            const allToolBtns = [toolSelect, toolPen, toolHighlighter, toolEraser];

            // ---- IntersectionObserver ----
            let intersectionObserver = null;

            // ---- Resizer state ----
            let isResizing = false;

            // ============================================================
            //  2.  NOTEPAD TOGGLE (FIX 1: HIDDEN BY DEFAULT)
            // ============================================================

            function toggleNotepad() {
                isNotepadVisible = !isNotepadVisible;

                if (isNotepadVisible) {
                    notepadContainer.classList.add('visible');
                    resizer.classList.add('visible');
                    btnNotes.classList.add('active-notes');
                    // Set initial split: PDF 55%, Notepad 45%
                    pdfContainer.style.flex = '0 0 55%';
                    notepadContainer.style.flex = '0 0 45%';
                } else {
                    notepadContainer.classList.remove('visible');
                    resizer.classList.remove('visible');
                    btnNotes.classList.remove('active-notes');
                    // PDF takes full width
                    pdfContainer.style.flex = '1 1 100%';
                    notepadContainer.style.flex = '0 0 0%';
                }

                // Re-render PDF pages if needed (resize)
                if (pdfDoc) {
                    setTimeout(function() {
                        renderedPages.clear();
                        document.querySelectorAll('.page-placeholder').forEach(function(el) {
                            const pNum = parseInt(el.dataset.page, 10);
                            if (pNum) {
                                const record = pageRenders[pNum];
                                if (record) {
                                    record.loaded = false;
                                    record.canvas = null;
                                    record.ctx = null;
                                    el.innerHTML = '';
                                    el.className = 'page-placeholder loading';
                                    el.style.minHeight = '850px';
                                }
                            }
                        });
                        if (intersectionObserver) {
                            intersectionObserver.disconnect();
                            document.querySelectorAll('.page-placeholder').forEach(function(el) {
                                intersectionObserver.observe(el);
                            });
                        }
                        requestIdleCallback(function() {
                            for (let i = 1; i <= Math.min(4, totalPages); i++) {
                                if (!renderedPages.has(i)) renderPage(i);
                            }
                        }, { timeout: 300 });
                    }, 50);
                }

                saveToStorage();
            }

            // ============================================================
            //  3.  TOOLBAR STATE MANAGEMENT
            // ============================================================

            function setActiveTool(tool) {
                currentTool = tool;
                allToolBtns.forEach(function(btn) {
                    var t = btn.dataset.tool;
                    btn.classList.toggle('active', t === tool);
                });
                // Update cursor style on PDF container
                if (tool === 'pen' || tool === 'highlighter') {
                    pdfContainer.style.cursor = 'crosshair';
                } else if (tool === 'eraser') {
                    pdfContainer.style.cursor = 'not-allowed';
                } else {
                    pdfContainer.style.cursor = 'default';
                }
                saveToStorage();
            }

            function setupToolbar() {
                // --- FIX 2: default is 'select' ---
                setActiveTool('select');

                allToolBtns.forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        var tool = this.dataset.tool;
                        if (tool) setActiveTool(tool);
                    });
                });

                // File upload
                fileUpload.addEventListener('change', function(e) {
                    var file = this.files[0];
                    if (file && file.type === 'application/pdf') {
                        loadPDF(file);
                    }
                    this.value = '';
                });

                // Theme select
                themeSelect.addEventListener('change', function() {
                    applyTheme(this.value);
                    saveToStorage();
                });

                // Clear notes
                btnClearNotes.addEventListener('click', function() {
                    if (confirm('Clear all notes? This cannot be undone.')) {
                        notepadTextarea.value = '';
                        notes = [];
                        updateNoteStats();
                        saveToStorage();
                    }
                });

                // Notepad textarea changes
                notepadTextarea.addEventListener('input', function() {
                    updateNoteStats();
                    saveToStorage();
                });

                // Notes toggle button
                btnNotes.addEventListener('click', function() {
                    toggleNotepad();
                });

                // Page indicator click to go to top
                pageIndicator.addEventListener('click', function() {
                    pdfContainer.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            // ============================================================
            //  4.  THEME ENGINE (FIX 4: RED/PURPLE LINES, DOT GRID)
            // ============================================================

            function applyTheme(theme) {
                // Remove all theme classes
                notepadTextarea.classList.remove(
                    'theme-red-lined',
                    'theme-purple-lined',
                    'theme-dot-grid',
                    'theme-dark',
                    'theme-light'
                );

                switch (theme) {
                    case 'red-lined':
                        notepadTextarea.classList.add('theme-red-lined');
                        break;
                    case 'purple-lined':
                        notepadTextarea.classList.add('theme-purple-lined');
                        break;
                    case 'dot-grid':
                        notepadTextarea.classList.add('theme-dot-grid');
                        break;
                    case 'light':
                        notepadTextarea.classList.add('theme-light');
                        break;
                    case 'dark':
                    default:
                        notepadTextarea.classList.add('theme-dark');
                        break;
                }

                themeSelect.value = theme;
                saveToStorage();
            }

            // ============================================================
            //  5.  NOTEPAD STATS & STORAGE
            // ============================================================

            function updateNoteStats() {
                var text = notepadTextarea.value;
                var words = text.trim() ? text.trim().split(/\s+/).length : 0;
                noteStats.textContent = words + ' words';
            }

            // ============================================================
            //  6.  LOCAL STORAGE (preserve data arrays & routines)
            // ============================================================

            function saveToStorage() {
                try {
                    var data = {
                        notes: notes,
                        annotations: annotations,
                        notepadText: notepadTextarea.value,
                        theme: themeSelect.value,
                        tool: currentTool,
                        pdfScale: scale,
                        lastPage: currentPageNum,
                        splitRatio: getSplitRatio(),
                        notepadVisible: isNotepadVisible
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    // silently ignore quota errors
                }
            }

            function loadFromStorage() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    var data = JSON.parse(raw);

                    if (data.notepadText !== undefined) {
                        notepadTextarea.value = data.notepadText;
                        updateNoteStats();
                    }
                    if (data.theme) {
                        applyTheme(data.theme);
                    }
                    if (data.tool) {
                        setActiveTool(data.tool);
                    }
                    if (data.notes) {
                        notes = data.notes;
                    }
                    if (data.annotations) {
                        annotations = data.annotations;
                    }
                    if (data.splitRatio) {
                        applySplitRatio(data.splitRatio);
                    }
                    if (data.pdfScale) {
                        scale = data.pdfScale;
                    }
                    // Restore notepad visibility state
                    if (data.notepadVisible === true) {
                        // Only restore if we have a PDF loaded? We'll defer to after PDF load.
                        // We'll store the flag and apply after PDF load.
                        isNotepadVisible = true;
                    } else {
                        isNotepadVisible = false;
                    }
                } catch (e) {
                    // ignore corrupt storage
                }
            }

            function getSplitRatio() {
                var container = document.getElementById('app-container');
                var pdfWidth = pdfContainer.getBoundingClientRect().width;
                var totalWidth = container.getBoundingClientRect().width;
                if (totalWidth === 0) return 0.55;
                return Math.min(0.95, Math.max(0.05, pdfWidth / totalWidth));
            }

            function applySplitRatio(ratio) {
                ratio = Math.min(0.95, Math.max(0.05, ratio));
                var notepadRatio = 1 - ratio;
                pdfContainer.style.flex = '0 0 ' + (ratio * 100) + '%';
                notepadContainer.style.flex = '0 0 ' + (notepadRatio * 100) + '%';
            }

            // ============================================================
            //  7.  PDF RENDERING (FIX 3: LAG & BLANK PAGES)
            // ============================================================

            function showLoading(show) {
                loadingOverlay.classList.toggle('visible', show);
            }

            function loadPDF(file) {
                showLoading(true);
                var reader = new FileReader();

                reader.onload = function(e) {
                    var arrayBuffer = e.target.result;
                    // --- FIX 3.1: wrap in setTimeout to not block main thread ---
                    setTimeout(function() {
                        pdfjsLib.getDocument({ data: arrayBuffer }).promise
                            .then(function(doc) {
                                pdfDoc = doc;
                                totalPages = doc.numPages;
                                currentPageNum = 1;
                                renderedPages.clear();
                                pageRenders = {};
                                renderAllPages();
                                updatePageIndicator();
                                showLoading(false);

                                // Restore notepad visibility after PDF load
                                if (isNotepadVisible) {
                                    // Apply the notepad visibility state
                                    notepadContainer.classList.add('visible');
                                    resizer.classList.add('visible');
                                    btnNotes.classList.add('active-notes');
                                    pdfContainer.style.flex = '0 0 55%';
                                    notepadContainer.style.flex = '0 0 45%';
                                } else {
                                    notepadContainer.classList.remove('visible');
                                    resizer.classList.remove('visible');
                                    btnNotes.classList.remove('active-notes');
                                    pdfContainer.style.flex = '1 1 100%';
                                    notepadContainer.style.flex = '0 0 0%';
                                }

                                saveToStorage();
                            })
                            .catch(function(err) {
                                console.error('PDF load error:', err);
                                showLoading(false);
                                alert('Failed to load PDF. Please try again.');
                            });
                    }, 0);
                };

                reader.onerror = function() {
                    showLoading(false);
                    alert('Failed to read file.');
                };

                reader.readAsArrayBuffer(file);
            }

            function renderAllPages() {
                // Clear container
                pdfContainer.innerHTML = '';
                pageRenders = {};
                renderedPages.clear();

                if (!pdfDoc) return;

                // --- FIX 3.2: placeholders with forced min-height ---
                for (var i = 1; i <= totalPages; i++) {
                    var placeholder = document.createElement('div');
                    placeholder.className = 'page-placeholder loading';
                    placeholder.dataset.page = i;
                    placeholder.id = 'page-' + i;
                    placeholder.style.minHeight = '850px';
                    placeholder.style.width = '100%';
                    placeholder.style.display = 'block';
                    pdfContainer.appendChild(placeholder);
                    pageRenders[i] = { placeholder: placeholder, canvas: null, ctx: null, loaded: false };
                }

                // --- FIX 3.3: IntersectionObserver with rootMargin ---
                if (intersectionObserver) {
                    intersectionObserver.disconnect();
                }

                intersectionObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            var pageNum = parseInt(entry.target.dataset.page, 10);
                            if (pageNum && !renderedPages.has(pageNum)) {
                                renderPage(pageNum);
                            }
                        }
                    });
                }, {
                    root: pdfContainer,
                    rootMargin: '600px 0px',
                    threshold: 0.01
                });

                // Observe all placeholders
                document.querySelectorAll('.page-placeholder').forEach(function(el) {
                    intersectionObserver.observe(el);
                });

                // Immediately render first few pages to avoid initial blank
                requestIdleCallback(function() {
                    for (var i = 1; i <= Math.min(4, totalPages); i++) {
                        if (!renderedPages.has(i)) {
                            renderPage(i);
                        }
                    }
                }, { timeout: 200 });
            }

            function renderPage(pageNum) {
                if (!pdfDoc || renderedPages.has(pageNum)) return;
                var record = pageRenders[pageNum];
                if (!record) return;
                if (record.loaded) return;

                var placeholder = record.placeholder;
                placeholder.classList.remove('loading');

                var containerWidth = pdfContainer.clientWidth - 32;
                if (containerWidth <= 0) {
                    setTimeout(function() { renderPage(pageNum); }, 100);
                    return;
                }

                pdfDoc.getPage(pageNum).then(function(page) {
                    var viewport = page.getViewport({ scale: 1 });
                    var scaleFactor = Math.min(1, (containerWidth - 4) / viewport.width);
                    var scaledViewport = page.getViewport({ scale: scaleFactor });

                    var canvas = document.createElement('canvas');
                    canvas.width = scaledViewport.width;
                    canvas.height = scaledViewport.height;
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    canvas.style.display = 'block';

                    var ctx = canvas.getContext('2d');
                    var renderContext = {
                        canvasContext: ctx,
                        viewport: scaledViewport
                    };

                    ctx.fillStyle = '#1e1e1e';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    page.render(renderContext).promise.then(function() {
                        placeholder.innerHTML = '';
                        placeholder.appendChild(canvas);
                        record.canvas = canvas;
                        record.ctx = ctx;
                        record.loaded = true;
                        renderedPages.add(pageNum);

                        if (pageNum === currentPageNum) {
                            updatePageIndicator();
                        }

                        scale = scaleFactor;
                        saveToStorage();
                    }).catch(function(err) {
                        console.warn('Page render error:', err);
                        placeholder.innerHTML =
                            '<div style="padding:40px;text-align:center;color:#666;">⚠️ Could not render page ' +
                            pageNum + '</div>';
                        record.loaded = true;
                    });
                }).catch(function(err) {
                    console.warn('Page fetch error:', err);
                    placeholder.innerHTML =
                        '<div style="padding:40px;text-align:center;color:#666;">⚠️ Could not load page ' + pageNum +
                        '</div>';
                    record.loaded = true;
                });
            }

            function updatePageIndicator() {
                if (totalPages === 0) {
                    pageIndicator.textContent = 'No PDF loaded';
                    return;
                }
                var placeholders = document.querySelectorAll('.page-placeholder');
                var bestPage = 1;
                var bestRatio = 0;
                var containerRect = pdfContainer.getBoundingClientRect();
                var viewportHeight = containerRect.height;

                placeholders.forEach(function(el) {
                    var rect = el.getBoundingClientRect();
                    var visibleTop = Math.max(rect.top, containerRect.top);
                    var visibleBottom = Math.min(rect.bottom, containerRect.bottom);
                    var visibleHeight = Math.max(0, visibleBottom - visibleTop);
                    var ratio = visibleHeight / viewportHeight;
                    if (ratio > bestRatio) {
                        bestRatio = ratio;
                        bestPage = parseInt(el.dataset.page, 10) || 1;
                    }
                });

                currentPageNum = bestPage;
                pageIndicator.textContent = 'Page ' + bestPage + ' / ' + totalPages;
            }

            // ---- PDF scroll listener for page indicator ----
            pdfContainer.addEventListener('scroll', function() {
                updatePageIndicator();
                saveToStorage();
            });

            // ---- Window resize ----
            var resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(function() {
                    if (pdfDoc) {
                        renderedPages.clear();
                        document.querySelectorAll('.page-placeholder').forEach(function(el) {
                            var pNum = parseInt(el.dataset.page, 10);
                            if (pNum) {
                                var record = pageRenders[pNum];
                                if (record) {
                                    record.loaded = false;
                                    record.canvas = null;
                                    record.ctx = null;
                                    el.innerHTML = '';
                                    el.className = 'page-placeholder loading';
                                    el.style.minHeight = '850px';
                                }
                            }
                        });
                        if (intersectionObserver) {
                            intersectionObserver.disconnect();
                            document.querySelectorAll('.page-placeholder').forEach(function(el) {
                                intersectionObserver.observe(el);
                            });
                        }
                        requestIdleCallback(function() {
                            for (var i = 1; i <= Math.min(4, totalPages); i++) {
                                if (!renderedPages.has(i)) renderPage(i);
                            }
                        }, { timeout: 300 });
                    }
                }, 300);
            });

            // ============================================================
            //  8.  RESIZER BAR (FIX 5: TOUCH/PENCIL SPLIT-SCREEN)
            // ============================================================

            function setupResizer() {
                // --- FIX 5.1: force pointer-events & touch-action ---
                resizer.style.pointerEvents = 'auto !important';
                resizer.style.touchAction = 'none !important';

                var container = document.getElementById('app-container');

                function startResize(e) {
                    if (!isNotepadVisible) return;
                    isResizing = true;
                    resizer.style.background = '#3a6ea5';
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                    document.body.style.webkitUserSelect = 'none';
                    e.preventDefault();
                }

                function doResize(e) {
                    if (!isResizing || !isNotepadVisible) return;
                    e.preventDefault();

                    // --- FIX 5.2: capture coordinates strictly ---
                    var clientX;
                    if (e.touches && e.touches.length > 0) {
                        clientX = e.touches[0].clientX;
                    } else if (e.changedTouches && e.changedTouches.length > 0) {
                        clientX = e.changedTouches[0].clientX;
                    } else {
                        clientX = e.clientX;
                    }

                    if (clientX === undefined) return;

                    var rect = container.getBoundingClientRect();
                    var totalWidth = rect.width;
                    if (totalWidth === 0) return;

                    var ratio = (clientX - rect.left) / totalWidth;
                    ratio = Math.min(0.92, Math.max(0.08, ratio));

                    // --- FIX 5.3: requestAnimationFrame for 60fps ---
                    requestAnimationFrame(function() {
                        applySplitRatio(ratio);
                    });
                }

                function endResize(e) {
                    if (isResizing) {
                        isResizing = false;
                        resizer.style.background = '';
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                        document.body.style.webkitUserSelect = '';
                        // Re-render PDF pages at new size
                        if (pdfDoc) {
                            clearTimeout(resizeTimeout);
                            resizeTimeout = setTimeout(function() {
                                renderedPages.clear();
                                document.querySelectorAll('.page-placeholder').forEach(function(el) {
                                    var pNum = parseInt(el.dataset.page, 10);
                                    if (pNum) {
                                        var record = pageRenders[pNum];
                                        if (record) {
                                            record.loaded = false;
                                            record.canvas = null;
                                            record.ctx = null;
                                            el.innerHTML = '';
                                            el.className = 'page-placeholder loading';
                                            el.style.minHeight = '850px';
                                        }
                                    }
                                });
                                if (intersectionObserver) {
                                    intersectionObserver.disconnect();
                                    document.querySelectorAll('.page-placeholder').forEach(function(el) {
                                        intersectionObserver.observe(el);
                                    });
                                }
                                requestIdleCallback(function() {
                                    for (var i = 1; i <= Math.min(4, totalPages); i++) {
                                        if (!renderedPages.has(i)) renderPage(i);
                                    }
                                }, { timeout: 300 });
                                saveToStorage();
                            }, 200);
                        }
                        saveToStorage();
                    }
                }

                // Mouse events
                resizer.addEventListener('mousedown', startResize);
                window.addEventListener('mousemove', doResize);
                window.addEventListener('mouseup', endResize);

                // Touch events (for finger & pencil)
                resizer.addEventListener('touchstart', startResize, { passive: false });
                window.addEventListener('touchmove', doResize, { passive: false });
                window.addEventListener('touchend', endResize, { passive: false });
                window.addEventListener('touchcancel', endResize, { passive: false });

                // Prevent default touch actions on resizer
                resizer.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                }, { passive: false });
            }

            // ============================================================
            //  9.  DRAWING / INK EVENTS (strict tool check)
            // ============================================================

            function setupDrawing() {
                // --- FIX 2: drawing only occurs if tool is pen or highlighter ---
                pdfContainer.addEventListener('pointerdown', function(e) {
                    if (currentTool !== 'pen' && currentTool !== 'highlighter') return;
                    if (!pdfDoc) return;

                    var rect = pdfContainer.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top + pdfContainer.scrollTop;

                    isDrawing = true;
                    lastX = x;
                    lastY = y;

                    var page = getPageAtY(y);
                    if (page) {
                        var color = currentTool === 'pen' ? '#ffcc00' : 'rgba(255, 255, 0, 0.35)';
                        var size = currentTool === 'pen' ? 2 : 12;
                        annotations.push({
                            id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                            page: page,
                            x: x,
                            y: y,
                            color: color,
                            type: currentTool,
                            size: size,
                            points: [{ x: x, y: y }]
                        });
                    }

                    e.preventDefault();
                });

                pdfContainer.addEventListener('pointermove', function(e) {
                    if (currentTool !== 'pen' && currentTool !== 'highlighter') return;
                    if (!isDrawing || !pdfDoc) return;

                    var rect = pdfContainer.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top + pdfContainer.scrollTop;

                    if (annotations.length > 0) {
                        var last = annotations[annotations.length - 1];
                        if (last.points) {
                            last.points.push({ x: x, y: y });
                        }
                    }

                    var page = getPageAtY(y);
                    if (page) {
                        var record = pageRenders[page];
                        if (record && record.canvas) {
                            // For simplicity, we just track annotations.
                            // Actual drawing would require overlay canvas.
                        }
                    }

                    lastX = x;
                    lastY = y;
                    e.preventDefault();
                });

                pdfContainer.addEventListener('pointerup', function(e) {
                    if (currentTool !== 'pen' && currentTool !== 'highlighter') return;
                    if (isDrawing) {
                        isDrawing = false;
                        saveToStorage();
                    }
                });

                pdfContainer.addEventListener('pointerleave', function(e) {
                    if (isDrawing) {
                        isDrawing = false;
                        saveToStorage();
                    }
                });
            }

            function getPageAtY(y) {
                var placeholders = document.querySelectorAll('.page-placeholder');
                var scrollTop = pdfContainer.scrollTop;
                for (var i = 0; i < placeholders.length; i++) {
                    var el = placeholders[i];
                    var rect = el.getBoundingClientRect();
                    var top = rect.top + scrollTop - pdfContainer.getBoundingClientRect().top;
                    var bottom = top + rect.height;
                    if (y >= top && y <= bottom) {
                        return parseInt(el.dataset.page, 10) || 1;
                    }
                }
                return 1;
            }

            // ============================================================
            //  10.  INITIALIZATION
            // ============================================================

            function init() {
                // --- FIX 1 & 2: notepad hidden, tool = 'select' ---
                currentTool = 'select';
                isNotepadVisible = false;

                // Ensure notepad is hidden initially
                notepadContainer.classList.remove('visible');
                resizer.classList.remove('visible');
                btnNotes.classList.remove('active-notes');
                pdfContainer.style.flex = '1 1 100%';
                notepadContainer.style.flex = '0 0 0%';

                // Setup UI
                setupToolbar();
                setupResizer();
                setupDrawing();

                // Apply saved theme
                var saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        var data = JSON.parse(saved);
                        if (data.theme) {
                            applyTheme(data.theme);
                        }
                        if (data.notepadText !== undefined) {
                            notepadTextarea.value = data.notepadText;
                            updateNoteStats();
                        }
                        if (data.tool) {
                            setActiveTool(data.tool);
                        }
                        // Restore notepad visibility from saved state, but only if we have a PDF
                        // We'll apply it after PDF load
                        if (data.notepadVisible === true) {
                            isNotepadVisible = true;
                        } else {
                            isNotepadVisible = false;
                        }
                    } catch (e) { /* ignore */ }
                } else {
                    applyTheme('dark');
                }

                // Load any stored notes
                loadFromStorage();

                // Update stats
                updateNoteStats();

                console.log('✅ App initialized. Tool:', currentTool);
                console.log('📌 Default tool is SELECT (not pen).');
                console.log('📝 Notepad is HIDDEN by default.');
                console.log('📐 Resizer has pointer-events:auto & touch-action:none.');
                console.log('🎨 Theme engine ready (red-lined, purple-lined, dot-grid).');
                console.log('📄 PDF rendering uses IntersectionObserver with 600px margin.');
            }

            // ---- Start when DOM ready ----
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // ---- Also handle late-loading of PDF.js ----
            if (typeof pdfjsLib === 'undefined') {
                console.warn('PDF.js not loaded yet, will retry…');
                var checkPDF = setInterval(function() {
                    if (typeof pdfjsLib !== 'undefined') {
                        clearInterval(checkPDF);
                        console.log('PDF.js loaded.');
                    }
                }, 200);
            }

            // ---- Expose for debugging ----
            window.__APP = {
                currentTool: currentTool,
                pdfDoc: pdfDoc,
                totalPages: totalPages,
                annotations: annotations,
                notes: notes,
                isNotepadVisible: isNotepadVisible,
                setActiveTool: setActiveTool,
                applyTheme: applyTheme,
                saveToStorage: saveToStorage,
                loadFromStorage: loadFromStorage,
                renderAllPages: renderAllPages,
                renderPage: renderPage,
                toggleNotepad: toggleNotepad
            };

        })();
    </script>
</body>
</html>
