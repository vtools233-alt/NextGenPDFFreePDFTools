                notesCanvas.classList.toggle('gesture-active', isGesture);
                notesCanvas.classList.toggle('connect-active', isConnect);

                // Eraser cursor
                if (tool === 'eraser') {
                    pdfCanvas.classList.add('eraser-active');
                    notesCanvas.classList.add('eraser-active');
                } else {
                    pdfCanvas.classList.remove('eraser-active');
                    notesCanvas.classList.remove('eraser-active');
                }

                // Connector hint
                updateConnectorHint();

                // Cancel connect state if switching away
                if (tool !== 'connect' && connectState.active) {
                    connectState.active = false;
                    if (connectState.fromElement) {
                        connectState.fromElement.style.outline = '';
                    }
                    connectState.fromNoteId = null;
                    connectState.fromElement = null;
                    connectorHint.textContent = '🔗 Click a note to start, click another to connect';
                }

                // Cancel sticky creation if switching away
                if (stickyCreateState.active) {
                    stickyCreateState.active = false;
                    stickyCreationHint.style.display = 'none';
                }

                // Focus handling for textarea
                if (tool === 'select') {
                    notesTextarea.focus();
                    notesCanvas.classList.add('textarea-focused');
                } else {
                    notesCanvas.classList.remove('textarea-focused');
                }
            }

            // ---- Toggle Notepad ----
            function toggleNotepad(show) {
                if (show === undefined) {
                    notepadPopup.classList.toggle('visible');
                } else {
                    notepadPopup.classList.toggle('visible', show);
                }
                if (notepadPopup.classList.contains('visible')) {
                    setTimeout(() => {
                        resizeCanvases();
                        renderStickyNotes();
                        renderConnectors();
                    }, 50);
                    updatePageInfo();
                }
            }

            // ---- Export / Import ----
            function exportData() {
                const data = {
                    version: '1.0',
                    exportedAt: new Date().toISOString(),
                    notepads: notepads,
                    currentNotepadIndex: currentNotepadIndex,
                    stickyNotes: stickyNotes,
                    connectors: connectors,
                    nextNoteId: nextNoteId,
                    nextConnectorId: nextConnectorId,
                    pdfDrawings: {
                        strokes: pdfData.strokes,
                        highlights: pdfData.highlights,
                        undoStack: pdfData.undoStack,
                        redoStack: pdfData.redoStack,
                    },
                    pdfFileData: pdfFileData || null,
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `notes_backup_${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }

            function importData(file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.notepads) {
                            alert('Invalid backup file: missing notepads');
                            return;
                        }
                        // Restore
                        notepads = data.notepads;
                        currentNotepadIndex = data.currentNotepadIndex || 0;
                        stickyNotes = data.stickyNotes || [];
                        connectors = data.connectors || [];
                        nextNoteId = data.nextNoteId || 0;
                        nextConnectorId = data.nextConnectorId || 0;

                        if (data.pdfDrawings) {
                            pdfData.strokes = data.pdfDrawings.strokes || [];
                            pdfData.highlights = data.pdfDrawings.highlights || [];
                            pdfData.undoStack = data.pdfDrawings.undoStack || [];
                            pdfData.redoStack = data.pdfDrawings.redoStack || [];
                        }

                        if (data.pdfFileData) {
                            pdfFileData = data.pdfFileData;
                            localStorage.setItem('pdfFileData', pdfFileData);
                            try {
                                const binary = atob(pdfFileData);
                                const bytes = new Uint8Array(binary.length);
                                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                                loadPdfFromData(bytes, 'Imported PDF');
                            } catch (e) { console.warn('PDF restore failed', e); }
                        }

                        // Ensure current index is valid
                        if (currentNotepadIndex >= notepads.length) currentNotepadIndex = 0;

                        const notepad = getCurrentNotepad();
                        const page = notepad.pages[notepad.currentPage] || notepad.pages[0];
                        if (page) {
                            notesTextarea.value = page.text || '';
                            applyTemplateToPage(notepad.currentPage);
                        }
                        updateNotepadSelector();
                        updatePageInfo();
                        redrawAllStrokes('pdf');
                        redrawAllStrokes('notes');
                        renderStickyNotes();
                        renderConnectors();
                        saveToLocalStorage('notes');
                        saveToLocalStorage('pdf');
                        updateBadge('pdf');
                        updateBadge('notes');
                        alert('Import successful!');
                    } catch (e) {
                        alert('Invalid backup file: ' + e.message);
                    }
                };
                reader.readAsText(file);
            }

            // ---- Pointer Events ----
            function getPointerCoords(e, canvas) {
                const rect = canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            function attachPointerEvents(canvas, panel) {
                let pointerDown = false;

                canvas.addEventListener('pointerdown', (e) => {
                    // Handle different tools
                    if (state.tool === 'select') {
                        // Let textarea handle it
                        return;
                    }

                    if (state.tool === 'gesture') {
                        // Pan mode - but we don't have pan implemented fully, just a placeholder
                        gestureState.active = true;
                        gestureState.startX = e.clientX;
                        gestureState.startY = e.clientY;
                        canvas.setPointerCapture(e.pointerId);
                        return;
                    }

                    if (state.tool === 'connect') {
                        // Connect tool - handled by sticky note clicks
                        return;
                    }

                    if (state.tool === 'eraser' || state.tool === 'pen' || state.tool === 'highlighter') {
                        state.activePanel = panel;
                        const coords = getPointerCoords(e, canvas);
                        startStroke(panel, coords.x, coords.y);
                        canvas.setPointerCapture(e.pointerId);
                        pointerDown = true;
                    }
                });

                canvas.addEventListener('pointermove', (e) => {
                    if (state.tool === 'connect') return;
                    if (state.tool === 'select') return;

                    if (state.tool === 'gesture' && gestureState.active) {
                        // Simple pan simulation - move the canvas content
                        const dx = e.clientX - gestureState.startX;
                        const dy = e.clientY - gestureState.startY;
                        // For now just update offset and redraw
                        if (panel === 'pdf' && pdfDoc) {
                            // Simple pan: we'd need to re-render with offset
                            // For simplicity, just show it as a demo
                        }
                        return;
                    }

                    if (state.tool === 'eraser' || state.tool === 'pen' || state.tool === 'highlighter') {
                        const coords = getPointerCoords(e, canvas);
                        continueStroke(panel, coords.x, coords.y);
                    }
                });

                canvas.addEventListener('pointerup', (e) => {
                    if (state.tool === 'gesture' && gestureState.active) {
                        gestureState.active = false;
                        canvas.releasePointerCapture(e.pointerId);
                        return;
                    }

                    if (state.tool === 'eraser' || state.tool === 'pen' || state.tool === 'highlighter') {
                        if (pointerDown) {
                            endStroke(panel);
                            canvas.releasePointerCapture(e.pointerId);
                            pointerDown = false;
                        }
                    }
                });

                canvas.addEventListener('pointercancel', (e) => {
                    if (pointerDown) {
                        endStroke(panel);
                        canvas.releasePointerCapture(e.pointerId);
                        pointerDown = false;
                    }
                    if (gestureState.active) {
                        gestureState.active = false;
                        canvas.releasePointerCapture(e.pointerId);
                    }
                });
            }

            // ---- Sticky Creation Events on notesCanvas ----
            notesCanvas.addEventListener('pointerdown', (e) => {
                if (state.tool === 'select') {
                    // Check if click is on a sticky note via target
                    const target = document.elementFromPoint(e.clientX, e.clientY);
                    if (target && target.closest('.sticky-note')) return;
                    // Focus textarea
                    notesTextarea.focus();
                    return;
                }
                if (state.tool === 'connect') {
                    // Delegate to handleConnectClick
                    const target = document.elementFromPoint(e.clientX, e.clientY);
                    if (target && target.closest('.sticky-note')) {
                        handleConnectClick(e);
                    } else {
                        // Cancel connection on empty click
                        if (connectState.active) {
                            connectState.active = false;
                            if (connectState.fromElement) {
                                connectState.fromElement.style.outline = '';
                            }
                            connectState.fromNoteId = null;
                            connectState.fromElement = null;
                            connectorHint.textContent = '🔗 Click a note to start, click another to connect';
                            updateConnectorHint();
                        }
                    }
                    return;
                }

                // Sticky creation: only if tool is pen or highlighter and not on a sticky note
                if (state.tool === 'pen' || state.tool === 'highlighter' || state.tool === 'eraser') {
                    const target = document.elementFromPoint(e.clientX, e.clientY);
                    if (target && target.closest('.sticky-note')) return;
                    // Start sticky creation
                    startStickyCreation(e);
                    notesCanvas.setPointerCapture(e.pointerId);
                }
            });

            notesCanvas.addEventListener('pointermove', (e) => {
                if (stickyCreateState.active) {
                    moveStickyCreation(e);
                }
            });

            notesCanvas.addEventListener('pointerup', (e) => {
                if (stickyCreateState.active) {
                    endStickyCreation(e);
                    notesCanvas.releasePointerCapture(e.pointerId);
                }
            });

            notesCanvas.addEventListener('pointercancel', (e) => {
                if (stickyCreateState.active) {
                    stickyCreateState.active = false;
                    stickyCreationHint.style.display = 'none';
                    notesCanvas.releasePointerCapture(e.pointerId);
                }
            });

            // ---- Textarea focus handling ----
            notesTextarea.addEventListener('focus', () => {
                notesCanvas.classList.add('textarea-focused');
                // If tool is pen/highlighter/eraser, temporarily switch to select
                if (state.tool === 'pen' || state.tool === 'highlighter' || state.tool === 'eraser') {
                    // Don't auto-switch, but prevent drawing on canvas
                }
            });

            notesTextarea.addEventListener('blur', () => {
                notesCanvas.classList.remove('textarea-focused');
            });

            // ---- Event Listeners ----
            btnPen.addEventListener('click', () => setTool('pen'));
            btnHighlighter.addEventListener('click', () => setTool('highlighter'));
            btnEraser.addEventListener('click', () => setTool('eraser'));
            btnSelect.addEventListener('click', () => setTool('select'));
            btnGesture.addEventListener('click', () => setTool('gesture'));
            btnConnect.addEventListener('click', () => setTool('connect'));

            colorPicker.addEventListener('input', function() { state.color = this.value; });
            sizeSlider.addEventListener('input', function() {
                state.size = parseFloat(this.value);
                sizeLabel.textContent = state.size;
            });

            btnClear.addEventListener('click', () => {
                if (confirm('Clear all strokes on the current panel?')) {
                    clearAllStrokes(state.activePanel);
                }
            });
            btnUndo.addEventListener('click', () => undoLastStroke(state.activePanel));
            btnRedo.addEventListener('click', () => redoLastStroke(state.activePanel));

            btnOpenPdf.addEventListener('click', () => pdfUpload.click());
            btnClosePdf.addEventListener('click', closePdf);

            // ---- CRITICAL FIX: PDF Upload Handler ----
            pdfUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) {
                    return;
                }

                // Validate file type
                if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                    alert('Please select a valid PDF file.');
                    this.value = '';
                    return;
                }

                // Store filename for display
                pdfFileName = file.name;

                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        // Create a safe copy of the ArrayBuffer
                        const arrayBuffer = ev.target.result;
                        // Create a fresh Uint8Array from the ArrayBuffer
                        const uint8Array = new Uint8Array(arrayBuffer);

                        // Verify we have data
                        if (uint8Array.length === 0) {
                            alert('The selected PDF file appears to be empty.');
                            return;
                        }

                        // Store base64 for localStorage persistence
                        try {
                            let binary = '';
                            for (let i = 0; i < uint8Array.length; i++) {
                                binary += String.fromCharCode(uint8Array[i]);
                            }
                            pdfFileData = btoa(binary);
                            localStorage.setItem('pdfFileData', pdfFileData);
                        } catch (storageErr) {
                            console.warn('Could not store PDF in localStorage:', storageErr);
                            pdfFileData = null;
                        }

                        // Load the PDF using the safe copy
                        loadPdfFromData(uint8Array, pdfFileName);

                        // Reset the file input so the same file can be re-selected
                        pdfUpload.value = '';

                    } catch (err) {
                        console.error('Error processing PDF file:', err);
                        alert('Failed to process the PDF file: ' + (err.message || 'Unknown error'));
                        pdfUpload.value = '';
                    }
                };

                reader.onerror = function() {
                    alert('Failed to read the PDF file. Please try again.');
                    pdfUpload.value = '';
                };

                // Read as ArrayBuffer
                reader.readAsArrayBuffer(file);
            });

            btnToggleNotes.addEventListener('click', () => toggleNotepad());
            closeNotepad.addEventListener('click', () => toggleNotepad(false));

            prevPageBtn.addEventListener('click', () => goToPage(getCurrentNotepad().currentPage - 1));
            nextPageBtn.addEventListener('click', () => goToPage(getCurrentNotepad().currentPage + 1));

            addPageBtn.addEventListener('click', function() {
                const notepad = getCurrentNotepad();
                notepad.pages[notepad.currentPage].text = notesTextarea.value;
                notepad.pages.push({
                    strokes: [],
                    highlights: [],
                    text: '',
                    template: notepad.pages[notepad.currentPage].template,
                    undoStack: [],
                    redoStack: [],
                });
                notepad.currentPage = notepad.pages.length - 1;
                updatePageInfo();
                saveToLocalStorage('notes');
            });

            templateSelector.addEventListener('change', function() {
                const notepad = getCurrentNotepad();
                notepad.pages[notepad.currentPage].template = this.value;
                applyTemplateToPage(notepad.currentPage);
                saveToLocalStorage('notes');
            });

            let notesSaveTimeout = null;
            notesTextarea.addEventListener('input', function() {
                clearTimeout(notesSaveTimeout);
                notesSaveTimeout = setTimeout(() => {
                    const notepad = getCurrentNotepad();
                    notepad.pages[notepad.currentPage].text = this.value;
                    saveToLocalStorage('notes');
                }, 400);
            });

            notepadSelector.addEventListener('change', function() {
                switchNotepad(parseInt(this.value));
            });

            newNotepadBtn.addEventListener('click', createNewNotepadWithName);

            addStickyBtn.addEventListener('click', function() {
                // Create a sticky at a random position in the notepad
                const rect = notesContent.getBoundingClientRect();
                const x = 20 + Math.random() * (rect.width - 160);
                const y = 20 + Math.random() * (rect.height - 100);
                createStickyNote(x, y, 'Double-click to edit');
                setTool('select');
            });

            btnExport.addEventListener('click', exportData);

            btnImport.addEventListener('click', () => importFileInput.click());

            importFileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                importData(file);
                this.value = '';
            });

            // Fullscreen
            btnFullscreen.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    document.body.classList.add('is-fullscreen');
                } else {
                    document.exitFullscreen().catch(() => {});
                    document.body.classList.remove('is-fullscreen');
                }
            });

            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement) {
                    document.body.classList.remove('is-fullscreen');
                } else {
                    document.body.classList.add('is-fullscreen');
                }
            });

            // ---- Window Resize ----
            let resizeTimeout = null;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    resizeCanvases();
                    renderStickyNotes();
                    renderConnectors();
                }, 150);
            });

            // ---- Popup Drag ----
            let dragData = null;
            notepadHeader.addEventListener('pointerdown', function(e) {
                if (e.target.closest('.controls')) return;
                const rect = notepadPopup.getBoundingClientRect();
                dragData = { offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
                notepadPopup.setPointerCapture(e.pointerId);
            });

            document.addEventListener('pointermove', function(e) {
                if (!dragData) return;
                const parentRect = mainContainer.getBoundingClientRect();
                let left = e.clientX - parentRect.left - dragData.offsetX;
                let top = e.clientY - parentRect.top - dragData.offsetY;
                left = Math.max(0, Math.min(left, parentRect.width - notepadPopup.offsetWidth));
                top = Math.max(0, Math.min(top, parentRect.height - notepadPopup.offsetHeight));
                notepadPopup.style.left = left + 'px';
                notepadPopup.style.top = top + 'px';
                notepadPopup.style.right = 'auto';
            });

            document.addEventListener('pointerup', function(e) {
                if (dragData) {
                    dragData = null;
                    notepadPopup.releasePointerCapture(e.pointerId);
                }
            });

            // ---- Init ----
            function init() {
                loadFromLocalStorage();
                loadStoredPdf();

                // Default: notepad hidden, tool set to pen
                // notepadPopup is already hidden via CSS (display:none)
                // Ensure it stays hidden on load
                notepadPopup.classList.remove('visible');

                setTimeout(() => {
                    resizeCanvases();
                    setTool('pen');
                    updateBadge('pdf');
                    updateBadge('notes');
                    renderStickyNotes();
                    renderConnectors();
                    updateConnectorHint();
                }, 100);

                // Attach pointer events after setup
                attachPointerEvents(pdfCanvas, 'pdf');
                attachPointerEvents(notesCanvas, 'notes');
            }

            init();

            // Expose for debugging
            window.__app = {
                notepads,
                stickyNotes,
                connectors,
                pdfData,
                createStickyNote,
                deleteStickyNote,
                exportData,
                importData,
                loadPdfFromData,
                closePdf,
            };

        })();
    </script>
</body>
</html>
