<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF Viewer & Workspace</title>
  
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary-accent: #2563eb;
      --primary-accent-hover: #1d4ed8;
      --active-bg: #eff6ff;
      --active-border: #3b82f6;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-primary);
      color: var(--text-main);
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* TOP TOOLBAR STYLES WITH HORIZONTAL SCROLL & RESPONSIVE TOUCH SUPPORT */
    #top-toolbar {
      height: 55px;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      gap: 10px !important;
      white-space: nowrap !important;
      padding: 0 15px !important;
      -webkit-overflow-scrolling: touch !important;
      z-index: 500;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      width: 100vw;
      -ms-overflow-style: none; /* IE and Edge */
      scrollbar-width: none; /* Firefox */
    }

    #top-toolbar::-webkit-scrollbar {
      display: none !important; /* Hide scrollbar for Chrome, Safari, Opera */
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0 !important;
    }

    .toolbar-divider {
      height: 24px;
      width: 1px;
      background-color: var(--border-color);
      margin: 0 2px;
      flex-shrink: 0 !important;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0 !important;
    }

    .btn:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-primary {
      background-color: var(--primary-accent);
      color: #ffffff;
      border-color: var(--primary-accent);
    }

    .btn-primary:hover {
      background-color: var(--primary-accent-hover);
      border-color: var(--primary-accent-hover);
    }

    .btn-tool {
      padding: 8px;
      min-width: 36px;
      height: 36px;
      flex-shrink: 0 !important;
    }

    .btn-tool.active {
      background-color: var(--active-bg);
      border-color: var(--active-border);
      color: var(--primary-accent);
    }

    .tool-group {
      display: flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
      border: 1px solid var(--border-color);
      flex-shrink: 0 !important;
    }

    .tool-group .btn-tool {
      border: none;
      border-radius: 5px;
      background: transparent;
    }

    .tool-group .btn-tool.active {
      background-color: #ffffff;
      box-shadow: var(--shadow-sm);
      color: var(--primary-accent);
    }

    #doc-info {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0 !important;
    }

    .control-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      flex-shrink: 0 !important;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
      flex-shrink: 0 !important;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      flex-shrink: 0 !important;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--border-color);
      border-radius: 50%;
    }

    input[type="range"] {
      width: 70px;
      accent-color: var(--primary-accent);
      cursor: pointer;
      flex-shrink: 0 !important;
    }

    /* MAIN CONTENT WORKSPACE (NON-OVERLAPPING FLEX LAYOUT) */
    #main-workspace {
      display: flex !important;
      flex-direction: row !important;
      width: 100% !important;
      height: calc(100vh - 55px) !important;
      overflow: hidden !important;
      position: relative !important;
      touch-action: none;
    }

    /* UNIFIED GLOBAL TRANSPARENT DRAWING OVERLAY */
    #global-drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
      touch-action: none;
    }

    /* PDF VIEWPORT CONTAINER */
    #pdf-view-wrapper {
      flex: 1 1 100%;
      width: 100%;
      height: 100% !important;
      overflow-y: auto !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      background-color: #f1f5f9;
      position: relative;
      display: block !important;
      padding: 24px 0 80px 0;
      box-sizing: border-box;
      min-width: 0;
      will-change: width, flex-basis;
      touch-action: pan-x pan-y;
    }

    #pdf-container {
      width: 100% !important;
      min-height: 100%;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 28px;
      margin: 0 auto;
      transform-origin: top center;
      transition: transform 0.05s ease-out;
    }

    /* VERTICAL RESIZER BAR */
    #resizer {
      width: 8px;
      height: 100%;
      background-color: var(--border-color);
      cursor: col-resize;
      flex-shrink: 0 !important;
      user-select: none;
      touch-action: none;
      z-index: 30;
      display: none;
      position: relative;
      transition: background-color 0.15s ease;
    }

    #resizer:hover, #resizer.active {
      background-color: var(--primary-accent);
    }

    #resizer::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 24px;
      background-color: #94a3b8;
      border-radius: 1px;
    }

    #resizer:hover::after, #resizer.active::after {
      background-color: #ffffff;
    }

    /* PAGE CARD STYLES */
    .pdf-page-card {
      position: relative;
      background-color: #ffffff;
      box-shadow: var(--shadow-md);
      border-radius: 4px;
      min-height: 850px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
      flex-shrink: 0;
      transition: box-shadow 0.2s ease;
    }

    .pdf-page-card:hover {
      box-shadow: var(--shadow-lg);
    }

    .page-number-indicator {
      position: absolute;
      top: -22px;
      left: 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .canvas-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    .pdf-canvas {
      display: block;
      position: relative;
      z-index: 1;
    }

    /* INITIAL EMPTY STATE */
    #empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      background: #ffffff;
      padding: 40px 60px;
      border-radius: 12px;
      border: 2px dashed #cbd5e1;
      box-shadow: var(--shadow-sm);
    }

    #empty-state svg {
      width: 48px;
      height: 48px;
      stroke: var(--text-muted);
    }

    #empty-state h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }

    #empty-state p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 300px;
    }

    /* NOTEPAD SPLIT VIEW SIDEBAR (SIDE-BY-SIDE FLEX CHILD) */
    #notepad-pane {
      display: none;
      width: 0%;
      flex: 0 0 0%;
      height: 100%;
      background-color: #ffffff;
      border-left: 1px solid var(--border-color);
      flex-direction: column;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.05);
      z-index: 20;
      overflow: hidden;
      flex-shrink: 0 !important;
      position: relative !important;
      min-width: 0;
      will-change: width, flex-basis;
    }

    #notepad-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
    }

    #notepad-header h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .notepad-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #notepad-editor-container {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      position: relative;
    }

    #notepad-editor {
      width: 100%;
      height: 100%;
      min-height: 100%;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      background: transparent;
      color: #1e293b;
      font-family: inherit;
    }

    /* NOTEPAD BACKGROUND TEMPLATES */
    .bg-red-lined {
      background-color: #ffffff;
      background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
      background-size: 100% 32px;
      line-height: 32px !important;
      border-left: 3px solid #f87171 !important;
      padding-left: 16px !important;
    }

    .bg-purple-lined {
      background-color: #ffffff;
      background-image: linear-gradient(#f3e8ff 1px, transparent 1px);
      background-size: 100% 32px;
      line-height: 32px !important;
      border-left: 3px solid #c084fc !important;
      padding-left: 16px !important;
    }

    .bg-dot-grid {
      background-color: #ffffff;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      line-height: 24px !important;
      padding-left: 12px !important;
    }

    /* CUSTOM PAGE TEMPLATE BACKGROUND STYLES FOR APPENDED PAGES */
    .page-template-white {
      background-color: #ffffff;
    }

    .page-template-lined-white {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 100% 32px;
    }

    .page-template-yellow-blank {
      background-color: #fef9c3;
    }

    .page-template-yellow-lined {
      background-color: #fef9c3;
      background-image: linear-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 100% 32px;
    }

    .page-template-dot-grid {
      background-color: #ffffff;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    /* MODAL POP-UP STYLES FOR ADD PAGE */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-content {
      background-color: #ffffff;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }

    .modal-close-btn:hover {
      color: var(--text-main);
      background-color: #e2e8f0;
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-section h4 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .modal-action-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      justify-content: center;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .template-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .template-option:hover {
      border-color: var(--primary-accent);
      background-color: var(--active-bg);
    }

    .template-preview {
      width: 100%;
      height: 60px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .template-option span {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      text-align: center;
    }

    .bg-template-white { background-color: #ffffff; }
    .bg-template-lined-white {
      background-color: #ffffff;
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 100% 16px;
    }
    .bg-template-yellow-blank { background-color: #fef9c3; }
    .bg-template-yellow-lined {
      background-color: #fef9c3;
      background-image: linear-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 100% 16px;
    }
    .bg-template-dot-grid {
      background-color: #ffffff;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 12px 12px;
    }
  </style>
</head>
<body>

  <!-- TOP TOOLBAR -->
  <header id="top-toolbar">
    <!-- File Section -->
    <div class="toolbar-section">
      <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;" />
      <button class="btn btn-primary" id="btn-open-pdf">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        Open PDF
      </button>

      <!-- Case + Button & Input for Multi-PDF Appending -->
      <input type="file" id="case-plus-input" accept="application/pdf" multiple style="display: none;" />
      <button class="btn" id="btn-case-plus" title="Append single or multiple supplementary PDFs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Case +
      </button>

      <span id="doc-info">No file selected</span>

      <!-- + Page Button & Input for Camera / Gallery -->
      <button class="btn" id="btn-add-page" title="Insert Camera/Gallery Scan or Blank Template Page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        + Page
      </button>
      <input type="file" id="camera-gallery-input" accept="image/*" capture="environment" style="display: none;">
    </div>

    <div class="toolbar-divider"></div>

    <!-- Drawing Tools -->
    <div class="toolbar-section">
      <div class="tool-group">
        <button class="btn btn-tool active" id="tool-select" title="Selection / Scroll Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"></path></svg>
        </button>
        <button class="btn btn-tool" id="tool-pen" title="Pen Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
        </button>
        <button class="btn btn-tool" id="tool-highlighter" title="Highlighter Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11-6 6v3h3l6-6"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></svg>
        </button>
        <button class="btn btn-tool" id="tool-eraser" title="Eraser Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
        </button>
      </div>

      <!-- Color & Line Settings -->
      <div class="color-picker-wrapper">
        <span class="control-label">Color:</span>
        <input type="color" id="picker-color" value="#1e293b" title="Stroke Color" />
      </div>

      <div class="color-picker-wrapper">
        <span class="control-label">Size:</span>
        <input type="range" id="slider-size" min="1" max="25" value="3" title="Stroke Thickness" />
      </div>

      <button class="btn" id="btn-clear-page" title="Clear Screen Annotations">
        Clear Page
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Zoom Controls -->
    <div class="toolbar-section">
      <button class="btn btn-tool" id="btn-zoom-out" title="Zoom Out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <span id="zoom-label" class="control-label" style="min-width: 42px; text-align: center;">135%</span>
      <button class="btn btn-tool" id="btn-zoom-in" title="Zoom In">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Export & Notepad Toggles -->
    <div class="toolbar-section">
      <button class="btn" id="btn-toggle-notepad">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"></path><path d="M15 3v6h6"></path></svg>
        Notepad
      </button>

      <button class="btn" id="btn-export-pdf" title="Save annotated PDF">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Save
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div id="main-workspace">
    
    <!-- UNIFIED GLOBAL TRANSPARENT DRAWING OVERLAY -->
    <canvas id="global-drawing-canvas"></canvas>

    <!-- PDF CONTINUOUS SCROLL VIEWPORT CONTAINER -->
    <main id="pdf-view-wrapper">
      <div id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        <h3>No Document Loaded</h3>
        <p>Click "Open PDF" to load a file, "Case +" to append documents, or "+ Page" to add custom page templates.</p>
      </div>

      <div id="pdf-container"></div>
    </main>

    <!-- VERTICAL RESIZER DIVIDER BAR -->
    <div id="resizer" title="Drag to resize workspace"></div>

    <!-- NOTEPAD SIDEBAR (SIDE-BY-SIDE FLEX CHILD) -->
    <aside id="notepad-pane">
      <div id="notepad-header">
        <h4>Workspace Notepad</h4>
        <div class="notepad-controls">
          <select id="notepad-bg-select" class="btn" style="padding: 4px 8px; font-size: 12px;">
            <option value="bg-red-lined">Red Lined</option>
            <option value="bg-purple-lined">Purple Lined</option>
            <option value="bg-dot-grid">Dot Grid</option>
          </select>
          <button class="btn btn-tool" id="btn-close-notepad" title="Close Notepad">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>
      <div id="notepad-editor-container" class="bg-red-lined">
        <textarea id="notepad-editor" placeholder="Type your notes here..."></textarea>
      </div>
    </aside>

  </div>

  <!-- ADD PAGE MODAL POP-UP -->
  <div id="add-page-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Insert New Page</h3>
        <button id="btn-close-modal" class="modal-close-btn" title="Close">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Option 1: Camera / Gallery Scan -->
        <div class="modal-section">
          <h4>From Camera / Photo</h4>
          <button class="btn btn-primary modal-action-btn" id="btn-trigger-camera">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            Gallery / Camera
          </button>
        </div>

        <!-- Option 2: Custom Page Templates -->
        <div class="modal-section">
          <h4>Custom Page Templates</h4>
          <div class="template-grid">
            <button class="template-option" data-template="white">
              <div class="template-preview bg-template-white"></div>
              <span>Plain White Page</span>
            </button>
            <button class="template-option" data-template="lined-white">
              <div class="template-preview bg-template-lined-white"></div>
              <span>Lined White Paper</span>
            </button>
            <button class="template-option" data-template="yellow-blank">
              <div class="template-preview bg-template-yellow-blank"></div>
              <span>Light Yellow Blank</span>
            </button>
            <button class="template-option" data-template="yellow-lined">
              <div class="template-preview bg-template-yellow-lined"></div>
              <span>Light Yellow Lined</span>
            </button>
            <button class="template-option" data-template="dot-grid">
              <div class="template-preview bg-template-dot-grid"></div>
              <span>Dot Grid Page</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configure PDF.js Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Application State - Multi-Document & Multi-Page Architecture
    let loadedDocs = []; // Array of objects: { pdfDoc, fileName, numPages, startPageGlobal, endPageGlobal }
    let totalPages = 0;
    
    let currentScale = 1.35; // Ideal size scale for clear full-width display
    let currentTool = 'select'; // Neutral default state
    let penColor = '#1e293b';
    let highlighterColor = 'rgba(250, 204, 21, 0.4)';
    let strokeWidth = 3;
    
    let intersectionObserver = null;

    // DOM Elements
    const fileInput = document.getElementById('pdf-file-input');
    const btnOpenPdf = document.getElementById('btn-open-pdf');
    const casePlusInput = document.getElementById('case-plus-input');
    const btnCasePlus = document.getElementById('btn-case-plus');
    const btnAddPage = document.getElementById('btn-add-page');
    const cameraGalleryInput = document.getElementById('camera-gallery-input');
    const addPageModal = document.getElementById('add-page-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnTriggerCamera = document.getElementById('btn-trigger-camera');
    const docInfo = document.getElementById('doc-info');
    
    const mainWorkspace = document.getElementById('main-workspace');
    const globalCanvas = document.getElementById('global-drawing-canvas');
    const globalCtx = globalCanvas.getContext('2d');
    const pdfContainer = document.getElementById('pdf-container');
    const emptyState = document.getElementById('empty-state');
    const pdfViewWrapper = document.getElementById('pdf-view-wrapper');
    const notepadPane = document.getElementById('notepad-pane');
    const resizer = document.getElementById('resizer');
    const btnToggleNotepad = document.getElementById('btn-toggle-notepad');
    const btnCloseNotepad = document.getElementById('btn-close-notepad');
    const notepadBgSelect = document.getElementById('notepad-bg-select');
    const notepadEditorContainer = document.getElementById('notepad-editor-container');
    const notepadEditor = document.getElementById('notepad-editor');
    
    const toolSelect = document.getElementById('tool-select');
    const toolPen = document.getElementById('tool-pen');
    const toolHighlighter = document.getElementById('tool-highlighter');
    const toolEraser = document.getElementById('tool-eraser');
    const pickerColor = document.getElementById('picker-color');
    const sliderSize = document.getElementById('slider-size');
    const btnClearPage = document.getElementById('btn-clear-page');
    
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const zoomLabel = document.getElementById('zoom-label');
    const btnExportPdf = document.getElementById('btn-export-pdf');

    // UNIFIED VECTOR STROKE STORAGE SYSTEM
    let strokeDataStore = [];
    let activeStroke = null;
    let isDrawingOnGlobalCanvas = false;

    // MULTI-TOUCH PINCH TO EXCLUSIVELY RESIZE WORKSPACE WIDTHS STATE
    let isPinching = false;
    let initialPinchDistance = 0;
    let initialPdfRatio = 50; // percentage width for PDF wrapper
    let pinchCenterPane = 'pdf'; // 'pdf' or 'notepad'
    let pinchRafId = null;
    const activePointerMap = new Map();

    // SYNCHRONIZE GLOBAL CANVAS DIMENSIONS TO WORKSPACE
    function resizeGlobalCanvas() {
      const rect = mainWorkspace.getBoundingClientRect();
      if (globalCanvas.width !== rect.width || globalCanvas.height !== rect.height) {
        globalCanvas.width = rect.width;
        globalCanvas.height = rect.height;
        redrawGlobalStrokes();
      }
    }

    // DYNAMIC VECTOR REDRAW SYSTEM
    function redrawGlobalStrokes() {
      globalCtx.clearRect(0, 0, globalCanvas.width, globalCanvas.height);

      strokeDataStore.forEach(stroke => {
        if (!stroke.points || stroke.points.length < 2) return;

        globalCtx.save();
        globalCtx.beginPath();
        globalCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++) {
          globalCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
        }

        if (stroke.tool === 'pen') {
          globalCtx.globalCompositeOperation = 'source-over';
          globalCtx.strokeStyle = stroke.color;
          globalCtx.lineWidth = stroke.width;
          globalCtx.lineCap = 'round';
          globalCtx.lineJoin = 'round';
        } else if (stroke.tool === 'highlighter') {
          globalCtx.globalCompositeOperation = 'source-over';
          globalCtx.strokeStyle = stroke.color;
          globalCtx.lineWidth = stroke.width * 4;
          globalCtx.lineCap = 'square';
          globalCtx.lineJoin = 'miter';
        } else if (stroke.tool === 'eraser') {
          globalCtx.globalCompositeOperation = 'destination-out';
          globalCtx.lineWidth = stroke.width * 6;
          globalCtx.lineCap = 'round';
          globalCtx.lineJoin = 'round';
        }

        globalCtx.stroke();
        globalCtx.restore();
      });
    }

    function getGlobalCoords(e) {
      const rect = globalCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // CONTINUOUS UNBROKEN CROSS-SCREEN DRAWING TRACKER
    function startGlobalStroke(e) {
      if (currentTool === 'select' || isPinching) return;
      if (e.touches && e.touches.length > 1) return;
      
      e.preventDefault();
      
      if (e.pointerId && globalCanvas.setPointerCapture) {
        try { globalCanvas.setPointerCapture(e.pointerId); } catch(err) {}
      }

      isDrawingOnGlobalCanvas = true;
      const coords = getGlobalCoords(e);

      activeStroke = {
        tool: currentTool,
        color: currentTool === 'highlighter' ? highlighterColor : penColor,
        width: strokeWidth,
        points: [coords]
      };

      strokeDataStore.push(activeStroke);
    }

    function drawGlobalStroke(e) {
      if (!isDrawingOnGlobalCanvas || !activeStroke || currentTool === 'select' || isPinching) return;
      if (e.touches && e.touches.length > 1) return;
      e.preventDefault();

      const coords = getGlobalCoords(e);
      const lastPoint = activeStroke.points[activeStroke.points.length - 1];

      activeStroke.points.push(coords);

      globalCtx.save();
      globalCtx.beginPath();
      globalCtx.moveTo(lastPoint.x, lastPoint.y);
      globalCtx.lineTo(coords.x, coords.y);

      if (currentTool === 'pen') {
        globalCtx.globalCompositeOperation = 'source-over';
        globalCtx.strokeStyle = penColor;
        globalCtx.lineWidth = strokeWidth;
        globalCtx.lineCap = 'round';
        globalCtx.lineJoin = 'round';
      } else if (currentTool === 'highlighter') {
        globalCtx.globalCompositeOperation = 'source-over';
        globalCtx.strokeStyle = highlighterColor;
        globalCtx.lineWidth = strokeWidth * 4;
        globalCtx.lineCap = 'square';
        globalCtx.lineJoin = 'miter';
      } else if (currentTool === 'eraser') {
        globalCtx.globalCompositeOperation = 'destination-out';
        globalCtx.lineWidth = strokeWidth * 6;
        globalCtx.lineCap = 'round';
        globalCtx.lineJoin = 'round';
      }

      globalCtx.stroke();
      globalCtx.restore();
    }

    function stopGlobalStroke(e) {
      if (isDrawingOnGlobalCanvas) {
        isDrawingOnGlobalCanvas = false;
        activeStroke = null;
        if (e && e.pointerId && globalCanvas.releasePointerCapture) {
          try { globalCanvas.releasePointerCapture(e.pointerId); } catch(err) {}
        }
      }
    }

    // BIND POINTER/TOUCH/STYLUS STREAMS DIRECTLY TO GLOBAL OVERLAY
    globalCanvas.addEventListener('pointerdown', startGlobalStroke);
    globalCanvas.addEventListener('pointermove', drawGlobalStroke);
    globalCanvas.addEventListener('pointerup', stopGlobalStroke);
    globalCanvas.addEventListener('pointercancel', stopGlobalStroke);

    globalCanvas.addEventListener('touchstart', startGlobalStroke, { passive: false });
    globalCanvas.addEventListener('touchmove', drawGlobalStroke, { passive: false });
    globalCanvas.addEventListener('touchend', stopGlobalStroke);

    window.addEventListener('resize', resizeGlobalCanvas);
    window.addEventListener('DOMContentLoaded', resizeGlobalCanvas);

    // =========================================================================
    // CO-DEPENDENT AUTO-COMPRESSING SIDE-BY-SIDE FLEXBOX LAYOUT (FRAME-LOCKED)
    // =========================================================================

    function updateWorkspaceWidths(pdfRatioPct) {
      const isNotepadOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
      if (!isNotepadOpen) return;

      if (pinchRafId) {
        cancelAnimationFrame(pinchRafId);
      }

      pinchRafId = requestAnimationFrame(() => {
        const clampedPdfRatio = Math.max(15, Math.min(85, pdfRatioPct));
        const notepadRatioPct = 100 - clampedPdfRatio;

        pdfViewWrapper.style.width = `${clampedPdfRatio}%`;
        pdfViewWrapper.style.flex = `0 0 ${clampedPdfRatio}%`;

        notepadPane.style.width = `${notepadRatioPct}%`;
        notepadPane.style.flex = `0 0 ${notepadRatioPct}%`;

        resizeGlobalCanvas();
      });
    }

    // Multi-touch Gesture Handlers for Workspace Width Adjustments
    function handleWorkspaceTouchStart(e) {
      if (e.touches && e.touches.length === 2) {
        const isNotepadOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
        if (!isNotepadOpen) return;

        isPinching = true;

        if (isDrawingOnGlobalCanvas) {
          isDrawingOnGlobalCanvas = false;
          if (activeStroke) {
            strokeDataStore.pop();
            activeStroke = null;
            redrawGlobalStrokes();
          }
        }

        const t1 = e.touches[0];
        const t2 = e.touches[1];
        initialPinchDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

        const workspaceRect = mainWorkspace.getBoundingClientRect();
        const pdfRect = pdfViewWrapper.getBoundingClientRect();
        initialPdfRatio = (pdfRect.width / workspaceRect.width) * 100;

        const centerX = (t1.clientX + t2.clientX) / 2;
        const resizerRect = resizer.getBoundingClientRect();

        if (resizerRect.width > 0 && centerX > resizerRect.left) {
          pinchCenterPane = 'notepad';
        } else {
          pinchCenterPane = 'pdf';
        }
      }
    }

    function handleWorkspaceTouchMove(e) {
      if (isPinching && e.touches && e.touches.length === 2) {
        e.preventDefault();

        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const currentDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

        if (initialPinchDistance > 0) {
          const factor = currentDistance / initialPinchDistance;
          let targetPdfRatio = initialPdfRatio;

          if (pinchCenterPane === 'pdf') {
            targetPdfRatio = initialPdfRatio * factor;
          } else {
            const initialNotepadRatio = 100 - initialPdfRatio;
            const targetNotepadRatio = initialNotepadRatio * factor;
            targetPdfRatio = 100 - targetNotepadRatio;
          }

          updateWorkspaceWidths(targetPdfRatio);
        }
      }
    }

    function handleWorkspaceTouchEnd(e) {
      if (isPinching && (!e.touches || e.touches.length < 2)) {
        isPinching = false;
        if (pinchRafId) {
          cancelAnimationFrame(pinchRafId);
          pinchRafId = null;
        }
      }
    }

    // Pointer Events Multi-Touch Stream Fallback
    mainWorkspace.addEventListener('pointerdown', (e) => {
      activePointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointerMap.size === 2) {
        const isNotepadOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
        if (!isNotepadOpen) return;

        isPinching = true;
        if (isDrawingOnGlobalCanvas) {
          isDrawingOnGlobalCanvas = false;
          if (activeStroke) {
            strokeDataStore.pop();
            activeStroke = null;
            redrawGlobalStrokes();
          }
        }

        const pts = Array.from(activePointerMap.values());
        initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        
        const workspaceRect = mainWorkspace.getBoundingClientRect();
        const pdfRect = pdfViewWrapper.getBoundingClientRect();
        initialPdfRatio = (pdfRect.width / workspaceRect.width) * 100;

        const centerX = (pts[0].x + pts[1].x) / 2;
        const resizerRect = resizer.getBoundingClientRect();
        if (resizerRect.width > 0 && centerX > resizerRect.left) {
          pinchCenterPane = 'notepad';
        } else {
          pinchCenterPane = 'pdf';
        }
      }
    });

    mainWorkspace.addEventListener('pointermove', (e) => {
      if (activePointerMap.has(e.pointerId)) {
        activePointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }

      if (isPinching && activePointerMap.size === 2) {
        const pts = Array.from(activePointerMap.values());
        const currentDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);

        if (initialPinchDistance > 0) {
          const factor = currentDistance / initialPinchDistance;
          let targetPdfRatio = initialPdfRatio;

          if (pinchCenterPane === 'pdf') {
            targetPdfRatio = initialPdfRatio * factor;
          } else {
            const initialNotepadRatio = 100 - initialPdfRatio;
            const targetNotepadRatio = initialNotepadRatio * factor;
            targetPdfRatio = 100 - targetNotepadRatio;
          }

          updateWorkspaceWidths(targetPdfRatio);
        }
      }
    });

    const releasePointerFromMap = (e) => {
      activePointerMap.delete(e.pointerId);
      if (activePointerMap.size < 2) {
        isPinching = false;
      }
    };

    mainWorkspace.addEventListener('pointerup', releasePointerFromMap);
    mainWorkspace.addEventListener('pointercancel', releasePointerFromMap);

    mainWorkspace.addEventListener('touchstart', handleWorkspaceTouchStart, { passive: false });
    mainWorkspace.addEventListener('touchmove', handleWorkspaceTouchMove, { passive: false });
    mainWorkspace.addEventListener('touchend', handleWorkspaceTouchEnd, { passive: false });
    mainWorkspace.addEventListener('touchcancel', handleWorkspaceTouchEnd, { passive: false });

    // =========================================================================
    // MULTI-DOCUMENT ACCUMULATION ENGINE & PAGE RENDER MAPPING
    // =========================================================================

    function updateDocSummaryLabel() {
      if (loadedDocs.length === 0) {
        docInfo.textContent = totalPages > 0 ? `Custom Workspace (${totalPages} ${totalPages === 1 ? 'page' : 'pages'})` : 'No file selected';
      } else if (loadedDocs.length === 1) {
        docInfo.textContent = `${loadedDocs[0].fileName} (${totalPages} ${totalPages === 1 ? 'page' : 'pages'})`;
      } else {
        docInfo.textContent = `${loadedDocs.length} Cases (${totalPages} pages total)`;
      }
    }

    function getTargetDocForGlobalPage(globalPageNum) {
      for (let i = 0; i < loadedDocs.length; i++) {
        const docEntry = loadedDocs[i];
        if (globalPageNum >= docEntry.startPageGlobal && globalPageNum <= docEntry.endPageGlobal) {
          return {
            pdfDoc: docEntry.pdfDoc,
            internalPageNum: globalPageNum - docEntry.startPageGlobal + 1
          };
        }
      }
      return null;
    }

    function updateAllPageIndicators() {
      const indicators = pdfContainer.querySelectorAll('.page-number-indicator');
      indicators.forEach((indicator, index) => {
        indicator.textContent = `PAGE ${index + 1} OF ${totalPages}`;
      });
    }

    function initIntersectionObserver() {
      if (intersectionObserver) {
        intersectionObserver.disconnect();
      }

      intersectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageCard = entry.target;
            const pageNum = parseInt(pageCard.dataset.pageNum, 10);
            if (pageCard.dataset.rendered !== 'true') {
              renderSinglePage(pageNum, pageCard);
            }
          }
        });
      }, {
        root: pdfViewWrapper,
        rootMargin: '600px 0px',
        threshold: 0.01
      });
    }

    function appendPageCardsForRange(startPage, endPage) {
      if (!intersectionObserver) {
        initIntersectionObserver();
      }

      for (let i = startPage; i <= endPage; i++) {
        const pageCard = document.createElement('div');
        pageCard.className = 'pdf-page-card';
        pageCard.dataset.pageNum = i;
        pageCard.style.minHeight = '850px';

        const pageIndicator = document.createElement('div');
        pageIndicator.className = 'page-number-indicator';
        pageIndicator.textContent = `PAGE ${i} OF ${totalPages}`;

        const canvasWrapper = document.createElement('div');
        canvasWrapper.className = 'canvas-wrapper';

        const pdfCanvas = document.createElement('canvas');
        pdfCanvas.className = 'pdf-canvas';

        canvasWrapper.appendChild(pdfCanvas);
        pageCard.appendChild(pageIndicator);
        pageCard.appendChild(canvasWrapper);

        pdfContainer.appendChild(pageCard);

        intersectionObserver.observe(pageCard);
      }

      updateAllPageIndicators();
    }

    // SINGLE PAGE RENDERER USING GLOBAL-TO-INTERNAL PAGE MAPPING
    function renderSinglePage(globalPageNum, pageCard) {
      const docTarget = getTargetDocForGlobalPage(globalPageNum);
      if (!docTarget || pageCard.dataset.rendering === 'true') return;
      
      pageCard.dataset.rendering = 'true';

      docTarget.pdfDoc.getPage(docTarget.internalPageNum).then(page => {
        const viewport = page.getViewport({ scale: currentScale });
        const pdfCanvas = pageCard.querySelector('.pdf-canvas');
        const canvasWrapper = pageCard.querySelector('.canvas-wrapper');

        const pdfCtx = pdfCanvas.getContext('2d');

        pdfCanvas.height = viewport.height;
        pdfCanvas.width = viewport.width;

        canvasWrapper.style.width = `${viewport.width}px`;
        canvasWrapper.style.height = `${viewport.height}px`;
        
        pageCard.style.width = `${viewport.width}px`;
        pageCard.style.height = `${viewport.height}px`;
        pageCard.style.minHeight = `${viewport.height}px`;

        const renderContext = {
          canvasContext: pdfCtx,
          viewport: viewport
        };

        page.render(renderContext).promise.then(() => {
          pageCard.dataset.rendered = 'true';
          pageCard.dataset.rendering = 'false';
        }).catch(err => {
          console.error(`Page ${globalPageNum} render error:`, err);
          pageCard.dataset.rendering = 'false';
        });
      }).catch(err => {
        console.error(`Fetch page ${globalPageNum} error:`, err);
        pageCard.dataset.rendering = 'false';
      });
    }

    // Helper function to resolve optimal dimensions for newly added blank/image pages
    function getStandardPageDimensions() {
      const existingCard = pdfContainer.querySelector('.pdf-page-card');
      if (existingCard && existingCard.offsetWidth > 0) {
        return {
          width: existingCard.offsetWidth,
          height: existingCard.offsetHeight || Math.round(existingCard.offsetWidth * 1.3)
        };
      }
      const defaultWidth = Math.round(612 * currentScale);
      const defaultHeight = Math.round(792 * currentScale);
      return { width: defaultWidth, height: defaultHeight };
    }

    // =========================================================================
    // MODAL CONTROL & "+ PAGE" INSERTION ENGINE
    // =========================================================================

    btnAddPage.addEventListener('click', () => {
      addPageModal.style.display = 'flex';
    });

    function closeModal() {
      addPageModal.style.display = 'none';
    }

    btnCloseModal.addEventListener('click', closeModal);
    addPageModal.addEventListener('click', (e) => {
      if (e.target === addPageModal) closeModal();
    });

    // OPTION 1: CAMERA / GALLERY ATTACHMENT HANDLER
    btnTriggerCamera.addEventListener('click', () => {
      cameraGalleryInput.value = '';
      cameraGalleryInput.click();
    });

    cameraGalleryInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          if (emptyState) emptyState.style.display = 'none';

          totalPages++;
          const dims = getStandardPageDimensions();

          const pageCard = document.createElement('div');
          pageCard.className = 'pdf-page-card';
          pageCard.dataset.pageNum = totalPages;
          pageCard.dataset.rendered = 'true';
          pageCard.style.width = `${dims.width}px`;
          pageCard.style.height = `${dims.height}px`;
          pageCard.style.minHeight = `${dims.height}px`;

          const pageIndicator = document.createElement('div');
          pageIndicator.className = 'page-number-indicator';
          pageIndicator.textContent = `PAGE ${totalPages} OF ${totalPages}`;

          const canvasWrapper = document.createElement('div');
          canvasWrapper.className = 'canvas-wrapper';
          canvasWrapper.style.width = '100%';
          canvasWrapper.style.height = '100%';
          canvasWrapper.style.display = 'flex';
          canvasWrapper.style.alignItems = 'center';
          canvasWrapper.style.justifyContent = 'center';
          canvasWrapper.style.overflow = 'hidden';

          const imgElem = document.createElement('img');
          imgElem.src = event.target.result;
          imgElem.style.maxWidth = '100%';
          imgElem.style.maxHeight = '100%';
          imgElem.style.objectFit = 'contain';

          canvasWrapper.appendChild(imgElem);
          pageCard.appendChild(pageIndicator);
          pageCard.appendChild(canvasWrapper);

          pdfContainer.appendChild(pageCard);

          updateAllPageIndicators();
          updateDocSummaryLabel();
          redrawGlobalStrokes();
          closeModal();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // OPTION 2: CUSTOM PAGE TEMPLATES HANDLER
    document.querySelectorAll('.template-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const templateType = btn.dataset.template;
        if (!templateType) return;

        if (emptyState) emptyState.style.display = 'none';

        totalPages++;
        const dims = getStandardPageDimensions();

        const pageCard = document.createElement('div');
        pageCard.className = 'pdf-page-card';
        pageCard.dataset.pageNum = totalPages;
        pageCard.dataset.rendered = 'true';
        pageCard.style.width = `${dims.width}px`;
        pageCard.style.height = `${dims.height}px`;
        pageCard.style.minHeight = `${dims.height}px`;

        const pageIndicator = document.createElement('div');
        pageIndicator.className = 'page-number-indicator';
        pageIndicator.textContent = `PAGE ${totalPages} OF ${totalPages}`;

        const canvasWrapper = document.createElement('div');
        canvasWrapper.className = `canvas-wrapper page-template-${templateType}`;
        canvasWrapper.style.width = '100%';
        canvasWrapper.style.height = '100%';

        pageCard.appendChild(pageIndicator);
        pageCard.appendChild(canvasWrapper);

        pdfContainer.appendChild(pageCard);

        updateAllPageIndicators();
        updateDocSummaryLabel();
        redrawGlobalStrokes();
        closeModal();
      });
    });

    // =========================================================================
    // FILE OPEN AND CASE + MULTI-APPENDING HANDLERS
    // =========================================================================

    // "OPEN PDF" BUTTON (Clears and loads fresh single document)
    btnOpenPdf.addEventListener('click', () => {
      fileInput.value = '';
      fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const safeBuffer = event.target.result.slice(0);

          pdfjsLib.getDocument({ data: safeBuffer }).promise.then(function(pdf) {
            // Reset existing document array and layout
            loadedDocs = [];
            totalPages = pdf.numPages;

            loadedDocs.push({
              pdfDoc: pdf,
              fileName: file.name,
              numPages: pdf.numPages,
              startPageGlobal: 1,
              endPageGlobal: pdf.numPages
            });

            updateDocSummaryLabel();

            hideNotepad();
            setTool('select');

            strokeDataStore = [];
            resizeGlobalCanvas();

            if (emptyState) emptyState.style.display = 'none';

            pdfContainer.innerHTML = '';
            initIntersectionObserver();
            appendPageCardsForRange(1, totalPages);

            const firstPageCard = pdfContainer.querySelector('[data-page-num="1"]');
            if (firstPageCard) {
              renderSinglePage(1, firstPageCard);
            }
          }).catch(function(error) {
            console.error('Error loading PDF:', error);
            alert('Failed to parse the selected PDF file.');
          });
        } catch (err) {
          console.error('Buffer processing error:', err);
        }
      };

      reader.readAsArrayBuffer(file);
    });

    // "CASE +" BUTTON (Appends single or multiple supplementary PDFs seamlessly)
    btnCasePlus.addEventListener('click', () => {
      casePlusInput.value = '';
      casePlusInput.click();
    });

    casePlusInput.addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files || files.length === 0) return;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
          const buffer = await file.arrayBuffer();
          const safeBuffer = buffer.slice(0);
          const pdf = await pdfjsLib.getDocument({ data: safeBuffer }).promise;

          const startPage = totalPages + 1;
          const numPages = pdf.numPages;
          const endPage = totalPages + numPages;
          totalPages = endPage;

          loadedDocs.push({
            pdfDoc: pdf,
            fileName: file.name,
            numPages: numPages,
            startPageGlobal: startPage,
            endPageGlobal: endPage
          });

          if (emptyState) emptyState.style.display = 'none';

          appendPageCardsForRange(startPage, endPage);

          const newlyAppendedCard = pdfContainer.querySelector(`[data-page-num="${startPage}"]`);
          if (newlyAppendedCard) {
            renderSinglePage(startPage, newlyAppendedCard);
          }
        } catch (err) {
          console.error(`Error appending file ${file.name}:`, err);
          alert(`Failed to append document: ${file.name}`);
        }
      }

      updateDocSummaryLabel();
      redrawGlobalStrokes();
    });

    // =========================================================================
    // INDEPENDENT TOOLBAR ZOOM ENGINE
    // =========================================================================

    function applyZoom(newScale) {
      currentScale = Math.min(Math.max(newScale, 0.5), 3.0);
      zoomLabel.textContent = `${Math.round(currentScale * 100)}%`;

      const pageCards = document.querySelectorAll('.pdf-page-card');
      pageCards.forEach(card => {
        if (card.querySelector('.pdf-canvas')) {
          card.dataset.rendered = 'false';
        } else {
          // Resize blank / custom image pages dynamically on zoom
          const dims = getStandardPageDimensions();
          card.style.width = `${dims.width}px`;
          card.style.height = `${dims.height}px`;
          card.style.minHeight = `${dims.height}px`;
        }
      });

      pageCards.forEach(card => {
        if (card.querySelector('.pdf-canvas')) {
          const rect = card.getBoundingClientRect();
          if (rect.top < window.innerHeight * 2 && rect.bottom > -window.innerHeight) {
            const pageNum = parseInt(card.dataset.pageNum, 10);
            renderSinglePage(pageNum, card);
          }
        }
      });

      redrawGlobalStrokes();
    }

    btnZoomIn.addEventListener('click', () => applyZoom(currentScale + 0.15));
    btnZoomOut.addEventListener('click', () => applyZoom(currentScale - 0.15));

    // TOOL SELECTION CONTROLLER
    function setTool(tool) {
      currentTool = tool;

      toolSelect.classList.toggle('active', tool === 'select');
      toolPen.classList.toggle('active', tool === 'pen');
      toolHighlighter.classList.toggle('active', tool === 'highlighter');
      toolEraser.classList.toggle('active', tool === 'eraser');

      if (tool === 'select') {
        globalCanvas.style.pointerEvents = 'none';
      } else {
        globalCanvas.style.pointerEvents = 'auto';
        globalCanvas.style.cursor = 'crosshair';
      }
    }

    toolSelect.addEventListener('click', () => setTool('select'));
    toolPen.addEventListener('click', () => setTool('pen'));
    toolHighlighter.addEventListener('click', () => setTool('highlighter'));
    toolEraser.addEventListener('click', () => setTool('eraser'));

    pickerColor.addEventListener('input', (e) => {
      penColor = e.target.value;
      const hex = e.target.value;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      highlighterColor = `rgba(${r}, ${g}, ${b}, 0.35)`;
    });

    sliderSize.addEventListener('input', (e) => {
      strokeWidth = parseInt(e.target.value, 10);
    });

    btnClearPage.addEventListener('click', () => {
      strokeDataStore = [];
      redrawGlobalStrokes();
    });

    // RESIZER DRAG CONTROLLER
    let isResizing = false;

    function startResizing(e) {
      isResizing = true;
      resizer.classList.add('active');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';

      if (e.pointerId && resizer.setPointerCapture) {
        try { resizer.setPointerCapture(e.pointerId); } catch(err) {}
      }
    }

    function handleResizeMove(e) {
      if (!isResizing) return;

      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      if (clientX === undefined) return;

      const windowWidth = window.innerWidth;
      let pdfWidthPct = (clientX / windowWidth) * 100;
      updateWorkspaceWidths(pdfWidthPct);
    }

    function stopResizing(e) {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';

        if (e && e.pointerId && resizer.releasePointerCapture) {
          try { resizer.releasePointerCapture(e.pointerId); } catch(err) {}
        }
      }
    }

    resizer.addEventListener('pointerdown', startResizing);
    window.addEventListener('pointermove', handleResizeMove);
    window.addEventListener('pointerup', stopResizing);
    window.addEventListener('pointercancel', stopResizing);

    resizer.addEventListener('touchstart', startResizing, { passive: false });
    window.addEventListener('touchmove', handleResizeMove, { passive: false });
    window.addEventListener('touchend', stopResizing);
    window.addEventListener('touchcancel', stopResizing);

    // =========================================================================
    // STRICT BUTTON-DRIVEN TOGGLE ONLY FOR NOTEPAD PANE
    // =========================================================================
    function hideNotepad() {
      notepadPane.style.display = 'none';
      notepadPane.style.width = '0%';
      notepadPane.style.flex = '0 0 0%';

      resizer.style.display = 'none';

      pdfViewWrapper.style.width = '100%';
      pdfViewWrapper.style.flex = '1 1 100%';

      btnToggleNotepad.classList.remove('active');
      resizeGlobalCanvas();
    }

    function showNotepad() {
      notepadPane.style.display = 'flex';
      notepadPane.style.width = '50%';
      notepadPane.style.flex = '0 0 50%';

      resizer.style.display = 'block';

      pdfViewWrapper.style.width = '50%';
      pdfViewWrapper.style.flex = '0 0 50%';

      btnToggleNotepad.classList.add('active');
      resizeGlobalCanvas();
    }

    btnToggleNotepad.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = notepadPane.style.display === 'none' || getComputedStyle(notepadPane).display === 'none';
      if (isHidden) {
        showNotepad();
      } else {
        hideNotepad();
      }
    });

    btnCloseNotepad.addEventListener('click', (e) => {
      e.stopPropagation();
      hideNotepad();
    });

    notepadBgSelect.addEventListener('change', (e) => {
      notepadEditorContainer.className = e.target.value;
    });

    // SAVE / EXPORT ANNOTATED WORKSPACE SNAPSHOT
    btnExportPdf.addEventListener('click', () => {
      if (totalPages === 0) {
        alert('Please open a PDF document or insert a page first.');
        return;
      }

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = mainWorkspace.clientWidth;
      tempCanvas.height = mainWorkspace.clientHeight;
      const ctx = tempCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

      ctx.drawImage(globalCanvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'annotated-workspace.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    });

    // INITIALIZATION STATE (STRICTLY HIDDEN NOTEPAD ON BOOT)
    hideNotepad();
    resizeGlobalCanvas();
  </script>
</body>
</html>
