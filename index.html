<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF & Notepad Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
        }

        /* Toolbar Header */
        .toolbar {
            height: 50px;
            background-color: #1e293b;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            z-index: 10;
            position: relative;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .doc-info {
            font-size: 14px;
            color: #cbd5e1;
            margin-left: auto;
        }

        /* Workspace Container */
        .workspace {
            display: flex;
            width: 100vw;
            height: calc(100vh - 50px);
            position: relative;
            overflow: hidden;
        }

        /* Canvas Overlay for Connecting Lines */
        #globalCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* PDF Section */
        .pdf-container {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .empty-state {
            margin-auto: auto;
            text-align: center;
            color: #64748b;
            margin-top: 150px;
        }

        .pdf-page-card {
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 600px;
            height: 800px;
            position: relative;
            border-radius: 4px;
        }

        /* Resizer Line */
        .resizer {
            width: 6px;
            background-color: #cbd5e1;
            cursor: col-resize;
            z-index: 8;
            display: none;
        }

        /* Notepad Panel */
        .notepad-pane {
            width: 380px;
            background-color: #ffffff;
            border-left: 1px solid #e2e8f0;
            display: none;
            flex-direction: column;
            position: relative;
            z-index: 6;
        }

        .notepad-header {
            height: 40px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-weight: bold;
        }

        .notepad-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            position: relative;
        }

        .notepad-page-wrapper {
            min-height: 100%;
            position: relative;
        }

        /* Link Markers & Scans */
        .notepad-link-marker, .notepad-scan-container {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: grab;
            user-select: none;
            z-index: 7;
        }

        .notepad-link-marker:active {
            cursor: grabbing;
        }

        /* Notification Toast */
        .mode-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #0f172a;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 20;
        }

        .mode-status.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Header / Toolbar -->
    <div class="toolbar">
        <button id="btnOpenPdf" class="btn">PDF खोलें</button>
        <button id="btnToggleNotepad" class="btn btn-secondary">नोटपैड टॉगल करें</button>
        <input type="file" id="fileInput" accept="application/pdf" style="display: none;" />
        <span id="docInfo" class="doc-info">कोई फ़ाइल चयनित नहीं है</span>
    </div>

    <!-- Main Workspace -->
    <div id="mainWorkspace" class="workspace">
        <canvas id="globalCanvas"></canvas>

        <!-- PDF Section -->
        <div id="pdfContainer" class="pdf-container">
            <div id="emptyState" class="empty-state">
                <h2>कोई दस्तावेज़ नहीं खुला है</h2>
                <p>प्रारंभ करने के लिए ऊपर "PDF खोलें" बटन पर क्लिक करें।</p>
            </div>
        </div>

        <!-- Resizer -->
        <div id="resizer" class="resizer"></div>

        <!-- Notepad Section -->
        <div id="notepadPane" class="notepad-pane">
            <div class="notepad-header">
                <span>नोटपैड</span>
                <button id="btnCloseNotepad" style="background:none; border:none; cursor:pointer; font-size:16px;">✕</button>
            </div>
            <div class="notepad-body">
                <div id="notepadPageWrapper" class="notepad-page-wrapper">
                    <!-- नोटपैड कंटेंट और लिंक मार्कर्स यहाँ आएँगे -->
                </div>
            </div>
        </div>
    </div>

    <!-- Status Toast -->
    <div id="modeStatus" class="mode-status"></div>

    <script>
        // ================================================================
        // GLOBAL VARIABLES & STATE
        // ================================================================
        let notepadDragState = null;
        let currentNotepadIndex = 0;
        let linkData = []; // लिंक डेटा की सूची [{id, sourceType, sourcePageNum, sourceX, sourceY, targetType, targetNotepadIndex, color}]

        // DOM Element Elements
        const mainWorkspace = document.getElementById('mainWorkspace');
        const globalCanvas = document.getElementById('globalCanvas');
        const globalCtx = globalCanvas ? globalCanvas.getContext('2d') : null;
        const pdfContainer = document.getElementById('pdfContainer');
        const notepadPane = document.getElementById('notepadPane');
        const resizer = document.getElementById('resizer');
        const btnOpenPdf = document.getElementById('btnOpenPdf');
        const btnToggleNotepad = document.getElementById('btnToggleNotepad');
        const btnCloseNotepad = document.getElementById('btnCloseNotepad');
        const fileInput = document.getElementById('fileInput');
        const docInfo = document.getElementById('docInfo');
        const emptyState = document.getElementById('emptyState');
        const modeStatus = document.getElementById('modeStatus');

        // ================================================================
        // HELPER UTILITIES
        // ================================================================
        function getWorkspaceRect() {
            return mainWorkspace ? mainWorkspace.getBoundingClientRect() : { left: 0, top: 0 };
        }

        function getNotepadPageWrapper(index) {
            return document.getElementById('notepadPageWrapper');
        }

        function renderNotepadPages() {
            const wrapper = getNotepadPageWrapper(currentNotepadIndex);
            if (!wrapper) return;
            
            // यदि कोई मार्कर नहीं है तो टेस्ट के लिए डिफ़ॉल्ट मार्कर बनाना
            if (wrapper.children.length === 0 && linkData.length > 0) {
                linkData.forEach(link => {
                    const marker = document.createElement('div');
                    marker.className = 'notepad-link-marker';
                    marker.dataset.linkId = link.id;
                    marker.textContent = '●';
                    marker.style.left = '50px';
                    marker.style.top = '50px';
                    
                    marker.addEventListener('pointerdown', (e) => {
                        notepadDragState = {
                            marker: marker,
                            linkId: link.id,
                            ghost: null
                        };
                        marker.style.opacity = '0.5';
                        if (marker.setPointerCapture) marker.setPointerCapture(e.pointerId);
                    });

                    wrapper.appendChild(marker);
                });
            }
        }

        // ================================================================
        // MARKER POINTER EVENTS & DRAG LOGIC
        // ================================================================
        function onNotepadMarkerPointerMove(e) {
            if (!notepadDragState) return;
            e.preventDefault();
            const state = notepadDragState;
            
            if (state.ghost) {
                state.ghost.style.left = `${e.clientX}px`;
                state.ghost.style.top = `${e.clientY}px`;
            }
            
            const markerParent = state.marker.parentElement;
            if (!markerParent) return;

            const parentRect = markerParent.getBoundingClientRect();
            const newX = e.clientX - parentRect.left;
            const newY = e.clientY - parentRect.top;

            state.marker.style.left = `${newX}px`;
            state.marker.style.top = `${newY}px`;

            state.marker.dataset.contentX = newX;
            state.marker.dataset.contentY = newY;
            
            redrawGlobalStrokes();
        }

        function onNotepadMarkerPointerUp(e) {
            if (!notepadDragState) return;
            e.preventDefault();
            const state = notepadDragState;

            if (state.ghost && state.ghost.parentElement) {
                state.ghost.remove();
            }

            state.marker.style.opacity = '1';
            state.marker.style.transform = '';
            document.body.style.userSelect = '';
            document.body.style.cursor = '';

            if (e.pointerId !== undefined && state.marker.releasePointerCapture) {
                try { 
                    state.marker.releasePointerCapture(e.pointerId); 
                } catch (err) {
                    console.warn('Pointer capture release failed:', err);
                }
            }

            notepadDragState = null;
            redrawGlobalStrokes();
        }

        // ================================================================
        // CANVAS CONNECTOR STROKE RENDERER
        // ================================================================
        function redrawGlobalStrokes() {
            if (!globalCanvas || !globalCtx || !mainWorkspace) return;

            globalCanvas.width = mainWorkspace.clientWidth;
            globalCanvas.height = mainWorkspace.clientHeight;
            globalCtx.clearRect(0, 0, globalCanvas.width, globalCanvas.height);

            const wsRect = getWorkspaceRect();

            if (!Array.isArray(linkData)) return;

            linkData.forEach(link => {
                let p1 = null;
                let p2 = null;

                // PDF स्रोत स्थिति की गणना
                if (link.sourceType === 'pdf' && pdfContainer) {
                    const card = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${link.sourcePageNum}"]`);
                    if (card) {
                        const cardRect = card.getBoundingClientRect();
                        p1 = { 
                            x: cardRect.left - wsRect.left + (link.sourceX || 0), 
                            y: cardRect.top - wsRect.top + (link.sourceY || 0) 
                        };
                    }
                } else if (link.sourceType === 'notepad' && link.sourceNotepadIndex === currentNotepadIndex) {
                    const wrapper = getNotepadPageWrapper(currentNotepadIndex);
                    if (wrapper) {
                        const marker = wrapper.querySelector(`.notepad-link-marker[data-link-id="${link.id}"]`) ||
                                       wrapper.querySelector(`.notepad-scan-container[data-link-id="${link.id}"]`);
                        if (marker) {
                            const rect = marker.getBoundingClientRect();
                            p1 = { x: rect.left - wsRect.left + rect.width / 2, y: rect.top - wsRect.top + rect.height / 2 };
                        }
                    }
                }

                // नोटपैड लक्ष्य स्थिति की गणना
                if (link.targetType === 'notepad' && link.targetNotepadIndex === currentNotepadIndex) {
                    const wrapper = getNotepadPageWrapper(currentNotepadIndex);
                    if (wrapper) {
                        const marker = wrapper.querySelector(`.notepad-link-marker[data-link-id="${link.id}"]`) ||
                                       wrapper.querySelector(`.notepad-scan-container[data-link-id="${link.id}"]`);
                        if (marker) {
                            const rect = marker.getBoundingClientRect();
                            p2 = { x: rect.left - wsRect.left + rect.width / 2, y: rect.top - wsRect.top + rect.height / 2 };
                        }
                    }
                }

                // कर्व रेखा खींचना
                if (p1 && p2) {
                    globalCtx.beginPath();
                    globalCtx.moveTo(p1.x, p1.y);
                    globalCtx.bezierCurveTo(p1.x + 60, p1.y, p2.x - 60, p2.y, p2.x, p2.y);
                    globalCtx.strokeStyle = link.color || '#2563eb';
                    globalCtx.lineWidth = 2;
                    globalCtx.setLineDash([5, 4]);
                    globalCtx.stroke();
                    globalCtx.setLineDash([]);
                }
            });
        }

        // ================================================================
        // UI INITIALIZATION & SAFE EVENT BINDINGS
        // ================================================================
        function updateModeStatus(msg) {
            if (!modeStatus) return;
            modeStatus.textContent = msg;
            modeStatus.classList.add('visible');
            setTimeout(() => modeStatus.classList.remove('visible'), 2500);
        }

        // Global Event Listeners
        window.addEventListener('pointermove', onNotepadMarkerPointerMove);
        window.addEventListener('pointerup', onNotepadMarkerPointerUp);
        window.addEventListener('resize', redrawGlobalStrokes);

        if (pdfContainer) {
            pdfContainer.addEventListener('scroll', redrawGlobalStrokes);
        }

        // File Handler Listeners
        if (btnOpenPdf && fileInput) {
            btnOpenPdf.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (file) {
                    if (docInfo) docInfo.textContent = file.name;
                    if (emptyState) emptyState.style.display = 'none';
                    
                    // सिमुलेशन के लिए एक खाली कार्ड जोड़ना
                    const card = document.createElement('div');
                    card.className = 'pdf-page-card';
                    card.dataset.pageNum = '1';
                    card.innerHTML = `<p style="padding:20px; color:#64748b;">PDF पृष्ठ 1 (${file.name})</p>`;
                    pdfContainer.appendChild(card);

                    // सैंपल लिंक जोड़ना (कनेक्शन चेक करने हेतु)
                    linkData = [{
                        id: 'link-1',
                        sourceType: 'pdf',
                        sourcePageNum: 1,
                        sourceX: 100,
                        sourceY: 100,
                        targetType: 'notepad',
                        targetNotepadIndex: 0,
                        color: '#2563eb'
                    }];

                    renderNotepadPages();
                    updateModeStatus(`लोड किया गया: ${file.name}`);
                    setTimeout(redrawGlobalStrokes, 100);
                }
            });
        }

        // Notepad Panel Controls
        if (btnToggleNotepad && notepadPane) {
            btnToggleNotepad.addEventListener('click', () => {
                const isHidden = notepadPane.style.display === 'none' || !notepadPane.style.display;
                notepadPane.style.display = isHidden ? 'flex' : 'none';
                if (resizer) resizer.style.display = isHidden ? 'block' : 'none';
                if (isHidden) {
                    renderNotepadPages();
                }
                setTimeout(redrawGlobalStrokes, 100);
            });
        }

        if (btnCloseNotepad && notepadPane) {
            btnCloseNotepad.addEventListener('click', () => {
                notepadPane.style.display = 'none';
                if (resizer) resizer.style.display = 'none';
                redrawGlobalStrokes();
            });
        }

        // Initial Boot
        renderNotepadPages();
    </script>
</body>
</html>
