                marker.dataset.contentX = contentX;
                marker.dataset.contentY = contentY;
                applyScrollOffsetToMarker(marker);
            };

            const onUp = () => {
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);
                if (ghost.parentNode) ghost.remove();
                marker.style.opacity = '1';

                const link = linkData.find(l => l.id === linkId);
                if (link) {
                    link.targetX = parseFloat(marker.dataset.contentX);
                    link.targetY = parseFloat(marker.dataset.contentY);
                    saveNotepadState(currentActivePage);
                }
                redrawGlobalStrokes();
            };

            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onUp);
        }

        globalCanvas.addEventListener('mousedown', (e) => {
            if (activeToolMode === 'pointer') startGlobalStroke(e);
            else startLinkStroke(e);
        });
        globalCanvas.addEventListener('mousemove', (e) => {
            if (activeToolMode === 'pointer') drawGlobalStroke(e);
            else drawLinkStroke(e);
        });
        globalCanvas.addEventListener('mouseup', (e) => {
            if (activeToolMode === 'pointer') stopGlobalStroke(e);
            else stopLinkStroke(e);
        });

        globalCanvas.addEventListener('touchstart', (e) => {
            if (activeToolMode === 'pointer') startGlobalStroke(e);
            else startLinkStroke(e);
        }, { passive: false });
        globalCanvas.addEventListener('touchmove', (e) => {
            if (activeToolMode === 'pointer') drawGlobalStroke(e);
            else drawLinkStroke(e);
        }, { passive: false });
        globalCanvas.addEventListener('touchend', (e) => {
            if (activeToolMode === 'pointer') stopGlobalStroke(e);
            else stopLinkStroke(e);
        });

        btnOpenPdf.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        btnCasePlus.addEventListener('click', () => casePlusInput.click());
        casePlusInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(f => loadPdf(f, true));
        });

        async function loadPdf(fileOrUrl, append = false) {
            try {
                let arrayBuffer;
                if (fileOrUrl instanceof File) {
                    arrayBuffer = await fileOrUrl.arrayBuffer();
                    docInfo.textContent = fileOrUrl.name;
                } else {
                    arrayBuffer = fileOrUrl;
                }

                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                if (!append) {
                    pdfContainer.innerHTML = '';
                    totalPages = 0;
                    loadedDocs = [];
                    globalStrokes = [];
                    linkData = [];
                }

                loadedDocs.push(pdf);
                emptyState.style.display = 'none';

                for (let i = 1; i <= pdf.numPages; i++) {
                    totalPages++;
                    const pageNum = totalPages;
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: currentScale });

                    const card = document.createElement('div');
                    card.className = 'pdf-page-card';
                    card.dataset.pageNum = pageNum;
                    card.style.width = viewport.width + 'px';
                    card.style.height = viewport.height + 'px';

                    const indicator = document.createElement('div');
                    indicator.className = 'page-number-indicator';
                    indicator.textContent = `PAGE ${pageNum}`;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'canvas-wrapper';

                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-canvas';
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: ctx, viewport }).promise;

                    const textLayer = createPageTextLayer();
                    wrapper.appendChild(canvas);
                    wrapper.appendChild(textLayer);
                    card.appendChild(indicator);
                    card.appendChild(wrapper);

                    pdfContainer.appendChild(card);
                }

                updatePadCounterAndSelect();
                redrawGlobalStrokes();
            } catch (err) {
                alert('Error loading PDF: ' + err.message);
            }
        }

        function createPageTextLayer() {
            const textLayer = document.createElement('div');
            textLayer.className = 'page-text-layer';
            if (activeToolMode !== 'pointer') textLayer.classList.add('block-events');
            return textLayer;
        }

        btnAddPage.addEventListener('click', () => { addPageModal.style.display = 'flex'; });
        btnCloseModal.addEventListener('click', () => { addPageModal.style.display = 'none'; });

        document.querySelectorAll('.template-option').forEach(btn => {
            btn.addEventListener('click', function() {
                const template = this.dataset.template;
                addPageModal.style.display = 'none';
                addNewTemplatePage(template);
            });
        });

        function addNewTemplatePage(templateStyle) {
            const dims = getStandardPageDimensions();
            const pageCard = document.createElement('div');
            pageCard.className = 'pdf-page-card';
            totalPages++;
            pageCard.dataset.pageNum = totalPages;
            pageCard.style.width = dims.width + 'px';
            pageCard.style.height = dims.height + 'px';

            const indicator = document.createElement('div');
            indicator.className = 'page-number-indicator';
            indicator.textContent = `PAGE ${totalPages}`;

            const wrapper = document.createElement('div');
            wrapper.className = `canvas-wrapper page-template-${templateStyle}`;
            wrapper.style.width = '100%';
            wrapper.style.height = '100%';

            const textLayer = createPageTextLayer();
            wrapper.appendChild(textLayer);
            pageCard.appendChild(indicator);
            pageCard.appendChild(wrapper);

            emptyState.style.display = 'none';
            pdfContainer.appendChild(pageCard);
            updatePadCounterAndSelect();
        }

        btnTriggerCamera.addEventListener('click', () => cameraOnlyInput.click());
        btnTriggerGallery.addEventListener('click', () => galleryOnlyInput.click());

        [cameraOnlyInput, galleryOnlyInput].forEach(input => {
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        addPageModal.style.display = 'none';
                        addImagePage(evt.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        function addImagePage(imgSrc) {
            const img = new Image();
            img.onload = () => {
                const dims = getStandardPageDimensions();
                const pageCard = document.createElement('div');
                pageCard.className = 'pdf-page-card';
                totalPages++;
                pageCard.dataset.pageNum = totalPages;
                pageCard.style.width = dims.width + 'px';
                pageCard.style.height = dims.height + 'px';

                const indicator = document.createElement('div');
                indicator.className = 'page-number-indicator';
                indicator.textContent = `PAGE ${totalPages}`;

                const wrapper = document.createElement('div');
                wrapper.className = 'canvas-wrapper';

                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-canvas';
                canvas.width = dims.width;
                canvas.height = dims.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, dims.width, dims.height);

                const textLayer = createPageTextLayer();
                wrapper.appendChild(canvas);
                wrapper.appendChild(textLayer);
                pageCard.appendChild(indicator);
                pageCard.appendChild(wrapper);

                emptyState.style.display = 'none';
                pdfContainer.appendChild(pageCard);
                updatePadCounterAndSelect();
            };
            img.src = imgSrc;
        }

        function toggleNotepad() {
            if (notepadPane.style.display === 'none' || !notepadPane.style.display) {
                notepadPane.style.display = 'flex';
                notepadPane.style.width = '40%';
                notepadPane.style.flex = '0 0 40%';
                resizer.style.display = 'block';
                pdfViewWrapper.style.flex = '1 1 60%';
            } else {
                notepadPane.style.display = 'none';
                resizer.style.display = 'none';
                pdfViewWrapper.style.flex = '1 1 100%';
            }
            redrawGlobalStrokes();
        }

        btnToggleNotepad.addEventListener('click', toggleNotepad);
        btnCloseNotepad.addEventListener('click', toggleNotepad);

        notepadBgSelect.addEventListener('change', function() {
            notepadEditorContainer.className = this.value;
            saveNotepadState(currentActivePage);
        });

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerWidth = mainWorkspace.clientWidth;
            const newNotepadWidth = ((containerWidth - e.clientX) / containerWidth) * 100;
            if (newNotepadWidth > 15 && newNotepadWidth < 70) {
                notepadPane.style.width = `${newNotepadWidth}%`;
                notepadPane.style.flex = `0 0 ${newNotepadWidth}%`;
                pdfViewWrapper.style.flex = `1 1 ${100 - newNotepadWidth}%`;
                redrawGlobalStrokes();
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = '';
            }
        });

        btnZoomIn.addEventListener('click', () => adjustZoom(0.15));
        btnZoomOut.addEventListener('click', () => adjustZoom(-0.15));

        function adjustZoom(delta) {
            currentScale = Math.max(0.5, Math.min(3.0, currentScale + delta));
            zoomLabel.textContent = `${Math.round(currentScale * 100)}%`;
            redrawGlobalStrokes();
        }

        pdfViewWrapper.addEventListener('scroll', onPdfScroll);
        notepadEditorContainer.addEventListener('scroll', updateAllOverlayMarkers);

        btnExportPdf.addEventListener('click', () => {
            alert('Document workspace saved successfully.');
        });

        window.addEventListener('resize', redrawGlobalStrokes);
    </script>
</body>
</html>
