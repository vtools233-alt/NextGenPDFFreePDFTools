<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Viewer & Workspace</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <style>
        /* ===== CSS (same as before, with additions for new UI) ===== */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-accent: #2563eb;
            --primary-accent-hover: #1d4ed8;
            --active-bg: #eff6ff;
            --active-border: #3b82f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --toolbar-height: 55px;
            --link-color: #2563eb;
            --link-highlight: rgba(37, 99, 235, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-main);
            touch-action: none;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        #top-toolbar {
            position: relative;
            width: 100%;
            height: var(--toolbar-height);
            z-index: 1000;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 10px;
            white-space: nowrap;
            padding: 0 15px;
            -webkit-overflow-scrolling: touch;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #top-toolbar::-webkit-scrollbar {
            display: none;
        }

        .toolbar-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .toolbar-divider {
            height: 24px;
            width: 1px;
            background-color: var(--border-color);
            margin: 0 2px;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .btn-primary {
            background-color: var(--primary-accent);
            color: #ffffff;
            border-color: var(--primary-accent);
        }

        .btn-primary:hover {
            background-color: var(--primary-accent-hover);
            border-color: var(--primary-accent-hover);
        }

        .btn-success {
            background-color: #16a34a;
            color: #ffffff;
            border-color: #16a34a;
        }

        .btn-success:hover {
            background-color: #15803d;
            border-color: #15803d;
        }

        .btn-tool {
            padding: 8px;
            min-width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .btn-tool.active {
            background-color: var(--active-bg);
            border-color: var(--active-border);
            color: var(--primary-accent);
        }

        .tool-group {
            display: flex;
            background: #f1f5f9;
            padding: 3px;
            border-radius: 8px;
            gap: 2px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .tool-group .btn-tool {
            border: none;
            border-radius: 5px;
            background: transparent;
        }

        .tool-group .btn-tool.active {
            background-color: #ffffff;
            box-shadow: var(--shadow-sm);
            color: var(--primary-accent);
        }

        #doc-info {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .control-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 4px;
            flex-shrink: 0;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            flex-shrink: 0;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border-color);
            border-radius: 50%;
        }

        input[type="range"] {
            width: 70px;
            accent-color: var(--primary-accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        #main-workspace {
            display: flex;
            flex-direction: row;
            width: 100%;
            flex: 1;
            height: calc(100vh - var(--toolbar-height));
            overflow: hidden;
            position: relative;
            touch-action: none;
            background-color: #f1f5f9;
        }

        #global-drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            touch-action: none;
        }

        #pdf-view-wrapper {
            flex: 1 1 100%;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #f1f5f9;
            position: relative;
            display: block;
            padding: 24px 0 80px 0;
            box-sizing: border-box;
            min-width: 0;
            touch-action: pan-x pan-y;
            will-change: width, flex-basis;
            transition: width 0.08s ease-out, flex-basis 0.08s ease-out;
        }

        #pdf-container {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            margin: 0 auto;
            transform-origin: top center;
            will-change: transform;
            transition: transform 0.08s ease-out;
        }

        #notepad-pane {
            display: none;
            width: 0%;
            flex: 0 0 0%;
            height: 100%;
            background-color: #ffffff;
            border-left: none;
            flex-direction: column;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.04);
            z-index: 20;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            min-width: 0;
            background-color: #f1f5f9;
            will-change: width, flex-basis;
            transition: width 0.08s ease-out, flex-basis 0.08s ease-out;
        }

        #notepad-editor-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            position: relative;
            background-color: #ffffff;
        }

        /* ---- MARKER OVERLAY (absolutely positioned on top of the text) ---- */
        #notepad-marker-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        /* Each marker lives in the overlay with absolute positioning */
        .notepad-link-marker {
            position: absolute;
            pointer-events: auto;
            cursor: grab;
            user-select: none;
            touch-action: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            z-index: 10;
            will-change: transform, left, top;
        }

        .notepad-link-marker:hover {
            transform: translate(-50%, -50%) scale(1.18);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .notepad-link-marker:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(0.92);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .notepad-link-marker .link-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 100;
        }

        .notepad-link-marker:hover .link-tooltip {
            display: block;
        }

        .notepad-link-marker .link-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: #1e293b;
        }

        .notepad-link-marker.type-line {
            background: #2563eb;
        }
        .notepad-link-marker.type-highlight {
            background: #eab308;
        }
        .notepad-link-marker.type-underline {
            background: #22c55e;
        }
        .notepad-link-marker.type-scan {
            background: #8b5cf6;
        }
        .notepad-link-marker.type-linkpoint {
            background: #ec4899;
        }
        .notepad-link-marker.type-line::after {
            content: '✏️';
            font-size: 12px;
            line-height: 1;
        }
        .notepad-link-marker.type-highlight::after {
            content: '🟡';
            font-size: 12px;
            line-height: 1;
        }
        .notepad-link-marker.type-underline::after {
            content: '⏺️';
            font-size: 12px;
            line-height: 1;
        }
        .notepad-link-marker.type-scan::after {
            content: '📷';
            font-size: 12px;
            line-height: 1;
        }
        .notepad-link-marker.type-linkpoint::after {
            content: '🔗';
            font-size: 12px;
            line-height: 1;
        }

        /* Scan image container in the overlay */
        .notepad-scan-container {
            position: absolute;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transform: translate(-50%, -50%);
            user-select: none;
            touch-action: none;
            z-index: 10;
        }

        .notepad-scan-container img {
            max-height: 80px;
            max-width: 150px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            box-shadow: var(--shadow-sm);
            display: block;
            pointer-events: none;
        }

        .notepad-scan-container .notepad-link-marker {
            position: relative;
            transform: none;
            flex-shrink: 0;
        }

        .notepad-scan-container .notepad-link-marker:hover {
            transform: scale(1.18);
        }

        .notepad-scan-container .notepad-link-marker:active {
            transform: scale(0.92);
        }

        /* ghost while dragging */
        .marker-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            opacity: 0.9;
            transform: translate(-50%, -50%) scale(1.25) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            transition: none;
        }

        .marker-ghost .link-tooltip {
            display: none !important;
        }

        /* ---- original notepad editor (contenteditable) ---- */
        #notepad-editor {
            width: 100%;
            min-height: 100%;
            height: auto;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #1e293b;
            font-family: inherit;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            will-change: font-size;
            transition: font-size 0.08s ease-out;
            position: relative;
            z-index: 1;
            padding-right: 4px;
        }

        #notepad-editor:empty::before {
            content: attr(placeholder);
            color: #94a3b8;
            pointer-events: none;
        }

        #notepad-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        #notepad-header .left-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #notepad-header h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
        }

        #notepad-pad-number {
            font-weight: 500;
            color: #64748b;
            font-size: 14px;
        }

        #notepad-pad-counter {
            font-weight: 400;
            color: #64748b;
            font-size: 13px;
        }

        #btn-add-pad {
            padding: 2px 8px;
            font-size: 16px;
            line-height: 1;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            color: var(--text-main);
            cursor: pointer;
        }

        #btn-add-pad:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .notepad-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== 6 BACKGROUND STYLES ===== */
        #notepad-editor-container.bg-red-lined {
            background-color: #ffffff;
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
            background-size: 100% 32px;
        }
        #notepad-editor-container.bg-red-lined #notepad-editor {
            line-height: 32px !important;
            padding-left: 16px !important;
            border-left: 3px solid #f87171 !important;
        }

        #notepad-editor-container.bg-purple-lined {
            background-color: #ffffff;
            background-image: linear-gradient(#f3e8ff 1px, transparent 1px);
            background-size: 100% 32px;
        }
        #notepad-editor-container.bg-purple-lined #notepad-editor {
            line-height: 32px !important;
            padding-left: 16px !important;
            border-left: 3px solid #c084fc !important;
        }

        #notepad-editor-container.bg-dot-grid {
            background-color: #ffffff;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        #notepad-editor-container.bg-dot-grid #notepad-editor {
            line-height: 24px !important;
            padding-left: 12px !important;
        }

        #notepad-editor-container.bg-light-yellow-blank {
            background-color: #fffde7 !important;
            background-image: none !important;
        }
        #notepad-editor-container.bg-light-yellow-blank #notepad-editor {
            padding-left: 4px;
            line-height: 1.6;
            border-left: none !important;
        }

        #notepad-editor-container.bg-yellow-lined {
            background-color: #fef9c3 !important;
            background-image: linear-gradient(#d1d5db 1px, transparent 1px) !important;
            background-size: 100% 32px !important;
        }
        #notepad-editor-container.bg-yellow-lined #notepad-editor {
            line-height: 32px !important;
            padding-left: 16px !important;
            border-left: 3px solid #f59e0b !important;
        }

        #notepad-editor-container.bg-white-blank {
            background-color: #ffffff !important;
            background-image: none !important;
        }
        #notepad-editor-container.bg-white-blank #notepad-editor {
            padding-left: 4px;
            line-height: 1.6;
            border-left: none !important;
        }

        /* PDF page styles */
        .pdf-page-card {
            position: relative;
            background-color: #ffffff;
            box-shadow: var(--shadow-md);
            border-radius: 4px;
            min-height: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            flex-shrink: 0;
            transition: box-shadow 0.2s ease;
        }

        .pdf-page-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .page-number-indicator {
            position: absolute;
            top: -22px;
            left: 0;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .canvas-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            width: 100%;
            height: 100%;
        }

        .pdf-canvas {
            display: block;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        .pdf-link-highlight {
            position: absolute;
            border-radius: 3px;
            pointer-events: none;
            z-index: 5;
            background-color: var(--link-highlight);
            border: 2px solid var(--primary-accent);
            transition: opacity 0.4s ease;
            opacity: 0;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.25);
        }

        .pdf-link-highlight.active {
            opacity: 1;
        }

        .pdf-link-marker {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            z-index: 6;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #ffffff;
            pointer-events: auto;
            transform: translate(-50%, -50%);
            background: #2563eb;
        }

        .pdf-link-marker:hover {
            transform: translate(-50%, -50%) scale(1.25);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .pdf-link-marker .link-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            pointer-events: none;
        }

        .pdf-link-marker:hover .link-tooltip {
            display: block;
        }

        .pdf-link-marker .link-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: #1e293b;
        }

        .pdf-link-marker.type-line {
            background: #2563eb;
        }
        .pdf-link-marker.type-highlight {
            background: #eab308;
        }
        .pdf-link-marker.type-underline {
            background: #22c55e;
        }
        .pdf-link-marker.type-scan {
            background: #8b5cf6;
        }
        .pdf-link-marker.type-linkpoint {
            background: #ec4899;
        }

        .page-text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            outline: none;
            padding: 32px 28px;
            box-sizing: border-box;
            font-size: 16px;
            line-height: 32px;
            color: #0f172a;
            white-space: pre-wrap;
            word-break: break-word;
            cursor: text;
            pointer-events: auto;
        }

        .page-text-layer.block-events {
            pointer-events: none !important;
        }

        #empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        #empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
        }

        #empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        #empty-state p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 300px;
        }

        #resizer {
            width: 4px;
            height: 100%;
            background-color: var(--border-color);
            cursor: col-resize;
            flex-shrink: 0;
            user-select: none;
            touch-action: none;
            z-index: 30;
            display: none;
            position: relative;
            transition: background-color 0.2s ease;
        }

        #resizer:hover,
        #resizer.active {
            background-color: var(--primary-accent);
        }

        #resizer::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 24px;
            background-color: #94a3b8;
            border-radius: 1px;
        }

        #resizer:hover::after,
        #resizer.active::after {
            background-color: #ffffff;
        }

        #mode-status {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-accent);
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        #mode-status.visible {
            opacity: 1;
        }

        /* modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background-color: #ffffff;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            animation: modalFadeIn 0.2s ease-out;
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        // ================================================================

        // ================================================================
        // COORDINATE HELPERS (unchanged)
        // ================================================================
        function getWorkspaceRect() { return mainWorkspace.getBoundingClientRect(); }

        function getPdfCanvasWrapper(pageNum) {
            const card = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${pageNum}"]`);
            if (!card) return null;
            return card.querySelector('.canvas-wrapper');
        }

        function getContainerFromPoint(globalX, globalY) {
            const wsRect = getWorkspaceRect();
            const viewportX = globalX + wsRect.left;
            const viewportY = globalY + wsRect.top;
            const elements = document.elementsFromPoint(viewportX, viewportY);
            for (let el of elements) {
                const card = el.closest('.pdf-page-card');
                if (card) {
                    const wrapper = card.querySelector('.canvas-wrapper');
                    if (wrapper) {
                        const wrapperRect = wrapper.getBoundingClientRect();
                        return {
                            type: 'pdf',
                            pageNum: parseInt(card.dataset.pageNum, 10),
                            element: card,
                            wrapper,
                            wrapperRect,
                            offsetX: wrapperRect.left - wsRect.left,
                            offsetY: wrapperRect.top - wsRect.top,
                            width: wrapperRect.width,
                            height: wrapperRect.height
                        };
                    }
                    const rect = card.getBoundingClientRect();
                    return {
                        type: 'pdf',
                        pageNum: parseInt(card.dataset.pageNum, 10),
                        element: card,
                        wrapper: null,
                        offsetX: rect.left - wsRect.left,
                        offsetY: rect.top - wsRect.top,
                        width: rect.width,
                        height: rect.height
                    };
                }
            }
            const notepadRect = notepadEditorContainer.getBoundingClientRect();
            if (notepadPane.style.display !== 'none') {
                const nOffsetX = notepadRect.left - wsRect.left;
                const nOffsetY = notepadRect.top - wsRect.top;
                if (globalX >= nOffsetX && globalX <= nOffsetX + notepadRect.width &&
                    globalY >= nOffsetY && globalY <= nOffsetY + notepadRect.height) {
                    return {
                        type: 'notepad',
                        element: notepadEditorContainer,
                        offsetX: nOffsetX,
                        offsetY: nOffsetY,
                        width: notepadRect.width,
                        height: notepadRect.height
                    };
                }
            }
            return null;
        }

        function globalToContainer(globalX, globalY, containerInfo) {
            if (containerInfo.type === 'pdf') {
                return { x: globalX - containerInfo.offsetX, y: globalY - containerInfo.offsetY };
            } else if (containerInfo.type === 'notepad') {
                const scrollX = notepadEditorContainer.scrollLeft || 0;
                const scrollY = notepadEditorContainer.scrollTop || 0;
                return { x: globalX - containerInfo.offsetX + scrollX, y: globalY - containerInfo.offsetY + scrollY };
            }
            return { x: globalX, y: globalY };
        }

        function containerToGlobal(containerX, containerY, containerInfo) {
            if (containerInfo.type === 'pdf') {
                return { x: containerX + containerInfo.offsetX, y: containerY + containerInfo.offsetY };
            } else if (containerInfo.type === 'notepad') {
                const scrollX = notepadEditorContainer.scrollLeft || 0;
                const scrollY = notepadEditorContainer.scrollTop || 0;
                return { x: containerX + containerInfo.offsetX - scrollX, y: containerY + containerInfo.offsetY - scrollY };
            }
            return { x: containerX, y: containerY };
        }

            tooltip.textContent = 'Jump to Notepad (' + (labels[type] || type) + ')';
            marker.appendChild(tooltip);
            marker.addEventListener('click', function(e) { e.stopPropagation();
                jumpToLink(parseInt(this.dataset.linkId, 10)); });

        }

        function insertNotepadMarker(linkId, x, y, type) {
            const overlay = notepadMarkerOverlay;
