<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Viewer & Workspace</title>
    
    <!-- 🔥 FIX: लोकल फाइल से सीधे लोड करें (GitHub पर अपलोड की गई फाइल) -->
    <script src="pdf.min.js"></script>

    <style>
        /* ===== CSS – सभी स्टाइल्स पहले जैसी ===== */
        :root { --bg-primary: #f8fafc; --bg-secondary: #ffffff; --border-color: #e2e8f0;
            --text-main: #0f172a; --text-muted: #64748b; --primary-accent: #2563eb;
            --primary-accent-hover: #1d4ed8; --active-bg: #eff6ff; --active-border: #3b82f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05); --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1); --toolbar-height: 55px;
            --link-color: #2563eb; --link-highlight: rgba(37, 99, 235, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; top: 0; left: 0; margin: 0; padding: 0; background-color: var(--bg-primary); color: var(--text-main); touch-action: none; }
        body { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        #top-toolbar { position: relative; width: 100%; height: var(--toolbar-height); z-index: 1000; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; gap: 6px; white-space: nowrap; padding: 0 10px; box-shadow: var(--shadow-sm); flex-shrink: 0; }
        #top-toolbar::-webkit-scrollbar { display: none; }
        .toolbar-section { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .toolbar-divider { height: 28px; width: 1px; background-color: var(--border-color); margin: 0 2px; flex-shrink: 0; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 10px; border-radius: 5px; font-size: 12px; font-weight: 500; border: 1px solid var(--border-color); background-color: #ffffff; color: var(--text-main); cursor: pointer; user-select: none; flex-shrink: 0; pointer-events: auto !important; }
        .btn:hover { background-color: #f1f5f9; border-color: #cbd5e1; }
        .btn-primary { background-color: var(--primary-accent); color: #ffffff; border-color: var(--primary-accent); }
        .btn-primary:hover { background-color: var(--primary-accent-hover); }
        #doc-info { font-size: 12px; color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
        .control-label { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; padding: 0; }
        input[type="range"] { width: 60px; accent-color: var(--primary-accent); }
        #main-workspace { display: flex; flex-direction: row; width: 100%; flex: 1; height: calc(100vh - var(--toolbar-height)); overflow: hidden; position: relative; background-color: #f1f5f9; }
        #global-drawing-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; touch-action: none; }
        #left-resizer { width: 4px; height: 100%; background-color: #2563eb; cursor: col-resize; z-index: 35; opacity: 0.6; }
        #pdf-view-wrapper { flex: 1 1 100%; width: 100%; height: 100%; overflow-y: auto; overflow-x: auto; background-color: #f1f5f9; position: relative; padding: 24px 0 80px 0; min-width: 0; transition: width 0.08s ease-out, flex-basis 0.08s ease-out; }
        #pdf-container { width: 100%; min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px; margin: 0 auto; transform-origin: top center; transition: transform 0.08s ease-out; }
        #notepad-pane { display: none; width: 0%; flex: 0 0 0%; height: 100%; background-color: #f1f5f9; z-index: 20; overflow: hidden; transition: width 0.08s ease-out; }
        #notepad-scroll-container { flex: 1; overflow-y: auto; overflow-x: hidden; background-color: #e2e8f0; padding: 16px; }
        #notepad-pages { display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }
        .notepad-page-wrapper { position: relative; width: 100%; max-width: 700px; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-height: 300px; }
        .notepad-page-wrapper .page-header { padding: 6px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; border-radius: 8px 8px 0 0; }
        .notepad-page-wrapper .page-header .page-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; }
        .notepad-page-content { padding: 24px 28px; min-height: 260px; outline: none; border-radius: 0 0 8px 8px; }
        .notepad-page-markers { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden; }
        .notepad-link-marker { position: absolute; cursor: grab; width: 26px; height: 26px; border-radius: 50%; background: #2563eb; border: 2px solid #fff; color: #fff; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); }
        .notepad-link-marker:hover { transform: translate(-50%, -50%) scale(1.18); }
        .notepad-scan-container { position: absolute; pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; transform: translate(-50%, -50%); }
        .notepad-scan-container img { max-height: 120px; max-width: 200px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .notepad-scan-container .scan-resize-controls button { background: #fff; border: 1px solid #ccc; padding: 2px 6px; font-size: 11px; cursor: pointer; }
        .notepad-page-content.bg-red-lined { background-color: #ffffff; background-image: linear-gradient(#f1f5f9 1px, transparent 1px); background-size: 100% 32px; line-height: 32px !important; border-left: 3px solid #f87171 !important; }
        .notepad-page-content.bg-dot-grid { background-color: #ffffff; background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 24px 24px; }
        .notepad-page-content.bg-light-yellow-blank { background-color: #fffde7 !important; }
        .pdf-page-card { position: relative; background-color: #ffffff; box-shadow: var(--shadow-md); border-radius: 4px; min-height: 850px; display: flex; flex-direction: column; align-items: center; margin: 0 auto; }
        .page-number-indicator { position: absolute; top: -22px; left: 0; font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .canvas-wrapper { position: relative; overflow: hidden; width: 100%; height: 100%; }
        .pdf-canvas { display: block; position: relative; z-index: 1; width: 100%; height: 100%; }
        .page-text-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; outline: none; padding: 32px 28px; color: #0f172a; cursor: text; pointer-events: auto; }
        .pdf-text-annotation { position: absolute; z-index: 7; background: rgba(255,255,255,0.92); border: 1px solid var(--primary-accent); padding: 4px 8px; min-width: 40px; min-height: 24px; cursor: move; box-shadow: 0 2px 6px rgba(0,0,0,0.1); resize: both; overflow: auto; }
        .pdf-text-annotation.sticky-note { background: #fef9c3; border: 1px solid #eab308; min-width: 60px; min-height: 40px; }
        .pdf-text-annotation .delete-text-annotation { position: absolute; top: -10px; right: -10px; background: #ef4444; color: #fff; border-radius: 50%; border: none; cursor: pointer; display: none; }
        .pdf-text-annotation:hover .delete-text-annotation { display: flex; }
        .tool-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 5px; border: 2px solid transparent; background: transparent; color: var(--text-muted); font-size: 16px; cursor: pointer; }
        .tool-icon-btn.active { border-color: var(--primary-accent); background-color: var(--active-bg); color: var(--primary-accent); }
        .tool-icon-btn .tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; background: #1e293b; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 10px; white-space: nowrap; }
        .tool-icon-btn:hover .tooltip { display: block; }
        #empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffffff; padding: 40px 60px; border-radius: 12px; border: 2px dashed #cbd5e1; z-index: 10; }
        #mode-status { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary-accent); color: #fff; padding: 8px 20px; border-radius: 30px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; }
        #mode-status.visible { opacity: 1; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15,23,42,0.4); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background-color: #fff; border-radius: 12px; width: 90%; max-width: 480px; padding: 20px; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; }
        .modal-close-btn { background: none; border: none; font-size: 22px; color: var(--text-muted); cursor: pointer; }
        .modal-body { padding: 20px; }
        .modal-section h4 { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
        .modal-action-btn { padding: 12px; font-size: 14px; }
        .template-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .template-option { display: flex; flex-direction: column; align-items: center; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; }
        .template-preview { width: 100%; height: 60px; border: 1px solid #e2e8f0; border-radius: 4px; }
        .cursor-text-input { position: fixed; z-index: 500; background: #fff; border: 2px solid var(--primary-accent); border-radius: 8px; padding: 8px 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); display: none; }
        .cursor-text-input input { border: none; outline: none; font-size: 16px; width: 100%; }
        .cursor-text-input .cursor-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
        .cursor-text-input .cursor-actions button { background: none; border: none; font-size: 12px; cursor: pointer; }
        .pdf-highlight-link-overlay { position: absolute; border-radius: 3px; pointer-events: auto; z-index: 4; opacity: 0.8; border: 2px solid rgba(0,0,0,0.2); cursor: pointer; }
        .pdf-highlight-link-overlay .hl-tooltip { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; background: #1e293b; color: #fff; padding: 4px 12px; border-radius: 6px; font-size: 11px; }
        .pdf-highlight-link-overlay:hover .hl-tooltip { display: block; }
        .pdf-highlight-link-overlay .hl-delete-btn { position: absolute; top: -10px; right: -10px; background: #ef4444; color: #fff; border-radius: 50%; border: 2px solid #fff; cursor: pointer; display: none; }
        .pdf-highlight-link-overlay:hover .hl-delete-btn { display: flex; }
        .scan-ghost { position: fixed; pointer-events: none; z-index: 99999; border: 2px solid var(--primary-accent); border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); opacity: 0.85; max-width: 300px; max-height: 300px; background: #fff; }
        .scan-drop-target { outline: 2px dashed var(--primary-accent); outline-offset: 4px; background-color: rgba(37,99,235,0.05); }
    </style>
</head>
<body>

    <header id="top-toolbar">
        <div class="toolbar-section">
            <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;" />
            <button class="btn btn-primary" id="btn-open-pdf" onclick="document.getElementById('pdf-file-input').click();">Open PDF</button>
            <input type="file" id="case-plus-input" accept="application/pdf" multiple style="display: none;" />
            <button class="btn" id="btn-case-plus">Case +</button>
            <span id="doc-info">No file selected</span>
            <button class="btn" id="btn-add-page">+ Page</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <div class="tool-group-box" id="toolGroup">
                <button class="tool-icon-btn active" data-tool="pointer">🖱️</button>
                <button class="tool-icon-btn" data-tool="pen">✏️</button>
                <button class="tool-icon-btn" data-tool="highlighter">🟡</button>
                <button class="tool-icon-btn" data-tool="eraser">🧹</button>
                <button class="tool-icon-btn" data-tool="whitener">⬜</button>
                <div class="tool-divider"></div>
                <button class="tool-icon-btn" data-tool="cursor">⌨️</button>
                <button class="tool-icon-btn" data-tool="line">📏</button>
                <button class="tool-icon-btn" data-tool="underline">⏺️</button>
                <button class="tool-icon-btn" data-tool="scan">📷</button>
                <button class="tool-icon-btn" data-tool="linkpoint">🔗</button>
                <button class="tool-icon-btn" data-tool="highlight-link">🖍️</button>
            </div>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <span class="control-label">Color:</span>
            <input type="color" id="picker-color" value="#2563eb" />
            <span class="control-label">Size:</span>
            <input type="range" id="slider-size" min="1" max="25" value="3" />
            <button class="btn" id="btn-clear-page">Clear</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <button class="btn btn-tool" id="btn-zoom-out">−</button>
            <span id="zoom-label" class="control-label">135%</span>
            <button class="btn btn-tool" id="btn-zoom-in">+</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <button class="btn" id="btn-toggle-notepad">📒 Notepad</button>
            <button class="btn" id="btn-export-pdf">💾 Save</button>
        </div>
    </header>

    <div id="mode-status"></div>
    <div id="main-workspace">
        <canvas id="global-drawing-canvas"></canvas>
        <div id="left-resizer"></div>
        <main id="pdf-view-wrapper">
            <div id="empty-state"><h3>No Document Loaded</h3><p>Click "Open PDF" to load a file.</p></div>
            <div id="pdf-container"></div>
        </main>
        <div id="resizer"></div>
        <aside id="notepad-pane">
            <div id="notepad-header">
                <div class="left-group">
                    <h4>📒 Notepad</h4>
                    <button class="notepad-nav-btn" id="notepad-prev">◀</button>
                    <button class="notepad-nav-btn" id="notepad-next">▶</button>
                    <select id="notepad-page-select"></select>
                    <button id="btn-notepad-list">📋</button>
                    <span id="notepad-pad-number">— Pad 01</span>
                    <span id="notepad-pad-counter">(Total: 1)</span>
                    <button id="btn-add-pad" class="btn btn-tool" onclick="addNewNotepadPage()">+</button>
                </div>
                <div class="notepad-controls">
                    <select id="notepad-bg-select">
                        <option value="bg-red-lined">Red Lined</option>
                        <option value="bg-purple-lined">Purple Lined</option>
                        <option value="bg-dot-grid">Dot Grid</option>
                        <option value="bg-light-yellow-blank">Light Yellow</option>
                        <option value="bg-yellow-lined">Yellow Lined</option>
                        <option value="bg-white-blank">White</option>
                    </select>
                    <button class="btn btn-tool" id="btn-close-notepad">✕</button>
                </div>
            </div>
            <div id="notepad-scroll-container"><div id="notepad-pages"></div></div>
        </aside>
    </div>

    <div class="cursor-text-input" id="cursorInput">
        <input type="text" id="cursorText" placeholder="Type here…" />
        <div class="cursor-actions"><button class="btn-cancel" id="cursorCancel">Cancel</button><button class="btn-apply" id="cursorApply">✔ Apply</button></div>
    </div>

    <div id="add-page-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3>Insert New Page</h3><button id="btn-close-modal" class="modal-close-btn">&times;</button></div>
            <div class="modal-body">
                <div class="modal-section"><h4>FROM CAMERA / PHOTO</h4><div style="display:flex; gap:10px;"><button class="btn btn-primary modal-action-btn" id="btn-trigger-camera">📷 Camera</button><button class="btn modal-action-btn" id="btn-trigger-gallery">🖼️ Gallery</button></div><input type="file" id="camera-only-input" accept="image/*" capture="environment" style="display:none;"><input type="file" id="gallery-only-input" accept="image/*" style="display:none;"></div>
                <div class="modal-section"><h4>Custom Page Templates</h4><div class="template-grid"><button class="template-option" data-template="white"><div class="template-preview bg-template-white"></div><span>Plain White</span></button><button class="template-option" data-template="lined-white"><div class="template-preview bg-template-lined-white"></div><span>Lined White</span></button><button class="template-option" data-template="dot-grid"><div class="template-preview bg-template-dot-grid"></div><span>Dot Grid</span></button></div></div>
            </div>
        </div>
    </div>

    <div id="notepad-list-modal" class="modal-overlay notepad-page-list-modal">
        <div class="modal-content">
            <div class="modal-header"><h3>📋 All Notepad Pages</h3><button class="modal-close-btn" id="notepad-list-close">&times;</button></div>
            <div class="modal-body" id="notepad-list-body"></div>
        </div>
    </div>

    <script>
        // 🔥 FIX: बाहरी CDN हटाकर लोकल फाइल से सीधे लोड करें
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
        console.log('✅ PDF.js Library Loaded successfully from local files!');

        // ================================================================
        // STATE
        // ================================================================
        let loadedDocs = [];
        let totalPages = 0;
        let currentScale = 1.35;
        let currentTool = 'select';
        let penColor = '#1e293b';
        let highlighterColor = 'rgba(250, 204, 21, 0.4)';
        let strokeWidth = 3;
        let intersectionObserver = null;

        let globalStrokes = [];
        let activeStroke = null;
        let isDrawing = false;
        let linkData = [];
        let linkIdCounter = 0;
        let activeToolMode = 'pointer';
        let pendingLinkSource = null;
        let waitingForDrop = false;
        let linkPointStart = null;
        let scanSelectionStart = null;
        let scanSelectionEnd = null;
        let isScanSelecting = false;
        let underlineStartX = 0, underlineStartY = 0, underlineEndX = 0;
        let dragState = null;
        let isResizing = false;
        let resizeRafId = null;
        let isPinching = false;
        let initialPinchDistance = 0;
        let initialPinchScale = 1.35;
        let zoomDebounceTimer = null;
        let isZoomFinalizing = false;
        const activePointerMap = new Map();
        let isLeftResizing = false;
        let leftResizeStartX = 0;
        let leftResizeStartMargin = 0;
        let leftMarginPx = 0;
        let textAnnotations = [];
        let textIdCounter = 0;
        let isCursorActive = false;
        let hlSelectionStart = null;
        let hlSelectionEnd = null;
        let isHLSelecting = false;
        let isScanDragging = false;
        let scanDragState = null;
        let scanDragJustStarted = false;
        let cursorTargetPage = null;
        let cursorTargetX = 0, cursorTargetY = 0;
        let cursorPending = false;

        const cursorInput = document.getElementById('cursorInput');
        const cursorText = document.getElementById('cursorText');
        const cursorApply = document.getElementById('cursorApply');
        const cursorCancel = document.getElementById('cursorCancel');

        const fileInput = document.getElementById('pdf-file-input');
        const btnOpenPdf = document.getElementById('btn-open-pdf');
        const casePlusInput = document.getElementById('case-plus-input');
        const btnCasePlus = document.getElementById('btn-case-plus');
        const btnAddPage = document.getElementById('btn-add-page');
        const btnTriggerCamera = document.getElementById('btn-trigger-camera');
        const btnTriggerGallery = document.getElementById('btn-trigger-gallery');
        const cameraOnlyInput = document.getElementById('camera-only-input');
        const galleryOnlyInput = document.getElementById('gallery-only-input');
        const addPageModal = document.getElementById('add-page-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const docInfo = document.getElementById('doc-info');
        const mainWorkspace = document.getElementById('main-workspace');
        const globalCanvas = document.getElementById('global-drawing-canvas');
        const globalCtx = globalCanvas.getContext('2d');
        const pdfContainer = document.getElementById('pdf-container');
        const emptyState = document.getElementById('empty-state');
        const pdfViewWrapper = document.getElementById('pdf-view-wrapper');
        const notepadPane = document.getElementById('notepad-pane');
        const notepadScrollContainer = document.getElementById('notepad-scroll-container');
        const notepadPagesContainer = document.getElementById('notepad-pages');
        const resizer = document.getElementById('resizer');
        const leftResizer = document.getElementById('left-resizer');
        const btnToggleNotepad = document.getElementById('btn-toggle-notepad');
        const btnCloseNotepad = document.getElementById('btn-close-notepad');
        const notepadBgSelect = document.getElementById('notepad-bg-select');
        const pickerColor = document.getElementById('picker-color');
        const sliderSize = document.getElementById('slider-size');
        const btnClearPage = document.getElementById('btn-clear-page');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const zoomLabel = document.getElementById('zoom-label');
        const btnExportPdf = document.getElementById('btn-export-pdf');
        const modeStatus = document.getElementById('mode-status');

        const notepadPrevBtn = document.getElementById('notepad-prev');
        const notepadNextBtn = document.getElementById('notepad-next');
        const notepadPageSelect = document.getElementById('notepad-page-select');
        const btnNotepadList = document.getElementById('btn-notepad-list');
        const notepadListModal = document.getElementById('notepad-list-modal');
        const notepadListClose = document.getElementById('notepad-list-close');
        const notepadListBody = document.getElementById('notepad-list-body');
        const toolButtons = document.querySelectorAll('.tool-icon-btn[data-tool]');

        let notepadPagesData = [];
        let currentNotepadIndex = 0;
        notepadPagesData.push({ content: '', background: 'bg-red-lined', scrollTop: 0 });

        function getWorkspaceRect() { return mainWorkspace.getBoundingClientRect(); }
        function getPdfCanvasWrapper(pageNum) {
            const card = pdfContainer.querySelector(`.pdf-page-card[data-page-num="${pageNum}"]`);
            if (!card) return null;
            return card.querySelector('.canvas-wrapper');
        }
        function getContainerFromPoint(globalX, globalY) {
            const wsRect = getWorkspaceRect();
            const viewportX = globalX + wsRect.left;
            const viewportY = globalY + wsRect.top;
            const elements = document.elementsFromPoint(viewportX, viewportY);
            for (let el of elements) {
                const card = el.closest('.pdf-page-card');
                if (card) {
                    const wrapper = card.querySelector('.canvas-wrapper');
                    if (wrapper) {
                        const wrapperRect = wrapper.getBoundingClientRect();
                        return { type: 'pdf', pageNum: parseInt(card.dataset.pageNum, 10), element: card, wrapper, wrapperRect, offsetX: wrapperRect.left - wsRect.left, offsetY: wrapperRect.top - wsRect.top, width: wrapperRect.width, height: wrapperRect.height };
                    }
                    const rect = card.getBoundingClientRect();

            pdfContainer.style.transform = `scale(${scaleFactor})`;
            pdfContainer.style.transformOrigin = 'top center';
            zoomLabel.textContent = Math.round(newScale * 100) + '%';
            currentScale = newScale;
            redrawGlobalStrokes();
        }
        function finalizeZoomSmooth() {
            pdfContainer.style.transform = ''; pdfContainer.style.transformOrigin = '';
            const cards = document.querySelectorAll('.pdf-page-card');
            cards.forEach(card => {
                if (card.dataset.isPdfPage === 'true') { card.dataset.rendered = 'false'; const rect = card.getBoundingClientRect(); if (rect.top < window.innerHeight * 2 && rect.bottom > -window.innerHeight) renderSinglePage(card); }
                else { const dims = getStandardPageDimensions(); card.style.width = dims.width + 'px'; card.style.height = dims.height + 'px'; card.style.minHeight = dims.height + 'px'; }
            });
            resizeGlobalCanvas(); renderHighlightLinks();
        }
        btnZoomIn.addEventListener('click', () => { applyZoomTransformSmooth(Math.min(currentScale + 0.15, 3.0)); setTimeout(finalizeZoomSmooth, 120); });
        btnZoomOut.addEventListener('click', () => { applyZoomTransformSmooth(Math.max(currentScale - 0.15, 0.5)); setTimeout(finalizeZoomSmooth, 120); });
        mainWorkspace.addEventListener('touchstart', handleWorkspaceTouchStart, { passive: false });
        mainWorkspace.addEventListener('touchmove', handleWorkspaceTouchMove, { passive: false });
        mainWorkspace.addEventListener('touchend', handleWorkspaceTouchEnd);

        function hideNotepad() { notepadPane.style.display = 'none'; notepadPane.style.width = '0%'; resizer.style.display = 'none'; pdfViewWrapper.style.width = '100%'; resizeGlobalCanvas(); }
        function showNotepad() { notepadPane.style.display = 'flex'; notepadPane.style.width = '50%'; pdfViewWrapper.style.width = '50%'; resizer.style.display = 'block'; resizeGlobalCanvas(); }
        btnToggleNotepad.addEventListener('click', (e) => { e.stopPropagation(); if (notepadPane.style.display === 'none' || getComputedStyle(notepadPane).display === 'none') showNotepad(); else hideNotepad(); });
        btnCloseNotepad.addEventListener('click', (e) => { e.stopPropagation(); hideNotepad(); });

        function updateDocSummaryLabel() { if (loadedDocs.length === 0) docInfo.textContent = 'No file selected'; else if (loadedDocs.length === 1) docInfo.textContent = loadedDocs[0].fileName; else docInfo.textContent = `${loadedDocs.length} Cases`; }
        function updateAllPageIndicators() { const cards = pdfContainer.querySelectorAll('.pdf-page-card'); totalPages = cards.length; cards.forEach((card, index) => { card.dataset.pageNum = index + 1; const ind = card.querySelector('.page-number-indicator'); if (ind) ind.textContent = `PAGE ${index+1} OF ${totalPages}`; }); }
        function getCurrentlyActivePageNode() {
            const cards = Array.from(pdfContainer.querySelectorAll('.pdf-page-card'));
            if (!cards.length) return null;
            const wrapperCenter = pdfViewWrapper.getBoundingClientRect().top + pdfViewWrapper.getBoundingClientRect().height / 2;
            return cards.reduce((closest, card) => { const rect = card.getBoundingClientRect(); return (Math.abs(rect.top + rect.height/2 - wrapperCenter) < Math.abs(closest.getBoundingClientRect().top + closest.getBoundingClientRect().height/2 - wrapperCenter)) ? card : closest; }, cards[0]);
        }
        function initIntersectionObserver() { if (intersectionObserver) intersectionObserver.disconnect(); intersectionObserver = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting && entry.target.dataset.isPdfPage === 'true' && entry.target.dataset.rendered !== 'true') renderSinglePage(entry.target); }); }, { root: pdfViewWrapper, rootMargin: '600px 0px', threshold: 0.01 }); }
        function appendPageCardsForRange(docIndex, start, end) {
            if (!intersectionObserver) initIntersectionObserver();
            for (let i = start; i <= end; i++) {
                const pageCard = document.createElement('div');
                pageCard.className = 'pdf-page-card'; pageCard.dataset.docIndex = docIndex; pageCard.dataset.internalPageNum = i; pageCard.dataset.isPdfPage = 'true'; pageCard.style.minHeight = '850px';
                const indicator = document.createElement('div'); indicator.className = 'page-number-indicator';
                const wrapper = document.createElement('div'); wrapper.className = 'canvas-wrapper';
                const pdfCanvas = document.createElement('canvas'); pdfCanvas.className = 'pdf-canvas';
                wrapper.appendChild(pdfCanvas); pageCard.appendChild(indicator); pageCard.appendChild(wrapper); pdfContainer.appendChild(pageCard); intersectionObserver.observe(pageCard);
            }
            updateAllPageIndicators(); redrawGlobalStrokes();
        }

        function renderSinglePage(pageCard) {
            if (pageCard.dataset.isPdfPage !== 'true' || pageCard.dataset.rendering === 'true') return;
            const docIndex = parseInt(pageCard.dataset.docIndex, 10);
            const pageNum = parseInt(pageCard.dataset.internalPageNum, 10);
            const docEntry = loadedDocs[docIndex];
            if (!docEntry || !docEntry.pdfDoc) return;
            pageCard.dataset.rendering = 'true';
            docEntry.pdfDoc.getPage(pageNum).then(page => {
                const viewport = page.getViewport({ scale: currentScale });
                const pdfCanvas = pageCard.querySelector('.pdf-canvas'); const wrapper = pageCard.querySelector('.canvas-wrapper');
                const ctx = pdfCanvas.getContext('2d');
                pdfCanvas.width = viewport.width; pdfCanvas.height = viewport.height;
                wrapper.style.width = viewport.width + 'px'; wrapper.style.height = viewport.height + 'px';
                pageCard.style.width = viewport.width + 'px'; pageCard.style.height = viewport.height + 'px'; pageCard.style.minHeight = viewport.height + 'px';
                return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                    pageCard.dataset.rendered = 'true'; pageCard.dataset.rendering = 'false';
                    redrawGlobalStrokes(); renderTextAnnotationsForPage(parseInt(pageCard.dataset.pageNum, 10)); renderHighlightLinks();
                });
            }).catch((err) => { pageCard.dataset.rendering = 'false'; });
        }

        function getStandardPageDimensions() { const existing = pdfContainer.querySelector('.pdf-page-card'); if (existing && existing.offsetWidth > 0) return { width: existing.offsetWidth, height: existing.offsetHeight || Math.round(existing.offsetWidth * 1.3) }; return { width: Math.round(612 * currentScale), height: Math.round(792 * currentScale) }; }
        function createPageTextLayer() { const textLayer = document.createElement('div'); textLayer.className = 'page-text-layer'; textLayer.contentEditable = 'true'; textLayer.setAttribute('placeholder', 'Tap here to type notes...'); return textLayer; }
        function insertPageCardInPlace(pageCard) { const activeCard = getCurrentlyActivePageNode(); if (activeCard && activeCard.parentNode === pdfContainer) activeCard.insertAdjacentElement('afterend', pageCard); else pdfContainer.appendChild(pageCard); updateAllPageIndicators(); updateDocSummaryLabel(); closeModal(); redrawGlobalStrokes(); }

        btnAddPage.addEventListener('click', () => { addPageModal.style.display = 'flex'; });
        function closeModal() { addPageModal.style.display = 'none'; }
        btnCloseModal.addEventListener('click', closeModal);
        btnTriggerCamera.addEventListener('click', () => { cameraOnlyInput.value = ''; cameraOnlyInput.click(); });
        btnTriggerGallery.addEventListener('click', () => { galleryOnlyInput.value = ''; galleryOnlyInput.click(); });
        function handleImageFileImport(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    if (emptyState) emptyState.style.display = 'none';
                    const dims = getStandardPageDimensions();
                    const pageCard = document.createElement('div'); pageCard.className = 'pdf-page-card'; pageCard.dataset.rendered = 'true'; pageCard.style.width = dims.width + 'px'; pageCard.style.height = dims.height + 'px';
                    const wrapper = document.createElement('div'); wrapper.className = 'canvas-wrapper'; const imgElem = document.createElement('img');
                    imgElem.src = event.target.result; imgElem.style.maxWidth = '100%'; imgElem.style.maxHeight = '100%'; imgElem.style.objectFit = 'contain';
                    wrapper.appendChild(imgElem); wrapper.appendChild(createPageTextLayer()); pageCard.appendChild(document.createElement('div')).className = 'page-number-indicator'; pageCard.appendChild(wrapper); insertPageCardInPlace(pageCard);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
        cameraOnlyInput.addEventListener('change', (e) => handleImageFileImport(e.target.files[0]));
        galleryOnlyInput.addEventListener('change', (e) => handleImageFileImport(e.target.files[0]));

        // OPEN PDF (With Local Fix)
        const pdfFileInput = document.getElementById('pdf-file-input');
        pdfFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (typeof pdfjsLib === 'undefined') { alert('❌ PDF.js library not loaded. Please refresh.'); return; }
            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                pdfjsLib.getDocument({ data }).promise.then(function(pdf) {
                    loadedDocs = []; totalPages = 0; globalStrokes = []; linkData = []; textAnnotations = [];
                    loadedDocs.push({ pdfDoc: pdf, fileName: file.name, numPages: pdf.numPages });
                    hideNotepad(); setToolMode('pointer'); if (emptyState) emptyState.style.display = 'none';
                    pdfContainer.innerHTML = '';
                    initIntersectionObserver(); appendPageCardsForRange(0, 1, pdf.numPages);
                    const first = pdfContainer.querySelector('.pdf-page-card');
                    if (first) { setTimeout(() => { renderSinglePage(first); }, 200); }
                    updateDocSummaryLabel(); resizeGlobalCanvas(); leftMarginPx = 0; applyLeftMargin(0); renderNotepadPages();
                }).catch((err) => { alert('Failed to parse PDF: ' + (err.message || 'Unknown error')); });
            };
            reader.onerror = function() { alert('Failed to read file'); };
            reader.readAsArrayBuffer(file);
        });

        btnCasePlus.addEventListener('click', () => { casePlusInput.value = ''; casePlusInput.click(); });
        casePlusInput.addEventListener('change', async function(e) {
            for (let file of e.target.files) {
                try { const buffer = await file.arrayBuffer(); const data = new Uint8Array(buffer); const pdf = await pdfjsLib.getDocument({ data }).promise; const docIndex = loadedDocs.length; loadedDocs.push({ pdfDoc: pdf, fileName: file.name, numPages: pdf.numPages }); appendPageCardsForRange(docIndex, 1, pdf.numPages); }
                catch (err) { alert('Failed to append PDF: ' + err.message); }
            }
            updateDocSummaryLabel(); resizeGlobalCanvas();
        });

        function resizeGlobalCanvas() { const rect = mainWorkspace.getBoundingClientRect(); globalCanvas.width = rect.width; globalCanvas.height = rect.height; redrawGlobalStrokes(); setTimeout(updateAllOverlayMarkers, 50); }

        // EXPORT
        btnExportPdf.addEventListener('click', () => {
            if (totalPages === 0) { alert('Please open a PDF first'); return; }
            const tempCanvas = document.createElement('canvas'); tempCanvas.width = mainWorkspace.clientWidth; tempCanvas.height = mainWorkspace.clientHeight;
            const ctx = tempCanvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height); ctx.drawImage(globalCanvas, 0, 0);
            const link = document.createElement('a'); link.download = 'workspace.png'; link.href = tempCanvas.toDataURL('image/png'); link.click();
        });

        pdfViewWrapper.addEventListener('scroll', redrawGlobalStrokes);
        window.addEventListener('resize', resizeGlobalCanvas);

        // INIT
        hideNotepad();
        setToolMode('pointer');
        resizeGlobalCanvas();
        if (loadedDocs.length === 0) emptyState.style.display = 'flex';
        renderNotepadPages();
        console.log('✅ PDF Open and all tools loaded successfully!');
    </script>
</body>
</html>
