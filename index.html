<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Legal PDF & Workspace Tool</title>
  <style>
    /* -------------------------------------------------------------------------- */
    /* 1. CORE SHELL & FULL VIEWPORT LAYOUT LOCK                                  */
    /* -------------------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #e5e5ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app-container {
      display: flex !important;
      flex-direction: column !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      position: relative !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* -------------------------------------------------------------------------- */
    /* 2. RESTORED PREMIUM LEGAL TOOLBAR                                          */
    /* -------------------------------------------------------------------------- */
    #toolbar {
      position: sticky !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 999999 !important;
      height: 55px !important;
      width: 100% !important;
      background-color: #f5f5f7 !important;
      border-bottom: 1px solid #d2d2d7 !important;
      flex-shrink: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between;
      padding: 0 12px !important;
      gap: 6px;
      box-sizing: border-box;
      overflow-x: auto;
      white-space: nowrap;
    }

    #toolbar::-webkit-scrollbar {
      height: 3px;
    }
    #toolbar::-webkit-scrollbar-thumb {
      background: #c1c1c4;
      border-radius: 3px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tool-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid #c6c6c8;
      background-color: #ffffff;
      color: #1c1c1e;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease-in-out;
      flex-shrink: 0;
    }

    .tool-btn:hover {
      background-color: #eef0f4;
    }

    .tool-btn.active {
      background-color: #007aff;
      color: #ffffff;
      border-color: #007aff;
    }

    .tool-btn.primary {
      background-color: #34c759;
      color: #ffffff;
      border-color: #34c759;
      font-weight: 600;
    }
    .tool-btn.primary:hover {
      background-color: #2fb350;
    }

    .tool-btn.danger {
      background-color: #ff3b30;
      color: #ffffff;
      border-color: #ff3b30;
    }

    .counter-badge {
      background-color: #e5e5ea;
      color: #1c1c1e;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #d2d2d7;
      white-space: nowrap;
    }

    .separator {
      width: 1px;
      height: 24px;
      background-color: #d2d2d7;
      margin: 0 4px;
      flex-shrink: 0;
    }

    .color-picker-input {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      flex-shrink: 0;
    }

    .color-picker-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-picker-input::-webkit-color-swatch {
      border: 1px solid #c6c6c8;
      border-radius: 50%;
    }

    .size-slider {
      width: 70px;
      cursor: pointer;
    }

    /* -------------------------------------------------------------------------- */
    /* 3. CO-DEPENDENT FLEX WORKSPACE & DIVIDER                                   */
    /* -------------------------------------------------------------------------- */
    #workspace {
      height: calc(100vh - 55px) !important;
      width: 100% !important;
      display: flex !important;
      overflow: hidden !important;
      flex-grow: 1 !important;
      position: relative !important;
    }

    #pdf-section {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      box-sizing: border-box;
      background-color: #8e8e93;
      position: relative;
    }

    #divider {
      width: 8px;
      height: 100%;
      background-color: #d2d2d7;
      cursor: col-resize;
      flex-shrink: 0;
      position: relative;
      z-index: 100;
      transition: background-color 0.15s;
    }

    #divider:hover, #divider.active {
      background-color: #007aff;
    }

    #notepad-section {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      box-sizing: border-box;
      background-color: #636366;
      position: relative;
    }

    .notepad-header {
      width: 794px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f5f7;
      padding: 8px 16px;
      border-radius: 6px 6px 0 0;
      border-bottom: 1px solid #d2d2d7;
      font-weight: 600;
      color: #1c1c1e;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 16px;
      font-weight: bold;
      color: #8e8e93;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .close-btn:hover {
      color: #ff3b30;
      background: #e5e5ea;
    }

    /* -------------------------------------------------------------------------- */
    /* 4. PAGE TEMPLATES & CANVASES                                              */
    /* -------------------------------------------------------------------------- */
    .page-wrapper {
      position: relative;
      width: 794px; /* A4 standard aspect */
      height: 1123px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      border-radius: 2px;
      flex-shrink: 0;
      overflow: hidden;
      background-color: #ffffff;
    }

    .page-number-tag {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 12px;
      color: #8e8e93;
      font-weight: 600;
      pointer-events: none;
      z-index: 10;
    }

    /* 5 PAGE TEMPLATE STYLES */
    .template-plain-white {
      background-color: #ffffff;
    }

    .template-lined-white {
      background-color: #ffffff;
      background-image: repeating-linear-gradient(
        #ffffff,
        #ffffff 31px,
        #e5e5ea 32px
      );
      background-position: 0 40px;
    }

    .template-dot-grid {
      background-color: #ffffff;
      background-image: radial-gradient(#c7c7cc 1.5px, transparent 1.5px);
      background-size: 20px 20px;
    }

    .template-light-yellow-blank {
      background-color: #fef9e7;
    }

    .template-light-yellow-lined {
      background-color: #fef9e7;
      background-image: repeating-linear-gradient(
        #fef9e7,
        #fef9e7 31px,
        #a3c1ad 32px
      );
      background-position: 0 40px;
    }

    .drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      touch-action: none;
    }

    .text-note-element {
      position: absolute;
      min-width: 140px;
      min-height: 40px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px dashed #007aff;
      border-radius: 4px;
      padding: 8px;
      font-size: 15px;
      color: #1c1c1e;
      outline: none;
      z-index: 6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      user-select: text;
      -webkit-user-select: text;
    }

    /* -------------------------------------------------------------------------- */
    /* 5. MODALS & FORMS                                                         */
    /* -------------------------------------------------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 14px;
      width: 440px;
      max-width: 90vw;
      max-height: 80vh !important;
      overflow-y: auto !important;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1c1c1e;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #636366;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      border: 1px solid #c6c6c8;
      padding: 0 12px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      background-color: #fff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background-color: #e5e5ea;
      color: #1c1c1e;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #007aff;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- 1. RESTORED PREMIUM LEGAL TOOLBAR -->
    <header id="toolbar">
      <div class="toolbar-group">
        <!-- 1. Open PDF -->
        <button class="tool-btn" id="btn-open-pdf" onclick="document.getElementById('file-pdf-input').click()">📂 Open PDF</button>
        <input type="file" id="file-pdf-input" accept="application/pdf,image/*" style="display:none" onchange="handleOpenPDF(this)">

        <!-- 2. + Case + -->
        <button class="tool-btn" id="btn-add-case" onclick="addNewCase()">+ Case +</button>

        <!-- 3. Counter Indicator -->
        <span class="counter-badge" id="case-counter">1 Case (6 pages total)</span>

        <div class="separator"></div>

        <!-- 4. Select/Arrow Tools -->
        <button class="tool-btn active" id="btn-select" onclick="setTool('select')">🏹 Select</button>

        <!-- 5. Pen -->
        <button class="tool-btn" id="btn-pen" onclick="setTool('pen')">✏️ Pen</button>

        <!-- 6. Highlighter -->
        <button class="tool-btn" id="btn-highlighter" onclick="setTool('highlighter')">🖍️ Highlighter</button>

        <!-- 7. Eraser -->
        <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')">🧹 Eraser</button>

        <!-- 8. Color Picker -->
        <input type="color" id="color-picker" class="color-picker-input" value="#007aff" onchange="updateStrokeStyle()" title="Stroke Color">

        <!-- 9. Size Slider -->
        <input type="range" id="size-slider" class="size-slider" min="1" max="30" value="5" oninput="updateStrokeStyle()" title="Stroke Thickness">

        <div class="separator"></div>

        <!-- 10. Clear Page -->
        <button class="tool-btn danger" id="btn-clear" onclick="clearCurrentPage()">🗑️ Clear Page</button>

        <!-- 11. Notes -->
        <button class="tool-btn" id="btn-notes" onclick="toggleNotepad()">📝 Notes</button>

        <!-- 12. + Page Button -->
        <button class="tool-btn primary" id="btn-add-page" onclick="openAddPageModal()">+ Page</button>
      </div>
    </header>

    <!-- 2. WORKSPACE WITH SPLIT VIEW & CO-DEPENDENT GESTURE RESIZING -->
    <main id="workspace">
      <!-- PDF Document Panel -->
      <section id="pdf-section">
        <!-- Pages generated dynamically -->
      </section>

      <!-- Resizable Divider -->
      <div id="divider"></div>

      <!-- Legal Notepad Panel -->
      <section id="notepad-section">
        <div class="notepad-header">
          <span>Legal Notepad Workspace</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <select id="notepad-bg-select" class="form-control" disabled style="width: 170px; height: 30px; font-size: 12px;">
              <option value="template-light-yellow-lined" selected>Light Yellow Lined</option>
            </select>
            <button class="close-btn" id="btn-close-notepad" onclick="closeNotepad()">✕</button>
          </div>
        </div>
        <div id="notepad-pages-container" style="display: flex; flex-direction: column; align-items: center; margin-top: 12px;">
          <!-- Notepad Page -->
        </div>
      </section>
    </main>
  </div>

  <!-- 3. "+ PAGE" INSERTION MODAL -->
  <div class="modal-overlay" id="add-page-modal">
    <div class="modal-card">
      <div class="modal-title">Insert New Sheet</div>
      
      <div class="form-group">
        <label>1. Select Page Template (5 Options)</label>
        <select id="modal-template-style" class="form-control">
          <option value="template-plain-white">1. Plain White</option>
          <option value="template-lined-white">2. Lined White</option>
          <option value="template-dot-grid">3. Dot Grid</option>
          <option value="template-light-yellow-blank">4. Light Yellow Blank</option>
          <option value="template-light-yellow-lined" selected>5. Light Yellow Lined</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Photo Inputs (Separate Actions)</label>
        <div style="display: flex; gap: 10px;">
          <button class="btn-secondary" style="flex: 1;" onclick="triggerCameraInput()">📷 Camera</button>
          <button class="btn-secondary" style="flex: 1;" onclick="triggerGalleryInput()">🖼️ Gallery / Browser</button>
        </div>
        <input type="file" id="modal-camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleModalPhotoSelected(this)">
        <input type="file" id="modal-gallery-input" accept="image/*" style="display:none" onchange="handleModalPhotoSelected(this)">
      </div>

      <div class="form-group">
        <label>3. Target Placement Page Number</label>
        <input type="number" id="modal-target-page" class="form-control" value="1" min="1">
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeAddPageModal()">Cancel</button>
        <button class="btn-primary" onclick="executePageInsertion()">Insert Page</button>
      </div>
    </div>
  </div>

  <script>
    /* -------------------------------------------------------------------------- */
    /* STATE MANAGEMENT                                                           */
    /* -------------------------------------------------------------------------- */
    let currentTool = 'select';
    let currentColor = '#007aff';
    let currentSize = 5;
    let casesCount = 1;
    let totalPdfPages = 6;

    let activePageWrapper = null;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    const pdfSection = document.getElementById('pdf-section');
    const notepadSection = document.getElementById('notepad-section');
    const divider = document.getElementById('divider');
    const workspace = document.getElementById('workspace');
    const caseCounter = document.getElementById('case-counter');

    /* -------------------------------------------------------------------------- */
    /* INITIALIZATION                                                             */
    /* -------------------------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      initPDFDocument();
      initNotepadDocument();
      initResizerAndGestures();
      setTool('select');
    });

    function updateCounter() {
      caseCounter.innerText = `${casesCount} Case${casesCount > 1 ? 's' : ''} (${totalPdfPages} pages total)`;
    }

    function initPDFDocument() {
      pdfSection.innerHTML = '';
      for (let i = 1; i <= totalPdfPages; i++) {
        const styleClass = (i === 5) ? 'template-light-yellow-lined' : 'template-plain-white';
        const pageEl = createPageElement(i, styleClass);
        pdfSection.appendChild(pageEl);
      }
      updateCounter();
    }

    function initNotepadDocument() {
      const container = document.getElementById('notepad-pages-container');
      container.innerHTML = '';
      const notepadPage = createPageElement(1, 'template-light-yellow-lined');
      container.appendChild(notepadPage);
    }

    /* -------------------------------------------------------------------------- */
    /* PAGE ELEMENT CREATION ENGINE                                               */
    /* -------------------------------------------------------------------------- */
    function createPageElement(pageIndex, templateClass = 'template-plain-white', bgImageUrl = null) {
      const pageWrapper = document.createElement('div');
      pageWrapper.className = `page-wrapper ${templateClass}`;
      pageWrapper.dataset.pageNumber = pageIndex;

      if (bgImageUrl) {
        pageWrapper.style.backgroundImage = `url(${bgImageUrl})`;
        pageWrapper.style.backgroundSize = 'cover';
        pageWrapper.style.backgroundPosition = 'center';
      }

      const pageTag = document.createElement('div');
      pageTag.className = 'page-number-tag';
      pageTag.innerText = `Page ${pageIndex}`;
      pageWrapper.appendChild(pageTag);

      const canvas = document.createElement('canvas');
      canvas.className = 'drawing-canvas';
      canvas.width = 794;
      canvas.height = 1123;
      pageWrapper.appendChild(canvas);

      attachCanvasEvents(canvas);
      attachTextNoteEvents(pageWrapper);

      pageWrapper.addEventListener('click', () => {
        activePageWrapper = pageWrapper;
      });

      return pageWrapper;
    }

    /* -------------------------------------------------------------------------- */
    /* TOOLBAR LOGIC                                                              */
    /* -------------------------------------------------------------------------- */
    function setTool(toolName) {
      currentTool = toolName;
      document.querySelectorAll('#toolbar .tool-btn').forEach(btn => {
        if (btn.id !== 'btn-add-page' && btn.id !== 'btn-add-case' && btn.id !== 'btn-open-pdf' && btn.id !== 'btn-clear') {
          btn.classList.remove('active');
        }
      });

      const targetBtn = document.getElementById(`btn-${toolName}`);
      if (targetBtn) targetBtn.classList.add('active');

      if (toolName === 'highlighter') {
        currentColor = 'rgba(255, 223, 0, 0.4)';
      } else if (toolName === 'pen') {
        currentColor = document.getElementById('color-picker').value;
      }
    }

    function updateStrokeStyle() {
      if (currentTool === 'pen') {
        currentColor = document.getElementById('color-picker').value;
      }
      currentSize = parseInt(document.getElementById('size-slider').value, 10);
    }

    function clearCurrentPage() {
      const target = activePageWrapper || pdfSection.querySelector('.page-wrapper');
      if (!target) return;

      const canvas = target.querySelector('canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      const textNotes = target.querySelectorAll('.text-note-element');
      textNotes.forEach(n => n.remove());
    }

    function addNewCase() {
      casesCount++;
      // Add 2 pages for new case
      const page1 = createPageElement(totalPdfPages + 1, 'template-plain-white');
      const page2 = createPageElement(totalPdfPages + 2, 'template-lined-white');
      pdfSection.appendChild(page1);
      pdfSection.appendChild(page2);
      reindexPages();
      page1.scrollIntoView({ behavior: 'smooth' });
    }

    function handleOpenPDF(input) {
      if (input.files && input.files[0]) {
        alert(`Loaded document: ${input.files[0].name}`);
      }
    }

    /* -------------------------------------------------------------------------- */
    /* DRAWING & NOTES INTERACTION                                                */
    /* -------------------------------------------------------------------------- */
    function attachCanvasEvents(canvas) {
      const ctx = canvas.getContext('2d');

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function startDraw(e) {
        if (currentTool === 'select') return;
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
      }

      function draw(e) {
        if (!isDrawing || currentTool === 'select') return;
        if (e.touches && e.touches.length > 1) return; // ignore multi-touch
        e.preventDefault();

        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);

        if (currentTool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = currentSize * 5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();
        } else if (currentTool === 'highlighter') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = 'rgba(255, 223, 0, 0.35)';
          ctx.lineWidth = currentSize * 3;
          ctx.lineCap = 'square';
          ctx.stroke();
        } else { // Pen
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = currentColor;
          ctx.lineWidth = currentSize;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();
        }

        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDraw() {
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('mouseleave', stopDraw);

      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDraw);
    }

    function attachTextNoteEvents(pageWrapper) {
      pageWrapper.addEventListener('click', (e) => {
        if (currentTool !== 'select') return;
        if (e.target.classList.contains('text-note-element') || e.target.tagName === 'CANVAS') {
          if (e.target.classList.contains('text-note-element')) return;
        }

        // Double click or explicit creation if needed
      });
    }

    function toggleNotepad() {
      if (notepadSection.style.display === 'none') {
        pdfSection.style.width = '50%';
        notepadSection.style.width = '50%';
        notepadSection.style.display = 'flex';
        divider.style.display = 'block';
      } else {
        closeNotepad();
      }
    }

    function closeNotepad() {
      pdfSection.style.width = '100%';
      notepadSection.style.display = 'none';
      divider.style.display = 'none';
    }

    /* -------------------------------------------------------------------------- */
    /* 2-FINGER PINCH & DIVIDER RESIZING                                          */
    /* -------------------------------------------------------------------------- */
    function initResizerAndGestures() {
      let isDraggingDivider = false;

      divider.addEventListener('mousedown', () => {
        isDraggingDivider = true;
        divider.classList.add('active');
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDraggingDivider) return;
        updateSplitByX(e.clientX);
      });

      document.addEventListener('mouseup', () => {
        if (isDraggingDivider) {
          isDraggingDivider = false;
          divider.classList.remove('active');
        }
      });

      // 2-Finger Pinch Gesture Listener
      let initialPinchDist = null;
      let initialPdfWidth = null;

      workspace.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2 && notepadSection.style.display !== 'none') {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          initialPinchDist = Math.hypot(dx, dy);
          initialPdfWidth = pdfSection.getBoundingClientRect().width;
        }
      }, { passive: false });

      workspace.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 2) return; // Single finger performs drawing/typing
        e.preventDefault();

        if (!initialPinchDist || notepadSection.style.display === 'none') return;

        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const currentDist = Math.hypot(dx, dy);
        const delta = currentDist - initialPinchDist;

        const workspaceWidth = workspace.getBoundingClientRect().width;
        let newPdfWidthPx = initialPdfWidth + delta;
        let pct = (newPdfWidthPx / workspaceWidth) * 100;
        pct = Math.max(15, Math.min(85, pct));

        pdfSection.style.width = `${pct}%`;
        notepadSection.style.width = `${100 - pct}%`;
      }, { passive: false });

      workspace.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDist = null;
        }
      });
    }

    function updateSplitByX(clientX) {
      const workspaceRect = workspace.getBoundingClientRect();
      let offsetX = clientX - workspaceRect.left;
      let pct = (offsetX / workspaceRect.width) * 100;
      pct = Math.max(15, Math.min(85, pct));

      pdfSection.style.width = `${pct}%`;
      notepadSection.style.width = `${100 - pct}%`;
    }

    /* -------------------------------------------------------------------------- */
    /* "+ PAGE" MODAL & MID-DOCUMENT INSERTION                                    */
    /* -------------------------------------------------------------------------- */
    function openAddPageModal() {
      // Set target page default to current page
      const currentTarget = activePageWrapper ? parseInt(activePageWrapper.dataset.pageNumber, 10) : 1;
      document.getElementById('modal-target-page').value = currentTarget;
      document.getElementById('add-page-modal').style.display = 'flex';
    }

    function closeAddPageModal() {
      document.getElementById('add-page-modal').style.display = 'none';
    }

    function triggerCameraInput() {
      document.getElementById('modal-camera-input').click();
    }

    function triggerGalleryInput() {
      document.getElementById('modal-gallery-input').click();
    }

    function handleModalPhotoSelected(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          executePageInsertion(e.target.result);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function executePageInsertion(photoDataUrl = null) {
      const targetPageNum = parseInt(document.getElementById('modal-target-page').value, 10) || 1;
      const templateStyle = document.getElementById('modal-template-style').value;

      const pages = Array.from(pdfSection.querySelectorAll('.page-wrapper'));
      let targetPageEl = pages.find(p => parseInt(p.dataset.pageNumber, 10) === targetPageNum) || pages[pages.length - 1];

      const newPage = createPageElement(0, photoDataUrl ? 'template-plain-white' : templateStyle, photoDataUrl);

      if (targetPageEl) {
        // Critical Placement: Insert directly below the target visible page
        targetPageEl.insertAdjacentElement('afterend', newPage);
      } else {
        pdfSection.appendChild(newPage);
      }

      reindexPages();
      closeAddPageModal();

      // Immediately focus and scroll to new page
      newPage.scrollIntoView({ behavior: 'smooth', block: 'center' });
      activePageWrapper = newPage;
    }

    function reindexPages() {
      const pages = pdfSection.querySelectorAll('.page-wrapper');
      pages.forEach((page, idx) => {
        const newNum = idx + 1;
        page.dataset.pageNumber = newNum;
        const tag = page.querySelector('.page-number-tag');
        if (tag) tag.innerText = `Page ${newNum}`;
      });
      totalPdfPages = pages.length;
      updateCounter();
    }
  </script>
</body>
