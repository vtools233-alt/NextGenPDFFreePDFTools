        btnAddPage.addEventListener('click', () => { addPageModal.style.display = 'flex'; });

        function closeModal() { addPageModal.style.display = 'none'; }
        btnCloseModal.addEventListener('click', closeModal);
        addPageModal.addEventListener('click', (e) => { if (e.target === addPageModal) closeModal(); });

        btnTriggerCamera.addEventListener('click', () => { cameraOnlyInput.value = '';
            cameraOnlyInput.click(); });
        btnTriggerGallery.addEventListener('click', () => { galleryOnlyInput.value = '';
            galleryOnlyInput.click(); });

        function handleImageFileImport(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    if (emptyState) emptyState.style.display = 'none';
                    const dims = getStandardPageDimensions();
                    const pageCard = document.createElement('div');
                    pageCard.className = 'pdf-page-card';
                    pageCard.dataset.rendered = 'true';
                    pageCard.style.width = dims.width + 'px';
                    pageCard.style.height = dims.height + 'px';
                    pageCard.style.minHeight = dims.height + 'px';
                    const indicator = document.createElement('div');
                    indicator.className = 'page-number-indicator';
                    const wrapper = document.createElement('div');
                    wrapper.className = 'canvas-wrapper';
                    wrapper.style.width = '100%';
                    wrapper.style.height = '100%';
                    wrapper.style.display = 'flex';
                    wrapper.style.alignItems = 'center';
                    wrapper.style.justifyContent = 'center';
                    wrapper.style.overflow = 'hidden';
                    const imgElem = document.createElement('img');
                    imgElem.src = event.target.result;
                    imgElem.style.maxWidth = '100%';
                    imgElem.style.maxHeight = '100%';
                    imgElem.style.objectFit = 'contain';
                    const textLayer = createPageTextLayer();
                    wrapper.appendChild(imgElem);
                    wrapper.appendChild(textLayer);
                    pageCard.appendChild(indicator);
                    pageCard.appendChild(wrapper);
                    insertPageCardInPlace(pageCard);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        cameraOnlyInput.addEventListener('change', (e) => handleImageFileImport(e.target.files[0]));
        galleryOnlyInput.addEventListener('change', (e) => handleImageFileImport(e.target.files[0]));

        document.querySelectorAll('.template-option').forEach(btn => {
            btn.addEventListener('click', () => {
                const templateType = btn.dataset.template;
                if (!templateType) return;
                if (emptyState) emptyState.style.display = 'none';
                const dims = getStandardPageDimensions();
                const pageCard = document.createElement('div');
                pageCard.className = 'pdf-page-card';
                pageCard.dataset.rendered = 'true';
                pageCard.style.width = dims.width + 'px';
                pageCard.style.height = dims.height + 'px';
                pageCard.style.minHeight = dims.height + 'px';
                const indicator = document.createElement('div');
                indicator.className = 'page-number-indicator';
                const wrapper = document.createElement('div');
                wrapper.className = `canvas-wrapper page-template-${templateType}`;
                wrapper.style.width = '100%';
                wrapper.style.height = '100%';
                const textLayer = createPageTextLayer();
                wrapper.appendChild(textLayer);
                pageCard.appendChild(indicator);
                pageCard.appendChild(wrapper);
                insertPageCardInPlace(pageCard);
            });
        });

        // ================================================================
        // OPEN PDF & CASE +
        // ================================================================
        btnOpenPdf.addEventListener('click', () => { fileInput.value = '';
            fileInput.click(); });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    pdfjsLib.getDocument({ data }).promise
                        .then(function(pdf) {
                            loadedDocs = [];
                            totalPages = 0;
                            globalStrokes = [];
                            linkData = [];
                            linkIdCounter = 0;
                            textAnnotations = [];
                            textIdCounter = 0;
                            loadedDocs.push({ pdfDoc: pdf, fileName: file.name, numPages: pdf
                                    .numPages });
                            hideNotepad();
                            modeSelect.value = 'pointer';
                            setToolMode('pointer');
                            if (emptyState) emptyState.style.display = 'none';
                            pdfContainer.innerHTML = '';
                            pdfContainer.style.transform = '';
                            pdfContainer.style.transformOrigin = '';
                            pdfContainer.style.willChange = '';
                            initIntersectionObserver();
                            appendPageCardsForRange(0, 1, pdf.numPages);
                            const first = pdfContainer.querySelector('.pdf-page-card');
                            if (first) renderSinglePage(first);
                            updateDocSummaryLabel();
                            resizeGlobalCanvas();
                            leftMarginPx = 0;
                            applyLeftMargin(0);
                            notepadPagesData = [{ content: '', background: 'bg-red-lined', scrollTop: 0 }];
                            currentNotepadIndex = 0;
                            renderNotepadPages();
                            notepadBgSelect.value = 'bg-red-lined';
                        })
                        .catch((err) => {
                            console.error('PDF parse error:', err);
                            alert('Failed to parse PDF: ' + (err.message || 'Unknown error'));
                        });
                } catch (err) {
                    console.error('File read error:', err);
                    alert('Error reading file: ' + (err.message || 'Unknown error'));
                }
            };
            reader.readAsArrayBuffer(file);
        });

        btnCasePlus.addEventListener('click', () => { casePlusInput.value = '';
            casePlusInput.click(); });

        casePlusInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            for (let file of files) {
                try {
                    const buffer = await file.arrayBuffer();
                    const data = new Uint8Array(buffer);
                    const pdf = await pdfjsLib.getDocument({ data }).promise;
                    const docIndex = loadedDocs.length;
                    const numPages = pdf.numPages;
                    loadedDocs.push({ pdfDoc: pdf, fileName: file.name, numPages });
                    if (emptyState) emptyState.style.display = 'none';
                    appendPageCardsForRange(docIndex, 1, numPages);
                    const newly = pdfContainer.querySelector(
                        `[data-doc-index="${docIndex}"][data-internal-page-num="1"]`);
                    if (newly) renderSinglePage(newly);
                } catch (err) {
                    console.error('Case+ load error:', err);
                    alert('Failed to append PDF: ' + (err.message || 'Unknown error'));
                }
            }
            updateDocSummaryLabel();
            resizeGlobalCanvas();
        });

        btnClearPage.addEventListener('click', function() {
            const activeCard = getCurrentlyActivePageNode();
            if (!activeCard) return;
            const pNum = parseInt(activeCard.dataset.pageNum, 10);
            const toRemove = globalStrokes.filter(s => s.container === 'pdf' && s.pageNum === pNum);
            toRemove.forEach(s => {
                const linkIds = [];
                linkData.forEach(l => {
                    if ((l.sourceType === 'pdf' && l.sourcePageNum === pNum) || (l.targetType ===
                        'pdf' && l.targetPageNum === pNum)) {
                        linkIds.push(l.id);
                    }
                });
                linkData = linkData.filter(l => !linkIds.includes(l.id));
            });
            globalStrokes = globalStrokes.filter(s => !(s.container === 'pdf' && s.pageNum === pNum));
            const linkIdsOnPage = [];
            linkData.forEach(l => {
                if ((l.sourceType === 'pdf' && l.sourcePageNum === pNum) || (l.targetType === 'pdf' &&
                        l.targetPageNum === pNum)) {
                    linkIdsOnPage.push(l.id);
                }
            });
            linkIdsOnPage.forEach(id => {
                const wrappers = notepadPagesContainer.querySelectorAll('.notepad-page-wrapper');
                wrappers.forEach(wrapper => {
                    const marker = wrapper.querySelector(`.notepad-link-marker[data-link-id="${id}"]`);
                    if (marker) marker.remove();
                    const scan = wrapper.querySelector(`.notepad-scan-container[data-link-id="${id}"]`);
                    if (scan) scan.remove();
                });
            });
            document.querySelectorAll('.pdf-link-marker').forEach(marker => {
                const id = parseInt(marker.dataset.linkId, 10);
                if (linkIdsOnPage.includes(id)) { marker.remove(); }
            });
            const toRemoveText = textAnnotations.filter(a => a.pageNum === pNum);
            toRemoveText.forEach(a => {
                if (a.element && a.element.parentNode) a.element.parentNode.removeChild(a.element);
            });
            textAnnotations = textAnnotations.filter(a => a.pageNum !== pNum);
            redrawGlobalStrokes();
        });

        // ================================================================
        // RESIZE CANVAS
        // ================================================================
        function resizeGlobalCanvas() {
            const rect = mainWorkspace.getBoundingClientRect();
            globalCanvas.width = rect.width;
            globalCanvas.height = rect.height;
            redrawGlobalStrokes();
            setTimeout(updateAllOverlayMarkers, 50);
        }

        // ================================================================
        // EXPORT
        // ================================================================
        btnExportPdf.addEventListener('click', () => {
            if (totalPages === 0) { alert('Please open a PDF document or insert a page first.'); return; }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = mainWorkspace.clientWidth;
            tempCanvas.height = mainWorkspace.clientHeight;
            const ctx = tempCanvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            redrawGlobalStrokes();
            ctx.drawImage(globalCanvas, 0, 0);
            const link = document.createElement('a');
            link.download = 'annotated-workspace.png';
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        });

        // ================================================================
        // SCROLL LISTENERS
        // ================================================================
        pdfViewWrapper.addEventListener('scroll', redrawGlobalStrokes);
        window.addEventListener('resize', resizeGlobalCanvas);

        // ================================================================
        // NAVIGATION LISTENERS
        // ================================================================
        notepadPrevBtn.addEventListener('click', prevNotepadPage);
        notepadNextBtn.addEventListener('click', nextNotepadPage);
        notepadPageSelect.addEventListener('change', function(e) {
            goToNotepadPage(this.value);
        });
        btnNotepadList.addEventListener('click', showNotepadPageList);
        notepadListClose.addEventListener('click', function() {
            notepadListModal.style.display = 'none';
        });
        notepadListModal.addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });

        // ================================================================
        // INIT
        // ================================================================
        hideNotepad();
        modeSelect.value = 'pointer';
        setToolMode('pointer');
        resizeGlobalCanvas();
        if (loadedDocs.length === 0) emptyState.style.display = 'flex';

        // नोटपैड को रेंडर करें (initNotepad की जगह)
        renderNotepadPages();
        window.addNewNotepadPage = addNewNotepadPage;

        leftMarginPx = 0;
        applyLeftMargin(0);

        setTimeout(updateAllOverlayMarkers, 200);

        console.log('✅ All tools unified. Added Whitener, Select & Type, Scan resize controls.');
        console.log('✅ Critical bug fixed: removed undefined initNotepad call.');
        console.log('✅ Annotation drag now prevents accidental creation of new boxes.');
    </script>
</body>
</html>
