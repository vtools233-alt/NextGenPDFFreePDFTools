<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer & Workspace</title>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-accent: #2563eb;
            --primary-accent-hover: #1d4ed8;
            --active-bg: #eff6ff;
            --active-border: #3b82f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-main);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* TOP TOOLBAR — horizontal scroll + touch support */
        #top-toolbar {
            height: 55px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex !important;
            align-items: center !important;
            justify-content: flex-start !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            gap: 10px !important;
            white-space: nowrap !important;
            padding: 0 15px !important;
            -webkit-overflow-scrolling: touch !important;
            z-index: 50;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            width: 100vw;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #top-toolbar::-webkit-scrollbar {
            display: none !important;
        }

        .toolbar-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0 !important;
        }
        .toolbar-divider {
            height: 24px;
            width: 1px;
            background-color: var(--border-color);
            margin: 0 2px;
            flex-shrink: 0 !important;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0 !important;
        }
        .btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }
        .btn-primary {
            background-color: var(--primary-accent);
            color: #ffffff;
            border-color: var(--primary-accent);
        }
        .btn-primary:hover {
            background-color: var(--primary-accent-hover);
            border-color: var(--primary-accent-hover);
        }

        .btn-tool {
            padding: 8px;
            min-width: 36px;
            height: 36px;
            flex-shrink: 0 !important;
        }
        .btn-tool.active {
            background-color: var(--active-bg);
            border-color: var(--active-border);
            color: var(--primary-accent);
        }

        .tool-group {
            display: flex;
            background: #f1f5f9;
            padding: 3px;
            border-radius: 8px;
            gap: 2px;
            border: 1px solid var(--border-color);
            flex-shrink: 0 !important;
        }
        .tool-group .btn-tool {
            border: none;
            border-radius: 5px;
            background: transparent;
        }
        .tool-group .btn-tool.active {
            background-color: #ffffff;
            box-shadow: var(--shadow-sm);
            color: var(--primary-accent);
        }

        #doc-info {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0 !important;
        }

        .control-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0 !important;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 4px;
            flex-shrink: 0 !important;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            flex-shrink: 0 !important;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border-color);
            border-radius: 50%;
        }

        input[type="range"] {
            width: 70px;
            accent-color: var(--primary-accent);
            cursor: pointer;
            flex-shrink: 0 !important;
        }

        /* MAIN WORKSPACE — flex row, no overlap */
        #main-workspace {
            display: flex !important;
            flex-direction: row !important;
            width: 100% !important;
            height: calc(100vh - 55px) !important;
            overflow: hidden !important;
            position: relative !important;
        }

        /* PDF VIEWPORT */
        #pdf-view-wrapper {
            flex: 1 1 100%;
            width: 100%;
            height: 100% !important;
            overflow-y: auto !important;
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch !important;
            background-color: #f1f5f9;
            position: relative;
            display: block !important;
            padding: 24px 0 80px 0;
            box-sizing: border-box;
            min-width: 0;
        }

        #pdf-container {
            width: 100% !important;
            min-height: 100%;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 28px;
            margin: 0 auto;
        }

        /* VERTICAL RESIZER */
        #resizer {
            width: 8px;
            height: 100%;
            background-color: var(--border-color);
            cursor: col-resize;
            flex-shrink: 0 !important;
            user-select: none;
            touch-action: none;
            z-index: 30;
            display: none;
            position: relative;
            transition: background-color 0.15s ease;
        }
        #resizer:hover,
        #resizer.active {
            background-color: var(--primary-accent);
        }
        #resizer::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 24px;
            background-color: #94a3b8;
            border-radius: 1px;
        }
        #resizer:hover::after,
        #resizer.active::after {
            background-color: #ffffff;
        }

        /* PAGE CARDS */
        .pdf-page-card {
            position: relative;
            background-color: #ffffff;
            box-shadow: var(--shadow-md);
            border-radius: 4px;
            min-height: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            flex-shrink: 0;
            transition: box-shadow 0.2s ease;
        }
        .pdf-page-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .page-number-indicator {
            position: absolute;
            top: -22px;
            left: 0;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .canvas-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .pdf-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* — PER-PAGE DRAWING CANVAS KEPT FOR BACKWARD COMPAT, BUT OVERLAY OVERRIDES — */
        .drawing-canvas {
            display: block;
            position: relative;
            z-index: 2;
            touch-action: none;
            pointer-events: none !important;
            /* disabled: global overlay handles drawing */;
        }

        /* EMPTY STATE */
        #empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            box-shadow: var(--shadow-sm);
        }
        #empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
        }
        #empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }
        #empty-state p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 300px;
        }

        /* NOTEPAD SIDEBAR */
        #notepad-pane {
            display: none;
            width: 50%;
            height: 100%;
            background-color: #ffffff;
            border-left: 1px solid var(--border-color);
            flex-direction: column;
            box-shadow: -4px 0 12px rgba(0, 0, 0, 0.05);
            z-index: 20;
            overflow: hidden;
            flex-shrink: 0 !important;
            position: relative !important;
            min-width: 0;
        }

        #notepad-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
        }
        #notepad-header h4 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }
        .notepad-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #notepad-editor-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            position: relative;
        }
        #notepad-editor {
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 15px;
            background: transparent;
            color: #1e293b;
            font-family: inherit;
        }

        /* Notepad background templates — UNCHANGED */
        .bg-red-lined {
            background-color: #ffffff;
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
            background-size: 100% 32px;
            line-height: 32px !important;
            border-left: 3px solid #f87171 !important;
            padding-left: 16px !important;
        }
        .bg-purple-lined {
            background-color: #ffffff;
            background-image: linear-gradient(#f3e8ff 1px, transparent 1px);
            background-size: 100% 32px;
            line-height: 32px !important;
            border-left: 3px solid #c084fc !important;
            padding-left: 16px !important;
        }
        .bg-dot-grid {
            background-color: #ffffff;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            line-height: 24px !important;
            padding-left: 12px !important;
        }

        /* ===== GLOBAL DRAWING OVERLAY ===== */
        #global-draw-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            /* default: pass through */
            touch-action: none;
            display: block;
        }
        /* When a drawing tool is active, the overlay captures all pointers */
        #global-draw-overlay.active {
            pointer-events: auto !important;
            cursor: default;
        }
        /* Eraser gets crosshair */
        #global-draw-overlay.eraser-mode {
            cursor: crosshair !important;
        }
    </style>
</head>
<body>

    <!-- TOP TOOLBAR -->
    <header id="top-toolbar">
        <!-- File Section -->
        <div class="toolbar-section">
            <input type="file" id="pdf-file-input" accept="application/pdf" style="display: none;" />
            <button class="btn btn-primary" id="btn-open-pdf">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                Open PDF
            </button>
            <span id="doc-info">No file selected</span>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Drawing Tools -->
        <div class="toolbar-section">
            <div class="tool-group">
                <button class="btn btn-tool active" id="tool-select" title="Selection / Scroll Mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"></path></svg>
                </button>
                <button class="btn btn-tool" id="tool-pen" title="Pen Tool">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
                </button>
                <button class="btn btn-tool" id="tool-highlighter" title="Highlighter Tool">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11-6 6v3h3l6-6"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></svg>
                </button>
                <button class="btn btn-tool" id="tool-eraser" title="Eraser Tool">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
                </button>
            </div>

            <div class="color-picker-wrapper">
                <span class="control-label">Color:</span>
                <input type="color" id="picker-color" value="#1e293b" title="Stroke Color" />
            </div>

            <div class="color-picker-wrapper">
                <span class="control-label">Size:</span>
                <input type="range" id="slider-size" min="1" max="25" value="3" title="Stroke Thickness" />
            </div>

            <button class="btn" id="btn-clear-page" title="Clear Current Page Annotations">
                Clear Page
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Zoom Controls -->
        <div class="toolbar-section">
            <button class="btn btn-tool" id="btn-zoom-out" title="Zoom Out">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            <span id="zoom-label" class="control-label" style="min-width:42px;text-align:center;">135%</span>
            <button class="btn btn-tool" id="btn-zoom-in" title="Zoom In">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Export & Notepad -->
        <div class="toolbar-section">
            <button class="btn" id="btn-toggle-notepad">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"></path><path d="M15 3v6h6"></path></svg>
                Notepad
            </button>
            <button class="btn" id="btn-export-pdf" title="Save annotated PDF">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Save
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div id="main-workspace">

        <!-- PDF VIEWPORT -->
        <main id="pdf-view-wrapper">
            <div id="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                <h3>No Document Loaded</h3>
                <p>Click "Open PDF" in the toolbar above to load and view your document.</p>
            </div>
            <div id="pdf-container"></div>
        </main>

        <!-- VERTICAL RESIZER -->
        <div id="resizer" title="Drag to resize workspace"></div>

        <!-- NOTEPAD SIDEBAR -->
        <aside id="notepad-pane">
            <div id="notepad-header">
                <h4>Workspace Notepad</h4>
                <div class="notepad-controls">
                    <select id="notepad-bg-select" class="btn" style="padding:4px 8px;font-size:12px;">
                        <option value="bg-red-lined">Red Lined</option>
                        <option value="bg-purple-lined">Purple Lined</option>
                        <option value="bg-dot-grid">Dot Grid</option>
                    </select>
                    <button class="btn btn-tool" id="btn-close-notepad" title="Close Notepad">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div id="notepad-editor-container" class="bg-red-lined">
                <textarea id="notepad-editor" placeholder="Type your notes here..."></textarea>
            </div>
        </aside>

        <!-- ===== GLOBAL DRAWING OVERLAY ===== -->
        <canvas id="global-draw-overlay"></canvas>

    </div>

    <script>
        // ─── PDF.js Worker ──────────────────────────────────────────────
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ─── DOM refs ──────────────────────────────────────────────────
        const fileInput = document.getElementById('pdf-file-input');
        const btnOpenPdf = document.getElementById('btn-open-pdf');
        const docInfo = document.getElementById('doc-info');
        const pdfContainer = document.getElementById('pdf-container');
        const emptyState = document.getElementById('empty-state');
        const pdfViewWrapper = document.getElementById('pdf-view-wrapper');
        const notepadPane = document.getElementById('notepad-pane');
        const resizer = document.getElementById('resizer');
        const btnToggleNotepad = document.getElementById('btn-toggle-notepad');
        const btnCloseNotepad = document.getElementById('btn-close-notepad');
        const notepadBgSelect = document.getElementById('notepad-bg-select');
        const notepadEditorContainer = document.getElementById('notepad-editor-container');

        const toolSelect = document.getElementById('tool-select');
        const toolPen = document.getElementById('tool-pen');
        const toolHighlighter = document.getElementById('tool-highlighter');
        const toolEraser = document.getElementById('tool-eraser');
        const pickerColor = document.getElementById('picker-color');
        const sliderSize = document.getElementById('slider-size');
        const btnClearPage = document.getElementById('btn-clear-page');

        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const zoomLabel = document.getElementById('zoom-label');
        const btnExportPdf = document.getElementById('btn-export-pdf');

        // ─── Global overlay canvas ─────────────────────────────────────
        const overlay = document.getElementById('global-draw-overlay');
        const ctx = overlay.getContext('2d', { alpha: true });

        // ─── State ─────────────────────────────────────────────────────
        let currentPdfDoc = null;
        let currentScale = 1.35;
        let currentTool = 'select';
        let penColor = '#1e293b';
        let highlighterColor = 'rgba(250,204,21,0.4)';
        let strokeWidth = 3;
        let totalPages = 0;

        // ─── Drawing paths store (unified) ────────────────────────────
        let drawingPaths = [];
        let currentPath = null;
        let isDrawing = false;

        // ─── PDF rendering state ──────────────────────────────────────
        let intersectionObserver = null;

        // ─── Resize / redraw throttle ──────────────────────────────────
        let redrawPending = false;

        // ─── Utility: get overlay coords from pointer event ──────────
        function getOverlayCoords(e) {
            const rect = overlay.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // ─── Determine which page (if any) the point is over ────────
        function getPageAtPoint(clientX, clientY) {
            const pageCards = document.querySelectorAll('.pdf-page-card');
            for (const card of pageCards) {
                const rect = card.getBoundingClientRect();
                if (clientX >= rect.left && clientX <= rect.right &&
                    clientY >= rect.top && clientY <= rect.bottom) {
                    return parseInt(card.dataset.pageNum, 10);
                }
            }
            return -1; // not over any page (e.g. notepad or empty area)
        }

        // ─── Redraw all paths on the overlay ─────────────────────────
        function redrawAllPaths() {
            if (redrawPending) return;
            redrawPending = true;
            requestAnimationFrame(() => {
                redrawPending = false;
                const w = overlay.width;
                const h = overlay.height;
                ctx.clearRect(0, 0, w, h);

                for (const path of drawingPaths) {
                    if (path.points.length < 2) continue;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(path.points[0].x, path.points[0].y);
                    for (let i = 1; i < path.points.length; i++) {
                        ctx.lineTo(path.points[i].x, path.points[i].y);
                    }

                    if (path.type === 'eraser') {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.strokeStyle = 'rgba(0,0,0,1)';
                        ctx.lineWidth = path.width * 6;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                    } else if (path.type === 'highlighter') {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = path.color;
                        ctx.lineWidth = path.width * 4;
                        ctx.lineCap = 'square';
                        ctx.lineJoin = 'miter';
                    } else { // pen
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = path.color;
                        ctx.lineWidth = path.width;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                    }
                    ctx.stroke();
                    ctx.restore();
                }
            });
        }

        // ─── Add a completed path to the store ──────────────────────
        function finalizePath() {
            if (currentPath && currentPath.points.length > 1) {
                // Clone the path to avoid reference issues
                drawingPaths.push({
                    points: currentPath.points.map(p => ({ x: p.x, y: p.y })),
                    color: currentPath.color,
                    width: currentPath.width,
                    type: currentPath.type,
                    pageNum: currentPath.pageNum
                });
            }
            currentPath = null;
            redrawAllPaths();
        }

        // ─── Start a new path ─────────────────────────────────────────
        function startNewPath(coords, pageNum) {
            const type = currentTool;
            let color = penColor;
            if (type === 'highlighter') color = highlighterColor;
            if (type === 'eraser') color = 'rgba(0,0,0,1)';

            currentPath = {
                points: [{ x: coords.x, y: coords.y }],
                color: color,
                width: strokeWidth,
                type: type,
                pageNum: pageNum
            };
        }

        // ─── Add a point to the current path ─────────────────────────
        function extendPath(coords) {
            if (!currentPath) return;
            currentPath.points.push({ x: coords.x, y: coords.y });

            // Incremental draw (fast) — but we redraw all on pointerup
            // For smoothness, we draw the segment immediately
            const pts = currentPath.points;
            if (pts.length < 2) return;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pts[pts.length - 2].x, pts[pts.length - 2].y);
            ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);

            const type = currentPath.type;
            if (type === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineWidth = currentPath.width * 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            } else if (type === 'highlighter') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentPath.color;
                ctx.lineWidth = currentPath.width * 4;
                ctx.lineCap = 'square';
                ctx.lineJoin = 'miter';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentPath.color;
                ctx.lineWidth = currentPath.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }
            ctx.stroke();
            ctx.restore();
        }

        // ─── Clear drawing on a specific page ──────────────────────
        function clearPageAnnotations(pageNum) {
            // Remove all paths that belong to this page
            drawingPaths = drawingPaths.filter(p => p.pageNum !== pageNum);
            redrawAllPaths();
        }

        // ─── Get the most visible page in the viewport ──────────────
        function getCurrentVisiblePage() {
            const pageCards = document.querySelectorAll('.pdf-page-card');
            let bestPage = -1;
            let bestArea = 0;
            const viewRect = pdfViewWrapper.getBoundingClientRect();

            for (const card of pageCards) {
                const rect = card.getBoundingClientRect();
                const overlapX = Math.max(0, Math.min(rect.right, viewRect.right) - Math.max(rect.left, viewRect.left));
                const overlapY = Math.max(0, Math.min(rect.bottom, viewRect.bottom) - Math.max(rect.top, viewRect.top));
                const area = overlapX * overlapY;
                if (area > bestArea) {
                    bestArea = area;
                    bestPage = parseInt(card.dataset.pageNum, 10);
                }
            }
            return bestPage;
        }

        // ─── Pointer event handlers (unified) ──────────────────────
        function onPointerDown(e) {
            if (currentTool === 'select') return;
            e.preventDefault();

            const coords = getOverlayCoords(e);
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pageNum = getPageAtPoint(clientX, clientY);

            isDrawing = true;
            startNewPath(coords, pageNum);
            // Draw the initial point (single pixel / dot)
            ctx.save();
            ctx.fillStyle = currentTool === 'eraser' ? 'rgba(0,0,0,1)' :
                (currentTool === 'highlighter' ? highlighterColor : penColor);
            ctx.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : 'source-over';
            ctx.beginPath();
            ctx.arc(coords.x, coords.y, currentTool === 'eraser' ? strokeWidth * 3 : 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function onPointerMove(e) {
            if (!isDrawing || currentTool === 'select') {
                // Update cursor style based on tool
                return;
            }
            e.preventDefault();

            const coords = getOverlayCoords(e);
            extendPath(coords);
        }

        function onPointerUp(e) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;
            finalizePath();
        }

        function onPointerLeave(e) {
            if (isDrawing) {
                // Complete the path if the pointer leaves the overlay
                isDrawing = false;
                finalizePath();
            }
        }

        // ─── Bind events to the overlay ──────────────────────────────
        overlay.addEventListener('pointerdown', onPointerDown);
        overlay.addEventListener('pointermove', onPointerMove);
        overlay.addEventListener('pointerup', onPointerUp);
        overlay.addEventListener('pointerleave', onPointerLeave);

        // Touch events (for better mobile support)
        overlay.addEventListener('touchstart', onPointerDown, { passive: false });
        overlay.addEventListener('touchmove', onPointerMove, { passive: false });
        overlay.addEventListener('touchend', onPointerUp, { passive: false });
        overlay.addEventListener('touchcancel', onPointerUp, { passive: false });

        // ─── Tool selection ───────────────────────────────────────────
        function setTool(tool) {
            currentTool = tool;

            toolSelect.classList.toggle('active', tool === 'select');
            toolPen.classList.toggle('active', tool === 'pen');
            toolHighlighter.classList.toggle('active', tool === 'highlighter');
            toolEraser.classList.toggle('active', tool === 'eraser');

            // Update overlay pointer events and cursor
            if (tool === 'select') {
                overlay.classList.remove('active');
                overlay.classList.remove('eraser-mode');
                overlay.style.cursor = 'default';
            } else {
                overlay.classList.add('active');
                if (tool === 'eraser') {
                    overlay.classList.add('eraser-mode');
                    overlay.style.cursor = 'crosshair';
                } else {
                    overlay.classList.remove('eraser-mode');
                    overlay.style.cursor = 'default';
                }
            }
        }

        toolSelect.addEventListener('click', () => setTool('select'));
        toolPen.addEventListener('click', () => setTool('pen'));
        toolHighlighter.addEventListener('click', () => setTool('highlighter'));
        toolEraser.addEventListener('click', () => setTool('eraser'));

        // ─── Color & size ─────────────────────────────────────────────
        pickerColor.addEventListener('input', (e) => {
            penColor = e.target.value;
            const hex = e.target.value;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            highlighterColor = `rgba(${r},${g},${b},0.35)`;
        });

        sliderSize.addEventListener('input', (e) => {
            strokeWidth = parseInt(e.target.value, 10);
        });

        // ─── Clear Page ──────────────────────────────────────────────
        btnClearPage.addEventListener('click', () => {
            if (!currentPdfDoc) return;
            const pageNum = getCurrentVisiblePage();
            if (pageNum === -1) {
                // If no page is visible, clear all
                drawingPaths = [];
                redrawAllPaths();
                return;
            }
            clearPageAnnotations(pageNum);
        });

        // ─── Zoom ─────────────────────────────────────────────────────
        function applyZoom(newScale) {
            if (!currentPdfDoc) return;
            currentScale = Math.min(Math.max(newScale, 0.5), 3.0);
            zoomLabel.textContent = `${Math.round(currentScale * 100)}%`;

            const pageCards = document.querySelectorAll('.pdf-page-card');
            pageCards.forEach(card => { card.dataset.rendered = 'false'; });

            pageCards.forEach(card => {
                const rect = card.getBoundingClientRect();
                if (rect.top < window.innerHeight * 2 && rect.bottom > -window.innerHeight) {
                    const pageNum = parseInt(card.dataset.pageNum, 10);
                    renderSinglePage(pageNum, card);
                }
            });
        }

        btnZoomIn.addEventListener('click', () => applyZoom(currentScale + 0.15));
        btnZoomOut.addEventListener('click', () => applyZoom(currentScale - 0.15));

        // ─── Notepad toggle ──────────────────────────────────────────
        function hideNotepad() {
            notepadPane.style.display = 'none';
            notepadPane.style.width = '0%';
            notepadPane.style.flex = '0 0 0%';
            resizer.style.display = 'none';
            pdfViewWrapper.style.width = '100%';
            pdfViewWrapper.style.flex = '1 1 100%';
            btnToggleNotepad.classList.remove('active');
            resizeOverlay();
        }

        function showNotepad() {
            notepadPane.style.display = 'flex';
            notepadPane.style.width = '50%';
            notepadPane.style.flex = '0 0 50%';
            resizer.style.display = 'block';
            pdfViewWrapper.style.width = '50%';
            pdfViewWrapper.style.flex = '0 0 50%';
            btnToggleNotepad.classList.add('active');
            resizeOverlay();
        }

        btnToggleNotepad.addEventListener('click', () => {
            if (notepadPane.style.display === 'none' || getComputedStyle(notepadPane).display === 'none') {
                showNotepad();
            } else {
                hideNotepad();
            }
        });

        btnCloseNotepad.addEventListener('click', hideNotepad);

        notepadBgSelect.addEventListener('change', (e) => {
            notepadEditorContainer.className = e.target.value;
        });

        // ─── Resizer logic ────────────────────────────────────────────
        let isResizing = false;
        let resizeAnimationFrame = null;

        function resizeOverlay() {
            const rect = document.getElementById('main-workspace').getBoundingClientRect();
            overlay.width = rect.width * window.devicePixelRatio;
            overlay.height = rect.height * window.devicePixelRatio;
            overlay.style.width = rect.width + 'px';
            overlay.style.height = rect.height + 'px';
            // Scale the canvas context to match CSS pixels
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            // Redraw all paths after resize
            redrawAllPaths();
        }

        function startResizing(e) {
            isResizing = true;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            if (e.pointerId && resizer.setPointerCapture) {
                try { resizer.setPointerCapture(e.pointerId); } catch (_) {}
            }
        }

        function handleResizeMove(e) {
            if (!isResizing) return;
            const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
            if (clientX === undefined) return;

            if (resizeAnimationFrame) cancelAnimationFrame(resizeAnimationFrame);
            resizeAnimationFrame = requestAnimationFrame(() => {
                const windowWidth = window.innerWidth;
                let pdfWidthPct = (clientX / windowWidth) * 100;
                pdfWidthPct = Math.max(15, Math.min(85, pdfWidthPct));
                const notepadWidthPct = 100 - pdfWidthPct;

                pdfViewWrapper.style.width = `${pdfWidthPct}%`;
                pdfViewWrapper.style.flex = `0 0 ${pdfWidthPct}%`;
                notepadPane.style.width = `${notepadWidthPct}%`;
                notepadPane.style.flex = `0 0 ${notepadWidthPct}%`;

                // Resize overlay to match new layout
                resizeOverlay();
            });
        }

        function stopResizing(e) {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                if (e && e.pointerId && resizer.releasePointerCapture) {
                    try { resizer.releasePointerCapture(e.pointerId); } catch (_) {}
                }
                resizeOverlay();
            }
        }

        resizer.addEventListener('pointerdown', startResizing);
        window.addEventListener('pointermove', handleResizeMove);
        window.addEventListener('pointerup', stopResizing);
        window.addEventListener('pointercancel', stopResizing);

        resizer.addEventListener('touchstart', startResizing, { passive: false });
        window.addEventListener('touchmove', handleResizeMove, { passive: false });
        window.addEventListener('touchend', stopResizing);
        window.addEventListener('touchcancel', stopResizing);

        // ─── Resize observer to keep overlay sized ──────────────────
        const resizeObserver = new ResizeObserver(() => { resizeOverlay(); });
        resizeObserver.observe(document.getElementById('main-workspace'));

        // ─── PDF loading ──────────────────────────────────────────────
        btnOpenPdf.addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const safeBuffer = event.target.result.slice(0);
                    pdfjsLib.getDocument({ data: safeBuffer }).promise.then(function(pdf) {
                        currentPdfDoc = pdf;
                        totalPages = pdf.numPages;
                        docInfo.textContent = `${file.name} (${totalPages} ${totalPages === 1 ? 'page' : 'pages'})`;

                        hideNotepad();
                        setTool('select');

                        // Clear old drawing paths
                        drawingPaths = [];
                        redrawAllPaths();

                        if (emptyState) emptyState.style.display = 'none';
                        initializePdfContainer();
                        // Ensure overlay is sized after PDF loads
                        setTimeout(resizeOverlay, 50);
                    }).catch(function(error) {
                        console.error('Error loading PDF:', error);
                        alert('Failed to parse the selected PDF file.');
                    });
                } catch (err) {
                    console.error('Buffer processing error:', err);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // ─── PDF rendering (per-page, with intersection observer) ──
        function initializePdfContainer() {
            pdfContainer.innerHTML = '';
            if (intersectionObserver) intersectionObserver.disconnect();

            intersectionObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageCard = entry.target;
                        const pageNum = parseInt(pageCard.dataset.pageNum, 10);
                        if (pageCard.dataset.rendered !== 'true') {
                            renderSinglePage(pageNum, pageCard);
                        }
                    }
                });
            }, {
                root: pdfViewWrapper,
                rootMargin: '600px 0px',
                threshold: 0.01
            });

            for (let i = 1; i <= totalPages; i++) {
                const pageCard = document.createElement('div');
                pageCard.className = 'pdf-page-card';
                pageCard.dataset.pageNum = i;
                pageCard.style.minHeight = '850px';

                const pageIndicator = document.createElement('div');
                pageIndicator.className = 'page-number-indicator';
                pageIndicator.textContent = `PAGE ${i} OF ${totalPages}`;

                const canvasWrapper = document.createElement('div');
                canvasWrapper.className = 'canvas-wrapper';

                const pdfCanvas = document.createElement('canvas');
                pdfCanvas.className = 'pdf-canvas';

                const drawCanvas = document.createElement('canvas');
                drawCanvas.className = 'drawing-canvas';

                canvasWrapper.appendChild(pdfCanvas);
                canvasWrapper.appendChild(drawCanvas);
                pageCard.appendChild(pageIndicator);
                pageCard.appendChild(canvasWrapper);

                pdfContainer.appendChild(pageCard);
                intersectionObserver.observe(pageCard);
            }

            const firstPageCard = pdfContainer.querySelector('[data-page-num="1"]');
            if (firstPageCard) {
                renderSinglePage(1, firstPageCard);
            }
            // Ensure overlay sizing after PDF container is built
            setTimeout(resizeOverlay, 100);
        }

        function renderSinglePage(pageNum, pageCard) {
            if (!currentPdfDoc || pageCard.dataset.rendering === 'true') return;
            pageCard.dataset.rendering = 'true';

            currentPdfDoc.getPage(pageNum).then(page => {
                const viewport = page.getViewport({ scale: currentScale });
                const pdfCanvas = pageCard.querySelector('.pdf-canvas');
                const drawCanvas = pageCard.querySelector('.drawing-canvas');
                const canvasWrapper = pageCard.querySelector('.canvas-wrapper');

                const pdfCtx = pdfCanvas.getContext('2d');

                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;
                drawCanvas.height = viewport.height;
                drawCanvas.width = viewport.width;

                canvasWrapper.style.width = `${viewport.width}px`;
                canvasWrapper.style.height = `${viewport.height}px`;
                pageCard.style.width = `${viewport.width}px`;
                pageCard.style.height = `${viewport.height}px`;
                pageCard.style.minHeight = `${viewport.height}px`;

                const renderContext = {
                    canvasContext: pdfCtx,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(() => {
                    pageCard.dataset.rendered = 'true';
                    pageCard.dataset.rendering = 'false';
                }).catch(err => {
                    console.error(`Page ${pageNum} render error:`, err);
                    pageCard.dataset.rendering = 'false';
                });
            }).catch(err => {
                console.error(`Fetch page ${pageNum} error:`, err);
                pageCard.dataset.rendering = 'false';
            });
        }

        // ─── Export (Save) — uses PDF page + overlay ──────────────
        btnExportPdf.addEventListener('click', () => {
            if (!currentPdfDoc) {
                alert('Please open a PDF document first.');
                return;
            }

            const page1Card = pdfContainer.querySelector('[data-page-num="1"]');
            if (!page1Card) return;

            const pdfCanvas = page1Card.querySelector('.pdf-canvas');
            if (!pdfCanvas) return;

            // Capture the global overlay drawing
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = pdfCanvas.width;
            tempCanvas.height = pdfCanvas.height;
            const tCtx = tempCanvas.getContext('2d');

            // Draw the PDF page
            tCtx.drawImage(pdfCanvas, 0, 0);

            // Draw the overlay content (scaled to match the page)
            // We need to map the overlay drawing to the page coordinates
            const pageRect = page1Card.getBoundingClientRect();
            const overlayRect = overlay.getBoundingClientRect();

            // Calculate the offset of the page within the overlay
            const offsetX = pageRect.left - overlayRect.left;
            const offsetY = pageRect.top - overlayRect.top;

            // Scale factor: the overlay is in CSS pixels, the page is in its own coordinate space
            // We draw the overlay content onto the temp canvas using the page's dimensions
            const scaleX = pdfCanvas.width / pageRect.width;
            const scaleY = pdfCanvas.height / pageRect.height;

            tCtx.save();
            tCtx.translate(0, 0);
            tCtx.scale(scaleX, scaleY);
            tCtx.drawImage(overlay, offsetX, offsetY, pageRect.width, pageRect.height,
                0, 0, pageRect.width, pageRect.height);
            tCtx.restore();

            const link = document.createElement('a');
            link.download = 'annotated-document-page1.png';
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        });

        // ─── Initial sizing ──────────────────────────────────────────
        window.addEventListener('load', () => {
            resizeOverlay();
            // If no PDF loaded, show empty state
            if (!currentPdfDoc) {
                emptyState.style.display = 'flex';
            }
        });

        // ─── Also resize overlay on window resize ───────────────────
        window.addEventListener('resize', resizeOverlay);

        // ─── Initialize tool state ──────────────────────────────────
        setTool('select');

        // ─── Expose for debugging ──────────────────────────────────
        console.log('✅ Global unified drawing overlay active. Draw continuously across PDF and Notepad.');
    </script>
</body>
</html>
