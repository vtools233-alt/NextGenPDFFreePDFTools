<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notepad & PDF Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
        }

        /* 1. STRICT APPLICATION VIEWPORT BOX */
        #app-container {
            display: flex !important;
            flex-direction: column !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* RIGID FULLY-VISIBLE TOOLBAR LAYOUT */
        #toolbar {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 55px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 0 16px !important;
            background-color: #f5f5f7 !important;
            border-bottom: 1px solid #d2d2d7 !important;
            z-index: 9999 !important;
            flex-shrink: 0 !important;
            box-sizing: border-box !important;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn {
            background: #ffffff;
            border: 1px solid #dcdfe6;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #2c3e50;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            height: 36px;
        }

        .tool-btn:hover {
            background: #e9e9eb;
            border-color: #c0c4cc;
        }

        .tool-btn.active {
            background: #007aff;
            color: #ffffff;
            border-color: #007aff;
        }

        .color-picker {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 0 1px #dcdfe6;
            transition: transform 0.1s ease;
        }

        .color-picker:hover {
            transform: scale(1.1);
        }

        .color-picker.active {
            box-shadow: 0 0 0 2px #007aff;
        }

        /* 2. WORKSPACE BOUNDS & VERTICAL SCROLL STREAM */
        #workspace {
            height: calc(100vh - 55px) !important;
            width: 100% !important;
            display: flex !important;
            position: relative !important;
            overflow: hidden !important;
            background-color: #e5e9f0;
        }

        #pdf-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            box-sizing: border-box;
        }

        /* IN-STREAM PAGE CONTAINER SETUP */
        .page-wrapper {
            position: relative !important;
            z-index: 1 !important;
            width: 100%;
            max-width: 794px;
            height: 1123px;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            overflow: hidden;
            box-sizing: border-box;
            flex-shrink: 0;
            transition: box-shadow 0.2s ease;
        }

        .page-wrapper.active-page {
            box-shadow: 0 0 0 3px #007aff, 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        canvas.drawing-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: auto;
            touch-action: none;
        }

        .page-number-tag {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 11px;
            color: #909399;
            z-index: 3;
            user-select: none;
        }

        /* TEMPLATE BACKGROUND PATTERNS */
        .bg-plain-white {
            background-color: #ffffff;
        }

        .bg-lined-white {
            background-color: #ffffff;
            background-image: repeating-linear-gradient(#ffffff, #ffffff 31px, #e1e8ed 31px, #e1e8ed 32px);
            background-position: 0 40px;
        }

        .bg-lined-white::before {
            content: '';
            position: absolute;
            top: 0;
            left: 60px;
            width: 2px;
            height: 100%;
            background-color: #ff8a80;
        }

        .bg-dot-grid {
            background-color: #ffffff;
            background-image: radial-gradient(#c5cae9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .bg-yellow-blank {
            background-color: #fffde7;
        }

        .bg-yellow-lined {
            background-color: #fffde7;
            background-image: repeating-linear-gradient(#fffde7, #fffde7 31px, #e6ee9c 31px, #e6ee9c 32px);
            background-position: 0 40px;
        }

        .bg-yellow-lined::before {
            content: '';
            position: absolute;
            top: 0;
            left: 60px;
            width: 2px;
            height: 100%;
            background-color: #ff8a80;
        }

        /* 3. "+ PAGE" MODAL OVERFLOW & LAYOUT FIX */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.active {
            display: flex;
        }

        #add-page-modal .modal-card {
            background: #ffffff;
            width: 90%;
            max-width: 520px;
            max-height: 80vh !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ebeef5;
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }

        .close-btn {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #909399;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        .template-option {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            background: #f9fafb;
        }

        .template-option:hover {
            border-color: #007aff;
            background: #ecf5ff;
            transform: translateY(-2px);
        }

        .template-preview {
            width: 100%;
            height: 90px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .template-label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            text-align: center;
        }

        .upload-section {
            border-top: 1px solid #ebeef5;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- APPLICATION VIEWPORT WRAPPER -->
    <div id="app-container">
        
        <!-- RIGID TOOLBAR (HEIGHT: 55px, Z-INDEX: 9999) -->
        <div id="toolbar">
            <div class="tool-group">
                <button id="btn-pen" class="tool-btn active" title="Pen Tool">✏️ Pen</button>
                <button id="btn-eraser" class="tool-btn" title="Eraser Tool">🧹 Eraser</button>
                <input type="range" id="stroke-width" min="1" max="30" value="3" title="Stroke Thickness" style="width: 80px; cursor: pointer;">
            </div>

            <div class="tool-group">
                <div class="color-picker active" style="background-color: #000000;" data-color="#000000"></div>
                <div class="color-picker" style="background-color: #2563eb;" data-color="#2563eb"></div>
                <div class="color-picker" style="background-color: #dc2626;" data-color="#dc2626"></div>
                <div class="color-picker" style="background-color: #16a34a;" data-color="#16a34a"></div>
                <input type="color" id="custom-color-picker" value="#000000" style="width: 26px; height: 26px; border: none; background: none; cursor: pointer;">
            </div>

            <div class="tool-group">
                <button id="btn-add-page" class="tool-btn" style="background: #ecf5ff; color: #007aff; border-color: #b3d8ff;">➕ Add Page</button>
                <button id="btn-clear" class="tool-btn" title="Clear Canvas">🗑️ Clear</button>
                <button id="btn-export" class="tool-btn" style="background: #f0f9eb; color: #67c23a; border-color: #c2e7b0;">💾 Export PDF / Print</button>
            </div>
        </div>

        <!-- MAIN WORKSPACE CONTAINING PAGE STREAM (HEIGHT: CALC(100VH - 55PX)) -->
        <div id="workspace">
            <div id="pdf-container">
                <!-- Pages dynamically inserted here -->
            </div>
        </div>

    </div>

    <!-- ADD PAGE MODAL WITH ALL 5 CUSTOM TEMPLATES -->
    <div id="add-page-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Insert New Page</span>
                <button class="close-btn" id="modal-close-btn">&times;</button>
            </div>

            <div class="template-grid">
                <!-- 1. Plain White -->
                <div class="template-option" data-template="bg-plain-white">
                    <div class="template-preview bg-plain-white"></div>
                    <span class="template-label">1. Plain White</span>
                </div>

                <!-- 2. Lined White -->
                <div class="template-option" data-template="bg-lined-white">
                    <div class="template-preview bg-lined-white"></div>
                    <span class="template-label">2. Lined White</span>
                </div>

                <!-- 3. Dot Grid -->
                <div class="template-option" data-template="bg-dot-grid">
                    <div class="template-preview bg-dot-grid"></div>
                    <span class="template-label">3. Dot Grid</span>
                </div>

                <!-- 4. Light Yellow Blank -->
                <div class="template-option" data-template="bg-yellow-blank">
                    <div class="template-preview bg-yellow-blank"></div>
                    <span class="template-label">4. Light Yellow Blank</span>
                </div>

                <!-- 5. Light Yellow Lined -->
                <div class="template-option" data-template="bg-yellow-lined">
                    <div class="template-preview bg-yellow-lined"></div>
                    <span class="template-label">5. Light Yellow Lined</span>
                </div>
            </div>

            <div class="upload-section">
                <span class="template-label" style="text-align: left;">Or Append Image / Photo Document:</span>
                <div class="file-input-wrapper">
                    <button class="tool-btn btn-block">📷 Upload Photo / Camera Image</button>
                    <input type="file" id="image-upload-input" accept="image/*">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pdfContainer = document.getElementById('pdf-container');
            const modal = document.getElementById('add-page-modal');
            const btnAddPage = document.getElementById('btn-add-page');
            const modalCloseBtn = document.getElementById('modal-close-btn');
            const imageUploadInput = document.getElementById('image-upload-input');

            const btnPen = document.getElementById('btn-pen');
            const btnEraser = document.getElementById('btn-eraser');
            const strokeWidthInput = document.getElementById('stroke-width');
            const colorPickers = document.querySelectorAll('.color-picker');
            const customColorPicker = document.getElementById('custom-color-picker');
            const btnClear = document.getElementById('btn-clear');
            const btnExport = document.getElementById('btn-export');

            let currentTool = 'pen';
            let strokeColor = '#000000';
            let strokeWidth = 3;
            let activePageWrapper = null;
            let pageCount = 0;

            // Initialize Page Stream with 1 Default Page
            insertNewPage('bg-lined-white');

            // Modal Controls
            btnAddPage.addEventListener('click', () => {
                modal.classList.add('active');
            });

            modalCloseBtn.addEventListener('click', closeModal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });

            function closeModal() {
                modal.classList.remove('active');
            }

            // Template Selection
            document.querySelectorAll('.template-option').forEach(option => {
                option.addEventListener('click', () => {
                    const templateClass = option.getAttribute('data-template');
                    insertNewPage(templateClass);
                    closeModal();
                });
            });

            // Camera / Photo Upload
            imageUploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        insertPhotoPage(event.target.result);
                        closeModal();
                        imageUploadInput.value = '';
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Drawing Tool Listeners
            btnPen.addEventListener('click', () => {
                currentTool = 'pen';
                btnPen.classList.add('active');
                btnEraser.classList.remove('active');
            });

            btnEraser.addEventListener('click', () => {
                currentTool = 'eraser';
                btnEraser.classList.add('active');
                btnPen.classList.remove('active');
            });

            strokeWidthInput.addEventListener('input', (e) => {
                strokeWidth = parseInt(e.target.value, 10);
            });

            colorPickers.forEach(picker => {
                picker.addEventListener('click', () => {
                    colorPickers.forEach(p => p.classList.remove('active'));
                    picker.classList.add('active');
                    strokeColor = picker.getAttribute('data-color');
                    customColorPicker.value = strokeColor;
                    if (currentTool === 'eraser') {
                        btnPen.click();
                    }
                });
            });

            customColorPicker.addEventListener('input', (e) => {
                strokeColor = e.target.value;
                colorPickers.forEach(p => p.classList.remove('active'));
                if (currentTool === 'eraser') {
                    btnPen.click();
                }
            });

            btnClear.addEventListener('click', () => {
                if (activePageWrapper) {
                    const canvas = activePageWrapper.querySelector('canvas.drawing-layer');
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                }
            });

            btnExport.addEventListener('click', () => {
                window.print();
            });

            // TARGETED IN-PLACE PLACEMENT & STACKING
            function insertNewPage(templateClass, photoSrc = null) {
                pageCount++;

                const pageWrapper = document.createElement('div');
                pageWrapper.className = `page-wrapper ${templateClass || ''}`;

                const canvas = document.createElement('canvas');
                canvas.className = 'drawing-layer';

                const pageNumTag = document.createElement('div');
                pageNumTag.className = 'page-number-tag';
                pageNumTag.innerText = `Page ${pageCount}`;

                pageWrapper.appendChild(canvas);
                pageWrapper.appendChild(pageNumTag);

                if (photoSrc) {
                    const img = document.createElement('img');
                    img.src = photoSrc;
                    img.style.position = 'absolute';
                    img.style.top = '0';
                    img.style.left = '0';
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'contain';
                    img.style.zIndex = '1';
                    pageWrapper.insertBefore(img, canvas);
                }

                // Insert underneath active sheet or append into scroll stream
                if (activePageWrapper && activePageWrapper.parentNode === pdfContainer) {
                    activePageWrapper.after(pageWrapper);
                } else {
                    pdfContainer.appendChild(pageWrapper);
                }

                setupCanvas(pageWrapper, canvas);
                setActivePage(pageWrapper);
                updatePageNumbers();

                pageWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            function insertPhotoPage(photoSrc) {
                insertNewPage('bg-plain-white', photoSrc);
            }

            function setActivePage(wrapper) {
                document.querySelectorAll('.page-wrapper').forEach(p => p.classList.remove('active-page'));
                wrapper.classList.add('active-page');
                activePageWrapper = wrapper;
            }

            function updatePageNumbers() {
                const pages = pdfContainer.querySelectorAll('.page-wrapper');
                pages.forEach((page, index) => {
                    const tag = page.querySelector('.page-number-tag');
                    if (tag) {
                        tag.innerText = `Page ${index + 1}`;
                    }
                });
            }

            function setupCanvas(wrapper, canvas) {
                const rect = wrapper.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = (rect.width || 794) * dpr;
                canvas.height = (rect.height || 1123) * dpr;

                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);

                let isDrawing = false;
                let lastX = 0;
                let lastY = 0;

                function getCoords(e) {
                    const r = canvas.getBoundingClientRect();
                    let clientX = e.clientX;
                    let clientY = e.clientY;

                    if (e.touches && e.touches.length > 0) {
                        clientX = e.touches[0].clientX;
                        clientY = e.touches[0].clientY;
                    }

                    return {
                        x: clientX - r.left,
                        y: clientY - r.top
                    };
                }

                function startDrawing(e) {
                    isDrawing = true;
                    setActivePage(wrapper);
                    const coords = getCoords(e);
                    lastX = coords.x;
                    lastY = coords.y;
                }

                function draw(e) {
                    if (!isDrawing) return;
                    e.preventDefault();

                    const coords = getCoords(e);
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(coords.x, coords.y);

                    if (currentTool === 'eraser') {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.lineWidth = strokeWidth * 3;
                    } else {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = strokeColor;
                        ctx.lineWidth = strokeWidth;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                    }

                    ctx.stroke();
                    lastX = coords.x;
                    lastY = coords.y;
                }

                function stopDrawing() {
                    isDrawing = false;
                }

                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseleave', stopDrawing);

                canvas.addEventListener('touchstart', startDrawing, { passive: false });
                canvas.addEventListener('touchmove', draw, { passive: false });
                canvas.addEventListener('touchend', stopDrawing);

                wrapper.addEventListener('click', () => {
                    setActivePage(wrapper);
                });
            }
        });
    </script>
</body>
</html>
