                    if (pagesStr) {
                        const parsed = JSON.parse(pagesStr);
                        notesPages = parsed.map(p => ({
                            strokes: p.strokes || [],
                            highlights: p.highlights || [],
                            text: p.text || '',
                            template: p.template || 'template-plain-white',
                            undoStack: p.undoStack || [],
                        }));
                    } else {
                        // If no pages, create a default
                        notesPages = [{
                            strokes: [],
                            highlights: [],
                            text: '',
                            template: 'template-plain-white',
                            undoStack: [],
                        }];
                    }
                    const currentPage = localStorage.getItem('currentNotesPage');
                    if (currentPage !== null) {
                        const idx = parseInt(currentPage);
                        if (idx >= 0 && idx < notesPages.length) currentNotesPage = idx;
                    }
                    // Load notes text (old key) - we can migrate to the first page if it's empty
                    const oldNotesText = localStorage.getItem('notesText');
                    if (oldNotesText && notesPages.length > 0 && notesPages[0].text === '') {
                        notesPages[0].text = oldNotesText;
                    }
                    // Apply template to current page
                    applyTemplate(currentNotesPage);
                    // Update textarea
                    notesTextarea.value = notesPages[currentNotesPage].text || '';

                    // Load sticky notes and connectors
                    loadConnectorsAndNotes();
                } catch (_) { /* ignore */ }
            }

            function updateBadge(panel) {
                if (panel === 'pdf') {
                    const count = pdfData.strokes.length + (pdfData.highlights ? pdfData.highlights.length : 0);
                    if (pdfDoc) {
                        pdfBadge.textContent = `Page ${pdfPageNum} · ${count} marks`;
                    } else {
                        pdfBadge.textContent = count > 0 ? `${count} marks` : 'No file';
                    }
                } else {
                    const totalPages = notesPages.length;
                    const pageNum = currentNotesPage + 1;
                    const count = notesPages[currentNotesPage].strokes.length;
                    notesBadge.textContent = `${pageNum}/${totalPages} · ${count} strokes`;
                }
            }

            // ============================================================
            //  NOTES POPUP MANAGEMENT
            // ============================================================

            function toggleNotepad(show) {
                if (show === undefined) {
                    notepadPopup.classList.toggle('visible');
                } else {
                    notepadPopup.classList.toggle('visible', show);
                }
                if (notepadPopup.classList.contains('visible')) {
                    // Ensure canvas is sized
                    setTimeout(() => {
                        resizeCanvases();
                    }, 50);
                    // Update page info
                    updatePageInfo();
                }
            }

            btnToggleNotes.addEventListener('click', function() {
                toggleNotepad();
            });

            closeNotepad.addEventListener('click', function() {
                toggleNotepad(false);
            });

            // Dragging the popup
            let dragData = null;
            notepadHeader.addEventListener('pointerdown', function(e) {
                if (e.target.closest('.controls')) return;
                const rect = notepadPopup.getBoundingClientRect();
                dragData = {
                    offsetX: e.clientX - rect.left,
                    offsetY: e.clientY - rect.top,
                };
                notepadPopup.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            document.addEventListener('pointermove', function(e) {
                if (!dragData) return;
                const parentRect = mainContainer.getBoundingClientRect();
                let left = e.clientX - parentRect.left - dragData.offsetX;
                let top = e.clientY - parentRect.top - dragData.offsetY;
                // Clamp to container
                left = Math.max(0, Math.min(left, parentRect.width - notepadPopup.offsetWidth));
                top = Math.max(0, Math.min(top, parentRect.height - notepadPopup.offsetHeight));
                notepadPopup.style.left = left + 'px';
                notepadPopup.style.top = top + 'px';
                notepadPopup.style.right = 'auto';
                e.preventDefault();
            });

            document.addEventListener('pointerup', function(e) {
                if (dragData) {
                    dragData = null;
                    notepadPopup.releasePointerCapture(e.pointerId);
                }
            });

            // ============================================================
            //  NOTES PAGE MANAGEMENT
            // ============================================================

            function applyTemplate(pageIndex) {
                const page = notesPages[pageIndex];
                if (!page) return;
                // Remove all template classes from notesContent
                notesContent.className = 'notes-content ' + page.template;
                templateSelector.value = page.template;
            }

            function updatePageInfo() {
                const total = notesPages.length;
                const current = currentNotesPage + 1;
                pageIndicator.textContent = `Page ${current}`;
                pageInfo.textContent = `${current} / ${total}`;
                prevPageBtn.disabled = (currentNotesPage === 0);
                nextPageBtn.disabled = (currentNotesPage === total - 1);
                // Update textarea content
                notesTextarea.value = notesPages[currentNotesPage].text || '';
                // Update template
                applyTemplate(currentNotesPage);
                // Redraw strokes for current page
                redrawAllStrokes('notes');
                updateBadge('notes');
                // Save state
                saveToLocalStorage('notes');
            }

            function goToPage(index) {
                if (index < 0 || index >= notesPages.length) return;
                // Save current page text before switching
                notesPages[currentNotesPage].text = notesTextarea.value;
                currentNotesPage = index;
                updatePageInfo();
                // Redraw notes canvas
                redrawAllStrokes('notes');
                // Update connectors (sticky notes are independent)
                updateConnectors();
            }

            prevPageBtn.addEventListener('click', function() {
                if (currentNotesPage > 0) goToPage(currentNotesPage - 1);
            });

            nextPageBtn.addEventListener('click', function() {
                if (currentNotesPage < notesPages.length - 1) goToPage(currentNotesPage + 1);
            });

            addPageBtn.addEventListener('click', function() {
                // Save current page text
                notesPages[currentNotesPage].text = notesTextarea.value;
                // Create new page with same template
                const currentTemplate = notesPages[currentNotesPage].template;
                const newPage = {
                    strokes: [],
                    highlights: [],
                    text: '',
                    template: currentTemplate,
                    undoStack: [],
                };
                notesPages.push(newPage);
                // Go to new page
                currentNotesPage = notesPages.length - 1;
                updatePageInfo();
                // Clear textarea
                notesTextarea.value = '';
                redrawAllStrokes('notes');
                saveToLocalStorage('notes');
                updateBadge('notes');
            });

            templateSelector.addEventListener('change', function() {
                const page = notesPages[currentNotesPage];
                page.template = this.value;
                applyTemplate(currentNotesPage);
                saveToLocalStorage('notes');
            });

            // Auto-save notes text on input
            let notesSaveTimeout = null;
            notesTextarea.addEventListener('input', function() {
                clearTimeout(notesSaveTimeout);
                notesSaveTimeout = setTimeout(() => {
                    notesPages[currentNotesPage].text = this.value;
                    saveToLocalStorage('notes');
                }, 400);
            });

            // ============================================================
            //  TOOLBAR EVENTS (updated to handle notes panel)
            // ============================================================

            function setTool(tool) {
                state.tool = tool;
                document.querySelectorAll('.toolbar button[data-tool]').forEach(b => b.classList.remove('active'));
                const map = { pen: btnPen, highlighter: btnHighlighter, eraser: btnEraser, select: btnSelect,
                    gesture: btnGesture, connect: btnConnect };
                if (map[tool]) map[tool].classList.add('active');

                // Update both PDF and Notes canvases
                const pdfOverlay = pdfCanvas;
                const notesOverlay = notesCanvas;
                const isSelect = tool === 'select';
                const isEraser = tool === 'eraser';
                const isGesture = tool === 'gesture';
                const isConnect = tool === 'connect';

                pdfOverlay.classList.toggle('active', !isSelect && !isGesture && !isConnect);
                pdfOverlay.classList.toggle('eraser-active', isEraser);
                pdfOverlay.classList.toggle('select-active', isSelect);
                pdfOverlay.classList.toggle('gesture-active', isGesture);
                pdfOverlay.classList.toggle('connect-active', isConnect);

                notesOverlay.classList.toggle('active', !isSelect && !isGesture && !isConnect);
                notesOverlay.classList.toggle('eraser-active', isEraser);
                notesOverlay.classList.toggle('select-active', isSelect);
                notesOverlay.classList.toggle('gesture-active', isGesture);
                notesOverlay.classList.toggle('connect-active', isConnect);

                // Update active panel for drawing
                if (tool === 'connect') {
                    state.activePanel = 'pdf'; // connect only works on PDF
                } else if (tool === 'gesture') {
                    state.activePanel = 'pdf';
                } else {
                    // If notes popup is visible, default to notes for drawing tools, else pdf
                    if (notepadPopup.classList.contains('visible')) {
                        state.activePanel = 'notes';
                    } else {
                        state.activePanel = 'pdf';
                    }
                }
            }

            // Override: when popup opens, set active panel to notes if drawing tools selected
            notepadPopup.addEventListener('transitionend', function() {
                if (this.classList.contains('visible')) {
                    if (['pen', 'highlighter', 'eraser'].includes(state.tool)) {
                        state.activePanel = 'notes';
                    }
                } else {
                    state.activePanel = 'pdf';
                }
            });

            // Click on notes canvas to set active panel
            notesCanvas.addEventListener('pointerdown', function() {
                if (notepadPopup.classList.contains('visible')) {
                    state.activePanel = 'notes';
                }
            });
            pdfCanvas.addEventListener('pointerdown', function() {
                state.activePanel = 'pdf';
            });

            btnPen.addEventListener('click', () => setTool('pen'));
            btnHighlighter.addEventListener('click', () => setTool('highlighter'));
            btnEraser.addEventListener('click', () => setTool('eraser'));
            btnSelect.addEventListener('click', () => setTool('select'));
            btnGesture.addEventListener('click', () => setTool('gesture'));
            btnConnect.addEventListener('click', () => setTool('connect'));

            colorPicker.addEventListener('input', function() {
                state.color = this.value;
            });

            sizeSlider.addEventListener('input', function() {
                state.size = parseFloat(this.value);
                sizeLabel.textContent = state.size;
            });

            btnClear.addEventListener('click', function() {
                const panel = state.activePanel;
                if (confirm(`Clear all drawings on ${panel === 'pdf' ? 'PDF' : 'current notes page'}?`)) {
                    clearAllStrokes(panel);
                }
            });

            btnUndo.addEventListener('click', function() {
                const panel = state.activePanel;
                undoLastStroke(panel);
            });

            // ============================================================
            //  CONNECT TOOL (unchanged, but sticky notes go into notesContent)
            // ============================================================

            function getHighlightIndexAt(clientX, clientY) {
                if (!pdfDoc) return -1;
                const rect = pdfCanvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                const highlights = pdfData.highlights;
                for (let i = 0; i < highlights.length; i++) {
                    const hl = highlights[i];
                    if (hl.page !== pdfPageNum) continue;
                    const hx = hl.rect.x * pdfScale + pdfOffsetX;
                    const hy = hl.rect.y * pdfScale + pdfOffsetY;
                    const hw = hl.rect.width * pdfScale;
                    const hh = hl.rect.height * pdfScale;
                    if (x >= hx && x <= hx + hw && y >= hy && y <= hy + hh) {
                        return i;
                    }
                }
                return -1;
            }

            function createGhost(text, x, y) {
                const ghost = document.createElement('div');
                ghost.className = 'sticky-note';
                ghost.style.position = 'fixed';
                ghost.style.pointerEvents = 'none';
                ghost.style.opacity = '0.7';
                ghost.style.zIndex = '1000';
                ghost.style.left = (x - 30) + 'px';
                ghost.style.top = (y - 20) + 'px';
                ghost.style.width = 'auto';
                ghost.style.maxWidth = '200px';
                ghost.style.background = '#fff9c4';
                ghost.style.padding = '6px 10px';
                ghost.style.borderRadius = '6px';
                ghost.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
                ghost.textContent = text;
                document.body.appendChild(ghost);
                return ghost;
            }

            pdfCanvas.addEventListener('pointerdown', function(e) {
                if (state.tool !== 'connect') return;
                const idx = getHighlightIndexAt(e.clientX, e.clientY);
                if (idx === -1) return;
                const highlight = pdfData.highlights[idx];
                if (!highlight) return;

                connectDrag.active = true;
                connectDrag.highlightIndex = idx;
                connectDrag.ghostElement = createGhost(highlight.text, e.clientX, e.clientY);
                this.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            pdfCanvas.addEventListener('pointermove', function(e) {
                if (state.tool !== 'connect' || !connectDrag.active) return;
                const ghost = connectDrag.ghostElement;
                if (ghost) {
                    ghost.style.left = (e.clientX - 30) + 'px';
                    ghost.style.top = (e.clientY - 20) + 'px';
                }
                e.preventDefault();
            });

            pdfCanvas.addEventListener('pointerup', function(e) {
                if (state.tool !== 'connect' || !connectDrag.active) {
                    this.releasePointerCapture(e.pointerId);
                    return;
                }
                const idx = connectDrag.highlightIndex;
                if (idx === -1) {
                    cleanupConnectDrag();
                    this.releasePointerCapture(e.pointerId);
                    return;
                }
                // Check if drop is over the notepad popup (notesContent area)
                const notesRect = notesContent.getBoundingClientRect();
                const dropX = e.clientX;
                const dropY = e.clientY;
                if (dropX >= notesRect.left && dropX <= notesRect.right &&
                    dropY >= notesRect.top && dropY <= notesRect.bottom) {
                    const highlight = pdfData.highlights[idx];
                    if (highlight) {
                        // Position relative to notesContent (scrollable)
                        const relX = dropX - notesRect.left + notesContent.scrollLeft;
                        const relY = dropY - notesRect.top + notesContent.scrollTop;
                        const noteId = nextNoteId++;
                        const card = createStickyNoteElement(noteId, highlight.text, relX, relY);
                        notesContent.appendChild(card);
                        connectors.push({
                            id: nextConnectorId++,
                            highlightIndex: idx,
                            noteId: noteId,
                            cardElement: card,
                        });
                        saveConnectorsAndNotes();
                        updateConnectors();
                        updateBadge('pdf');
                    }
                }
                cleanupConnectDrag();
                this.releasePointerCapture(e.pointerId);
            });

            pdfCanvas.addEventListener('pointercancel', function(e) {
                if (connectDrag.active) {
                    cleanupConnectDrag();
                    this.releasePointerCapture(e.pointerId);
                }
            });

            function cleanupConnectDrag() {
                if (connectDrag.ghostElement) {
                    connectDrag.ghostElement.remove();
                    connectDrag.ghostElement = null;
                }
                connectDrag.active = false;
                connectDrag.highlightIndex = -1;
            }

            // ============================================================
            //  STICKY NOTES (placed inside notesContent)
            // ============================================================

            function createStickyNoteElement(id, text, left, top) {
                const div = document.createElement('div');
                div.className = 'sticky-note';
                div.dataset.noteId = id;
                div.style.left = left + 'px';
                div.style.top = top + 'px';

                const textSpan = document.createElement('span');
                textSpan.className = 'note-text';
                textSpan.textContent = text;
                div.appendChild(textSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'note-delete';
                delBtn.textContent = '✕';
                delBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    removeStickyNote(id);
                });
                div.appendChild(delBtn);

                let dragData = null;
                div.addEventListener('pointerdown', function(e) {
                    if (e.target === delBtn) return;
                    const rect = div.getBoundingClientRect();
                    dragData = {
                        offsetX: e.clientX - rect.left,
                        offsetY: e.clientY - rect.top,
                        startLeft: parseFloat(div.style.left),
                        startTop: parseFloat(div.style.top),
                    };
                    div.classList.add('dragging');
                    div.setPointerCapture(e.pointerId);
                    e.preventDefault();
                });

                div.addEventListener('pointermove', function(e) {
                    if (!dragData) return;
                    const containerRect = notesContent.getBoundingClientRect();
                    let newLeft = e.clientX - containerRect.left - dragData.offsetX + notesContent.scrollLeft;
                    let newTop = e.clientY - containerRect.top - dragData.offsetY + notesContent.scrollTop;
                    newLeft = Math.max(0, newLeft);
                    newTop = Math.max(0, newTop);
                    div.style.left = newLeft + 'px';
                    div.style.top = newTop + 'px';
                    updateConnectors();
                    e.preventDefault();
                });

                div.addEventListener('pointerup', function(e) {
                    if (dragData) {
                        div.classList.remove('dragging');
                        dragData = null;
                        saveConnectorsAndNotes();
                        updateConnectors();
                        this.releasePointerCapture(e.pointerId);
                    }
                });

                div.addEventListener('pointercancel', function(e) {
                    if (dragData) {
                        div.classList.remove('dragging');
                        dragData = null;
                        this.releasePointerCapture(e.pointerId);
                    }
                });

                return div;
            }

            function createStickyNoteFromData(id, text, left, top) {
                const card = createStickyNoteElement(id, text, left, top);
                notesContent.appendChild(card);
                if (id >= nextNoteId) nextNoteId = id + 1;
                return card;
            }

            function removeStickyNote(id) {
                const noteEl = notesContent.querySelector(`.sticky-note[data-note-id="${id}"]`);
                if (noteEl) noteEl.remove();
                connectors = connectors.filter(c => c.noteId !== id);
                saveConnectorsAndNotes();
                updateConnectors();
            }

            // ============================================================
            //  CONNECTOR DRAWING (unchanged)
            // ============================================================

            function updateConnectors() {
                const ctx = drawState.connector;
                if (!ctx) return;
                const dpr = window.devicePixelRatio || 1;
                const canvas = connectorCanvas;
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (!pdfDoc) return;

                for (let conn of connectors) {
                    const hl = pdfData.highlights[conn.highlightIndex];
                    if (!hl || hl.page !== pdfPageNum) continue;
                    const cx = (hl.rect.x + hl.rect.width / 2) * pdfScale + pdfOffsetX;
                    const cy = (hl.rect.y + hl.rect.height / 2) * pdfScale + pdfOffsetY;
                    const pdfRect = pdfCanvas.getBoundingClientRect();
                    const mainRect = mainContainer.getBoundingClientRect();
                    const srcX = pdfRect.left + cx - mainRect.left;
                    const srcY = pdfRect.top + cy - mainRect.top;

                    const card = conn.cardElement;
                    if (!card || !card.isConnected) continue;
                    const cardRect = card.getBoundingClientRect();
                    const tgtX = cardRect.left + cardRect.width / 2 - mainRect.left;
                    const tgtY = cardRect.top + cardRect.height / 2 - mainRect.top;

                    ctx.save();
                    ctx.strokeStyle = '#0969da';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.6;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.moveTo(srcX, srcY);
                    const dx = tgtX - srcX;
                    const dy = tgtY - srcY;
                    const cp1x = srcX + dx * 0.4;
                    const cp1y = srcY;
                    const cp2x = srcX + dx * 0.6;
                    const cp2y = tgtY;
                    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tgtX, tgtY);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.fillStyle = '#0969da';
                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.arc(srcX, srcY, 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(tgtX, tgtY, 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ============================================================
            //  POINTER EVENTS FOR DRAWING (adapted)
            // ============================================================

            function getPointerCoords(e, canvas) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                return { x, y };
            }

            function handlePointerDown(e, panel) {
                if (state.tool === 'select' || state.tool === 'connect') return;
                const canvas = panel === 'pdf' ? pdfCanvas : notesCanvas;
                const coords = getPointerCoords(e, canvas);
                const rect = canvas.getBoundingClientRect();
                if (coords.x < 0 || coords.y < 0 || coords.x > rect.width || coords.y > rect.height) return;

                // If panel is notes but popup not visible, ignore
                if (panel === 'notes' && !notepadPopup.classList.contains('visible')) return;

                state.activePanel = panel;
                startStroke(panel, coords.x, coords.y);
                canvas.setPointerCapture(e.pointerId);
            }

            function handlePointerMove(e, panel) {
                if (state.tool === 'select' || state.tool === 'connect') return;
                const canvas = panel === 'pdf' ? pdfCanvas : notesCanvas;
                const coords = getPointerCoords(e, canvas);
                const rect = canvas.getBoundingClientRect();
                if (coords.x < 0 || coords.y < 0 || coords.x > rect.width || coords.y > rect.height) {
                    if (drawState[panel].isDrawing) {
                        endStroke(panel);
                    }
                    return;
                }
                if (drawState[panel].isDrawing) {
                    continueStroke(panel, coords.x, coords.y);
                }
            }

            function handlePointerUp(e, panel) {
                if (state.tool === 'select' || state.tool === 'connect') return;
                if (drawState[panel].isDrawing) {
                    endStroke(panel);
                }
                const canvas = panel === 'pdf' ? pdfCanvas : notesCanvas;
                canvas.releasePointerCapture(e.pointerId);
            }

            function attachPointerEvents(canvas, panel) {
                canvas.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handlePointerDown(e, panel);
                });
                canvas.addEventListener('pointermove', (e) => {
                    e.preventDefault();
                    handlePointerMove(e, panel);
                });
                canvas.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    handlePointerUp(e, panel);
                });
                canvas.addEventListener('pointerleave', (e) => {
                    if (drawState[panel].isDrawing) {
                        endStroke(panel);
                    }
                });
                canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            attachPointerEvents(pdfCanvas, 'pdf');
            attachPointerEvents(notesCanvas, 'notes');

            // ============================================================
            //  FULLSCREEN (unchanged)
            // ============================================================

            btnFullscreen.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().then(() => {
                        document.body.classList.add('is-fullscreen');
                    }).catch(() => {});
                } else {
                    document.exitFullscreen().then(() => {
                        document.body.classList.remove('is-fullscreen');
                    }).catch(() => {});
                }
            });

            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement) {
                    document.body.classList.remove('is-fullscreen');
                }
            });

            // ============================================================
            //  WINDOW RESIZE / SCROLL
            // ============================================================
            let resizeTimeout = null;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    resizeCanvases();
                }, 200);
            });

            pdfViewer.addEventListener('scroll', updateConnectors);
            notesContent.addEventListener('scroll', updateConnectors);

            if (window.ResizeObserver) {
                const ro = new ResizeObserver(() => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(resizeCanvases, 150);
                });
                ro.observe(pdfViewer);
                ro.observe(notesContent);
            }

            // Connector animation loop
            let frameId = null;

            function startConnectorUpdater() {
                if (frameId) return;
                (function tick() {
                    if (connectors.length > 0) {
                        updateConnectors();
                    }
                    frameId = requestAnimationFrame(tick);
                })();
            }
            startConnectorUpdater();

            // ============================================================
            //  BACKUP & RESTORE (updated to include notes pages)
            // ============================================================

            function exportBackup() {
                const backup = {
                    version: '1.0',
                    timestamp: new Date().toISOString(),
                    data: {}
                };
                const keys = [
                    'pdfDrawings',
                    'notesPages',
                    'currentNotesPage',
                    'stickyNotes',
                    'connectors',
                    'pdfFileData'
                ];
                for (let key of keys) {
                    const val = localStorage.getItem(key);
                    if (val !== null) {
                        backup.data[key] = val;
                    }
                }
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function importBackup(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const backup = JSON.parse(e.target.result);
                        if (!backup.data || typeof backup.data !== 'object') {
                            alert('Invalid backup file format.');
                            return;
                        }
                        for (let key in backup.data) {
                            localStorage.setItem(key, backup.data[key]);
                        }
                        alert('Backup restored successfully. The app will now reload.');
                        location.reload();
                    } catch (err) {
                        alert('Failed to parse backup file: ' + err.message);
                    }
                };
                reader.readAsText(file);
            }

            btnExport.addEventListener('click', exportBackup);
            btnImport.addEventListener('click', function() {
                importFileInput.click();
            });

            importFileInput.addEventListener('change', function(e) {
                if (this.files.length === 0) return;
                const file = this.files[0];
                importBackup(file);
                this.value = '';
            });

            // ============================================================
            //  KEYBOARD SHORTCUTS
            // ============================================================
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'z') {
                    e.preventDefault();
                    undoLastStroke(state.activePanel);
                }
                if (e.key === '1') setTool('pen');
                if (e.key === '2') setTool('highlighter');
                if (e.key === '3') setTool('eraser');
                if (e.key === '4') setTool('select');
                if (e.key === '5') setTool('gesture');
                if (e.key === '6') setTool('connect');
                if (e.key === 'f' || e.key === 'F') {
                    if (e.ctrlKey || e.metaKey) return;
                    btnFullscreen.click();
                }
                if (e.key === 'n' || e.key === 'N') {
                    if (!e.ctrlKey && !e.metaKey) {
                        btnToggleNotes.click();
                    }
                }
            });

            // ============================================================
            //  INIT
            // ============================================================
            function init() {
                loadFromLocalStorage();
                loadStoredPdf();

                setTimeout(() => {
                    resizeCanvases();
                    setTool('pen');
                    state.activePanel = 'pdf';
                    updateBadge('pdf');
                    updateBadge('notes');
                    if (!pdfDoc) {
                        pdfPlaceholder.classList.remove('hidden');
                        pdfBadge.textContent = 'No file';
                    }
                    updateConnectors();
                    // If there are notes pages, update the UI
                    if (notesPages.length > 0) {
                        currentNotesPage = Math.min(currentNotesPage, notesPages.length - 1);
                        updatePageInfo();
                    }
                    // Ensure popup is hidden initially
                    notepadPopup.classList.remove('visible');
                }, 100);
            }

            init();

            window.__drawApp = { state, pdfData, notesPages, connectors, resizeCanvases, redrawAllStrokes, updateConnectors };

        })();
    </script>
</body>
</html>
