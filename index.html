                applyTemplateToPage(notepad.currentPage);
                saveToLocalStorage('notes');
            });

            let notesSaveTimeout = null;
            notesTextareaPopup.addEventListener('input', function() {
                clearTimeout(notesSaveTimeout);
                notesSaveTimeout = setTimeout(() => {
                    const notepad = getCurrentNotepad();
                    notepad.pages[notepad.currentPage].text = this.value;
                    saveToLocalStorage('notes');
                }, 400);
            });

            // Sync main notes textarea with popup
            notesTextarea.addEventListener('input', function() {
                // Keep the main notes area in sync with the popup if visible
                if (notepadPopup.classList.contains('visible')) {
                    const notepad = getCurrentNotepad();
                    notepad.pages[notepad.currentPage].text = notesTextareaPopup.value;
                }
            });

            // ============================================================
            //  NOTEPAD SWITCHER
            // ============================================================

            notepadSelector.addEventListener('change', function() {
                const idx = parseInt(this.value);
                if (idx >= 0 && idx < notepads.length && idx !== currentNotepadIndex) {
                    switchNotepad(idx);
                }
            });

            newNotepadBtn.addEventListener('click', function() {
                createNewNotepadWithName();
            });

            // ============================================================
            //  TOOLBAR EVENTS
            // ============================================================

            function setTool(tool) {
                state.tool = tool;
                document.querySelectorAll('.toolbar button[data-tool]').forEach(b => b.classList.remove('active'));
                const map = { pen: btnPen, highlighter: btnHighlighter, eraser: btnEraser, select: btnSelect,
                    gesture: btnGesture, connect: btnConnect };
                if (map[tool]) map[tool].classList.add('active');

                const pdfOverlay = pdfCanvas;
                const notesOverlay = notesCanvas;
                const isSelect = tool === 'select';
                const isEraser = tool === 'eraser';
                const isGesture = tool === 'gesture';
                const isConnect = tool === 'connect';

                pdfOverlay.classList.toggle('active', !isSelect && !isGesture && !isConnect);
                pdfOverlay.classList.toggle('eraser-active', isEraser);
                pdfOverlay.classList.toggle('select-active', isSelect);
                pdfOverlay.classList.toggle('gesture-active', isGesture);
                pdfOverlay.classList.toggle('connect-active', isConnect);

                notesOverlay.classList.toggle('active', !isSelect && !isGesture && !isConnect);
                notesOverlay.classList.toggle('eraser-active', isEraser);
                notesOverlay.classList.toggle('select-active', isSelect);
                notesOverlay.classList.toggle('gesture-active', isGesture);
                notesOverlay.classList.toggle('connect-active', isConnect);

                if (tool === 'connect' || tool === 'gesture') {
                    state.activePanel = 'pdf';
                } else {
                    state.activePanel = 'pdf';
                }
            }

            btnPen.addEventListener('click', () => setTool('pen'));
            btnHighlighter.addEventListener('click', () => setTool('highlighter'));
            btnEraser.addEventListener('click', () => setTool('eraser'));
            btnSelect.addEventListener('click', () => setTool('select'));
            btnGesture.addEventListener('click', () => setTool('gesture'));
            btnConnect.addEventListener('click', () => setTool('connect'));

            colorPicker.addEventListener('input', function() {
                state.color = this.value;
            });

            sizeSlider.addEventListener('input', function() {
                state.size = parseFloat(this.value);
                sizeLabel.textContent = state.size;
            });

            btnClear.addEventListener('click', function() {
                const panel = state.activePanel;
                if (confirm('Clear all drawings on ' + (panel === 'pdf' ? 'PDF' : 'current notes page') + '?')) {
                    clearAllStrokes(panel);
                }
            });

            btnUndo.addEventListener('click', function() {
                const panel = state.activePanel;
                undoLastStroke(panel);
            });

            // ============================================================
            //  PDF UPLOAD
            // ============================================================

            btnOpenPdf.addEventListener('click', function() {
                pdfUpload.click();
            });

            pdfUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                loadPdfFromFile(file);
                this.value = '';
            });

            // ============================================================
            //  STICKY NOTES
            // ============================================================

            function createStickyNoteElement(id, text, left, top) {
                const div = document.createElement('div');
                div.className = 'sticky-note';
                div.dataset.noteId = id;
                div.style.left = left + 'px';
                div.style.top = top + 'px';

                const textSpan = document.createElement('span');
                textSpan.className = 'note-text';
                textSpan.textContent = text;
                div.appendChild(textSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'note-delete';
                delBtn.textContent = '✕';
                delBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    removeStickyNote(id);
                });
                div.appendChild(delBtn);

                let dragData = null;
                div.addEventListener('pointerdown', function(e) {
                    if (e.target === delBtn) return;
                    const rect = div.getBoundingClientRect();
                    dragData = {
                        offsetX: e.clientX - rect.left,
                        offsetY: e.clientY - rect.top,
                        startLeft: parseFloat(div.style.left),
                        startTop: parseFloat(div.style.top),
                    };
                    div.classList.add('dragging');
                    div.setPointerCapture(e.pointerId);
                    e.preventDefault();
                });

                div.addEventListener('pointermove', function(e) {
                    if (!dragData) return;
                    const containerRect = notesContent.getBoundingClientRect();
                    let newLeft = e.clientX - containerRect.left - dragData.offsetX + notesContent.scrollLeft;
                    let newTop = e.clientY - containerRect.top - dragData.offsetY + notesContent.scrollTop;
                    newLeft = Math.max(0, newLeft);
                    newTop = Math.max(0, newTop);
                    div.style.left = newLeft + 'px';
                    div.style.top = newTop + 'px';
                    updateConnectors();
                    e.preventDefault();
                });

                div.addEventListener('pointerup', function(e) {
                    if (dragData) {
                        div.classList.remove('dragging');
                        dragData = null;
                        saveConnectorsAndNotes();
                        updateConnectors();
                        this.releasePointerCapture(e.pointerId);
                    }
                });

                div.addEventListener('pointercancel', function(e) {
                    if (dragData) {
                        div.classList.remove('dragging');
                        dragData = null;
                        this.releasePointerCapture(e.pointerId);
                    }
                });

                return div;
            }

            function createStickyNoteFromData(id, text, left, top) {
                const card = createStickyNoteElement(id, text, left, top);
                notesContent.appendChild(card);
                if (id >= nextNoteId) nextNoteId = id + 1;
                return card;
            }

            function removeStickyNote(id) {
                const noteEl = notesContent.querySelector('.sticky-note[data-note-id="' + id + '"]');
                if (noteEl) noteEl.remove();
                connectors = connectors.filter(c => c.noteId !== id);
                saveConnectorsAndNotes();
                updateConnectors();
            }

            // ============================================================
            //  CONNECTOR DRAWING
            // ============================================================

            function updateConnectors() {
                const ctx = drawState.connector;
                if (!ctx) return;
                const dpr = window.devicePixelRatio || 1;
                const canvas = connectorCanvas;
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (!pdfDoc) return;

                for (let conn of connectors) {
                    const hl = pdfData.highlights[conn.highlightIndex];
                    if (!hl) continue;
                    // Simplified connector drawing
                    const pdfRect = pdfScroll.getBoundingClientRect();
                    const mainRect = splitContainer.getBoundingClientRect();
                    const srcX = pdfRect.left + pdfRect.width / 2 - mainRect.left;
                    const srcY = pdfRect.top + 50 - mainRect.top;

                    const card = conn.cardElement;
                    if (!card || !card.isConnected) continue;
                    const cardRect = card.getBoundingClientRect();
                    const tgtX = cardRect.left + cardRect.width / 2 - mainRect.left;
                    const tgtY = cardRect.top + cardRect.height / 2 - mainRect.top;

                    ctx.save();
                    ctx.strokeStyle = '#0969da';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.6;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.moveTo(srcX, srcY);
                    const dx = tgtX - srcX;
                    const dy = tgtY - srcY;
                    const cp1x = srcX + dx * 0.4;
                    const cp1y = srcY;
                    const cp2x = srcX + dx * 0.6;
                    const cp2y = tgtY;
                    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tgtX, tgtY);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.fillStyle = '#0969da';
                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.arc(srcX, srcY, 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(tgtX, tgtY, 4, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ============================================================
            //  POINTER EVENTS FOR DRAWING
            // ============================================================

            function handlePointerDown(e, panel) {
                if (state.tool === 'select' || state.tool === 'connect') return;
                const canvas = panel === 'pdf' ? pdfCanvas : notesCanvas;
                const coords = getCanvasCoords(canvas, e);
                const rect = canvas.getBoundingClientRect();
                if (coords.x < 0 || coords.y < 0 || coords.x > rect.width || coords.y > rect.height) return;

                state.activePanel = panel;
                startStroke(panel, coords.x, coords.y);
                canvas.setPointerCapture(e.pointerId);
            }

            function handlePointerMove(e, panel) {
                if (state.tool === 'select' || state.tool === 'connect') return;
                const canvas = panel === 'pdf' ? pdfCanvas : notesCanvas;
                const coords = getCanvasCoords(canvas, e);
                const rect = canvas.getBoundingClientRect();
                if (coords.x < 0 || coords.y < 0 || coords.x > rect.width || coords.y > rect.height) {
                    if (drawState[panel].isDrawing) {
                        endStroke(panel);
                    }
                    return;
                }
                if (drawState[panel].isDrawing) {
                    continueStroke(panel, coords.x, coords.y);
                }
            }

            function handlePointerUp(e, panel) {
                if (state.tool === 'select' || state.tool === 'connect') return;
                if (drawState[panel].isDrawing) {
                    endStroke(panel);
                }
                const canvas = panel === 'pdf' ? pdfCanvas : notesCanvas;
                canvas.releasePointerCapture(e.pointerId);
            }

            function attachPointerEvents(canvas, panel) {
                canvas.addEventListener('pointerdown', function(e) {
                    e.preventDefault();
                    handlePointerDown(e, panel);
                });
                canvas.addEventListener('pointermove', function(e) {
                    e.preventDefault();
                    handlePointerMove(e, panel);
                });
                canvas.addEventListener('pointerup', function(e) {
                    e.preventDefault();
                    handlePointerUp(e, panel);
                });
                canvas.addEventListener('pointerleave', function(e) {
                    if (drawState[panel].isDrawing) {
                        endStroke(panel);
                    }
                });
                canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            }

            attachPointerEvents(pdfCanvas, 'pdf');
            attachPointerEvents(notesCanvas, 'notes');

            // ============================================================
            //  FULLSCREEN
            // ============================================================

            btnFullscreen.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().then(function() {
                        document.body.classList.add('is-fullscreen');
                    }).catch(function() {});
                } else {
                    document.exitFullscreen().then(function() {
                        document.body.classList.remove('is-fullscreen');
                    }).catch(function() {});
                }
            });

            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement) {
                    document.body.classList.remove('is-fullscreen');
                }
            });

            // ============================================================
            //  BACKUP & RESTORE
            // ============================================================

            function exportBackup() {
                const backup = {
                    version: '1.0',
                    timestamp: new Date().toISOString(),
                    data: {}
                };
                const keys = [
                    'pdfDrawings',
                    'notepads',
                    'currentNotepadIndex',
                    'stickyNotes',
                    'connectors',
                    'pdfFileData'
                ];
                for (let key of keys) {
                    const val = localStorage.getItem(key);
                    if (val !== null) {
                        backup.data[key] = val;
                    }
                }
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'backup_' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function importBackup(file) {
                const blob = file.slice(0, 5);
                const pdfCheckReader = new FileReader();
                pdfCheckReader.onload = function(e) {
                    const header = e.target.result;
                    if (typeof header === 'string' && header.startsWith('%PDF')) {
                        alert('This is a PDF file! Please use the "📄 Open PDF" button to view it.');
                        return;
                    }
                    const fullReader = new FileReader();
                    fullReader.onload = function(ev) {
                        try {
                            const backup = JSON.parse(ev.target.result);
                            if (!backup.data || typeof backup.data !== 'object') {
                                alert('Invalid backup file format.');
                                return;
                            }
                            for (let key in backup.data) {
                                localStorage.setItem(key, backup.data[key]);
                            }
                            alert('Backup restored successfully. The app will now reload.');
                            location.reload();
                        } catch (err) {
                            alert('Failed to parse backup file: ' + err.message);
                        }
                    };
                    fullReader.readAsText(file);
                };
                pdfCheckReader.readAsText(blob);
            }

            btnExport.addEventListener('click', exportBackup);
            btnImport.addEventListener('click', function() {
                importFileInput.click();
            });

            importFileInput.addEventListener('change', function(e) {
                if (this.files.length === 0) return;
                const file = this.files[0];
                importBackup(file);
                this.value = '';
            });

            // ============================================================
            //  KEYBOARD SHORTCUTS
            // ============================================================

            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'z') {
                    e.preventDefault();
                    undoLastStroke(state.activePanel);
                }
                if (e.key === '1') setTool('pen');
                if (e.key === '2') setTool('highlighter');
                if (e.key === '3') setTool('eraser');
                if (e.key === '4') setTool('select');
                if (e.key === '5') setTool('gesture');
                if (e.key === '6') setTool('connect');
                if (e.key === 'f' || e.key === 'F') {
                    if (!e.ctrlKey && !e.metaKey) {
                        btnFullscreen.click();
                    }
                }
                if (e.key === 'n' || e.key === 'N') {
                    if (!e.ctrlKey && !e.metaKey) {
                        btnToggleNotes.click();
                    }
                }
                if (e.key === 'o' || e.key === 'O') {
                    if (!e.ctrlKey && !e.metaKey) {
                        btnOpenPdf.click();
                    }
                }
            });

            // ============================================================
            //  LOAD STORED PDF
            // ============================================================

            function loadStoredPdf() {
                const stored = localStorage.getItem('pdfFileData');
                if (stored) {
                    try {
                        const binary = atob(stored);
                        const len = binary.length;
                        const bytes = new Uint8Array(len);
                        for (let i = 0; i < len; i++) {
                            bytes[i] = binary.charCodeAt(i);
                        }
                        pdfFileData = stored;
                        loadPdfDocument(bytes);
                    } catch (e) {
                        console.warn('Failed to load stored PDF', e);
                    }
                }
            }

            // ============================================================
            //  WINDOW RESIZE
            // ============================================================

            let winResizeTimeout = null;
            window.addEventListener('resize', function() {
                clearTimeout(winResizeTimeout);
                winResizeTimeout = setTimeout(function() {
                    resizeCanvases();
                    renderVisiblePages();
                }, 200);
            });

            // ============================================================
            //  INIT
            // ============================================================

            function init() {
                loadFromLocalStorage();

                if (notepads.length === 0) {
                    notepads.push(createDefaultNotepad('Notepad 1'));
                }
                if (currentNotepadIndex >= notepads.length) {
                    currentNotepadIndex = 0;
                }

                // Set initial 50-50 split
                setSplitRatio(0.5);

                loadStoredPdf();

                setTimeout(function() {
                    resizeCanvases();
                    setTool('pen');
                    state.activePanel = 'pdf';
                    updateBadge('pdf');
                    updateBadge('notes');
                    if (!pdfDoc) {
                        pdfPlaceholder.style.display = 'flex';
                        pdfBadge.textContent = 'No file';
                    }
                    updateConnectors();
                    const notepad = getCurrentNotepad();
                    const page = notepad.pages[notepad.currentPage] || notepad.pages[0];
                    if (page) {
                        notesTextareaPopup.value = page.text || '';
                        applyTemplateToPage(notepad.currentPage);
                    }
                    updateNotepadSelector();
                    updatePageInfo();
                    notepadPopup.classList.remove('visible');

                    // Sync main notes textarea
                    notesTextarea.value = notesTextareaPopup.value || '';
                }, 150);
            }

            init();

            window.__drawApp = {
                state: state,
                pdfData: pdfData,
                notepads: notepads,
                connectors: connectors,
                resizeCanvases: resizeCanvases,
                redrawAllStrokes: redrawAllStrokes,
                updateConnectors: updateConnectors,
                switchNotepad: switchNotepad,
                createNewNotepadWithName: createNewNotepadWithName,
                loadPdfFromFile: loadPdfFromFile,
                goToPage: goToPage,
                pdfDoc: pdfDoc,
                setSplitRatio: setSplitRatio,
            };

        })();
    </script>
</body>
</html>
