        wrapper.style.width = '100%'; wrapper.style.height = '100%';
        const textLayer = createPageTextLayer();
        wrapper.appendChild(textLayer);
        pageCard.appendChild(indicator);
        pageCard.appendChild(wrapper);
        insertPageCardInPlace(pageCard);
      });
    });

    // ================================================================
    // OPEN PDF, CASE +, ZOOM, CLEAR PAGE
    // ================================================================
    btnOpenPdf.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const safeBuffer = event.target.result.slice(0);
          pdfjsLib.getDocument({ data: safeBuffer }).promise.then(function(pdf) {
            loadedDocs = [];
            totalPages = 0;
            globalStrokes = [];
            linkData = [];
            linkIdCounter = 0;
            notepadEditor.innerHTML = '';
            loadedDocs.push({ pdfDoc: pdf, fileName: file.name, numPages: pdf.numPages });
            hideNotepad();
            setTool('select');
            setToolMode('pointer');
            if (emptyState) emptyState.style.display = 'none';
            pdfContainer.innerHTML = '';
            initIntersectionObserver();
            appendPageCardsForRange(0, 1, pdf.numPages);
            const first = pdfContainer.querySelector('.pdf-page-card');
            if (first) renderSinglePage(first);
            updateDocSummaryLabel();
            resizeGlobalCanvas();
          }).catch(() => alert('Failed to parse PDF.'));
        } catch (err) {}
      };
      reader.readAsArrayBuffer(file);
    });

    btnCasePlus.addEventListener('click', () => { casePlusInput.value = ''; casePlusInput.click(); });
    casePlusInput.addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      for (let file of files) {
        try {
          const buffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buffer.slice(0) }).promise;
          const docIndex = loadedDocs.length;
          const numPages = pdf.numPages;
          loadedDocs.push({ pdfDoc: pdf, fileName: file.name, numPages });
          if (emptyState) emptyState.style.display = 'none';
          appendPageCardsForRange(docIndex, 1, numPages);
          const newly = pdfContainer.querySelector(`[data-doc-index="${docIndex}"][data-internal-page-num="1"]`);
          if (newly) renderSinglePage(newly);
        } catch (err) {}
      }
      updateDocSummaryLabel();
      resizeGlobalCanvas();
    });

    function applyZoom(newScale) {
      currentScale = Math.min(Math.max(newScale, 0.5), 3.0);
      zoomLabel.textContent = Math.round(currentScale * 100) + '%';
      const cards = document.querySelectorAll('.pdf-page-card');
      cards.forEach(card => {
        if (card.dataset.isPdfPage === 'true') {
          card.dataset.rendered = 'false';
        } else {
          const dims = getStandardPageDimensions();
          card.style.width = dims.width + 'px';
          card.style.height = dims.height + 'px';
          card.style.minHeight = dims.height + 'px';
        }
      });
      cards.forEach(card => {
        if (card.dataset.isPdfPage === 'true') {
          const rect = card.getBoundingClientRect();
          if (rect.top < window.innerHeight * 2 && rect.bottom > -window.innerHeight) {
            renderSinglePage(card);
          }
        }
      });
      resizeGlobalCanvas();
    }

    btnZoomIn.addEventListener('click', () => applyZoom(currentScale + 0.15));
    btnZoomOut.addEventListener('click', () => applyZoom(currentScale - 0.15));

    btnClearPage.addEventListener('click', function() {
      const activeCard = getCurrentlyActivePageNode();
      if (!activeCard) return;
      const pNum = parseInt(activeCard.dataset.pageNum, 10);
      const toRemove = globalStrokes.filter(s => s.container === 'pdf' && s.pageNum === pNum);
      toRemove.forEach(s => {
        const linkIds = [];
        linkData.forEach(l => {
          if ((l.sourceType === 'pdf' && l.sourcePageNum === pNum) || (l.targetType === 'pdf' && l.targetPageNum === pNum)) {
            linkIds.push(l.id);
          }
        });
        linkData = linkData.filter(l => !linkIds.includes(l.id));
      });
      globalStrokes = globalStrokes.filter(s => !(s.container === 'pdf' && s.pageNum === pNum));
      const linkIdsOnPage = [];
      linkData.forEach(l => {
        if ((l.sourceType === 'pdf' && l.sourcePageNum === pNum) || (l.targetType === 'pdf' && l.targetPageNum === pNum)) {
          linkIdsOnPage.push(l.id);
        }
      });
      const allElements = notepadEditor.querySelectorAll('[data-link-id]');
      allElements.forEach(el => {
        const id = parseInt(el.dataset.linkId, 10);
        if (linkIdsOnPage.includes(id)) {
          el.remove();
        }
      });
      document.querySelectorAll('.pdf-link-marker').forEach(marker => {
        const id = parseInt(marker.dataset.linkId, 10);
        if (linkIdsOnPage.includes(id)) {
          marker.remove();
        }
      });
      redrawGlobalStrokes();
    });

    // ================================================================
    // RESIZER (unchanged)
    // ================================================================
    function startResizing(e) {
      isResizing = true;
      resizer.classList.add('active');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      if (e.pointerId && resizer.setPointerCapture) try { resizer.setPointerCapture(e.pointerId); } catch(_) {}
    }
    function updateWorkspaceWidths(pdfRatioPct) {
      const isOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
      if (!isOpen) return;
      if (pinchRafId) cancelAnimationFrame(pinchRafId);
      pinchRafId = requestAnimationFrame(() => {
        const clamped = Math.max(15, Math.min(85, pdfRatioPct));
        const notepadPct = 100 - clamped;
        pdfViewWrapper.style.width = clamped + '%';
        pdfViewWrapper.style.flex = '0 0 ' + clamped + '%';
        notepadPane.style.width = notepadPct + '%';
        notepadPane.style.flex = '0 0 ' + notepadPct + '%';
        resizeGlobalCanvas();
      });
    }
    function handleResizeMove(e) {
      if (!isResizing) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      if (clientX === undefined) return;
      const w = window.innerWidth;
      let pct = (clientX / w) * 100;
      updateWorkspaceWidths(pct);
    }
    function stopResizing(e) {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        if (e && e.pointerId && resizer.releasePointerCapture) try { resizer.releasePointerCapture(e.pointerId); } catch(_) {}
        resizeGlobalCanvas();
      }
    }
    resizer.addEventListener('pointerdown', startResizing);
    window.addEventListener('pointermove', handleResizeMove);
    window.addEventListener('pointerup', stopResizing);
    window.addEventListener('pointercancel', stopResizing);
    resizer.addEventListener('touchstart', startResizing, { passive: false });
    window.addEventListener('touchmove', handleResizeMove, { passive: false });
    window.addEventListener('touchend', stopResizing);
    window.addEventListener('touchcancel', stopResizing);

    // ================================================================
    // PINCH GESTURE (unchanged)
    // ================================================================
    function handleWorkspaceTouchStart(e) {
      if (e.touches && e.touches.length === 2) {
        const isOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
        if (!isOpen) return;
        isPinching = true;
        if (isDrawing) { isDrawing = false; activeStroke = null; }
        const t1 = e.touches[0], t2 = e.touches[1];
        initialPinchDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        const ws = mainWorkspace.getBoundingClientRect();
        const pdfRect = pdfViewWrapper.getBoundingClientRect();
        initialPdfRatio = (pdfRect.width / ws.width) * 100;
        const cx = (t1.clientX + t2.clientX) / 2;
        const resizerRect = resizer.getBoundingClientRect();
        pinchCenterPane = (resizerRect.width > 0 && cx > resizerRect.left) ? 'notepad' : 'pdf';
      }
    }
    function handleWorkspaceTouchMove(e) {
      if (isPinching && e.touches && e.touches.length === 2) {
        e.preventDefault();
        const t1 = e.touches[0], t2 = e.touches[1];
        const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        if (initialPinchDistance > 0) {
          const factor = dist / initialPinchDistance;
          let target = initialPdfRatio;
          if (pinchCenterPane === 'pdf') target = initialPdfRatio * factor;
          else { const notepadRatio = 100 - initialPdfRatio; target = 100 - notepadRatio * factor; }
          updateWorkspaceWidths(target);
        }
      }
    }
    function handleWorkspaceTouchEnd(e) {
      if (isPinching && (!e.touches || e.touches.length < 2)) {
        isPinching = false;
        if (pinchRafId) { cancelAnimationFrame(pinchRafId); pinchRafId = null; }
        resizeGlobalCanvas();
      }
    }
    mainWorkspace.addEventListener('pointerdown', (e) => {
      activePointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointerMap.size === 2) {
        const isOpen = notepadPane.style.display === 'flex' || getComputedStyle(notepadPane).display === 'flex';
        if (!isOpen) return;
        isPinching = true;
        if (isDrawing) { isDrawing = false; activeStroke = null; }
        const pts = Array.from(activePointerMap.values());
        initialPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const ws = mainWorkspace.getBoundingClientRect();
        const pdfRect = pdfViewWrapper.getBoundingClientRect();
        initialPdfRatio = (pdfRect.width / ws.width) * 100;
        const cx = (pts[0].x + pts[1].x) / 2;
        const resizerRect = resizer.getBoundingClientRect();
        pinchCenterPane = (resizerRect.width > 0 && cx > resizerRect.left) ? 'notepad' : 'pdf';
      }
    });
    mainWorkspace.addEventListener('pointermove', (e) => {
      if (activePointerMap.has(e.pointerId)) activePointerMap.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (isPinching && activePointerMap.size === 2) {
        const pts = Array.from(activePointerMap.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (initialPinchDistance > 0) {
          const factor = dist / initialPinchDistance;
          let target = initialPdfRatio;
          if (pinchCenterPane === 'pdf') target = initialPdfRatio * factor;
          else { const notepadRatio = 100 - initialPdfRatio; target = 100 - notepadRatio * factor; }
          updateWorkspaceWidths(target);
        }
      }
    });
    const releasePointerFromMap = (e) => {
      activePointerMap.delete(e.pointerId);
      if (activePointerMap.size < 2) { isPinching = false; resizeGlobalCanvas(); }
    };
    mainWorkspace.addEventListener('pointerup', releasePointerFromMap);
    mainWorkspace.addEventListener('pointercancel', releasePointerFromMap);
    mainWorkspace.addEventListener('touchstart', handleWorkspaceTouchStart, { passive: false });
    mainWorkspace.addEventListener('touchmove', handleWorkspaceTouchMove, { passive: false });
    mainWorkspace.addEventListener('touchend', handleWorkspaceTouchEnd);
    mainWorkspace.addEventListener('touchcancel', handleWorkspaceTouchEnd);

    // ================================================================
    // NOTEPAD TOGGLE
    // ================================================================
    function hideNotepad() {
      notepadPane.style.display = 'none';
      notepadPane.style.width = '0%';
      notepadPane.style.flex = '0 0 0%';
      resizer.style.display = 'none';
      pdfViewWrapper.style.width = '100%';
      pdfViewWrapper.style.flex = '1 1 100%';
      btnToggleNotepad.classList.remove('active');
      resizeGlobalCanvas();
    }
    function showNotepad() {
      notepadPane.style.display = 'flex';
      notepadPane.style.width = '50%';
      notepadPane.style.flex = '0 0 50%';
      resizer.style.display = 'block';
      pdfViewWrapper.style.width = '50%';
      pdfViewWrapper.style.flex = '0 0 50%';
      btnToggleNotepad.classList.add('active');
      resizeGlobalCanvas();
    }
    btnToggleNotepad.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = notepadPane.style.display === 'none' || getComputedStyle(notepadPane).display === 'none';
      isHidden ? showNotepad() : hideNotepad();
    });
    btnCloseNotepad.addEventListener('click', (e) => { e.stopPropagation(); hideNotepad(); });
    notepadBgSelect.addEventListener('change', (e) => {
      notepadEditorContainer.className = e.target.value;
    });

    // ================================================================
    // EXPORT
    // ================================================================
    btnExportPdf.addEventListener('click', () => {
      if (totalPages === 0) { alert('Please open a PDF document or insert a page first.'); return; }
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = mainWorkspace.clientWidth;
      tempCanvas.height = mainWorkspace.clientHeight;
      const ctx = tempCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      redrawGlobalStrokes();
      ctx.drawImage(globalCanvas, 0, 0);
      const link = document.createElement('a');
      link.download = 'annotated-workspace.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    });

    // ================================================================
    // RESIZE CANVAS
    // ================================================================
    function resizeGlobalCanvas() {
      const rect = mainWorkspace.getBoundingClientRect();
      globalCanvas.width = rect.width;
      globalCanvas.height = rect.height;
      redrawGlobalStrokes();
    }

    // ================================================================
    // SCROLL LISTENERS
    // ================================================================
    pdfViewWrapper.addEventListener('scroll', redrawGlobalStrokes);
    notepadEditorContainer.addEventListener('scroll', redrawGlobalStrokes);
    window.addEventListener('resize', resizeGlobalCanvas);

    // ================================================================
    // INIT
    // ================================================================
    hideNotepad();
    setTool('select');
    setToolMode('pointer');
    resizeGlobalCanvas();
    if (loadedDocs.length === 0) emptyState.style.display = 'flex';

    notepadEditor.addEventListener('focus', function() {
      if (this.textContent.trim() === 'Type your notes here...') this.textContent = '';
    });
    notepadEditor.addEventListener('blur', function() {
      if (this.textContent.trim() === '') this.textContent = 'Type your notes here...';
    });
    if (notepadEditor.textContent.trim() === '') notepadEditor.textContent = 'Type your notes here...';

    console.log('✅ Ultimate fix: Select button now works perfectly!');
  </script>
</body>
